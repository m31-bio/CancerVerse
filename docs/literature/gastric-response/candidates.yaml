# Gastric cancer, response axis, the candidate shortlist.
#
# Searched 2026-08-14. 28 papers, 2018-2026, all PMIDs verified against
# Europe PMC. This is the input to `scripts/rank_literature.py`, which adds
# citation counts from OpenAlex and writes ranked.csv beside this file.
#
# Every field here was read out of the paper by hand. Nothing in this file is
# inferred, and `unknown` means unknown rather than zero. In particular:
#
#   inputs  -- what the model needs at prediction time. This is the field that
#              decides whether a paper is implementable in this library at all.
#              `clinical` = routine clinic and lab values. `ct-measure` =
#              numbers a radiologist reads off a scan (diameters, node size),
#              no feature extraction. `radiomics` / `dl` / `wsi` = needs a
#              segmentation or deep-learning pipeline we do not have.
#
#   usable  -- what the paper actually prints. `intercept` = a complete
#              logistic model. `beta` = coefficients but no intercept, so it
#              ranks patients and cannot state a probability, the exact trap
#              that held the colorectal cell for three months. `points` = an
#              integer score with a published cutoff, implementable as
#              published without an intercept. `or-only` = odds ratios in a
#              table with no model. `figure` = a nomogram picture and nothing
#              else. `none` = nothing recoverable.
#
#   jif     -- Clarivate Journal Impact Factor. Left null on purpose: it is
#              proprietary and must be typed in from Journal Citation Reports
#              by hand. The ranking script never guesses it.

meta:
  disease: gastric
  axis: response
  searched: 2026-08-14
  endpoint_scope: >-
    pathological complete response (pCR / ypT0N0 / TRG0), major or good
    pathological response (TRG0-1, Becker <10% residual viable tumour), and
    radiological response (RECIST) after neoadjuvant chemotherapy,
    chemoradiotherapy or chemo-immunotherapy in gastric or gastro-oesophageal
    junction adenocarcinoma.
  unverified: >-
    Supplementary material could not be reached for PMIDs 34141620 (S6,
    radscore formula), 38796795 (S2, coefficients), 36631788 (possible
    intercept) and 40128827 (possible coefficient table). Those four are
    recorded at what the main text prints, which may understate them.

candidates:

  # ---- routine clinical and lab inputs only ----------------------------

  - key: xu-2021-points
    pmid: '33937020'
    year: 2021
    journal: Frontiers in Oncology
    endpoint: >-
      Ryan TRG 0, complete regression of the PRIMARY tumour, which is NOT
      ypT0N0. Of the 30 patients with TRG 0 in the retrospective cohort, 6
      still had positive lymph nodes. Recorded here as "pCR" in the first pass
      and corrected 2026-08-14; the distinction matters when comparing this
      cell against the ypT0N0 endpoints elsewhere in the table.
    inputs: clinical + LN short-axis on CT
    usable: points
    predictors: CA19-9, CA72-4, differentiation grade, largest LN diameter
    n_train: 202
    n_val: 226
    val_kind: >-
      internal 102 (2:1 random split) + prospective TEMPORAL 124, same
      institution, the paper's word "external" overstates it
    auc: >-
      0.84 (0.77-0.91) training / 0.73 (0.55-0.91) internal / 0.82 (0.71-0.92)
      prospective. No C-index and no calibration analysis anywhere in the paper.
    locus: >-
      Table 3 "Multivariate analysis: variables correlated with TRG in the
      training set" (B, P, OR, 95% CI) and Table 4 "Risk Score of Prediction
      Model for TRG" (the points). Both are HTML tables in PMC8082104.
    locus_machine_readable: true
    note: >-
      Integer points, published in full and verified in the PMC HTML on
      2026-08-14: CA19-9 <=10.90 = 5, CA72-4 <=3.19 = 4, well differentiated
      = 7, LNmax >=1.535 cm = 7; range 0-23, cutoff 13.

      Checked and corrected 2026-08-14: this paper has NO nomogram figure,
      its three figures are two Kaplan-Meier panels and a ROC curve. So there
      is no points-to-probability axis anywhere, in text or in pixels. The
      only mapping printed is score -> binary risk group at 13 points, with
      observed pCR rates of 0% (low) and 22.35% (high). The model ranks and
      dichotomises; it cannot emit a calibrated probability, and no amount of
      re-reading the PDF will change that because the quantity was never
      estimated.

      Table 3 also carries a complete-separation artefact: signet-ring cell
      carcinoma, OR 33,985,914, P 0.998. The authors dropped it from the score,
      but it is a sign the multivariate fit was unstable.

      Validation claim checked against the full text 2026-08-14. The numbers
      are right and the framing is not. 428 patients at Shanghai Ruijin
      Hospital: 304 retrospective, split 2:1 at random into 202 training and
      102 internal validation, then 124 enrolled PROSPECTIVELY from December
      2018 to June 2020, after the model was locked. The paper calls that
      third group a "prospective external validation group"; every author
      affiliation is Ruijin, only one hospital is ever named, and the paper's
      own limitations say "This was a single-center clinical study". So it is
      prospective TEMPORAL validation, not geographic external validation.

      It is still the better of the two validations here, and for a reason
      worth keeping: the regimens changed between the eras (retrospective EOX
      and taxane-containing, prospective SOX and FLOT), so it is a genuine
      out-of-era test, which matters given that PMID 35280802 showed these
      signatures collapsing when the regimen changes.

      What it rests on is thin. 30 TRG=0 events retrospectively, 20 of them in
      the training set against four retained predictors, so events per
      variable is about 5 and the 0.84 is optimistic on its face. The internal
      AUC of 0.73 rests on 10 events and its CI runs down to 0.55. The
      prospective AUC of 0.82 rests on 9 events. Univariate screening was also
      done on all 304 before the split, so the internal validation set was in
      view when the predictors were chosen; the prospective cohort is
      unaffected and is the cleaner of the two.

      Two things the paper does not state: the rounding rule that maps ORs
      5.615 / 4.531 / 7.426 / 7.945 to points 5 / 4 / 7 / 7, and whether the
      13-point cutoff derived on the training set was the operating threshold
      behind the reported validation sensitivities and specificities. Neither
      blocks implementation, the points are printed directly, but neither
      can be reconstructed either.

  - key: liu-2023-lasso
    pmid: '36631788'
    year: 2023
    journal: BMC Cancer
    endpoint: RECIST CR/PR vs SD/PD
    inputs: clinical
    usable: beta
    n_train: 307
    n_val: 153
    val_kind: internal 153 (random split); the external cohort is never defined
    auc: C 0.842 dev / 0.806 internal / 0.760 "external"
    locus: >-
      Table 3 "Result of multivariable analysis in the training set. As
      revealed by lasso analysis excluding tumor size variable, five prediction
      factors were incorporated into the eventual model...". HTML table in
      PMC9832661, columns Items / Regression coefficient / Exp(B) / 95%CI / P.
    locus_machine_readable: true
    note: >-
      Betas verified in the PMC HTML 2026-08-14: location -1.561, tumour
      differentiation 1.103, cT stage 1.361, cN stage 2.040, smoking history
      1.129. The minus sign is U+2212, not ASCII, which will silently break a
      naive parser.

      and this demotes the paper. It was recorded here
      as the strongest clinical-only design on the strength of an external
      cohort of 108. Table 1 has only training 307 and validation 153, from a
      set.seed random split of 460 patients; the cohort behind the 0.760
      C-index is given no size and no source anywhere in the paper. Treat the
      external claim as unsubstantiated until that is resolved.

      Two blockers, not one. Beyond the missing intercept, the REFERENCE
      LEVELS are not stated. Table 3 gives bare variable names. Checking the
      signs against the Table 2 cell counts, four of the five coefficients are
      consistent with the favourable level being indexed, and `location` is
      the opposite sign under that same coding. The direction is therefore not
      recoverable from the text; it can only be read off the Fig. 3 nomogram
      image.

  - key: hou-2026-mpr-complete
    pmid: '41883960'
    year: 2026
    journal: Frontiers in Oncology
    endpoint: MPR (TRG1a/1b)
    inputs: clinical
    usable: intercept
    predictors: tumour-bed diameter, CEA, CA19-9, NLR, SII
    n_train: 113
    n_val: 0
    val_kind: internal bootstrap only
    auc: 0.848 (0.773-0.923)
    locus: >-
      Table 2 "Multivariate logistic regression analysis of predictors of major
      pathological response (MPR) following NICT in patients with LAGC" --
      HTML table in PMC13008680, columns Variable / B / SE / Wald / OR with CI
      / P. The binarisation cutoffs are in the Results prose, not in a table.
    locus_machine_readable: true
    note: >-
      The only paper in the whole set that prints a complete logistic model,
      beta, SE, OR, CI for all predictors AND the intercept (3.081, SE 1.179).
      Verified in the PMC HTML 2026-08-14, and internally consistent: exp(B)
      reproduces every printed OR exactly, including exp(3.081) = 21.785.
      Bought at the price of n=113 and no external cohort.

      THREE THINGS MUST BE RESOLVED BEFORE THIS IS IMPLEMENTED.

      1. The intercept belongs to a SEVEN-term fit that includes PNI (B 0.512,
         P 0.310). The nomogram in Figure 2 uses only five predictors, dropping
         PNI. Applying 3.081 to a five-predictor model is not the fitted model.
      2. Coding direction is ambiguous and the paper appears to have it
         backwards. All five biomarker betas are negative, and the Results text
         attaches them to the LOW level ("CEA < 1.765 ng/mL, OR 0.26"), but
         Table 1 shows the MPR group had LOWER CEA (median 1.520 vs 2.900),
         lower CA19-9, lower NLR, lower SII and smaller tumour bed. A negative
         beta on the low level contradicts the paper's own baseline table. It
         is consistent only if the indexed level is the HIGH one. Shipping this
         without resolving it ships a backwards model.
      3. Text and table ORs disagree (text 0.22 / 0.26 / 0.148 / 0.194 against
         table 0.248 / 0.267 / 0.150 / 0.210). Table 2 is self-consistent with
         its own betas, so Table 2 is the one to trust.

      Cutoffs, verbatim from Results: tumour bed diameter 3.75 cm, CEA 1.765
      ng/mL, CA19-9 18.390 U/mL, NLR 2.422, SII 597.483. All five predictors
      were binarised at these Youden points.

