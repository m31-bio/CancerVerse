- id: score2
  disease: cvd
  axis: detection
  role: alternative
  status: implemented
  title: ESC SCORE2
  code: mayo_baseline.cvd.detection.score2
  citation: SCORE2 working group. Eur Heart J. 2021
  license: open
  equation_source: Eur Heart J 2021; Hageman comment 4 d.p. coeff + recalibration table
  upstream:
  - doi: 10.1093/eurheartj/ehab309
    note: SCORE2 development
  - url: https://www.nature.com/articles/s41591-026-04437-z
    note: validation only
  canonical_impl:
    type: r_package
    url: https://www.phpc.cam.ac.uk/ceu/erfc/programs/
    license: open
    note: Cambridge score2risk; also published charts
  our_code: mayo_baseline.cvd.detection.score2
  parity_status: checked
  inputs:
  - sex
  - age
  - sbp
  - total_chol_mmol
  - hdl_mmol
  - smoker
  - region
  open_source: available
  parity_note: CHECKED 2026-08-05 against CRAN RiskScorescvd::SCORE2 (MIT) across all four ESC risk regions;
    agreement within that package's own 1-decimal rounding (it ends in round(x,1)). No web calculator
    was needed -- an R implementation existed.
  architecture_family: Survival (Cox)
  architecture: 'Cox proportional hazards: 1 - S0^exp(sum of beta*x), followed by a region-specific recalibration
    on the complementary log-log scale.'
  core_formula: "risk_uncal = 1 − S₀^exp(Σβx)\n\n  risk       = 1 − exp( −exp( a + b · ln(−ln(1 − risk_uncal))\
    \ ) )\n  a, b       region-specific recalibration constants (4 ESC risk regions)"
  evidence:
    test: tests/parity/test_r_reference_parity.py
    test_function: test_score2_matches_riskscorescvd
    script: tests/parity/reference/score2_reference.R
  public_repo: https://cran.r-project.org/package=RiskScorescvd
  source_url: https://doi.org/10.1093/eurheartj/ehab309
  year: 2021
  entrypoint: score2_predict
  repro_tier: A
  flagship_note: Prefer for European patients. It is the ESC standard and carries explicit recalibration
    for four European risk regions, which PREVENT does not. Not a lesser model -- a differently targeted
    one.
  equation_location:
    numbered: false
    where: 'Not in the main text: the article says ''Details of statistical analysis are provided in Supplementary
