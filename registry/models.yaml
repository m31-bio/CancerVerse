    or baseline-hazard file). This looks structural: all four papers were built with R''s rms::cph + nomogram(),
    which renders points-to-probability as a graphic and does not require, and none of the four report, printing
    S0(t) numerically. Without it you can rank patients (discriminate) but not state a probability, which is
