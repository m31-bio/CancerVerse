  - atypical_hyperplasia (optional)
  ehr_availability: not_ehr
  ehr_note: Age at menarche, age at first live birth, number of first-degree relatives with breast cancer
    and number of prior biopsies, a reproductive and family history interview.
  paper_title: Projecting individualized probabilities of developing breast cancer for white females who
    are being examined annually
  citation_apa: Gail, M. H., Brinton, L. A., Byar, D. P., Corle, D. K., Green, S. B., Schairer, C., &
    Mulvihill, J. J. (1989). Projecting individualized probabilities of developing breast cancer for white
    females who are being examined annually. Journal of the National Cancer Institute, 81(24), 1879-86.
    https://doi.org/10.1093/jnci/81.24.1879
  superseded_by: bcsc_v2
  replacement_note: 'by `bcsc_v2`. BCRAT is the oldest model here (1989) and its two
    hardest inputs, age at menarche and age at first live birth, are among the nine the target
    platform does not hold, so it cannot run on that data at all. The replacement, the BCSC breast density
    model (Tice et al. 2008), drops menarche and age-at-first-birth entirely and asks instead for BI-RADS
    breast density, a field a screening centre already records, plus simple family-history and biopsy-
    history yes/no/unknown. Unlike the newer BCSC updates (v3, JCO 2024, still `bcsc`; the 2015 BBD
    refinement, see `bcsc_v2`''s `future_enhancement`), the 2008 algorithm is printed in full in its own
    paper''s Appendix Figure, so it needed no source-code request to implement.'
  flagship_note: >-
    Kept implemented as the alternative rather than retired to catalog, which
    is what `rmi`, `roma`, `cha2ds2_vasc` and `erspc_rc3` all do after being
    superseded. It was briefly `status: catalog`, and the cost of that was
    concrete: `mb.predict("bcrat", ...)` raised, BCRAT left `list_models()`
    entirely, and the library's independently-checked count fell from 31/41 to
    30/40, a breaking API change and a drop in verified coverage, in exchange
    for a tidier registry field. BCRAT is `parity_status: checked` against CRAN
    `BCRA` to 3.7e-07 percentage points and remains the comparator every paper
    in this field reports against.
    Why it is NOT the flagship: it needs age at menarche and age at first live
    birth, and the target platform holds neither, so on that data it
    returns nothing at all, 3,395 citations and no computable answer. Its
    concordance is also 0.58, barely above chance, against BCSC's 0.66. The
    swap trades a model verified against someone else's implementation for one
    that can actually run, and being runnable is the point.
