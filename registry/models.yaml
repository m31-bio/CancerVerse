  equation_source: Table 2 points-based model — age 0/1.5/2.5/3.5, male 4.0, BMI 0/1.0/1.5/2.5, smoking
    never/former/current 0/2.0/3.5, esophageal condition 1.5; total 0-15, screening referral at >=8. Points
    are the fitted coefficients divided by the smallest (0.41), rounded to nearest 0.5.
  canonical_impl:
    type: paper_only
    license: open
    note: Table 2 and the Figure 2 nomogram
  our_code: mayo_baseline.esophageal.detection.kunzmann
  parity_status: checked
  parity_note: 'No worked patient is published and the full text is paywalled, so this was the last model
    blocked on paper access; the PDF was supplied 2026-08-06. The paper states its own construction (points
    = coefficient / smallest coefficient, rounded to the nearest 0.5), which makes the WHOLE model re-derivable
    rather than one point of it. All 10 published point values in Table 2 reproduce from their adjusted
    odds ratios. This also resolved a contradiction inside the paper: the Methods worked example divides
    by 0.40, the Table 2 footnote says 0.41. Inverting the problem decides it without appeal to authority
    -- each published point pins the divisor to an interval, and the ten rows jointly admit only d in
    (0.3958, 0.4046], which contains 0.40 and excludes 0.41 (under 0.41 ''Smoking, former'' comes out
    1.5 against a published 2.0). ln(1.50)=0.4055 is also just outside, which is likely where the footnote
    came from. Our docstring had repeated the footnote''s 0.41; corrected. Asserted by tests/parity/test_kunzmann_parity.py.'
