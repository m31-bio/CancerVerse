  scope_note: >-
    Locally advanced or metastatic esophago-gastric cancer at the START of first-line
    fluorouracil-based palliative chemotherapy. Answers how long this patient is likely to survive
    on that treatment, for deciding intensity and for trial stratification, not whether the tumour
    will shrink, and not anything about resectable disease.
    WHY AN "ESOPHAGO-GASTRIC" MODEL SITS IN AN ESOPHAGEAL CELL, since that is the obvious objection.
    Site of primary was esophagus 295 (27.3%), EGJ 248 (23.0%), stomach 512 (47.4%), unknown 25,
    so half the cohort (543, 50.3%) was esophageal or junctional. More importantly the authors
    tested site and found it did not matter: "Age, sex, and location of primary tumor were not
    significant in univariate analyses", and in the Discussion, "In our analysis, there were no
    survival differences among patients with esophageal, EGJ, or gastric cancers... there is no
    definite need for future phase III studies to distinguish patients with tumors from different
    anatomic origins if they have advanced disease." Contrast AGAMENON (Br J Cancer 2017), which
    also says "oesophagogastric" and is 5.8% esophagus against 83.9% stomach, the label is not
    evidence about a cohort, the site table is.
    TWO LIMITS THAT MATTER MORE THAN THE SITE MIX. (1) Histology was 88% adenocarcinoma and 4.6%
    squamous, so this is NOT a model for esophageal squamous cell carcinoma, the dominant histology
    across East Asia; applying it there is the same category error as running kunzmann on squamous
    disease. (2) The treatment era is 1992-2001 fluorouracil-based combination chemotherapy,
    predating trastuzumab and predating checkpoint inhibitors entirely.
    The authors state the index "requires validation" and name their own then-ongoing REAL-2 study
    as the intended validation set. No completed external validation is claimed by the paper, and
    none is claimed here.
