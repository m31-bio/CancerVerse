  tier_note: >-
    to close a gap that was invisible until the version labels were checked: the BCSC
    calculator has three versions and this registry carried only two of them, with the wrong names.
    This is the REAL version 2.0, the BCSC's own intro.htm says "This is version 2.0" on a page that
    describes the 2015 update as adding "benign breast disease diagnoses" and "both five-year and
