- id: hn_detection_gap
  disease: head_neck
  axis: detection
  role: flagship
  status: gap
  title: (no open flagship yet — sites heterogeneous)
  repro_tier: C
  tier_note: CANDIDATE FOUND, and a strong one. The INHANCE Consortium published a general-population
    head-and-neck cancer risk model (Am J Epidemiol, doi:10.1093/aje/kwz259) giving 20-year absolute risk
    from age, sex, race, smoking, alcohol, sexual history and oral HPV; Smith et al, Head & Neck 2024
    (doi:10.1002/hed.27834) adds an externally validated model. The previous note said no established
    general-population model was found. That was wrong -- it had not been searched for.
  open_source: none
  blocker: Two blockers, and the second is the harder one. (1) The coefficients are in Web Tables 4 and
    5 of the supplement, a 2.6 MB zip that is not reachable through any open route. (2) Even with the
    zip, absolute risk in this model is built from SEER age- and sex-specific incidence rates scaled by
    the attributable fraction -- the baseline is an external dataset, not a printed constant like the
    S0 values every Cox model here carries.
  blocker_kind: missing file plus external data dependency
  routes_tried: PMC serves an HTML interstitial in place of lee_web_material_final_kwz259.zip; the Oxford
    Silverchair CDN returns 403; Europe PMC reports no supplementary files for PMC7274188. The main text
    gives the AUCs (0.643 for oropharyngeal cancer in men, 0.70 or higher elsewhere, up to 0.870) and
    worked absolute-risk examples in Tables 2-3, but not the coefficients.
  next_action: Obtain the supplement from the journal or the authors, then decide whether to vendor SEER
    incidence rates. The SEER dependency means this is a larger piece of work than it looks -- closer
    to BCRAT, which also carries baseline hazards from an external registry.
