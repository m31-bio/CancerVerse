- id: moore_criteria
  discrimination: 'n/a as a c-index - no AUC or concordance is reported. Evidence is calibration plus
    separation, in an EXTERNAL cohort: predicted/observed response 50.9/42.6% low, 29.0/29.4% mid,
    13.5/14.3% high risk (GOG 149, n=280), with median OS 11.93 / 7.59 / 5.58 months. Hosmer-Lemeshow
    P=0.624 internally'
  discrimination_source: 'Moore DH et al., Gynecol Oncol 2010;116(1):44-49, PMC4470610, read 2026-08-17.
    Grepped for AUC / area under / c-index / concordance / ROC: none appears. Appropriate rather than
    missing, the index returns one of three bands, so the same reasoning as lipi, albi and abc_method.

    Table 4, the whole of it. Internal validation (GOG 110/169/179, n=428) then external (GOG 149, n=280),
    response rate estimated vs observed, and median PFS / OS in months:
      Low-risk  (0-1 factors)  50.6 vs 47.3 | 6.34 / 11.10    ||  50.9 vs 42.6 | 6.87 / 11.93
      Mid-risk  (2-3 factors)  29.4 vs 31.4 | 4.60 /  9.17    ||  29.0 vs 29.4 | 4.44 /  7.59
      High-risk (4-5 factors)  13.0 vs  9.8 | 2.79 /  5.49    ||  13.5 vs 14.3 | 3.38 /  5.58

    This is the best-evidenced ordinal model in the library, and the reason is the second block of
    columns. GOG 149 was not used for development, and the predicted response rates land within 8, 0.4
    and 0.8 points of observed across the three bands, calibration holding in a cohort the model never
    saw. Compare abc_method and lipi, whose separation is only ever shown internally. Internal
    goodness-of-fit was also formally tested: Hosmer-Lemeshow P=0.624, i.e. no evidence of misfit.

    A four-fold spread in response (50% to 13%) and a two-fold spread in median OS (11.9 to 5.6 months)
    is a clinically actionable separation, and the high-risk band is about 16% of patients, large
    enough to matter and small enough to be a real subgroup.

    One caution the numbers do not carry: the five factors are counted, NOT weighted. Table 3 prints
    five adjusted odds ratios and the paper says explicitly they conferred comparable weights with no
    interactions, which is why a plain count was used. Anyone tempted to reweight from those ORs would
    be building a different model than the one validated here. `black_race` is one of the five counted
    factors, which is a property of the GOG cohorts and needs stating before use rather than after.'
