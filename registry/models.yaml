    CHECKED 2026-08-05, encoded as a test 2026-08-17 (tests/test_liver_response_hap.py::
    test_matches_interventionalradio_independent_statement), against an independent statement of the
    score (interventionalradio.org/hap-score): same four criteria and thresholds, same A/B/C/D mapping
    with D as >2, same median survivals 27.6/18.5/9.0/3.6 months. That source ALSO writes the threshold
    as "g/dl", which does not independently corroborate a g/L reading (a second source repeating the
    same textual convention the original paper uses is not the same as a second source confirming the
    physiological value); the g/L reading rests on physiology alone, not on this corroboration. after an audit flagged the earlier wording as a non sequitur.

    Rewritten 2026-08-14, because the earlier wording called this "the abstract's g/dL typo" and that
    understated it. Re-reading the paper, "g/dl" is its uniform usage: it appears in Table 3, in Table 2
    ("Albumin (g/dl)"), in the abstract, and in the Methods ("The cut-offs used were bilirubin 17 umol/l,
    albumin 36 g/dl"). Four independent places, so it is not a transcription slip in one rendering of one
    section, it is how the paper was written throughout.

    That does not change our implementation, and it slightly strengthens the case for it. 36 g/dL is not
    a physiological albumin concentration; 36 g/L is the lower bound of the normal range, and it is the
    threshold every downstream statement of the score uses. We read it as g/L deliberately, and the
    reason is recorded here rather than left to look like an unnoticed discrepancy.
