    ESGO's own site terms say "personal and non-commercial use only", and "personal" is narrower
    than "academic" or "organisational". A statutory exception is a defence to a database-right
    claim; it is not a rewriting of a contract someone accepted by using a website. The two can
    diverge. This determination rests on the statute, holds while the academic-use premise holds,
    and would need revisiting if it stops holding.
