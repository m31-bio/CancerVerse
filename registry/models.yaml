    stage) and lost the head-to-head. The cost is the same and the discrimination is worse, so BCLC
    is carried as the standard-of-care reference rather than as the comparator to beat. Worth stating
    plainly: like ALBI, ITA.LI.CA publishes no baseline survival function -- Table 3 gives the
