    same patients
  discrimination_source: 'PLOS Medicine 2016, PMC4846017, Table 4, read 2026-08-07. Training n=3,628
    and internal validation n=1,555 (Italy), external validation n=2,651 (Taiwan). The head-to-head
    against five rival systems is the reason to prefer it, not the absolute number. A 2021 overview
