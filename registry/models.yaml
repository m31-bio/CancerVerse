      that would lift this row out of `no_independent_reference_implementation`. CRAN `cliot` 1.0.0
      (GPL-3, Neel Agarwal) ships `atria_stroke_risk(age, prior_stroke, female_sex, diabetes, chf,
      hypertension, proteinuria, egfr_lt_45_or_esrd)`, the same eight inputs, the right name, the
      right paper cited in its help page.

      It models the score as ADDITIVE: age scored 0/3/5/6 by band, plus a flat +4 for prior stroke.
      Table 3 of the source does not work that way. Age is scored 0/3/5/6 WITHOUT a prior stroke and
      8/7/7/9 WITH one, an explicit age x prior-stroke interaction, which is the specific thing that
      distinguishes ATRIA from CHADS2. Two tells that the additive reading cannot be right: the
      with-stroke row is NON-MONOTONIC in age (65-74 and 75-84 both score 7), which no additive model
      can produce; and a patient under 65 with a prior stroke scores 8, not 0+4.

      So `parity_status` stays `not_checked`. Running against `cliot` would produce disagreement on
      every prior-stroke patient and agreement on every other one, which is worse than no check,
      it would look like a parity failure in OUR code. Recorded here so the next person who finds
      `cliot` does not spend the same hour, and does not "fix" this module to match it.
