  upstream:
  - doi: 10.1158/1055-9965.EPI-22-0873
    note: development paper; no coefficient table, the fitted model is in the study package
  parity_status: checked
  parity_note: 'CHECKED 2026-08-14, route 1, against PatientLevelPrediction 6.6.0 itself: the reference
    values come from loadPlpModel + predictPlp on the study package''s own model directory, so the
    vendor''s whole predict path runs, covariate deletion, normalisation by normFactors, the join on
    covariateId, the dot product and the logistic link. 15 cases, worst absolute difference in the
    linear predictor below 1e-9. Between them the cases multiply every one of the 278 betas by a
    non-zero value, since two of them are the entire positive and entire negative halves of the model.
    What this does NOT prove: there is no published patient-level worked example anywhere, so nothing
    checks the artifact against the paper. It checks our code against the artifact, and the artifact
    against itself (model.json versus the unrounded covariateImportance.csv, all 278 agreeing).'
  evidence:
    test: tests/parity/test_optum_lung_lasso_parity.py
    test_function: test_matches_patient_level_prediction
    script: tests/parity/reference/optum_lung_lasso_reference.R
    fixture: tests/parity/reference/optum_lung_lasso_cases.json
  scope_note: 'Optum de-identified EHR (cdm_optum_ehr_v1705): patients aged 45-65 with a 2013 outpatient
    visit, at least 365 days of prior observation and no prior lung cancer; 4,777,606 patients and 3,661
    outcomes. Predicts a FIRST lung cancer diagnosis in days 1-1095 after the index visit. Three things
    to know before pointing it at data. (1) The inputs are OMOP covariateIds, not clinical variables, so
    the caller must already be extracting FeatureExtraction covariates under the settings in
    modelDesign.json, a different lookback window makes the same id mean something else. (2) Absence
    and zero are indistinguishable: the covariate set was built with missingMeansZero, so an
    under-coded record scores like a healthy one, and this is the failure mode to watch in deployment
    rather than a miscalibrated coefficient. (3) The model learned one vendor''s coding habits.
    Its fourth and fifth largest coefficients are a body-temperature measurement (-0.8444) and a
    temperature observation (+0.8025), the same clinical fact filed in two OMOP domains, with opposite
    signs. That is care-utilisation and documentation signal, not lung biology. It survived external
    validation (AUC 0.81 in the Mercy EHR) but that is not a guarantee for a third database.'
  repro_tier: A
  discrimination: AUC 0.76 internal; 0.81 on external validation in the Mercy EHR and 0.72 in Optum
    claims
  discrimination_source: Cancer Epidemiol Biomarkers Prev 2023;32(3):337-343, PMID 36576991, read
