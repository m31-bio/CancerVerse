  architecture_family: Points table
  architecture: Count of four binary poor-prognosis factors, each independently significant at 99%
    confidence in a multivariable Cox model and explicitly NOT weighted by its hazard ratio; banded
    0 / 1-2 / 3-4 and reported against the derivation cohort's published median and one-year overall
    survival for that band.
  parity_note: >-
    RELABELED 2026-08-17: parity_status was "checked", but no independent second source exists to
    check against, the article is CLOSED ACCESS with no repository copy anywhere, so
    tests/parity/test_chau_eg_parity.py compares the module's transcribed constants against a second
    hand-typed copy of the same constants in the test file, both written by the same reader from the
    same closed-access PDF. That is a real and useful check (it pins the transcription and catches a
    later silent edit), but it is not an external comparison, and "checked" overclaimed one. No
    fixture and no reference script exist, because there is nothing to run and nothing to re-derive:
    the published model is a count, and what the test actually verifies is whether every transcribed
    constant still equals the digits in the article, not whether the article's own numbers are
    independently corroborated. There is no URL a later reader can open to re-check and no mirror to
    regenerate a fixture from, which makes tests/parity/test_chau_eg_parity.py the durable record of what the article said, and that is not_checked.
    Pinned at zero tolerance: four Table 3 hazard ratios with 99% CIs, three significant Table 4 risk
    ratios, both non-significant Table 4 factors, three risk-group Ns, three median survivals, three
    one-year survivals with CIs, two hazard ratios versus good risk, and six whole-cohort figures.
    THE SUBSTANTIVE CHECK is that Table 3 and Table 4 are DIFFERENT MODELS. Table 4 fits tumour
    response separately and liver metastases, one of the four survival factors, P < .0001 there,
    is not significant for response at all (P = .558). A reader who assumes one model for two
    outcomes gets that backwards, so it is asserted directly rather than left in prose.
    Two further guards: that the module stores Table 3's three-decimal values rather than the
    abstract's rounded ones, and that the three risk groups sum to 817 (complete-case) rather than
    the 1,080 of the abstract.
  core_formula: "count = number of 4 binary factors present. NOT a weighted sum\n\
    \          PS >= 2 · liver metastases · peritoneal metastases · ALP >= 100 U/L\n\
    \  band  = good 0 | moderate 1-2 | poor 3-4\n\
    \  output = that band's published median OS and one-year survival\n\
    \           11.8 / 7.4 / 4.1 months;  48.5% / 25.7% / 11%\n\n\
    No intercept and no baseline survival are published, and none is needed:\n\
    the deliverable is the count and its three-cell outcome lookup.\n\
    `risk` is None. A SEPARATE logistic model for tumour response (Table 4)\n\
