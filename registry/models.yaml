  citation_note: CORRECTED 2026-08-07. Recorded first as Kerlikowske K, who is the LAST author. The record
    gives Gard CC first. This is the second time a hand-written citation here named the corresponding
    author as first author -- pbcg_extended had the same error -- which is why citations are fetched rather
    than typed.
  development_data: registry
