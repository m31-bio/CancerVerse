- id: iota_adnex
  nomogram_check_result: agrees
  nomogram_check: 'CHECKED 2026-08-18 against Appendix D of the BMJ supplement. All 44
    coefficients agree, 11 per linear predictor across z1 to z4, counted as well as
    compared, so a missing term could not pass as a match.

    Method note that matters for trusting this: the coefficients were PARSED OUT OF THE
    PDF TEXT LAYER by regex, not typed into the comparison script by hand. Typing them
    would repeat any transcription error twice and the check would prove nothing. It is
    still a weaker check than the others recorded here, for a reason worth stating: this
    module was written by the same agent now checking it, so it verifies the transcription
    and not the judgement behind it.

    THE FIRST RUN REPORTED THREE SIGN ERRORS IN OUR IMPLEMENTATION AND WAS WRONG. Appendix
    D is typeset inconsistently: z1 prints the acoustic-shadow term as "-2.04157" with a
    U+2212 minus adjacent to the digits, while z2, z3 and z4 print "- 1.87763" with an
    ASCII hyphen and a space. The regex required the sign to abut the number, so it read
    the three spaced terms as positive and confidently accused the code. A broken parser
    indicts whatever it is pointed at, and on this evidence it would have been believed,
    the three differences were in the same term across three predictors, which looks
    exactly like a real systematic error. Signs are now tokenised and the term count is
    asserted.'
