  ehr_availability: routine
  ehr_note: >-
    CA19-9 and CA72-4 are routine serum tumour markers, differentiation grade comes from the diagnostic
    biopsy report, and LNmax is a short-axis node measurement already made on the staging MDCT. CA72-4 is
    ordered less widely outside East Asia than the other three.
