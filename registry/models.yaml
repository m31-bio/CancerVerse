- id: lipi
  discrimination: 'n/a as a c-index - LIPI is a 3-group ordinal stratifier and the paper reports
    no concordance or AUC anywhere. Its evidence is separation: median OS 34 / 10 / 3 months for
    good / intermediate / poor (P < .001), median PFS 6.3 / 3.7 / 2.0 months, and independent
    HRs of 2.51 (LDH > ULN) and 2.22 (dNLR > 3)'
  discrimination_source: 'Mezquita L, Auclin E, et al. "Association of the Lung Immune Prognostic
    Index With Immune Checkpoint Inhibitor Outcomes in Patients With Advanced Non-Small Cell Lung
    Cancer." JAMA Oncol 2018;4(3):351-357. PubMed 29327044, PMC5885829. Abstract and full text read
    2026-08-17, and the full text grepped for c-index / concordance / AUC to confirm the absence
    rather than infer it: the only hit on "discriminat" is a Discussion sentence about neutrophil
    subpopulations and is unrelated.

    This is the RIGHT evidence for the model rather than a gap. LIPI returns one of three groups,
    not a probability, so a concordance statistic on its output would summarise three distinct
    values and calibration is undefined, the same position as albi and ang2010_rpa. What an
    ordinal stratifier has to show is that the groups separate, in the published order, by enough
    to matter. Verbatim: "Median OS for poor, intermediate, and good LIPI was 3 months (95% CI, 1
    month to not reached [NR]), 10 months (95% CI, 8 months to NR), and 34 months (95% CI, 17 months
    to NR), respectively, and median PFS was 2.0 (95% CI, 1.7-4.0), 3.7 (95% CI, 3.0-4.8), and 6.3
    (95% CI, 5.0-8.0) months (both P < .001)." An 11-fold spread in median OS across three groups
    is a wide separation by any standard.

    Cohorts: test n=161, validation n=305, pooled ICI n=466, plus a chemotherapy-only control cohort
    of n=162. The control cohort is the load-bearing part and is why this model sits on the RESPONSE
    axis at all. LIPI correlated with worse ICI outcomes but NOT with chemotherapy outcomes, which
    is what distinguishes a treatment-selection score from a general prognostic one. Note it is
    still prognosis in FORM: it ranks survival under a therapy rather than estimating what that
    therapy adds, so it takes survival metrics and not benefit metrics. See
    scripts/build_phase2_tables.py.'
  disease: lung
  axis: response
  role: flagship
  status: implemented
  title: LIPI (Lung Immune Prognostic Index, ICI outcomes)
  code: cancerverse_baseline.lung.response.lipi
  license: open
  repro_tier: A
  citation: Mezquita L et al., Lung Immune Prognostic Index
  equation_source: dNLR > 3 = 1 point, LDH > ULN = 1 point; 0/1/2 = good/intermediate/poor. dNLR = neutrophils
    / (leukocytes - neutrophils)
  upstream:
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5885829/
    note: LIPI development, JAMA Oncol 2018;4(3):351-357 (PMC7481630, cited here in earlier revisions,
      is a 2020 commentary, not the development paper)
  - url: https://www.sciencedirect.com/science/article/pii/S0169500224005737
    note: validation, IMpower130/131/150 post hoc
  canonical_impl:
    type: paper_only
    license: open
  our_code: cancerverse_baseline.lung.response.lipi
  parity_status: checked
  parity_note: 'No worked example exists. LIPI is a two-item binary index, so there is no arithmetic
    to reproduce beyond the rule itself. Checked by route 3 against TWO independent published statements
    of the rule, both read verbatim: PMC11222319 ("LIPI 0, dNLR<=3 and LDH <= ULN; LIPI 1, dNLR >3 or
    LDH > ULN; and LIPI 2, dNLR >3 and LDH > ULN") and Front Immunol 2025;16:1640066, which additionally
    gives the dNLR formula as "neutrophil count/(white blood cell count - neutrophil count)". All four
    cells of the truth table, both threshold boundaries (dNLR exactly 3 and LDH exactly ULN must score
    0, since both rules are strict >) and the dNLR denominator are asserted in tests/parity/test_lipi_parity.py.'
  scope_note: also used on the prognosis axis
  inputs:
  - dnlr (or neutrophils + leukocytes)
  - ldh
  - ldh_upper_limit_normal
  open_source: none
  architecture_family: Points table
  architecture: 'Two-item binary index: derived neutrophil-lymphocyte ratio >3 and LDH above the upper
    limit of normal each score 1, giving 3 risk groups.'
  n_parameters: 2
  core_formula: "score = [dNLR > 3] + [LDH > ULN]      (0–2)\n\n  dNLR = neutrophils / (leukocytes − neutrophils)\n\
    \  0 good · 1 intermediate · 2 poor"
  evidence:
    test: tests/parity/test_lipi_parity.py
    test_function: test_every_cell_of_the_published_truth_table
  public_repo: null
  source_url: https://pubmed.ncbi.nlm.nih.gov/29327044/
  year: 2018
  entrypoint: lipi_predict
  equation_location:
    numbered: null
    where: >-
      A two-item definition rather than a fitted equation, so there is no coefficient table, confirmed,
      the paper has only Table 1 ("Multivariate Analysis for Overall Survival in the Immunotherapy Pooled
      Cohort (Bootstrap Internal Validation)") and Table 2 ("Logistic Regression of Clinical Benefit
      (Disease Control Rate) in the Immunotherapy Pooled Cohort"), neither of which assigns weights.

      A precise locus does exist and is prose: Methods, "Patients" subsection, final paragraph, print
      page 353, immediately before "Statistical Analysis". Verbatim: "The LIPI was developed on the basis
      of dNLR greater than 3 and LDH greater than ULN, characterizing 3 groups (good, 0 factors;
      intermediate, 1 factor; poor, 2 factors)." The dNLR formula is not in that paragraph, it is in the
      Introduction, page 352: "derived neutrophil to lymphocyte ratio (dNLR; absolute neutrophil
      count/[white blood cell concentration - absolute neutrophil count])".

      Trap: Table 1's row label reads "Derived neutrophil/lymphocyte ratio", which contradicts the
      Introduction's definition. Anyone citing Table 1 alone will implement an ordinary NLR.
    verified: re-read 2026-08-14 against PMC5885829, machine-readable in both the PMC HTML and the PDF
