  flagship_note: 'Flagship for "Stroke risk in atrial fibrillation", decided 2026-08-14. Note the
    cell: cvd/prognosis carries TWO clinical questions, and GRACE is the flagship of the other one
    (mortality after acute coronary syndrome). They do not compete, and neither is an alternative to
    the other, see reporting.clinical_question for why the cell key has a third component.

    Why ATRIA over CHA2DS2-VASc, on three independent grounds. Discrimination: 0.73 against 0.70,
    head-to-head, both scored on the same patients in ATRIA''s own cohort rather than each reporting
    its own. Provenance: ten values read directly from Table 3 of an open-access paper and transcribed
    twice. Completeness: nothing missing, no author to email. Its only extra cost is two routine values,
    a urinalysis flag and an eGFR.

    CHA2DS2-VASc stays implemented as the alternative on this question because it is 16x more cited
    (6,781 against 409) and is what the guidelines say, so an answer that has to be guideline-concordant,
    or legible to a reviewer who expects it, needs it. Use it for that, not because it is more
    accurate; it is not.

