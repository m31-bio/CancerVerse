- id: msk_pancreatic
  discrimination: Bootstrap-corrected concordance index 0.64 internally (200 resamples, on the 555-patient
    MSK development cohort); externally, 0.62 at Massachusetts General Hospital (n=424, 375 with complete
    data, JCO 2005) against 0.59 for AJCC stage, p=0.004; 0.61 in a second independent cohort (Br J Surg
    2009)
  discrimination_source: 'after two independent citation-sourcing passes both
    caught the same errors here. Brennan MF, Kattan MW, Klimstra D, Conlon K., Ann Surg 2004;240(2):293-8,
    PMID 15273554, PMCID PMC1356406, the earlier note that this article "is paywalled with no PMC
    record" was wrong; the PMC record exists and is retrievable (confirmed via NCBI eutils and
    independently via a second sourcing pass). The earlier note that "the development paper reports no
    numeric figure" was also wrong: Results, page 294 of the PMC-served PDF, states plainly "The
    bootstrap-corrected concordance index is 0.64," from 200-resample bootstrapping described in
    Materials and Methods > Statistical Analysis, an internal figure, not an external one, but a real
    number the paper does print.

    The earlier n=555 was also misattributed: 555 is Brennan 2004''s OWN development cohort ("we
    collected clinicopathological and operative data on 555 resected patients," Materials and Methods,
    page 293). NOT the Katz 2005 external validation cohort, which was independently confirmed via
    Europe PMC (EXT_ID:16234519) to be 424 consecutive patients (375 with complete documentation) from
    Massachusetts General Hospital, 1985-2003.

    The earlier note about "the deployed calculator''s 315 coefficients" was a copy-paste artefact from
    a different model''s entry (dutasteride, which genuinely has 315), this model has on the order of
    23 terms plus intercept, per its own core_formula, and the figure never belonged here.

    Two external validations supply the numbers that matter for out-of-sample use, and they agree:

    (1) Katz MHG et al., J Clin Oncol 2005;23(30):7529-35, PubMed 16234519, abstract verbatim: "The
    nomogram concordance index was 0.62 compared with 0.59 with the American Joint Committee on Cancer
    (AJCC) stage (P = .004). This suggests that the nomogram discriminates disease-specific survival
    better than the AJCC staging system." (424 patients, 375 with complete data.)

    (2) de Castro SMM et al., Br J Surg 2009;96(4):417-23, PubMed 19283741, abstract verbatim: "The
    nomogram concordance index was 0.61. The calibration analysis of the model showed that the predicted
    survival did not significantly deviate from the actual survival."

    Read the margin, not the value. 0.62 against AJCC stage''s 0.59 is a three-point gain over the
    staging system it is meant to improve on, statistically significant on 424 patients, clinically
    slim. Both external validations put the nomogram near 0.61-0.62, below the 0.64 internal bootstrap
    figure, which is the usual direction of drift from internal to external validation.'
