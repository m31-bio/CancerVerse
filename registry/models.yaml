  parity_note: CHECKED 2026-08-05 by extracting the coefficients from SWOP's own Flash calculator (/2011/swf/c03dre.swf).
    The tool cannot be run. Flash is EOL, so outputs are unobtainable, but the SWF still serves and
    its ActionScript stores literals as IEEE-754 doubles. All six RC3 constants recovered; worst deviation
