  our_code: cancerverse_baseline.head_neck.prognosis.ang2010_rpa
  parity_status: not_checked
  parity_blocker: no_independent_reference_implementation
  scope_note: 'Known ambiguity, documented in code: the primary text uses ''>10 pack-years'' for the HPV-positive
    branch''s smoking split but ''nonsmokers'' (undefined precisely) for the HPV-negative branch''s exception.
    We apply the same <=10/>10 pack-years split to both branches as the more defensible reading; flagged,
    not silently resolved.'
  open_source: none
  parity_note: 'RELABELED 2026-08-17: this used to say Fakhry et al. (Cancer 2019;125:2027-2038, PMC6594017)
    "RESOLVED" the documented pack-years ambiguity. That overstated it. What Fakhry actually did is settle
    the pack-years split (both branches use <=10) but DISAGREE with Ang on where T1 falls for the
    HPV-negative exception: Ang names T2/T3 only, so an HPV-negative T1 patient defaults to high risk;
    Fakhry''s operationalization is <T4, which pulls T1 into the intermediate group instead. That is a
    genuine, still-unresolved divergence between the primary paper and its own external-validation
    paper, not something a second source settled, it is shipped as two selectable branches via the
    `definition` parameter (default `ang2010`, the literal primary reading) precisely because neither
    is simply "the corrected one." The cited evidence test only checks that the two hand-transcribed
    branches differ in the one cell where the two papers disagree, it does not compute anything from
    Fakhry''s own paper, so it demonstrates internal consistency between two code paths, not an
    independent replication of either paper''s numbers. Note also RTOG 0129 enrolled stage III-IV
    disease, so T1 was likely rare or absent in the original cohort either reading is drawn from, the
    T1 cell was probably not directly observed in the trial that produced these risk groups at all.'
  architecture_family: Decision tree
  architecture: 'Recursive-partitioning (CART) decision tree: three binary splits on HPV status, pack-years
    and nodal/tumour stage produce 3 risk groups.'
  n_parameters: 3
  core_formula: "HPV+ ─┬─ ≤10 pack-years ─────────────→ low\n      └─ >10 ─┬─ N0–N2a ────────────→ low\n\
    \              └─ N2b–N3 ───────────→ intermediate\n\nHPV− ─┬─ ≤10 pack-years, T2–T3 ────→ intermediate\n\
    \      └─ otherwise ────────────────→ high"
  evidence:
