  paper_title: Prediction Model of Tumor Regression Grade for Advanced Gastric Cancer After Preoperative
    Chemotherapy
  equation_source: >-
    Table 4 "Risk Score of Prediction Model for TRG" gives the four point values (CA19-9 <=10.90 U/mL 5,
    CA72-4 <=3.19 U/mL 4, well differentiation 7, LNmax >=1.535 cm 7). Table 3 "Multivariate analysis:
    variables correlated with TRG in the training set" gives the coefficients behind them (B 1.725, 1.511,
