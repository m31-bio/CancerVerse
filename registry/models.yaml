    three-cell lookup of response rate and median PFS/OS in a development and an external cohort.
  parity_note: >-
    Nothing to re-derive: the paper declines to weight the five factors, so the model is a count, and the
    parity question is whether the lookup reproduces Table 4 exactly rather than whether an equation
    reproduces a formula. All twelve Table 4 values (three bands x two cohorts x response rate and PFS/OS)
    are pinned at zero tolerance, transcribed from PMC4470610. Two further values from Tewari et al's
    prospective GOG 240 endpoint (PMC4896296) are pinned the same way; the paper's own mid-risk prospective
    figure is Fig. 1 only and is deliberately NOT invented as a number. The five Table 3 odds ratios are
    pinned separately as provenance and a behavioural test confirms they are never used to compute anything,
    flipping any one factor changes the count by exactly 1 regardless of that factor's odds ratio.
  core_formula: "count = number of 5 binary factors present (race, PS>0, pelvic site, prior\n\
    \        radiosensitizer, recurrence <=1yr from diagnosis). NOT a weighted sum\n\
    \  band  = low 0-1 | mid 2-3 | high 4-5\n\
    \  output = that band's published response rate and median PFS/OS,\n\
    \           development cohort AND external (GOG 149) validation cohort\n\n\
    No intercept exists for the underlying logistic model and none is needed:\n\
    the published deliverable is the count and its three-cell outcome table.\n\
    `risk` is None, this is a lookup, not a fitted probability."
