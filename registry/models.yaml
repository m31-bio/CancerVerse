- id: bcrat
  disease: breast
  axis: detection
  role: alternative
  status: implemented
  discrimination: Concordance 0.58 (95% CI 0.56-0.60) for 5-year risk in the Nurses' Health Study.
    Calibration is the model's strength, not discrimination, expected/observed 0.94 (0.89-0.99) in
    the same validation
  discrimination_source: 'NOT from the development paper. Gail MH et al., J Natl Cancer Inst 1989;81(24):1879-86
    reports NO discrimination statistic at all, abstract read in full 2026-08-14 via PubMed 2593165,
    and it describes the relative-risk model, the baseline hazard and the competing-risk adjustment
    without ever stating a concordance, c-statistic or AUC. That is not an omission by this registry;
    the number did not exist until the model was validated externally.

    The figure above is from the standard validation: Rockhill B, Spiegelman D, Byrne C, Hunter DJ,
    Colditz GA. "Validation of the Gail et al. model of breast cancer risk prediction and implications
    for chemoprevention." J Natl Cancer Inst. 2001;93(5):358-66, PubMed 11238697, abstract read 2026-08-14.
    Verbatim: "The concordance statistic, which indicates discriminatory accuracy, for the Gail et al.
    model 2 when used to estimate 5-year risk was 0.58 (95% CI = 0.56 to 0.60)." Cohort: 82,109 white
    women aged 45-71 followed 5 years.

    Read the two numbers together or neither is meaningful. The same paper reports the model FIT well
    E/O 0.94 (0.89-0.99) overall, and 1.04 (0.96-1.12) among women above the 1.67% chemoprevention
    threshold, and concludes it "fit well in this sample in terms of predicting numbers of breast
    cancer cases in specific risk factor strata but had modest discriminatory accuracy at the individual
    level." BCRAT is used to decide eligibility for risk-reducing therapy at a population threshold,
    which is a calibration question. Quoting 0.58 alone would make it look like a failed model rather
    than one being used for what it is good at.'
