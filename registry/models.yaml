  tier_note: 'RE-CHECKED 2026-08-14 by reading Yoo et al in full (PMC3464766, not just the abstract): the
    ''blocker'' below already describes this exact paper, 528 patients, 76 events, and the ccc.ac.at/gcu
    calculator are Yoo 2012''s own numbers, not a different earlier candidate. Confirmed line by line: Table
    3 is headed "Univariate hazard ratios" only; the text states the nomogram points were built by "dividing
    the shrinked [multivariable ridge Cox] coefficients by the largest shrinked coefficient... and multiplying
    by 100", the coefficients themselves are never printed, only this points-normalised ratio. The two
    worked examples in the text (7.2 points -> 95%/91.8% at 3/5y; 101.2 points -> 81.1%/70.5%) are read off
    the nomogram graphically ("draw a line from the total points axis to the OS probability axis"), not from
    a formula or baseline-survival table. No supplementary file exists on PMC or at BJC/Nature''s own site.
    So Yoo 2012 does NOT pan out; it is the same defect already on file, just confirmed against the primary
    text instead of a prior write-up.
    Also checked three SEER-based alternatives in the 0.75-0.84 C-index range from the "numerous SEER-based
    nomograms" lead: Wang et al, J Cancer 2018 (doi:10.7150/jca.26220, PMC free, C-index 0.749/0.786) DOES
    print full multivariable HRs with reference categories (Table 2), an improvement on Yoo, but never
    publishes a baseline survival function S0(3y)/S0(5y) or a points-to-probability formula, only the rms::cph
    nomogram figure; same for Zhu/Xu SEER nomogram PMC9583406 (C-index ~0.84) and the SEER-based Asian-population
