- id: ang2010_rpa
  disease: head_neck
  axis: prognosis
  role: flagship
  status: implemented
  title: Ang 2010 RPA risk groups (HPV / smoking / stage, oropharynx)
  code: mayo_baseline.head_neck.prognosis.ang2010_rpa
  license: open
  repro_tier: A
  citation: Ang KK et al. N Engl J Med. 2010;363(1):24-35 (RTOG 0129)
  equation_source: 'PMC2943767, verbatim Results-section quote — HPV-positive: low risk except smokers
    (>10 pack-years) with N2b-N3 = intermediate; HPV-negative: high risk except nonsmokers with T2/T3
    = intermediate'
  upstream:
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2943767/
    note: primary RTOG 0129 analysis
  canonical_impl:
    type: paper_only
    license: open
  our_code: mayo_baseline.head_neck.prognosis.ang2010_rpa
  parity_status: checked
  scope_note: 'Known ambiguity, documented in code: the primary text uses ''>10 pack-years'' for the HPV-positive
    branch''s smoking split but ''nonsmokers'' (undefined precisely) for the HPV-negative branch''s exception.
    We apply the same <=10/>10 pack-years split to both branches as the more defensible reading; flagged,
    not silently resolved.'
  open_source: none
  parity_note: 'CHECKED 2026-08-05 against Fakhry et al. external validation (Cancer 2019;125:2027-2038,
    PMC6594017), which operationalizes the same risk groups. It RESOLVED the documented ambiguity -- both
    branches use <=10 pack-years -- and exposed a divergence: Ang names T2/T3 for the HPV-negative exception,
    Fakhry says <T4, which adds T1. Both shipped via the definition parameter; ang2010 is the default.'
  architecture_family: Decision tree
  architecture: 'Recursive-partitioning (CART) decision tree: three binary splits on HPV status, pack-years
    and nodal/tumour stage produce 3 risk groups.'
  n_parameters: 3
  core_formula: "HPV+ ─┬─ ≤10 pack-years ─────────────→ low\n      └─ >10 ─┬─ N0–N2a ────────────→ low\n\
    \              └─ N2b–N3 ───────────→ intermediate\n\nHPV− ─┬─ ≤10 pack-years, T2–T3 ────→ intermediate\n\
    \      └─ otherwise ────────────────→ high"
  evidence:
    test: tests/test_head_neck_prognosis_ang2010.py
    test_function: test_the_two_operationalizations_differ_only_for_hpv_negative_t1
  public_repo: null
  source_url: https://doi.org/10.1056/NEJMoa0912217
  year: 2010
  entrypoint: ang2010_rpa_predict
  equation_location:
    numbered: false
    where: Results, subsection 'HPV status and survival', stated as prose and drawn as the recursive-partitioning
