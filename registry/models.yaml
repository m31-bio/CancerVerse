  inputs:
  - ca19_9_u_ml
  - ca72_4_u_ml
  - differentiation
  - lnmax_cm
  architecture_family: Points table
  architecture: >-
    Four dichotomised pretreatment values with integer weights (5, 4, 7, 7) summed to 0-23, split at 13.
    A logistic regression derives the weights and is then not used again, so the score is the model.
  n_parameters: 4
  canonical_impl:
    type: paper_only
    license: open
    note: >-
      No calculator and no reference implementation exist. The paper prints the points, the cut-offs and
      the threshold in text, so this is a transcription with no recoverable second opinion; the tests
      check the transcription against the paper and pin the two directions most likely to be inverted.
  parity_status: not_checked
  parity_blocker: no_independent_reference_implementation
  parity_note: >-
    RELABELED 2026-08-17 from a "checked" that its own text already contradicted: this entry said
    "CHECKED" while stating in the very next sentence "this is not a parity run against an independent
    implementation and is not claimed as one", caught by an audit that treats a checked/matched status
    paired with no confirmable external target as disqualifying regardless of how careful the underlying
    transcription work was. No vendor code or second implementation exists for this model at all, the
    paper prints no nomogram and no calculator was ever built from it, so there genuinely is nothing
    external to compare against, the same situation as `cvd_statin_benefit` and `bcsc_v2`, which already
    use this honest label. What WAS verified, and remains true: every point value, cut-off and threshold
    against the PMC8082104 full text; that exp(B) reproduces each Table 3 odds ratio; and that the four
    published points ARE re-derivable from those odds ratios, which the module docstring originally
    denied. Each point p constrains a divisor d by p-0.5 <= OR/d < p+0.5; the four constraints intersect
    in (1.0593, 1.1425], and the natural anchor 4.531/4 = 1.13275 lies inside it and reproduces all four
    points on rounding. The reconstruction is not relied on, the points are transcribed, but it is
    internal-consistency evidence the transcription is right, not an independent check of it.

    Also pinned: the weights 5, 4, 7, 7 make only twelve totals reachable (0, 4, 5, 7, 9, 11, 12, 14, 16,
    18, 19, 23), so a score of exactly 13 CANNOT occur. The published "<=13 / >13" split is identical to
    "<=12 / >=14" and carries no inclusive-threshold ambiguity.
