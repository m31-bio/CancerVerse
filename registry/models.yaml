    cut-off values are in the Results text. Both tables are machine-readable in PMC8082104 and the paper
    contains no nomogram figure, so nothing was read off an image.
  source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8082104/
  license: open
  open_source: none
  repro_tier: A
  candidate_for: gastric_response_gap
  upstream:
  - doi: 10.3389/fonc.2021.607640
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8082104/
    note: Table 3 gives the betas, Table 4 gives the integer points; both are HTML tables in PMC
  equation_location:
    where: >-
      Table 4, "Risk Score of Prediction Model for TRG", the four point assignments. The betas behind
