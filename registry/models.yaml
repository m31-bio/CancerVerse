  scope_note: >-
    Oesophageal or oesophagogastric junctional carcinoma treated with CROSS-regimen neoadjuvant
    chemoradiotherapy FOLLOWED BY RESECTION. Two of the three inputs are post-resection pathology, so
    this cannot be run pre-operatively and says nothing about whether to operate, which is the
    question someone reaching for an "oesophageal prognosis model" most often has.
    FOUR OF THIRTEEN REACHABLE SCORES HAVE NO PUBLISHED SURVIVAL, and the module returns None for
    them rather than interpolating. Fig. 1 labels even totals only; ypN2 scores 5 and is the model's
    only odd point value, so every ypN2 patient (3-6 positive nodes, 60 of 626 = 9.6% of the
    derivation cohort) lands between labelled ticks. A Cox fit reproduces the printed axis to 0.36
    percentage points and would fill the gap convincingly, which is precisely why it is not used.
    DISCRIMINATION IS WEAK and should be quoted whenever the model is: c-index 0.63 at internal
    validation, 0.62/0.63 on cross-validation between the two centres, 0.61 on external validation.
    The authors say so themselves, predicted survival showed "only moderate correlation with
    observed survival, emphasizing the need for new prognostic factors".
    Squamous histology is well represented here (139 of 626, 22.2%) unlike chau_eg (4.6%), so the
    two esophageal models differ in applicability by histology and the chau_eg caveat must not be
    carried across.
    Staging editions are mixed and are not interchangeable: cN is UICC TNM SIXTH edition and binary
    (cN0/cN1 only, not the modern N0-N3), while ypT and ypN are seventh edition. Feeding
    eighth-edition categories or a three-level cN is feeding the model something it was never fitted
    on; the module refuses rather than mis-scoring.
  flagship_note: >-
    THE BEST IMPLEMENTABLE MODEL FOR THIS CELL, NOT THE BEST MODEL, and the distinction is the point.
    The AUGIS Survival Predictor (Ann Surg Oncol, PMC9831040) is substantially better, 6,399
    oesophagectomies in England and Wales, 5-year time-dependent AUC 83.9% against this model's
    c-index of 0.61-0.63, and is a random survival forest: a few thousand decision trees, no
    coefficient table, nothing to transcribe, R code "available on request". It remains recorded on
    esophageal_prognosis_catalog as the better model that cannot be reproduced.
    This entry was expected to fail the same way. The catalog's own next_action predicted it: "It is
    a NOMOGRAM built from a Cox fit, which in every case this project has examined, four cervical
    prognosis papers, msk_prostate_post_rp, means the points-to-probability axis is drawn in a
    figure and no numeric baseline survival S0(t) is printed." That prediction was WRONG for this
    paper, and the reason is worth carrying: Fig. 1 prints its survival axes as tick LABELS rather
    than as a scale to measure, so the lookup is complete without an S0(t) ever being stated. The
    lesson is to check the figure rather than infer from the model class.
