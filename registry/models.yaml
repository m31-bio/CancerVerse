- id: hn_detection_gap
  third_candidate_verified: 'VERIFIED 2026-08-17.
     THE MODEL IS COMPLETE AND IMPLEMENTABLE. Correcting two details from the
    lead recorded earlier the same day: the citation is Int J Oncol 2020;57(5):1192-1202 (not 2021;58(3)),
    and the intercept is confirmed rather than merely reported.

    Table III, "Multivariable model for head and neck cancer risk in the UK Biobank", transcribed in
    full. Intercept -9.54 (95% CI -11.2 to -7.88, P<0.001), on 397,179 complete cases (232 HNC cases,
    396,947 controls). Odds ratios with reference levels:
      age                 1.04 per year (1.02-1.05), continuous
      sex                 female 1.00 ref | male 1.81 (1.38-2.38)
      smoking             never 1.00 ref | previous 1.59 (1.17-2.15) | current 3.10 (2.17-4.40)
      Townsend index      quintile 1 ref | 2: 1.30 | 3: 1.14 | 4: 1.81 (1.25-2.63) | 5: 1.66 (1.08-2.56)
      BMI                 0.96 per unit (0.93-0.99), continuous
      alcohol             never 1.00 ref | previous 3.26 (1.32-8.04) | current 1.42 (0.62-3.21)
      moderate exercise   0 days/week ref | 1-4: 0.68 (0.47-0.98) | >=5: 0.66 (0.46-0.95)
      fruit and vegetable <5/day ref | >=5: 0.71 (0.53-0.97)
    So every coefficient is ln(OR) and the constant is printed: logit(p) = -9.54 + sum(beta*x), for HNC
    within 7 years of recruitment.

    FOUR THINGS TO WEIGH BEFORE IMPLEMENTING, all read from the paper rather than inferred.

    (1) The external validation is not external. It is "the North West Cohort from the UK Biobank", a
    geographic subset of the same dataset, not an independent cohort. C-statistic 0.64 (0.60-0.68) there
    against 0.69 (0.66-0.71) in development. Every other model in this library at flagship status has
    either a genuinely separate validation cohort or a development base orders of magnitude larger; this
    has the large base (502,647 recruited) but the weaker validation design, so the label is
    internal-geographic.

    (2) No bootstrapping. Verbatim: "Bootstrapping was not completed as the dataset is sufficiently
    large, with minimal risk of optimism in predictions due to a good number of events per variable."
    Defensible at 232 events over 8 variables, and still an absence rather than a result.

    (3) Alcohol is non-monotonic and the current-drinker term is not significant. Previous drinkers
    3.26, current drinkers 1.42 with a CI crossing 1 (0.62-3.21), against never-drinkers as reference.
    That is the classic sick-quitter pattern, people who stopped because they were already ill, and     it means the alcohol term does not carry the direction a clinician would expect. Townsend is
    non-monotonic too (quintile 4 at 1.81 exceeds quintile 5 at 1.66).

    (4) Two inputs do not transfer. The Townsend deprivation index is a UK area-level measure with no
    US equivalent, the same class of problem the target platform crosswalk records for PREVENT''s SDI decile,
    where the only analogue found was a differently-scaled Vizient index. Exercise days per week and
    five-a-day intake are questionnaire items, so ehr_availability for this model would be not_ehr,
    matching crc_pro rather than routine.

    NEXT ACTION: a decision, not a search. Implementing this closes the last detection gap in the
    library and gives head_neck its first flagship on any axis besides prognosis. Against that: the
    discrimination is 0.64 on an internal-geographic split, and two of eight predictors have no platform
    equivalent. Both facts are now recorded, so the choice can be made on them.'
  third_candidate: 'The most promising of the three, it may be complete.
    McCarthy CE, Bonnet LJ, Marcus MW, Field JK. "Development and validation of a multivariable risk
    prediction model for head and neck cancer using the UK Biobank." Int J Oncol 2021;58(3):331-338,
    doi:10.3892/ijo.2020.5123, PubMed 33491742. Not previously recorded here; the note above knew only
    INHANCE and Smith 2024.

    Why it fits where the other two do not. Logistic regression on UK Biobank (502,647 recruited; 859
    HNC cases, 253 incident over 7 years), externally validated in a North West England cohort:
    C-statistic 0.69 (95% CI 0.66-0.71) development with "good calibration", 0.64 (0.60-0.68) external
    with "reasonable calibration". Modest, and in the same band as crc_pro, which ships at 0.681/0.679.
    Predictors are age, sex, smoking history, alcohol, material deprivation, BMI, weekly exercise and
    five-a-day fruit and vegetable intake. No HPV serology, no imaging, no tissue assay: the two
    obstacles that killed INHANCE (SEER incidence dependency) and the radiomics candidates do not apply.

    AND IT APPEARS TO PUBLISH ITS INTERCEPT, which is what Smith 2024 is missing and what
    af_stroke_lr_2026 is blocked on. A read of the publisher page on 2026-08-17 reports Table III
    carrying the predictor odds ratios with the constant in the caption: "Model Intercept Coefficient
    -9.54 (95% confidence interval, -11.2 - -7.88; P<0.001)". If that is right, every coefficient follows
    as ln(OR) and the cell is implementable.

    TREAT THAT AS A LEAD, NOT A FACT. The article is paywalled (Spandidos), has no PMC record, Europe PMC
    lists no full text, Crossref declares no licence and offers no link, and no author manuscript or
    repository copy was found. So the intercept above comes from a single reading of a page this project
    could not open, and the odds-ratio table was NOT read at all, reference categories, whether age and
    BMI enter continuously or banded, and how deprivation is coded are all unknown. Recording an
    unverified constant as verified is the specific failure this registry exists to prevent.

    NEXT ACTION: open Int J Oncol 2021;58(3):331-338, transcribe
    Table III in full, every odds ratio with its reference level and its coding, and confirm the
    intercept of -9.54. Then two judgements remain: material deprivation is an area-level index, the same
    class of predictor as PREVENT''s SDI decile that the target platform crosswalk flags as having only an
    imperfect analogue; and exercise and fruit-and-vegetable intake are questionnaire items, which put
    this at crc_pro''s ehr_availability of not_ehr rather than routine.'
  disease: head_neck
  axis: detection
  role: catalog
  status: catalog
  title: (superseded by ukb_hnc 2026-08-17, kept for the search record) (no open flagship yet, sites heterogeneous)
  repro_tier: C
  tier_note: >-
    RE-CHECKED 2026-08-14, full text of both candidates read; neither is implementable as-is.
    INHANCE (Am J Epidemiol, doi:10.1093/aje/kwz259, PMC7274188) is a 20-year absolute-risk model for
    HNC by subsite. Correction to the previous note, the final INHANCE model does NOT use sexual
    history or oral HPV: the paper states plainly it excluded HPV status "since most people in a general
    population do not know their HPV 16 or HPV 18 infection status," so the printed predictor set is
    age, sex, race/ethnicity, education, cigarette smoking (duration/intensity), alcohol intensity, and
    family history. Smith et al (Head & Neck 2024, doi:10.1002/hed.27834) is NOT a validation of the
    INHANCE model, it is an independently developed ARCAGE-derived logistic-regression model, externally
    validated in UK Biobank (AUC 0.75 development, 0.62 external validation), sharing only the general
    predictor themes (age, sex, education, smoking, alcohol). Full text obtained via the University of
    Glasgow Enlighten repository (eprints.gla.ac.uk/327130, CC-BY 4.0) after the Wiley page returned 402
    Payment Required, so Smith 2024 IS openly available, just not from the publisher's own page.
  open_source: none
  blocker: >-
    Both candidates fail on their own printed equations, for different reasons. INHANCE: (1) the
    coefficients are in Web Tables 4 and 5 of the supplement, a 2.6 MB zip confirmed unreachable through
    every route tried (PMC interstitial, Oxford/Silverchair 403, Europe PMC reports no supplementary
    files for PMC7274188); (2) even with the zip, INHANCE's absolute risk is built from SEER age- and
    sex-specific HNC incidence rates scaled by (1 - attributable fraction), the main text states this
    transform in words but prints no rate table, so the baseline is an external dataset dependency, not
    a printed constant. Smith 2024: the full text is open and Table 1 prints multivariable odds ratios
    (95% CI) for every retained predictor, age (continuous), sex, years of education (6 categories),
    smoking status (3) and pack-years (continuous), alcohol frequency (6 categories), but the paper
    never publishes the model intercept/baseline constant needed to turn those log-odds-ratios into an
    absolute probability, nor any worked numeric example. It is a case-control (ARCAGE)-derived logistic
    model besides, so even a printed intercept would need a Prentice-style correction for the sampling
    fraction before it read as a population absolute risk. Neither the intercept nor that correction is
    in the paper, the cited supplementary figures (S1-S5, ROC curves only per the text), or the Glasgow
    repository deposit (which holds only the main-text PDF, no supplement files).
  blocker_kind: missing file plus external data dependency (INHANCE); incomplete equation, odds ratios
    without an intercept (Smith 2024)
  routes_tried: INHANCE -- PMC serves an HTML interstitial in place of lee_web_material_final_kwz259.zip;
    Oxford/Silverchair CDN returns 403; Europe PMC reports no supplementary files for PMC7274188. Main
    text gives AUCs (0.643 oropharyngeal in men, 0.70+ elsewhere, up to 0.870) and worked absolute-risk
    examples in Tables 2-3, but not the coefficients. Smith 2024. Wiley pdfdirect returned 402; Europe
    PMC confirms isOpenAccess=N/inPMC=N; recovered instead via University of Glasgow Enlighten
    (eprints.gla.ac.uk/327130/2/327130.pdf, CC-BY 4.0, deposited by the corresponding author) and read in
    full with pdftotext. That deposit carries only the main PDF -- Figures S1-S5 referenced in the text
    (sensitivity-analysis ROC curves, not additional coefficients) are not attached there.
- id: hn_response_gap
  imaging_decision_2026_08_18: 'DECIDED, not pending. Widening criterion 2 to accept imaging inputs was put to the team on 2026-08-18 and declined for now. This cell therefore stays open by decision rather than by omission, and re-searching it on a schedule is not the plan, every candidate added to this literature since 2020 is imaging-derived. See docs/INCLUSION_CRITERIA.md for what was weighed, including why a retrained radiomics model would stop being an independent published baseline. What would reopen it is narrower: adopting published deep-learning WEIGHTS run as published, which is a different question and does not apply to any candidate in this cell.'
  criteria_note_2026_08_19: 'RE-SEARCHED 2026-08-19, and this pass finally TRIED THE ROUTE THIS ENTRY HAS
    BEEN NAMING AS UNTRIED. `researched_2026_08_17` said what would change the answer is the endpoint move
    that closed the cervical response cell, ask about response in the advanced or recurrent setting
    rather than to primary treatment. That has now been done. It does not change the answer, and knowing
    that is worth more than another sweep of the primary-treatment literature.

    FIRST, THE INCUMBENT IS STILL UNVALIDATED, CHECKED RATHER THAN ASSUMED. Every article citing the
    hypopharyngeal induction-chemotherapy nomogram (Front Oncol 2020, PMC7761343) was pulled: SIX
    citations, and not one is an external validation. They are distant-metastasis prediction (2026), an
    AI scoping review (2025), radiomics for locoregional recurrence (2024), the MRI radiogenomics paper
    already rejected here (2024), CT radiomics for PFS (2022), and a matched-pair survival analysis
    (2021). Criterion 3 fails today for the same reason it failed in 2026-08-06, and now that is a
    finding rather than an assumption.

    SECOND, THE ADVANCED/RECURRENT ROUTE. Two named candidates, both rejected, and they fail the same
    way as each other. (1) Novel Index Based on Inflammatory Markers Correlates with Treatment Efficacy
    of Nivolumab for Recurrent/Metastatic Head and Neck Cancer. Oncology. 2025. doi:10.1159/000542683,
    PMID 39566473. It does print a closed-form index on routine bloods. WBC + 2*lymphocyte%% +
    12*monocytes + 27*albumin, so it passes criterion 2 outright. But the index estimates OVERALL
    SURVIVAL, not response; n=61 at one centre; part of the analysis needs flow-cytometry T-cell
    subsets. It is prognosis under treatment, the same shape as the nine-variable pancreatic model
    rejected in `pancreatic_response_gap`, and it belongs in a different cell than the one it would
    fill. (2) Multicenter real-world data on immunotherapy for R/M HNSCC from China. Front Immunol.
    2026;doi:10.3389/fimmu.2026.1720838, PMID 41716388. n=105 across three hospitals, and its endpoints
    are OS and PFS. Its strongest predictor is PD-L1 combined positive score, an immunohistochemistry
    result. FINDING: the R/M literature answers this question with SURVIVAL endpoints and PD-L1/CPS. It
    is not producing validated response models on routine variables either, so the endpoint move that
    rescued cervical does not rescue this cell.

    THIRD, A NEW BEST-ON-INPUTS CANDIDATE, AND IT IS THE CLOSEST ANYTHING HAS COME. Nomogram Prediction
    of Response to Neoadjuvant Chemotherapy Plus Pembrolizumab in Locally Advanced Hypopharyngeal
    Squamous Cell Carcinoma. J Otolaryngol Head Neck Surg. 2025. doi:10.1177/19160216251318255, PMID
    39921555, PMC11807280, CC BY-NC. Endpoint is ORR by RECIST 1.1, the right endpoint for this cell.
    Inputs are pretreatment lymphocytes, red blood cells and basophils: a plain CBC, cleaner inputs than
    any candidate on file including the incumbent. Reported C-index 0.925 and AUC 0.925.

    It fails criterion 3, single institution, n=129, no external validation, and the nomogram was
    developed on the 47 patients who received pembrolizumab, not on all 129. TWO THINGS MAKE THE
    HEADLINE NUMBER WORSE THAN THE MISSING VALIDATION. The reported C-index interval is 0.848-1.002:
    an upper bound ABOVE 1 is impossible for a concordance statistic, so the interval was produced by a
    normal approximation that was never bounded, and 0.925 from three LASSO-selected predictors on ~47
    patients should be read as optimistic rather than as a result. Separately, the paper says it fitted
    a multivariable COX model to predict ORR -- Cox is for time-to-event and ORR is binary, so either
    the reporting is loose or the model is mismatched to its own endpoint. Same posture as the ovarian
    platinum-resistance nomogram, whose C-index of 0.975 this registry already records as a reason for
    suspicion rather than for enthusiasm.

    FOURTH, THE FIELD SAYS IT ABOUT ITSELF. Eur Radiol Exp 2026 (PMC12932746) opens: "There is no
    satisfactory model for predicting the therapeutic response to chemotherapy of nasopharyngeal
    carcinoma." That paper''s own answer is synthetic-MRI histogram features plus tumour-stroma ratio,
    which fails criterion 2 here, but the sentence is a straight corroboration of this cell from
    inside the specialty.

    WHAT THIS CHANGES. This cell is no longer "the endpoint move has not been tried". It has, and it
    failed. The remaining routes are narrower than before and should be stated so nobody re-runs this:
    (a) someone externally validates PMC7761343 or PMID 39921555, both are plausible, both are
    outside our control, and either would close the cell immediately since the inputs already pass;
    (b) the imaging criterion is widened, which was put to the team on 2026-08-18 and declined. There
    is no third route that a literature search can reach.'
  criteria_note_2026_08_18: 'RE-SEARCHED 2026-08-18. Recorded because the 2026-08-06 note was the only search on file and a stale date on a gap reads as a search nobody has repeated. Four candidates examined; none clears.\n\n    (1) Dual-energy CT nomogram for induction-chemotherapy response in nasopharyngeal carcinoma, two centres, 2025 (PMC11781003). Combines extracellular volume fraction with Ki67. FAILS criterion 2. DECT-derived, and Ki67 is an immunohistochemistry result.\n    (2) CT radiomics nomogram for pathological response after induction chemotherapy in advanced laryngeal cancer, single centre (Front Oncol 2023). FAILS criterion 2, radiomics features.\n    (3) Lien et al. Using Nomograms to Predict Patient Tolerance to High-Dose Cisplatin During Concurrent Chemoradiotherapy. Head Neck. 2025, doi:10.1002/hed.28164. Routine variables, but it answers a DIFFERENT QUESTION: whether a patient tolerates a cumulative cisplatin dose, not whether the disease responds. It belongs in no cell of this grid.\n    (4) The hypopharyngeal induction-chemotherapy nomogram (Front Oncol 2020, PMC7761343, AUC 0.860) remains the strongest and still fails criterion 3, unchanged.\n\n    PATTERN, and it is the same one the ovarian and pancreatic cells show: every candidate added to this literature since 2020 is imaging-derived. The routine-variable models on this axis are not appearing. Searching again in three months should not be expected to change that; a decision about criterion 2 would.'
  criteria_note: 'Fails criterion 3 of docs/INCLUSION_CRITERIA.md. three-fold cross-validation on the development cohort is not external validation, and one subsite at one centre is not a substitute for it.'
  researched_2026_08_17: 'RE-SEARCHED 2026-08-17. Nothing better found; the hypopharyngeal induction-
    chemotherapy nomogram in `tier_note` remains the best candidate and the cell remains a gap for the
    reason already recorded (3-fold cross-validation on one cohort, one subsite, one centre).

    Three new candidates were examined and all three fail on INPUTS, not on quality, the same wall the
    gastric, cervical and pancreatic response cells hit:
      * Acad Radiol 2024, PubMed 37985290. MRI radiogenomics: clinical data plus radiomics machine-
        learning classifiers plus transcriptomics. Two input classes this library does not take.
      * Int J Mol Sci 2024, PubMed 39062797. NMR-based metabolomics of blood serum. A research assay.
      * Cancers 2023, PubMed 36672427, ex vivo functional assay on tumour tissue. Requires live tissue
        and a laboratory protocol, not a record lookup.

    The pattern is now consistent enough to state as a finding rather than a coincidence: head and neck
    treatment-response prediction is being pursued almost entirely through imaging features, omics and
    tissue assays. A closed-form model on routine clinical variables is not what the field is building,
    so repeating this search is unlikely to help. What would change the answer is the same endpoint move
    that closed the cervical response cell, ask about response in the advanced or recurrent setting
    rather than to primary treatment, where simple validated indices sometimes exist.'
