  license: open
  repro_tier: A
  open_source: none
  citation: BMC Medicine. 2021;19:237
  equation_source: 'doi:10.1186/s12916-021-02078-2 (open access), Additional file 1 Table S1 — four nested
    logistic models (base / +E6 / +genotyping / full). Base: intercept -3.19059, hrHPV 2.06771, age -0.01935,
    cytology betas with NILM as reference. Supplement retrieved via the PMC mirror (PMC8414700) after
    Springer''s direct ESM URL returned 403.'
  upstream:
  - doi: 10.1186/s12916-021-02078-2
