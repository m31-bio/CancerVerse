- id: cvd_statin_benefit
  discrimination: 'n/a - this model does not rank patients, so it has no AUC. Its discrimination is
    whatever the upstream risk model supplies (PREVENT 0.794/0.757, or SCORE2)'
  discrimination_source: 'DELIBERATELY not a number, and not an unread paper either. after this row spent months rendering as "we have not read this from the paper yet", which implied
    homework that does not exist.

    There is no AUC to read because there is nothing to discriminate. The model takes an absolute
    untreated risk from a separate, verified model and multiplies it by a published trial rate ratio:
    ARR = baseline x (1 - RR^delta_LDL). Every patient with the same baseline risk and the same intended
    LDL reduction gets the same answer, so the output does not order patients and a concordance statistic
    is undefined on it. What CAN be wrong is the baseline risk, and that is the upstream model''s
    discrimination. PREVENT''s 0.794 (women) / 0.757 (men), or SCORE2''s.

    CTT 2010 (Lancet 2010;376(9753):1670-81, PMID 21067804) reports a treatment EFFECT, not a prediction
    model: RR 0.78 (0.76-0.80) per 1.0 mmol/L for major vascular events, RR 0.90 (0.87-0.93) for
    all-cause mortality. A meta-analysis of 26 trials has no AUC because it was never asked to identify
    anybody.

    This is the same reason parity_status is not_checked: there is no external target to check a
    composition against. Both facts are properties of what this model IS, and are stated as exceptions
    in docs/VERIFICATION.md rather than excused.'
  disease: cvd
  axis: response
  role: flagship
  status: implemented
  flagship_note: 'Flagship by default rather than by contest: it is the only implemented model on this
    cell, and the alternative listed beside it (cvd_response_gap) is a placeholder recording that no
    published CVD treatment-response model was found, not a rival., the field was
    empty because the no-flagship-note check only fires on cells holding more than one implemented
    model, so a single-model cell could hold the label with no stated reason.

    Read the label narrowly. This is the one model in the library this project COMPOSED rather than
    reimplemented: a CTT rate ratio applied to a baseline risk that some other model has to supply.
    It therefore inherits the accuracy of whatever feeds it, and its parity_status is not_checked
    because there is no external target to check a composition against, the single such case in the
    library, and stated as an exception in docs/VERIFICATION.md rather than excused.'
  title: 'LDL-lowering absolute benefit (DERIVED: CTT trial effect x a baseline risk)'
  code: cancerverse_baseline.cvd.response.statin_benefit
  entrypoint: cvd_statin_benefit_predict
  license: open
  repro_tier: B
  year: 2010
  citation: Cholesterol Treatment Trialists' Collaboration. Lancet. 2010;376(9753):1670-1681
  source_url: https://pubmed.ncbi.nlm.nih.gov/21067804/
  public_repo: null
  equation_source: 'NOT a published prediction model. A composition of two published quantities: the CTT
    2010 rate ratio per 1.0 mmol/L LDL-C reduction (major vascular events RR 0.78, 95% CI 0.76-0.80; all-cause
    mortality RR 0.90, 0.87-0.93, read verbatim from the abstract, PMID 21067804) applied to an untreated
    absolute risk supplied by a separate, verified model. ARR = baseline x (1 - RR^delta_LDL); NNT = 1/ARR.'
  upstream:
  - pmid: '21067804'
    note: CTT 2010, 170,000 participants in 26 trials
  canonical_impl:
    type: none
    license: n/a
    note: there is no calculator for this because nobody published it as a model; it is the arithmetic
      NICE, USPSTF and the AHA use
  our_code: cancerverse_baseline.cvd.response.statin_benefit
  architecture_family: Derived composition
  architecture: Not a fitted model. A published trial rate ratio raised to the LDL reduction and applied
    multiplicatively to a baseline absolute risk from another model, yielding absolute risk reduction
    and number needed to treat.
  core_formula: "ARR = baseline_risk × ( 1 − RR^ΔLDL )\n\n  NNT = 1 / ARR\n  RR  = 0.78 per 1.0 mmol/L\
    \ LDL-C reduction   (CTT 2010)\n        0.90 for all-cause mortality\n  baseline_risk comes from a\
    \ separate, verified model"
  n_parameters: 6
  development_cohort: 'CTT 2010: 26 randomised trials, 169,138 participants, median follow-up 4.8-5.1
    years'
  parity_status: not_checked
  parity_blocker: derived_not_published
  parity_note: 'NOT VERIFIABLE BY COMPARISON, and deliberately not claimed to be. Every other model here
    reproduces a published equation and is checked against an external source; this one has no external
    target because we have not found it published as a model. CTT published the effect estimate, not
    a calculator. What IS checked: the CTT rate ratios match the abstract verbatim (0.78 / 0.76-0.80 and
    0.90 / 0.87-0.93), the arithmetic identity holds by hand at delta = 1 mmol/L, the effect compounds
    as RR^delta rather than linearly, the confidence interval inverts correctly (a smaller rate ratio
    is a LARGER benefit), and the result carries its four assumptions. See tests/test_cvd_response_statin_benefit.py.
    It counts against the verification rate rather than being excused from it.'
