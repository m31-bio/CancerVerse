- id: gastric_response_gap
  disease: gastric
  axis: response
  role: catalog
  status: catalog
  superseded_by: xu_gastric_trg_score
  title: (cell closed 2026-08-14, kept as the record of what the literature actually offers)
  repro_tier: C
  tier_note: >-
    CLOSED 2026-08-14 by `xu_gastric_trg_score` (PMID 33937020), the only one of 28 papers searched that
    is computable exactly as published. See docs/literature/gastric-response/ for the full shortlist,
    the ranking method and the per-paper provenance.

    The cell is filled and it is filled WEAKLY, which is a different thing and should not be smoothed
    over. Xu is a single-centre score on 428 patients with 20 training events against four predictors,
    validated prospectively at the same hospital, never calibrated, and it emits a risk group rather
    than a probability. It is the best available option, not a good one.

    Deliberately NOT pursued, decided 2026-08-14: PMID 41883960 (Hou 2026), the only paper of the 28
    that prints an intercept and therefore the only one that could emit a probability. Resolving its
    coding direction, which contradicts its own Table 1, would buy a probability from a WEAKER study:
    n=113, no external cohort at all, and an intercept belonging to a seven-term fit whose own nomogram
    drops a term. Trading Xu's out-of-era prospective cohort for that is a bad trade. Revisit only if a
    new paper appears, not by re-reading these 28.

    History, kept because it is the useful part. This cell was recorded as having NO published equation,
    twice, by searches that stopped early. to "several candidates exist". Searched
    exhaustively 2026-08-14: 28 papers, 2018-2026. The real shape of the cell is now known and it is not
    a search problem.

    Of the 28: 12 take routine clinical and lab inputs, 3 take structured imaging measurements, 10 need
    CT radiomics or deep learning, and 3 need pathology whole-slide images. So a third of the literature
    is out of reach on inputs alone, that part of the old note was right.

    The part that was wrong is the assumption that the clinical-only papers were therefore usable. They
    mostly are not, and for the reason that held the colorectal cell for three months: they print odds
    ratios or betas and no intercept, which ranks patients without stating a probability. NOTHING in the
    28 has both a complete equation and an external cohort. The best-evidenced model in the set (PMID
    39637859, 1208 development patients, two external cohorts, a prospective cohort, and the only public
    code repository) takes CT volumes and whole-slide pathology, not variables.

    Three of the shortlist's validation claims did not survive a full-text read, see METHOD.md. Two
    papers describe a random split as external validation, one in its own words. That is the reason the
    finalists were re-read from Methods rather than accepted from abstracts.
  open_source: none
- id: xu_gastric_trg_score
  nomogram_check_result: agrees
  nomogram_check: 'CHECKED 2026-08-18 against Tables 3 and 4 of PMC8082104, every value.
    Points 5/4/7/7; cut-offs CA19-9 10.90, CA72-4 3.19, LNmax 1.535; max score 23 (which
    is the four points summed, checked rather than assumed); high-score threshold 13. Every
    Table 3 odds ratio matches, and each recorded beta equals ln(OR) to three decimals.

    THE ROUNDING RULE IS RECOVERABLE, and the blocker field saying otherwise is now
    superseded. It is floor(OR), and it holds for all four: floor(5.615)=5, floor(4.531)=4,
    floor(7.426)=7, floor(7.945)=7. Four for four on a rule that simple is unlikely to be
    coincidence.

    Stated as an INFERENCE, not as the authors'' claim, they never write it down. It has
    one testable consequence worth carrying: if the rule is floor(OR), then LNmax (7.945)
    and differentiation (7.426) collapse to the same 7 points and a real difference between
    them is discarded. That loss is the original authors'', not ours, and it belongs beside
    any use of this score.'
  disease: gastric
  axis: response
  role: flagship
  status: implemented
  code: cancerverse_baseline.gastric.response.xu_trg_score
  our_code: cancerverse_baseline.gastric.response.xu_trg_score
