  - age
  - male
  - bmi
  - smoking
  - esophageal_condition
  open_source: none
  architecture_family: Points table
  architecture: Points model derived from a stepwise logistic regression, with each coefficient divided
    by the smallest one, so the integer points ARE the model rather than a lossy summary.
  core_formula: "points = Σ round_to_half( βᵢ / 0.40 )      (0–15)\n\n  over age, sex, BMI, smoking, oesophageal\
    \ condition\n  refer for screening if points ≥ 8"
  evidence:
