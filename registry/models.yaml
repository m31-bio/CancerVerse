  blocker: Points are in Table 3 and are complete -- one point per ITA.LI.CA tumour stage increment
    (0 to 5 for stages 0, A, B1, B2, B3, C), Child-Pugh 5/6-7/8-9/>10 scoring 0/1/2/3, ECOG 0/1-2/3-4
    scoring 0/1/3, and 2 points for AFP > 1,000 ug/L. What blocks running it is data, not the paper
    -- ECOG performance status appears nowhere in the platform crosswalk, and Child-Pugh needs INR
