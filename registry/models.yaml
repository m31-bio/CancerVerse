  ehr_availability: routine
  ehr_note: 'Pure EHR: diagnoses, medications, laboratory results, procedures, visits, devices,
    demographics and coded smoking status. No questionnaire item anywhere, which is the point of
    carrying it next to PLCOm2012, whose pack-years, years-since-quitting and education level are
    survey fields an EHR does not hold. The caveat is the shape of the input, not its availability: the
    caller supplies OMOP covariateIds from a FeatureExtraction run, so a site that is not already on the
    OMOP CDM has an extraction to build before it has a prediction.'
  candidate_for: plcom2012
  tier_note: 'the EHR-native comparator the baseline set was missing, implemented
