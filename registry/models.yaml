    response cell was filled: by changing the ENDPOINT rather than looking harder at the same
    question. The curative-setting question for this disease, pathological complete response after
    neoadjuvant therapy, has a literature that is almost entirely CT/MRI radiomics and deep
    learning, single or few centre, citation counts 0 to 27, on inputs this library does not take.
    That search was run to exhaustion twice (2026-08-06 and 2026-08-17) and is recorded on
