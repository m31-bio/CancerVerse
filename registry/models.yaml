- id: ovarian_response_gap
  imaging_decision_2026_08_18: 'DECIDED, not pending. Widening criterion 2 to accept imaging inputs was put to the team on 2026-08-18 and declined for now. This cell therefore stays open by decision rather than by omission, and re-searching it on a schedule is not the plan, every candidate added to this literature since 2020 is imaging-derived. See docs/INCLUSION_CRITERIA.md for what was weighed, including why a retrained radiomics model would stop being an independent published baseline. What would reopen it is narrower: adopting published deep-learning WEIGHTS run as published, which is a different question and does not apply to any candidate in this cell.'
  requires_imaging: true
  #: The numbers and the citation are separate fields, not sentences to be
  #: sliced out of the note. Deriving a rendered headline by splitting prose
  #: is how the nomogram chip once printed the library's only failing cell as
  #: passing, the giveaway sentence fell outside the window it looked at.
  requires_imaging_auc_routine: 0.47
  requires_imaging_auc_imaging: 0.78
  requires_imaging_cohort: Barts external cohort, n=42, RECIST 1.1 response
  requires_imaging_citation: Crispin-Ortuzar M, Woitek R, Reinius MAV, et al. Nat Commun. 2023;14:6756
  requires_imaging_url: https://doi.org/10.1038/s41467-023-41820-7
  requires_imaging_note: 'ROUTINE CLINICAL VARIABLES DO NOT PREDICT THIS. Not an absence of evidence, a published head-to-head on the same external cohort. Crispin-Ortuzar M, Woitek R, Reinius MAV, et al. Integrated radiogenomics models predict response to neoadjuvant chemotherapy in high grade serous ovarian cancer. Nat Commun. 2023;14:6756, doi:10.1038/s41467-023-41820-7. On the Barts external cohort (n=42), RECIST 1.1 response: the CLINICAL-ONLY model (age, FIGO stage, treatment) scores AUC 0.47, below chance, against 0.78 for the integrated radiomics model. Training n=72, internal hold-out n=20. Read 2026-08-18.

    This changes what the gap IS. The other two open response cells are blocked because the candidates found so far fall short; this one is blocked because the evidence says the input class is wrong. Searching again for a routine-variable ovarian NACT-response model is not a plan, one was built, tested externally, and failed. Filling this cell requires imaging, which means widening criterion 2 of docs/INCLUSION_CRITERIA.md and establishing whether the platform holds the images.'
  criteria_note: 'Fails criterion 3 of docs/INCLUSION_CRITERIA.md (external validation, or a development cohort large enough to stand in for one). rejected on evidence, not on performance. AUC 0.82 is above several models this library ships.'
  disease: ovarian
  axis: response
  role: flagship
  status: gap
  title: (no open flagship yet)
  repro_tier: C
  open_source: none
  blocker: >-
    Three named candidates, all re-checked against their own sources on 2026-08-18 and all still
    rejected, for three DIFFERENT reasons, which is why this cell will not be closed by one lucky
    find. (1) Too few events. (2) Wrong inputs. (3) Not an equation at all, and now shown to be
    unrecoverable rather than merely unprinted.
  blocker_kind: three candidates, three different disqualifiers
  tier_note: >-
    RE-CHECKED 2026-08-18 against each candidate's own source, superseding the 2026-08-17 search
    (which was itself the first real search this entry ever had, it previously carried one
    undated line about KELIM). Every rejection below is confirmed, two of them with detail the
    earlier pass did not have.

    (1) CRS 3 NOMOGRAM after neoadjuvant chemotherapy. Front Oncol 2020;10:560888, PMC7571668,
    6 citations. Still the closest fit on inputs: four routine values (post-NACT CA-125, percent
    decrease in CA-125, post-NACT HE4, post-NACT haemoglobin) predicting chemotherapy response
    score 3 in tubo-ovarian high-grade serous carcinoma.
    CONFIRMED from the full text: n=106, CRS 3 in 24 (22.6%), Hosmer-Lemeshow P=0.272, four
    predictors on 24 events, about six events per predictor, below any accepted rule of thumb.
    TWO THINGS THE EARLIER NOTE MISSED. First, the paper reports its discrimination TWICE and
    inconsistently: the Abstract says "area under the curve = 0.82" while the Results say "the AUC
    value of this nomogram was 0.85 (95% CI 0.75-0.95)". Neither is wrong to quote, and anyone
    citing one should know the other exists. Second, and decisive, the paper does not merely lack
    external validation, it states that it could not do either kind: "the sample size of this
    work is only moderate, and it is difficult to conduct reliable internal and external
    validation", closing with "More studies are warranted to validate this model". A model whose
    authors say its internal validation is unreliable cannot be shipped as a flagship on the
    strength of its internal validation.
    A fresh Europe PMC sweep on 2026-08-18 found no external validation of it by anyone.

    (2) PLATINUM-RESISTANCE NOMOGRAM. World J Surg Oncol 2024;22(1):76, PMC10956367. Unchanged and
    still rejected outright on inputs: six of its eleven predictors are immunohistochemistry
    scores (CXCL1, CXCL2, IL6, ABCC1, LRP, BCL2). That is a tissue assay panel, the same obstacle
    as the radiomics models in the gastric, cervical and pancreatic response cells. Its reported
    C-index of 0.975 with external AUC 0.949, from eleven LASSO-selected predictors at one centre,
    is a reason for suspicion rather than for enthusiasm.

    (3) KELIM, the CA-125 elimination rate constant. Rejected before as "a nonlinear
    population-pharmacokinetic model, no closed form to transcribe". That was right and it was
    never actually tested against the deployed tool, which is the check that rescued erspc_rc3
    from a dead Flash calculator and wang_larc_pcr from a Shiny app. It has now been run, and it
    fails for a stronger reason than "not printed".
    The calculator at biomarker-kinetics.org ships NO model to the browser. Its two JavaScript
    files are pure interface code; the computation is a 2.9 MB WebAssembly binary
    (assets/components/wasm_components_bg.wasm, compiled Rust) with a server-side compute API at
    api.biomarker-kinetics.org behind it. So there are exactly two ways to obtain the model:
    decompile the binary, or probe the API.
    NEITHER IS THE SAME ACT AS THIS LIBRARY'S EXISTING RECOVERIES, and the difference is the whole
    point. When erspc_rc3's constants came out of SWF bytecode, the same constants were printed in
    the source paper's appendix, so the recovery was corroboration of a published fact. Here
    nothing equivalent is published, so a decompiled binary would be the SOLE source, taking
    compiled expression rather than reading a fact, which is the wrong side of the Feist line this
    library's whole licensing position rests on (see docs/COMMERCIAL_USE_AUDIT.md). "KELIM" and
    "Biomarker Kinetics" are both claimed as trademarks, and the site's terms of use expressly
    disclaim any guarantee "that the use of the Results does not infringe the intellectual property
    rights of a third Party".
    Separately and independently: the input is a TIME SERIES of CA-125 values with dates, and the
    output requires per-patient Bayesian estimation against population parameters. No model in this
    library takes a time series, so even a lawfully obtained KELIM would not fit the API.
    Its prognostic value is real and continues to be validated, which is precisely why it is worth
    stating clearly that it is a tool we cannot reimplement rather than a model we have not found.
- id: msk_ovarian
  discrimination: Bootstrap-corrected concordance index 0.67, against 0.53 for the previously published
    model for this stage. Internal validation only, no external cohort
  discrimination_source: 'Chi DS et al., Gynecol Oncol 2008;108(1):191-194, PubMed 17950784, abstract read
    2026-08-17. Verbatim: "It was shown to have excellent calibration with a bootstrap corrected
    concordance index of 0.67, which was more accurate in predicting survival at this stage than the
    previously published model (concordance index=0.53)."

    Checked via Europe PMC (EXT_ID:17950784), whose abstract states plainly "A total of 424 evaluable
    patients with bulky stage IIIC EOC underwent primary surgery" and ties that same 424 to the nomogram
    and its bootstrap-corrected concordance index. Full text is closed access, so a screening-vs-evaluable
    split larger than 424 upstream of that sentence cannot be ruled out from the abstract alone, but there
    is no textual support for 465 specifically, and 424 is the number the abstract itself attaches to
    model construction.

    Two things the number does not say. It is INTERNAL, bootstrapped on the same 424 patients the
    nomogram was fitted on, with no external cohort in the paper, so it is not comparable with an
    externally validated figure such as msk_gastric''s 0.80. And 0.67 is modest in absolute terms; the
    paper''s claim is relative, that it beats the 0.53 alternative, which is barely above chance for
    bulky stage IIIC disease. Both readings are correct and the second is the one a reader needs.'
