- id: abc_method
  discrimination: 'n/a as a c-index - the paper reports no AUC or concordance. Evidence is stratification:
    annual gastric-cancer incidence 0.04 / 0.06 / 0.35 / 0.60 %/y for groups A / B / C / D (log-rank
    p<0.0001), with Cox hazard ratios vs A of 1.1 (0.4-3.4, p=0.81), 6.0 (2.4-14.5), 8.2 (3.2-21.5).
    GROUP B IS NOT DISTINGUISHABLE FROM A'
  discrimination_source: 'Watabe H et al., Gut 2005;54(6):764-768, PubMed 15888780 / PMC1774550. Read
    2026-08-17 from the PMC full text; grepped for AUC / area under / c-index / concordance / ROC and
    none appears. That is appropriate rather than missing, the ABC method returns one of four
    serological groups, not a probability, so the same reasoning applies as for lipi and albi.

    Table 2, n=6,983 followed a mean 4.7 years, 43 cancers:
      group A (PG normal, HP-)  3,324 subjects,  7 cancers, 0.04 %/y
      group B (PG normal, HP+)  2,134 subjects,  6 cancers, 0.06 %/y
      group C (PG atrophic, HP+) 1,082 subjects, 18 cancers, 0.35 %/y
      group D (PG atrophic, HP-)   443 subjects, 12 cancers, 0.60 %/y

    Table 3, Cox model adjusted for age and sex, hazard ratio vs group A, verbatim: "1.1 (0.4-3.4;
    p = 0.81) in group B, 6.0 (2.4-14.5; p<0.0001) in group C, and 8.2 (3.2-21.5; p<0.0001) in group D."

    THE FOUR GROUPS ARE REALLY THREE. B does not separate from A -- HR 1.1, p=0.81, and 0.06 %/y against
    0.04 %/y. The ordering A < B < C < D is monotonic but the A-to-B step is noise, so any use that
    treats B as a distinct risk tier is reading a difference the derivation cohort does not support. The
    real jump is at atrophy: C and D are 6-8x group A.

    Age and sex outweigh the group for some patients: HR 5.3 (2.9-9.9) for age >60 and 3.2 (1.3-8.2) for
    male sex, both independent of the group. The paper''s own highest-risk stratum is men over 60 in
    group D at 1.8 %/y (0.81-3.82), which the score alone does not express, it takes neither age nor
    sex as an input. Anyone using this for triage needs both alongside it.

    All absolute rates are the Japanese cohort''s and do not transfer; see scope_note.'
