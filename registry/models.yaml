  discrimination_source: 'Johnson PJ et al., J Clin Oncol 2015;33(6):550-558, PubMed 25512453 /
    PMC4322258. Abstract and full text read 2026-08-17, and the full text grepped independently for
    Harrell/Somers/concordance/AUC to check the negative result rather than take one reading of it.

    The statistic exists and is not reachable. Methods, verbatim: "The discriminatory performance of
    the ALBI model and C-P grade was calculated and compared using Harrell''s C and Somers'' D
    statistics and also assessed visually via Kaplan-Meier (KM) plots". Where the numbers went, verbatim:
    "Associated tables display the median survival (in months) for each curve as well as Harrell''s C
    and Somers'' D scores", those tables are rendered INSIDE Figures 1A-1H, not typeset as tables.
    No numeric C appears in the running text or in any real table, and the Results say only that the
    scores "were similar".

    This is the third distinct reason a discrimination cell can be empty in this registry, and the three
    must not be conflated: (1) nobody has read the paper, (2) the model has no AUC by construction
    (cvd_statin_benefit), (3) the paper computed one and published it only as pixels. ALBI is case 3,
    which is the same failure mode as GRACE (Figure 4) and the four cervical prognosis nomograms.

    Two ways to close it, neither done: extract the values from Figure 1A-1H -- PMC returns an HTML
    block page for /pmc/blobs/ and for /bin/, so this needs the full text, or
    quote an external validation and label it as such, the route already used for bcrat (Rockhill 2001).
    A targeted PubMed search on 2026-08-17 surfaced ALBI-adjacent nomogram papers rather than a clean
    ALBI validation reporting a numeric C, so no external figure is recorded here in preference to a
    weak one.'
