  year: 2024
  citation: Wang G, Li J, Huang Y, Guo Y. Cancer Med. 2024;13(11):e7251
  source_url: https://doi.org/10.1002/cam4.7251
  equation_source: >-
    SPLIT ACROSS TWO ARTIFACTS, AND THE PAPER IS NOT THE COMPLETE ONE. Cancer Med 2024;13(11):e7251
    (doi:10.1002/cam4.7251, open access at PMC11141331) establishes the model, the cohort and the
    predictor set: Table 4 prints univariable and multivariable odds ratios (labelled "HR"), and Results
    3.3 prints the nomogram's points formula. Neither states an intercept, and the points-to-probability
    axis exists only as a drawn scale inside Figure 3A, so the article alone can rank patients and cannot
    state a probability. There is no supplement and no erratum.

    The ten coefficients implemented here, intercept included, were read on 2026-08-14 from the
    "Model Summary" tab of the authors' own calculator at https://pcrpredict.shinyapps.io/LARC2/, whose
    URL the article prints twice. The app is built with R's DynNom, which renders the fitted object with
    R's own print method; for the rms::lrm fit behind this nomogram that is the entire coefficient table.
    The captured printout is committed at tests/parity/reference/wang_larc_pcr_model_summary.txt and
    pinned by test_the_committed_model_summary_still_matches_our_coefficients.
  upstream:
  - doi: 10.1002/cam4.7251
    note: development and external validation; odds ratios and the points formula, but no intercept
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11141331/
    note: open-access full text; Table 4 and Results 3.3 are the relevant loci
  canonical_impl:
    type: web
    url: https://pcrpredict.shinyapps.io/LARC2/
    license: open
    note: The authors' own R/Shiny deployment, published in the article as an open-access resource. Its
      Model Summary tab prints the fitted model, so this is the equation source and not merely a
      reference implementation. Live and answering as of 2026-08-14.
  parity_status: checked
  parity_note: >-
    No worked example is published and no source release exists, so parity was established against the
    authors' own deployed calculator, the same artifact the coefficients came from, which makes this a
    transcription-and-coding check rather than an independent confirmation of the science, and it should
    be read that way. 13 patients were submitted, each differing from the reference patient in exactly
    one covariate, plus both ends of the CEA slider and the two extremes; that spans all four T levels,
    all three N levels and every binary. Our implementation matches all 13 probabilities within the
    app's 3-decimal display resolution (worst deviation 0.0005). Fixture:
    tests/parity/reference/wang_larc_pcr_cases.json, captured by wang_larc_pcr_fetch.py; asserted
    offline by tests/parity/test_wang_larc_pcr_parity.py.

    Three independent facts tie the deployed fit to the published paper: the printout says Obs 1579 split
    1229/350, which is exactly the paper's training cohort and its 350 (22.2%) pCR rate; C 0.737 rounds
    to the published 0.73 (95% CI 0.70-0.75); and the six predictors match Table 4 term for term.

    Where it does NOT reconcile, and this is expected: the deployed model fits T and N stage as unordered
    factors (d.f. 9) while Table 4 reports one ordinal odds ratio each (implying d.f. 6). exp(beta) here
    therefore reproduces Table 4 only approximately for the other four terms (CEA 0.943 vs 0.944,
    histology 4.19 vs 4.608, EMVI 0.331 vs 0.352, TNT 2.15 vs 2.264). Table 4 is a different fit of the
    same data and cannot produce a probability at all. Do not correct the coefficients toward it.
  scope_note: >-
    Locally advanced rectal cancer, staged BEFORE chemoradiotherapy, in patients who complete nCRT and
    proceed to surgery. All six inputs are pre-CRT values; feeding post-treatment (yp) staging in is a
    different question. CEA is bounded to 0-24 ng/mL, the authors' own slider range and the paper's
    explicit ">= 24" floor, and values outside are refused rather than extrapolated. Development was
    two Chinese centres, so transportability to other populations is untested beyond that.
  inputs:
  - n_stage
  - t_stage
  - mri_emvi_positive
  - total_neoadjuvant_therapy
  - histopathology
  - cea_ng_ml
  open_source: web_only
  parity_blocker: null
  architecture_family: Logistic regression
  architecture: Binary logistic regression (rms::lrm), six predictors on 9 degrees of freedom. T and N
    stage entered as unordered factors, histology and MRI EMVI and total neoadjuvant therapy as
    indicators, CEA as a linear term. Presented in the paper as a points nomogram and deployed as a
    web calculator.
  n_parameters: 10
  core_formula: "logit(P(pCR)) = -0.0131\n  + N-stage term        (reference cN0: cN1 -0.4513, cN2 -0.6596)\n\
    \  + T-stage term        (reference cT2: cT1 +1.3364, cT3 +0.5773, cT4 +0.0587)\n  - 1.1061 * [pre-CRT\
    \ MRI EMVI positive]\n  + 0.7642 * [total neoadjuvant therapy given]\n  - 1.4323 * [signet-ring cell\
    \ / mucinous histology]\n  - 0.0584 * pre-CRT CEA in ng/mL\n\nP(pCR) = 1 / (1 + exp(-logit))\n\nThe\
    \ intercept is in NO published source. T stage is NOT monotone and its reference is cT2."
  evidence:
    test: tests/parity/test_wang_larc_pcr_parity.py
    test_function: test_matches_the_authors_hosted_calculator
    script: tests/parity/reference/wang_larc_pcr_fetch.py
    fixture: tests/parity/reference/wang_larc_pcr_cases.json
  public_repo: null
  development_cohort: 1579 patients, Union Hospital (Fujian Medical University), training; external
    validation 246 patients at Zhangzhou Hospital. 350/1579 (22.2%) achieved pCR.
  discrimination: C-index 0.73 (95% CI 0.70-0.75) in the training cohort with an average of 0.73 across
    internal cross-validation, and 0.78 (0.72-0.83) in the external validation cohort. The deployed fit
    prints C 0.737 and Brier 0.151.
  discrimination_source: primary, PMC11141331; C-index independently confirmed from the deployed model's
    own printout
  equation_location:
    numbered: false
    where: >-
      Table 4 ("Univariate and multivariate Logistic regression analysis associated with pCR in the
      training cohort (n = 1579)") holds the multivariable odds ratios. Results 3.3 ("Nomogram for pCR")
