- id: endpac
  disease: pancreatic
  axis: detection
  role: flagship
  status: implemented
  title: END-PAC (pancreatic cancer risk in new-onset diabetes)
  code: mayo_baseline.pancreatic.detection.endpac
  license: open
  repro_tier: A
  citation: Sharma A, Kandlakunta H, Nagpal SJS, et al. Gastroenterology. 2018;155(3):730-739.e3
  equation_source: 'Gastroenterology 2018;155(3):730-739.e3, Table 1 (END-PAC score parameters), read
    from the NIH author manuscript. Three additive terms: blood-glucose CATEGORY difference (range 1-4),
    weight change over the preceding year (-6..+6, loss scores positive), age at diabetes onset (-1..+1).
    Total -6..11; >=3 high risk, <0 extremely low risk.'
  upstream:
  - doi: 10.1053/j.gastro.2018.05.023
    note: development + validation in glycemically-defined new-onset diabetes
  canonical_impl:
    type: paper_only
    license: open
    note: point table printed in Table 1; no official calculator
  our_code: mayo_baseline.pancreatic.detection.endpac
  parity_status: checked
  parity_note: 'No worked example exists and the only public calculator (endpacscore.com) no longer resolves,
    so parity was established on the primary source itself. Route 4: every cell of Table 1 (''END-PDAC
    score parameters'') reproduced against our point functions, including all three printed sub-score
    ranges (1-4, -6..+6, -1..+1). Route 5: the banding was re-derived from the paper''s own group proportions,
    which caught a real defect. The abstract writes the low-risk group as ''<0'' while the Results write
    ''<=0''; both cite the same 49%. The quoted group proportions sum to exactly 100% in both cohorts
    (T2-NOD 19+32+49, PC-NOD 77+21+2), which is only possible under {>=3, 1..2, <=0} -- under ''<0'' a
    score of exactly 0 belongs to no group. We had implemented the abstract''s typo, so a score of 0 was
    reported as intermediate instead of extremely low risk. Fixed; asserted by tests/parity/test_endpac_parity.py.'
  scope_note: Adults with glycemically-defined new-onset diabetes (validation in >=50-year-olds). Enriches
    an already-selected group; NOT a general-population screen.
  inputs:
  - glucose_at_diabetes_mg_dl
  - glucose_one_year_before_mg_dl
  - weight_change_kg
  - age_at_diabetes_onset
  open_source: none
  architecture_family: Points table
  architecture: 'Additive integer point score from 3 terms: blood-glucose CATEGORY change, weight change
    over the year, and age at diabetes onset.'
  core_formula: "total = ΔBG_category + weight_score + age_score      (−6 … 11)\n\n  ΔBG    category difference,\
    \ NOT mg/dL   (1–4)\n  weight LOSS scores positive             (−6 … +6)\n  age    ≤59 → −1,  60–69\
    \ → 0,  ≥70 → +1\n  ≥3 high risk · 1–2 intermediate · ≤0 extremely low"
  evidence:
    test: tests/parity/test_endpac_parity.py
    test_function: test_the_published_group_proportions_sum_to_one_hundred
  public_repo: null
  source_url: https://doi.org/10.1053/j.gastro.2018.05.023
  year: 2018
  development_cohort: Rochester Epidemiology Project; discovery 64 pancreatic cancers vs 192 type 2 diabetes,
    validation 1,096 with 9 cancers (0.82%)
  discrimination: AUROC 0.87 (discovery)
  discrimination_source: primary, Results — read from the PDF
  entrypoint: endpac_predict
  equation_location:
    numbered: false
    where: Table 1, titled 'Enriching New-onset Diabetes for Pancreatic Cancer (END-PDAC) score parameters'
      -- note the table says END-PDAC, not END-PAC. Described under 'Patients and Methods'. The three
      risk-group cut-offs are never listed together in one sentence, which is the direct cause of this
      project's <0 versus <=0 ambiguity.
    verified: read 2026-08-06 from PMC6120785
