- id: cvd_statin_benefit
  disease: cvd
  axis: response
  role: flagship
  status: implemented
  title: 'LDL-lowering absolute benefit (DERIVED: CTT trial effect x a baseline risk)'
  code: mayo_baseline.cvd.response.statin_benefit
  entrypoint: cvd_statin_benefit_predict
  license: open
  repro_tier: B
  year: 2010
  citation: Cholesterol Treatment Trialists' Collaboration. Lancet. 2010;376(9753):1670-1681
  source_url: https://pubmed.ncbi.nlm.nih.gov/21067804/
  public_repo: null
  equation_source: 'NOT a published prediction model. A composition of two published quantities: the CTT
    2010 rate ratio per 1.0 mmol/L LDL-C reduction (major vascular events RR 0.78, 95% CI 0.76-0.80; all-cause
    mortality RR 0.90, 0.87-0.93, read verbatim from the abstract, PMID 21067804) applied to an untreated
    absolute risk supplied by a separate, verified model. ARR = baseline x (1 - RR^delta_LDL); NNT = 1/ARR.'
  upstream:
  - pmid: '21067804'
    note: CTT 2010, 170,000 participants in 26 trials
  canonical_impl:
    type: none
    license: n/a
    note: there is no calculator for this because nobody published it as a model; it is the arithmetic
      NICE, USPSTF and the AHA use
  our_code: mayo_baseline.cvd.response.statin_benefit
  architecture_family: Derived composition
  architecture: Not a fitted model. A published trial rate ratio raised to the LDL reduction and applied
    multiplicatively to a baseline absolute risk from another model, yielding absolute risk reduction
    and number needed to treat.
  core_formula: "ARR = baseline_risk × ( 1 − RR^ΔLDL )\n\n  NNT = 1 / ARR\n  RR  = 0.78 per 1.0 mmol/L\
    \ LDL-C reduction   (CTT 2010)\n        0.90 for all-cause mortality\n  baseline_risk comes from a\
    \ separate, verified model"
  n_parameters: 6
  discrimination: null
  development_cohort: 'CTT 2010: 26 randomised trials, 169,138 participants, median follow-up 4.8-5.1
    years'
  parity_status: not_checked
  parity_blocker: derived_not_published
  parity_note: 'NOT VERIFIABLE BY COMPARISON, and deliberately not claimed to be. Every other model here
    reproduces a published equation and is checked against an external source; this one has no external
    target because we have not found it published as a model -- CTT published the effect estimate, not
    a calculator. What IS checked: the CTT rate ratios match the abstract verbatim (0.78 / 0.76-0.80 and
    0.90 / 0.87-0.93), the arithmetic identity holds by hand at delta = 1 mmol/L, the effect compounds
    as RR^delta rather than linearly, the confidence interval inverts correctly (a smaller rate ratio
    is a LARGER benefit), and the result carries its four assumptions. See tests/test_cvd_response_statin_benefit.py.
    It counts against the verification rate rather than being excused from it.'
  scope_note: 'The horizon and endpoint are whatever the baseline risk model''s were -- this function
    takes the baseline risk as an argument rather than computing it, so that stays visible. Four assumptions
    travel with every result: constant proportional effect across baseline risk (which is what CTT reports),
    a ~5-year trial effect carried to a 10-year horizon, CTT''s major-vascular-events endpoint approximating
    the baseline model''s endpoint, and a confidence interval covering the trial effect only, not baseline
    uncertainty.'
