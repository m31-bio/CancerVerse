    and no author contact required, unlike af_stroke_lr_2026, which is blocked on one number. The
    improvement is smaller (0.70->0.73 here vs 0.61->0.88 for the LR model) but it is available today.
    The two are not mutually exclusive: ATRIA could ship now and be superseded later if the intercept
    for af_stroke_lr_2026 arrives.

