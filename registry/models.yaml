  code: mayo_baseline.prostate.prognosis.capra
  license: open
  repro_tier: A
  citation: Cooperberg MR et al. J Urol. 2005;173(6):1938-1942
  equation_source: J Urol 2005;173(6):1938-1942, PMC2948569 Table 1 — PSA 0-4, Gleason 0/1/3, T-stage
    0-1, percent positive cores 0-1, age 0-1; total 0-10
  upstream:
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2948569/
    note: development + Table 1 point assignments
  canonical_impl:
    type: web
    url: https://www.mdcalc.com/calc/2046/ucsf-capra-score-prostate-cancer-risk
    license: web-only
  our_code: mayo_baseline.prostate.prognosis.capra
  parity_status: checked
  scope_note: preoperative CAPRA only; CAPRA-S (postoperative, Cancer 2011) not implemented
  inputs:
  - psa
  - gleason_primary
  - gleason_secondary
  - t_stage
  - percent_positive_cores
  - age
  open_source: web_only
  parity_note: CHECKED 2026-08-05 against MDCalc's published point schema, entry by entry across all five
    fields (PSA 5 bands, Gleason 0/1/3 with no 2-point level, T-stage, percent cores, age). Full agreement.
    Corroboration by an independent implementation rather than a worked example, which none is published
    for.
  architecture_family: Points table
  architecture: Additive integer point score (0-10) distilled from a Cox model; at prediction time it
    is table lookup and addition, with no regression evaluated.
  n_parameters: 16
  core_formula: "total = PSA + Gleason + T-stage + %positive-cores + age   (0–10)\n\n  PSA      2.1–6\
    \ → 0, 6.1–10 → 1, 10.1–20 → 2, 20.1–30 → 3, >30 → 4\n  Gleason  0, 1 or 3 — there is no 2-point level\n\
    \  0–2 low · 3–5 intermediate · 6–10 high"
  evidence:
    test: tests/parity/test_r_reference_parity.py
    test_function: test_capra_point_table_matches_mdcalc
    script: tests/parity/reference/mdcalc_extract.py
  public_repo: null
  source_url: https://pubmed.ncbi.nlm.nih.gov/15879786/
  year: 2005
  entrypoint: capra_predict
  discrimination: Concordance index 0.66
  discrimination_source: 'primary abstract, PMID 15879786, verbatim: "The concordance index for the UCSF-CAPRA
    score was 0.66."'
  equation_location:
    numbered: false
    where: 'Table 1, ''The UCSF-CAPRA scoring system''. Described in Methods under ''Development of the
      UCSF Cancer of the Prostate Risk Assessment (UCSF-CAPRA)''. The printed points match this library:
      PSA 0-4, Gleason 0/1/3 (no 2-point level), T stage 0-1, percent positive biopsies 0-1 at the 34%
      threshold, age 0-1 at 50.'
    verified: read 2026-08-06 from PMC2948569
