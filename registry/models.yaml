  architecture: 'Multivariable logistic regression: weighted sum of 3 predictors (log2 PSA, log2 prostate
    volume, DRE) pushed through a logistic link to a probability.'
  n_parameters: 4
  core_formula: "logit(p) = −1.826\n           + 1.024 · (log₂ PSA − 2.0)\n           − 1.500 · (log₂\
