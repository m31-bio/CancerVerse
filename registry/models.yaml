    implementation to run. ATRIA ships as a point table, not as code, so the published table is what
    parity is against, the same footing as CHA2DS2-VASc. The table was transcribed from the article twice,
    the second time cell by cell, and the two readings agreed. The test asserts the age x prior-stroke
    interaction explicitly, including that the stroke-column floor of 7 sits at ages 65-84 and NOT at
