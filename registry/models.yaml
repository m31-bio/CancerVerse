    The disease-site input collapses a three-level source variable (pelvic / distant / combined) onto the
    paper's own binary factor (pelvic vs. non-pelvic); the paper never states in prose which side "combined"
    (13.1% of the development cohort) falls on. This module reads the label literally and files combined as
    non-pelvic, and flags every case where that inference was used.
