- id: esophageal_response_gap
  route1_addition: 'independently of the Route 1 sweep recorded in `blocker` and
    `tier_note`. That sweep concluded the pCR literature is "almost entirely CT/MRI radiomics,
    delta-radiomics, deep learning, multi-omics and circulating-biomarker nomograms". One candidate is
    none of those and was not caught: Gastroenterol Rep 2024;12:goae060, doi:10.1093/gastro/goae060,
    PMC11227365, open access.

    It is the best-VALIDATED pCR model found for this cell, and it is beaten on discrimination by the one
    already recorded. n=457 ESCC patients after preoperative chemoradiotherapy plus oesophagectomy (285
    training, 172 validation), logistic regression, four parameters drawn from standard practice rather
    than from radiomics: histologic grade, clinical N stage, maximum standardized uptake value on PET,
    and post-PCRT biopsy. AUC 0.717 training, 0.704 internal validation, 0.707 EXTERNAL validation.
    Compare Liu 2024, which has the higher C-index at 0.743 but n=293 at a single centre with no external
    cohort. So the two candidates trade discrimination against validation design and neither dominates.

    Blocked anyway, and by the failure this registry has now seen four times: NO INTERCEPT. The full text
    was searched for "intercept" and "constant" on 2026-08-17 and neither word appears; the paper states
    the nomogram points "were computed using regression coefficients", which puts the constant inside the
    drawn figure exactly as in af_stroke_lr_2026, Smith 2024 and the cervical prognosis nomograms. Odds
    ratios are tabulated, so with a constant every beta would follow as ln(OR).

    A second obstacle even if the constant arrived: PET SUVmax. It is a standard clinical measurement
    rather than a radiomics feature, which is why this candidate is worth recording at all, but the target platform
    crosswalk puts it at report_text. FACT_RADIOLOGY carries the report, not a structured SUV column,
    so it needs an extraction model per value. Post-PCRT biopsy is a procedure result and is cleaner.'
  resolved_by: chau_eg
  resolution_note: >-
    CELL CLOSED 2026-08-17 by `chau_eg`. The blocker and tier_note below are kept verbatim
    because they remain exactly right about ROUTE 1, the curative-setting question: the pCR
    literature really is radiomics and deep learning on inputs this library does not take, and
    nothing about this closure changes that. What closed the cell is ROUTE 2, the endpoint
    change the note itself proposed, and specifically the paywalled candidate it named. The user
    supplied the Chau full text on 2026-08-17 and both open questions resolved in its favour:
    the cohort is 27.3% esophagus plus 23.0% EGJ (50.3% esophageal or junctional, against the
    5.8% that disqualified AGAMENON), and median OS per risk group is 11.8 / 7.4 / 4.1 months.
    Keep this row as the record of what Route 1 contains, so the next person does not re-run a
    search whose answer is already written down.
  disease: esophageal
  axis: response
  role: catalog
  status: catalog
  superseded_by: chau_eg
  title: (cell closed 2026-08-17, kept as the record of what Route 1 contains)
  repro_tier: C
  open_source: none
  blocker: >-
    Two independent routes searched to exhaustion 2026-08-17 and both fail, for DIFFERENT reasons.
    Route 1, the curative-setting question (pathological complete response after neoadjuvant therapy):
    candidates exist and are the wrong KIND. Route 2, the advanced-disease question (survival under
    palliative chemotherapy, the endpoint change that closed the cervical response cell): candidates
    exist, are excellent, and are not ESOPHAGEAL, they are gastric cohorts wearing an
    "esophago-gastric" label. The one candidate that is both strong and plausibly esophageal is
    entirely paywalled and has been handed to the user.
  blocker_kind: candidates are imaging-derived, or are gastric cohorts, or are paywalled
  tier_note: >-
    RE-SEARCHED 2026-08-17, both routes. This supersedes the 2026-08-06 note, which had itself
    corrected a still earlier claim about the literature and remains right about what it saw.

    ROUTE 1, pCR after neoadjuvant chemoradiotherapy or chemoimmunotherapy. The 2026-08-06 finding
    holds and is now stronger. Sweeping Europe PMC for ESCC and adenocarcinoma pCR models returns a
    literature that is almost entirely CT/MRI radiomics, delta-radiomics, deep learning, multi-omics
    and circulating-biomarker nomograms: citation counts run 0 to 27, cohorts are single or few
    centre, and the inputs are imaging-derived features this library does not take. Liu 2024
    (PMC10935883, six-variable logistic, C-index 0.743, n=293 single centre) is still the best of
    them and still does not clear the bar on cohort size or external validation. This is the same
    failure CLASS the cervical response axis hit before it was closed, see
    docs/diseases/cervical/README.md, "How the response cell was closed".

    ROUTE 2, change the endpoint, which is exactly what closed cervical. For cervical the escape
    was moving from response-to-primary-treatment (radiomics land) to response to chemotherapy in
    advanced/recurrent disease, where a simple validated count index existed. The analogous move
    here finds three real candidates, all of which fail on DISEASE MIX rather than on quality:
      * AGAMENON (Custodio et al, Br J Cancer 2017;116:1526-1535, doi:10.1038/bjc.2017.122,
        PMC5518851, CC BY-NC-SA, 43 cites). Genuinely good: 924 derivation + 502 PROSPECTIVELY
        recruited validation patients across 28 Spanish hospitals, seven predictors, live calculator
        at iricom.es/prognostictools/agamenon/inicio.aspx. Two disqualifiers. (a) Its Table 2 gives
        primary tumour site as oesophagus 54 (5.8%), GEJ 95 (10.3%), stomach 775 (83.9%), it is a
        gastric model, and putting it in the esophageal cell would misrepresent 84% of its cohort.
        (b) It is an rms nomogram with no printed baseline survival S0(t), the identical defect that
        blocked four cervical prognosis papers; the calculator is a recovery route if it is ever
        wanted, but (a) makes that moot.
      * REGARD/RAINBOW pooled analysis (Fuchs et al, J Gastric Cancer 2017, PMC5489542, CC BY-NC,
        49 cites): 953 patients, twelve prognostic factors, second-line. Gastric/GEJ by design.
      * Chau et al, J Clin Oncol 2004;22(12):2395-2403, doi:10.1200/jco.2004.08.154, PMID 15197201 --
        THE ONE WORTH PURSUING, and the one handed to the user. 533 citations (OpenAlex). Pooled
        INDIVIDUAL PATIENT DATA from three multicentre randomised controlled trials, 1,080 patients,
        979 deaths, provenance far above anything in Route 1. Its whole model is in the public
        abstract: four binary poor-prognosis factors (performance status >=2, HR 1.58; liver
        metastases, HR 1.41; peritoneal metastases, HR 1.33; alkaline phosphatase >=100 U/L,
        HR 1.41), a count index banded good (0) / moderate (1-2) / poor (3-4), and one-year survival
        of 48.5% / 25.7% / 11%. That is the same shape as moore_criteria, which closed the cervical
        response cell.
    WHY CHAU IS NOT IMPLEMENTED ANYWAY. It is fully closed access. OpenAlex reports oa_status
    "closed" with no repository copy at all, Europe PMC isOpenAccess "N", inPMC "N". Two things
    cannot be checked without the full text, and both decide the entry rather than decorating it:
    (1) what fraction of those 1,080 patients had OESOPHAGEAL rather than gastric primaries. AGAMENON
    is the cautionary case, it also says "oesophagogastric" on the label and is 84% stomach, so the
    label cannot be taken as evidence. (2) Median OS per risk group, which the abstract omits and
    which a band-lookup model needs to be useful. Per this project's standing rule, a paywalled
    source is handed to the user rather than substituted, guessed at, or implemented from its
    abstract alone.

    AXIS NOTE, because it will come up if Chau lands. All three Route 2 candidates predict SURVIVAL
    under chemotherapy, not tumour response, the lipi and hap shape, which this library already
    files under `response` on the reasoning that they rank survival UNDER a therapy rather than
    estimating what the therapy adds. That precedent fits. But esophageal_prognosis_catalog is also
    unfilled, so which cell such a model should occupy is a real question to settle deliberately,
    not by whichever gap is noticed first.
