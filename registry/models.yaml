    it.'
  candidate_for: bcrat
  blocker: >-
    RESOLVED as an access problem, still open as a licence question. The 2026-08-07 password request to
    the Statistical Coordinating Center was the wrong channel: the consortium's newer calculator (a
    Flutter web app at tools.bcsc-scc.ucdavis.edu/BC5yearRisk, distinct from the old static
    BC5yearRisk_V2 page the password request targeted) ships its own source as a downloadable asset of
    the page itself, no login and no password. Fetched and verified 2026-08-17: the zip
    (BCSC_V3_SourceCode.zip, 51,647,355 bytes) contains bcscrisk_v3.sas (the KPWA-authored macro,
    Chi Tran and Steven L. Balch, 7/17/2023), an R port, a sample calling program, and the complete
    precomputed risk table invasiverisklookuptablev3.sas7bdat -- 2,394,000 rows, one per combination of
    the model's 8 categorical inputs (age 35-79, race/ethnicity, BI-RADS density, family history,
    biopsy result, age at first live birth, BMI category, menopausal status), zero duplicate keys, zero
    missing values. Loads in pandas via `read_sas` alone, no extra library. Spot-checked against a
    50-year-old average-risk profile (white, scattered density, no family history, no prior biopsy,
    first birth 25-29, overweight, postmenopausal): 0.71% five-year / 1.56% ten-year, in line with the
    BCSC's own published benchmarks for that risk band.

    So this is now a lookup table, not a set of Table 2 / Appendix A3 coefficients to transcribe -- the
    macro is a plain 8-key join, nothing is fitted at request time. That changes what "implementing v3"
    would mean here: it is loading and querying a 183 MB table, not reproducing a formula.

    The licence question is separate and NOT resolved by finding the file. No LICENSE file ships in the
    zip and none of the four source files carries a copyright or rights-reserved notice -- but absence
    of a stated licence defaults to full copyright, not to permission, so `license: restricted` stays
    until someone at KPWA/BCSC says otherwise in writing. Same treatment as riskcalc.org and as `hap` /
    `kunzmann` elsewhere in this registry. `open_source` is left at `web_only` rather than moved to
    `available`: every other `available` row in this registry pairs with `license: open` (16 of 16), and
    this would be the first exception. Changing it needs a human call, not a default.

    FACTS GATHERED 2026-08-18 for that human call, so the decision does not start from scratch. They
    point toward permission-with-attribution rather than reserved-all-rights, but they are not a
    licence grant and this entry does not treat them as one.

    (a) The v3 calculator states a citation requirement in its own Source Code page, compiled into
        main.dart.js and reproduced verbatim: "Please cite the following source when using this
        program: NCI-funded Breast Cancer Surveillance Consortium (P01 CA154292). Downloaded
        mm/dd/yyyy from the Breast Cancer Surveillance Consortium Web site -
        https://tools.bcsc-scc.ucdavis.edu/BC5yearRisk". The phrase is "when using this program",
        which presupposes use, and the page describes itself as offering "software downloads, and
        usage guidelines".
    (b) The same page carries a disclaimer of accuracy, not of permission: "The SCC, BCSC, and NCI
        are not responsible for the completeness or accuracy of the data used by the risk program".
    (c) The download requires no login, no password and no acceptance click -- it is a static asset
        of the page (assets/assets/BCSC_V3_SourceCode.zip), fetched and verified.
    (d) P01 CA154292 is an NCI grant, so this is federally funded work. That is context, not a
        conclusion: NIH public-access policy reaches publications, and data/software sharing terms
        vary by award. It is a question for whoever makes the call, not an inference to make here.

    WHY THE REGISTRY'S USUAL REASONING DOES NOT SETTLE THIS. Every existing determination here --
    `hap`, `kunzmann`, `amap`, `iota_adnex`, `cibula_arrm` -- turns on Feist v. Rural Telephone: a
    coefficient table in an article is a set of facts, and facts are not copyrightable, so the
    article's CC BY-NC term does not reach the numbers. That argument does not transfer. What would
    be taken here is a 2,394,000-row precomputed table and a SAS macro, i.e. a software artifact and
    a database, and the EU sui generis database right reaches datasets that copyright does not --
    the same distinction already recorded against `cibula_arrm`'s derived outcome grid. So this needs
    its own determination rather than a citation of the others.
  blocker_kind: code and data retrieved (public download, no password needed) — awaiting a licence determination
  next_action: >-
    The 2026-08-07 request to the Statistical Coordinating Center (kpwa.scc@kp.org) is likely moot now
    that the source is confirmed reachable without it, but has not been withdrawn -- worth a follow-up
    note either way, since they may still be the right contact for a licence determination. Separately,
    `age_first_birth` is still not a field the platform holds, and that blocks v3 regardless of how the
    licence question resolves.
  tier_note: 'v3 (2024) is the target because it is the current version, and the replacement is not about
    age: BCRAT needs age at menarche and age at first live birth, neither of which the platform holds,
    while BCSC asks for BI-RADS breast density, which a screening centre already records as a structured
    field. The swap turns a model that cannot run on this data into one that can. Two things are worth
    stating plainly rather than discovering later: v3 requires age at first live birth, which the platform
    also lacks and which has been requested, and v3''s reported discrimination (0.646) is LOWER than v2''s
    (0.665). If the field does not arrive, v2 is the fallback and is not a worse choice on performance.'
  paper_title: Extending the Breast Cancer Surveillance Consortium Model of Invasive Breast Cancer
  citation_apa: Gard, C. C., Tice, J. A., Miglioretti, D. L., Sprague, B. L., Bissell, M. C. S., Henderson,
