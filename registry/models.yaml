    Two rejected alternatives from the same search, recorded so the choice is checkable: AGAMENON
    (Br J Cancer 2017, PMC5518851, 924 + 502 prospective, 28 hospitals) is genuinely good and is
    5.8% esophagus, a gastric model; and the REGARD/RAINBOW pooled analysis (PMC5489542) is
    gastric/GEJ by design and second-line.
