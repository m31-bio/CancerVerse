- id: pbcg_extended
  disease: prostate
  axis: detection
  role: flagship
  status: implemented
  license_url: https://creativecommons.org/licenses/by/4.0/
  license_basis: 'CC BY 4.0, commercial use permitted, attribution required, and the coefficients
    are Additional file 2 of the paper itself rather than someone''s deployment. Nothing here is
    restricted. Recorded because the audit flags any implemented model whose text mentions a
    noncommercial term and has no written determination, and this entry''s flagship_note mentions
    PolyForm: that reference is to `pbcg`, the 2018 model this one REPLACED, whose coefficients came
    from riskcalc.org. Resolving the flag by narrowing the audit''s pattern would have been the wrong
    fix, an unexplained mention is exactly what wants explaining.'
  year: 2022
  title: Extended PBCG (high-grade prostate cancer on biopsy, 1,024 sub-models)
  architecture_family: Logistic regression
  architecture: Binary logistic regression for high-grade disease, fitted 1,024 times, once for every
    pattern of the ten optional predictors. The pattern selects the sub-model; nothing is imputed.
  core_formula: "p(high grade) = 1 / (1 + e^(−Xβ))\n\n  Xβ   from one of 1,024 fitted sub-models\n  the\
    \ sub-model is chosen by WHICH of the ten optional\n  predictors were supplied, not by imputing the\
    \ rest\n  PSA and prostate volume enter as log₂"
  citation: Neumair M, Kattan MW, Freedland SJ, et al. Accommodating heterogeneous missing data patterns
    for prostate cancer risk prediction. BMC Med Res Methodol. 2022;22(1):200
  source_url: https://doi.org/10.1186/s12874-022-01674-x
  equation_source: Additional file 2 of the article itself (CC BY 4.0), the complete 1,024 x 13 coefficient
    matrix and the risk() function, published as journal supplementary material rather than taken from
    a deployment.
  equation_location:
    numbered: null
    where: Additional file 2 (12874_2022_1674_MOESM2_ESM.txt), the full coefficient matrix and risk()
      function. Table 3 of the main text prints odds ratios for the full, standard and minimal models,
      which is what the main text carries.
    verified: read and executed 2026-08-07 from the CC BY 4.0 supplement
  entrypoint: pbcg_extended_predict
  open_source: available
  public_repo: https://media.springernature.com/original/springer-static/esm/art%3A10.1186%2Fs12874-022-01674-x/MediaObjects/12874_2022_1674_MOESM2_ESM.txt
  public_repo_note: >-
    Additional file 2 of the article, not a git repository, 1,091 lines of R
    holding the 1,024 x 13 coefficient matrix and the risk() function, published
    CC BY 4.0 with the paper. This field pointed at the article DOI until
    2026-08-19, which meant the column headed "Public repository" rendered a link
    labelled `s12874-022-01674-x` that landed the reader on the paper they had just
    been given in the next column. The code was public the whole time; the link was
    the wrong one. The deployed calculator is separate, at
    https://riskcalc.org/ExtendedPBCG/.
  canonical_impl:
    type: open_source
    url: https://static-content.springer.com/esm/art%3A10.1186%2Fs12874-022-01674-x/MediaObjects/12874_2022_1674_MOESM2_ESM.txt
    license: CC BY 4.0
  upstream:
  - doi: 10.1186/s12874-022-01674-x
    note: development paper; coefficients in Additional file 2
  parity_status: checked
  parity_note: CHECKED 2026-08-07, route 1, against the authors' OWN published R rather than a vendor
    deployment, the strongest provenance in this library. 13 cases spanning every count of supplied
    optional predictors from 0 to 10; worst absolute difference below 1e-9 percentage points.
  evidence:
    test: tests/parity/test_pbcg_extended_parity.py
    test_function: test_matches_the_published_r
    script: tests/parity/reference/pbcg_extended_reference.R
    fixture: tests/parity/reference/pbcg_extended_cases.json
  repro_tier: A
  scope_note: 'Prostate Biopsy Collaborative Group, ten international cohorts of men referred for biopsy.
    Predicts HIGH-GRADE disease only (Gleason grade group >= 2); it does not report risk of any cancer,
    which the 2018 predecessor did. Age and PSA are mandatory. The 2018 version was found on external
    validation to over-predict in Black and other groups; that has not been re-tested here for this version.
    CAUTION, measured across all 1,024 sub-models: the African-ancestry coefficient CHANGES SIGN depending
    on which optional fields are supplied. It is protective in 412 sub-models and harmful in 100. OR
    0.68 in the full 12-factor model (1,334 biopsies, p=0.08) against OR 1.26 in the six-factor one (8,432
    biopsies, p=0.0005). Which sub-model a patient lands in is decided by what the caller happened to
    fill in, so supplying MORE data can move this term from harmful to protective. Do not read the term
    as a population effect.'
  flagship_note: 'Default for prostate detection since 2026-08-07, replacing the 2018 PBCG. The reason
    is licensing before recency: the 2018 coefficients were only machine-readable from riskcalc.org, whose
    source is PolyForm Noncommercial 1.0.0 and therefore unusable commercially. This version''s full coefficient
    set is CC BY 4.0. It is also newer, covers 1,024 missing-data patterns instead of 8, and takes ten
    optional predictors instead of three.'
  discrimination: AUC 75.7 (95% CI 74.4-77.1) in external validation, against 66.9 (65.4-68.5) for the
    2018 PBCG on the SAME validation set; internal cross-validation median 80, range 74-84
  discrimination_source: 'BMC Med Res Methodol 2022;22(1):200, PMC9306143, full text read 2026-08-14.
    Two figures, and the pairing is what matters. (1) Table 2, external validation on the withheld
    European cohort of 5,540 biopsies: the available-cases method, the one shipped, chosen for
    calibration rather than discrimination, gives AUC 75.7 (74.4, 77.1). The other five missing-data
    methods span 75.4 to 77.4, so the choice costs at most 1.7 AUC points and buys the best CIL by a
    wide margin (-2.9 against imputation''s -13.3). (2) Results, verbatim: the 2018 PBCG "based on only
    6 of the 12 risk factors used here obtained a CIL of -5.9 (95% CI -7.1, -4.7), and an AUC of 66.9
    (95% CI 65.4, 68.5), which is 10 points lower than any of the methods incorporating the additional
    risk factors."

    That second figure is the one to quote when this model is compared with its predecessor: same
    validation set, same patients, both scored together. It also settles a question the registry could
    not answer before, the 2022 extension was adopted for its CC BY 4.0 licence, and it turns out to
    be roughly nine AUC points better as well, so the licensing argument was never the whole case.

    Internal cross-validation (leave-one-cohort-out over the ten training cohorts) gives a median AUC
    of 80 with a range of 74 to 84; that is the internal figure and should not be compared with the
    external 75.7.'
  n_parameters: 8192
  code: cancerverse_baseline.prostate.detection.pbcg_extended
  our_code: cancerverse_baseline.prostate.detection.pbcg_extended
  license: open
  development_cohort: 'Prostate Biopsy Collaborative Group: up to 12,703 biopsies across ten international
    cohorts, with the full 12-factor model fitted on 1,334 biopsies from three cohorts'
  inputs:
  - age
  - psa
  - race (optional)
  - prior_biopsy (optional)
  - dre_abnormal (optional)
  - famhist_1 (optional)
  - famhist_2 (optional)
  - famhist_bca (optional)
  - prostate_volume (optional)
  - ari_use (optional)
  - hispanic (optional)
  - prior_psa (optional)
  ehr_availability: routine
  ehr_note: Requires only age and PSA. The other ten predictors are optional, and each pattern of them
    has its own fitted sub-model, 1,024 in all, so a record missing family history is scored by the
    model fitted without it rather than by imputing one. This is the design an EHR deployment wants.
  paper_title: Accommodating heterogeneous missing data patterns for prostate cancer risk prediction
  citation_apa: Neumair, M., Kattan, M. W., Freedland, S. J., Haese, A., Guerrios-Rivera, L., De Hoedt,
    A. M., Liss, M. A., Leach, R. J., Boorjian, S. A., Cooperberg, M. R., Poyet, C., Saba, K., Herkommer,
    K., Meissner, V. H., Vickers, A. J., & Ankerst, D. P. (2022). Accommodating heterogeneous missing
    data patterns for prostate cancer risk prediction. BMC Medical Research Methodology, 22(1), 200. https://doi.org/10.1186/s12874-022-01674-x
- id: pbcg
  disease: prostate
  axis: detection
  role: alternative
  status: implemented
  title: PBCG (Prostate Biopsy Collaborative Group; no cancer / low grade / high grade)
  code: cancerverse_baseline.prostate.detection.pbcg
  entrypoint: pbcg_predict
  ehr_availability: routine
  ehr_note: >-
    Age, PSA and DRE are routine at the point a biopsy is being considered,
    and prior-biopsy status is in the record whenever there was one. African
    ancestry and family history are the two that are inconsistently coded, and
    the model does not require them: there are eight fitted sub-models, one per
    pattern of missing prior-biopsy / DRE / family-history data, so a record
    missing those is scored by the sub-model fitted without them rather than
    by imputation.
  license: noncommercial_source
  repro_tier: A
  year: 2018
  citation: Ankerst DP, Straubinger J, Selig K, et al. Eur Urol. 2018;74(2):197-203
  source_url: https://doi.org/10.1016/j.eururo.2018.05.003
  public_repo: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PBCG
  equation_source: Coefficients from the deployed calculator's published R source at https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PBCG.
    Multinomial logistic with 'no cancer' as the reference outcome, and EIGHT coefficient sets, one
    per pattern of missing prior-biopsy / DRE / family-history data.
  upstream:
  - doi: 10.1016/j.eururo.2018.05.003
    note: development, 15,611 men
  - url: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PBCG
    note: deployed model source, coefficients in plain text
  canonical_impl:
    type: open_source
    url: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PBCG
    license: see repository terms
  our_code: cancerverse_baseline.prostate.detection.pbcg
  architecture_family: Logistic regression
  architecture: Multinomial logistic regression over three outcomes (no cancer, Gleason 6, Gleason 7+),
    with eight fitted coefficient sets so a record missing prior biopsy, DRE or family history uses the
    model fitted without it rather than an imputed value.
  core_formula: "S₁ = β_low · x        S₂ = β_high · x\n\n  P(no cancer)  = 1 / (1 + e^S₁ + e^S₂)\n  P(low\
    \ grade)  = e^S₁ / (1 + e^S₁ + e^S₂)\n  P(high grade) = e^S₂ / (1 + e^S₁ + e^S₂)\n\n  x = [1, log₂PSA,\
    \ age, African ancestry, + known optionals]\n  one of 8 coefficient sets, by which optionals are known"
  n_parameters: 88
  discrimination: AUC 75.5% internal validation, 72.3% external (vs 72.3%/69.7% for PCPTRC 2.0)
  discrimination_source: Eur Urol 2018 abstract and the validation literature reviewed 2026-08-06
  development_cohort: 15,611 men undergoing 16,369 biopsies at eight North American institutions 2006-2017;
    validated at three European institutions
  parity_status: checked
  parity_note: 'CHECKED 2026-08-06 against the vendor''s own deployed R, route 1. tests/parity/reference/pbcg_reference.R
    copies the risk() function VERBATIM from riskcalc.org''s published source and adds risk_raw(), the
    same function with only the two round() calls removed so unrounded probabilities can be compared.
    12 patients x 3 outcomes = 36 probabilities, chosen so that ALL EIGHT coefficient sets are exercised;
    worst absolute difference 4.8e-11 percentage points. The tool''s own display rounding is also reproduced
    and tested: it rounds no-cancer and low-grade then derives high grade as 100 - no - low, so every
    rounding error lands on the clinically decisive number. We return unrounded and expose rounded_like_riskcalc()
    for comparison.'
  scope_note: 'Men undergoing prostate biopsy. Predicts high-grade (Gleason 7+) separately from any cancer,
    which is the actionable question. NOT strictly better than ERSPC RC3: external validation found PBCG
    improved calibration in White men but OVER-PREDICTED in Black and other groups at most thresholds,
    so both are kept.'
  inputs:
  - psa
  - age
  - african_ancestry
  - prior_biopsy (optional)
  - dre_abnormal (optional)
  - family_history (optional)
  open_source: available
  evidence:
    test: tests/parity/test_pbcg_parity.py
    test_function: test_matches_the_vendor_r
    script: tests/parity/reference/pbcg_reference.R
    fixture: tests/parity/reference/pbcg_cases.json
  flagship_note: >-
    RETIRED as flagship 2026-08-07 and RESTORED to implemented/alternative
    2026-08-18. The retirement rested on one sentence in
    docs/THIRD_PARTY_CODE.md, "a company repository is not a noncommercial
    purpose", which tested the wrong thing. PolyForm Noncommercial 1.0.0
    gates on PURPOSE, not on entity: "any noncommercial purpose is a permitted
    purpose", with no exception for who is doing the using. M31 confirmed the
    project's use is academic research only, so the premise the retirement
    rested on no longer holds. See docs/ACADEMIC_USE_LICENSE_REVIEW.md.
    Two things that note used to say were also simply untrue, and are recorded
    here so the correction is not silent: it said "the implementation and its
    parity test are not published", while
    src/cancerverse_baseline/prostate/detection/pbcg.py has been published on GitHub
    since 2026-08-07. What was withheld was the vendor's R reference script,
    tests/parity/reference/pbcg_reference.R, not our own implementation, and     that now ships too, under its own PolyForm notice.
    Why it is still NOT the flagship: `pbcg_extended` covers the same cell with
    coefficients published CC BY 4.0 as its own paper's supplement, four years
    newer, from the same consortium. That is a better source, independent of
    the licensing question. PBCG stays implemented because it is
    parity_status: checked, repro_tier A, and predicts three outcomes rather
    than one, and because retiring a verified model to `catalog` removes it
    from the public API entirely, which is a breaking change made for tidiness.
  license_basis: >-
    The Eur Urol 2018 development paper is the source of record and is open
    access; that is what `license: open` refers to, as it does for the five
    other riskcalc.org-derived models here. The separate question is the
    DEPLOYED calculator's R source at ClevelandClinicQHS/riskcalc-website,
    which is PolyForm Noncommercial 1.0.0 and is where the machine-readable
    coefficients were read from. Two independent bases cover that use. First,
    fitted coefficients are facts rather than expression, the same Feist
    argument recorded for iota_adnex and amap. Second, and only since M31
    confirmed the project's use is academic research only, PolyForm's own
    general clause permits it outright: "Any noncommercial purpose is a
    permitted purpose." Note which clause that is, the entity-type safe
    harbor for charities, educational institutions and public research
    organizations does NOT obviously cover M31, and this determination does not
    rely on it. It relies on the purpose clause, which means it lapses the day
    the project's purpose stops being academic research.
  license_url: https://polyformproject.org/licenses/noncommercial/1.0.0
  equation_location:
    numbered: null
    where: NOT IN THE PAPER as a closed form. The coefficients are in the deployed calculator's R source,
      ClevelandClinicQHS/riskcalc-website/tree/main/PBCG, as eight coefficient sets (one per missing-data
      pattern). Establishing this by parity against that source is what verified the model.
    verified: vendor R source; parity-verified 2026-08-05
  superseded_by: pbcg_extended
  paper_title: A Contemporary Prostate Biopsy Risk Calculator Based on Multiple Heterogeneous Cohorts
  citation_apa: Ankerst, D. P., Straubinger, J., Selig, K., Guerrios, L., De Hoedt, A., Hernandez, J.,
    Liss, M. A., Leach, R. J., Freedland, S. J., Kattan, M. W., Nam, R., Haese, A., Montorsi, F., Boorjian,
    S. A., Cooperberg, M. R., Poyet, C., Vertosick, E., & Vickers, A. J. (2018). A Contemporary Prostate
    Biopsy Risk Calculator Based on Multiple Heterogeneous Cohorts. European Urology, 74(2), 197-203.
    https://doi.org/10.1016/j.eururo.2018.05.003
