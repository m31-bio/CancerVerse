  nomogram_check: 'CHECKED 2026-08-18 against Fig. 1, and this one is stronger than the
    gastric, ovarian and pancreatic checks rather than the same kind. That figure is drawn
    as VECTOR ART, so its axis labels sit in the PDF text layer and pdftotext returns them
    verbatim. No pixel measurement, no ruler, no calibration, the comparison isword
    for word and has no measurement error to argue about.

    All 27 published numbers match: cN0/cN1 = 0/2; ypT0/ypT1/ypT2/ypT3 = 0/2/2/4 (the
    figure prints "ypT1/pT2" sharing 2 points); ypN0/ypN1/ypN2/ypN3 = 0/4/5/10; and the
    total-points axis 0..16 mapping to 1-year survival 91/88/85/81/75/68/60/51/41 and
    5-year 70/62/53/43/33/23/14/7/3.

    SCORES_WITHOUT_SURVIVAL (5, 7, 9, 11) is not a gap in our implementation: the figure
    labels only even totals, so odd totals have no published survival to report and the
    module declines rather than interpolating. Note also that the paper states the points
    rule outright, each Cox coefficient multiplied by ten and rounded down, which is
    the derivation most nomogram papers omit.

    This closes the item that had said human eyes or a measurement rig would be needed
    here. Neither was.'
