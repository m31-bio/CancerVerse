    + DRE (ranging from 0.56 to 0.72)"'
  equation_location:
    numbered: false
    where: Appendix, under the heading 'Formulas used to calculate volume classes and the DRE ERSPC RC
      risks'. Printed there as lpDRE_ERSPC_riskcalc = -1.826 + 1.024 x (log2(PSA) - 2.0) - 1.50 x (log2(volumeclasses)
      - 5.4) + 0.992 x DRE, which matches this library's coefficients term for term.
    verified: read 2026-08-06 from PMC3321270
  ehr_availability: routine
  ehr_note: PSA, prostate volume and the DRE finding.
  paper_title: 'Importance of prostate volume in the European Randomised Study of Screening for Prostate
    Cancer (ERSPC) risk calculators: results from the prostate biopsy collaborative group'
  citation_apa: 'Roobol, M. J., Schröder, F. H., Hugosson, J., Jones, J. S., Kattan, M. W., Klein, E.
    A., Hamdy, F., Neal, D., Donovan, J., Parekh, D. J., Ankerst, D., Bartsch, G., Klocker, H., Horninger,
    W., Benchikh, A., Salama, G., Villers, A., Freedland, S. J., Moreira, D. M., . . . Steyerberg, E.
