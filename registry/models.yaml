    anyone via the open-access manuscript, not just the numbers matching what one paywalled PDF showed
    one reader, which is still a weaker claim than agreeing with an independent implementation. Same
    class as ang2010_rpa, iota_adnex and endpac.

    On the transcription itself: There is no reference implementation
    to run, the model exists only as a printed table, so the table is what parity is against, the
    same footing as cha2ds2_vasc and atria_stroke_2013. The test asserts the intercept and its confidence
