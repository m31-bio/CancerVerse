- id: esophageal_prognosis_catalog
  resolved_by: shapiro_ncrt
  resolution_note: >-
    CELL FILLED 2026-08-17 by `shapiro_ncrt`. Everything below stays: AUGIS is still the better
    model and is still a random survival forest with nothing to transcribe, so this row remains
    the record of the best model we cannot reproduce.
    TWO CORRECTIONS TO THE `second_candidate` NOTE, both from the full text. First, the authorship: the paper is Shapiro J et al, not Anderegg, confirmed
    against Crossref and the PDF byline. Second, and more useful, its prediction was wrong. It
    reasoned that a Cox-derived nomogram would print its points-to-probability step only as a
    drawn axis, as four cervical prognosis papers and msk_prostate_post_rp all did. Fig. 1 prints
    that axis as NUMERIC TICK LABELS, 1-year and 5-year survival under every total-points tick,
    so the lookup is complete without a baseline survival S0(t) ever being stated. The lesson
    is to open the figure rather than infer from the model class.
    What the check did NOT resolve: Fig. 1 labels even totals only, and ypN2 scores 5, so four
    reachable totals (5, 7, 9, 11, every ypN2 patient, 9.6% of the cohort) have no published
    survival. The module returns None there rather than interpolating.
  second_candidate_superseded: 'SUPERSEDED 2026-08-18, and the reason is my own error. The
    `second_candidate_verified` note below rejects a back-solve for S0(t) on the grounds that the
    paper''s points arithmetic could not be reproduced, it computed the worked example as 0 points
    (or 3 after rescaling) where the paper says 2. That reasoning was sound and the premise was wrong.
    The point scale is not floor(10*beta): Fig. 1 uses cN0 0 / cN1 2, ypT0 0 / ypT1 2 / ypT2 2 / ypT3 4,
    ypN0 0 / ypN1 4 / ypN2 5 / ypN3 10, total 0-16. On that scale the worked example is 2 + 0 + 0 = 2
    points exactly, as printed.

    The back-solve was also unnecessary. Fig. 1 prints the points-to-survival mapping NUMERICALLY as
    axis tick labels, points 0 2 4 6 8 10 12 14 16 against 1-year survival 91 88 85 81 75 68 60 51 41
    and 5-year 70 62 53 43 33 23 14 7 3, so S0 never had to be inverted out of an example. At 2 points
    that reads 88 and 62 per cent, matching the worked example exactly.

    The model is now implemented as `shapiro_ncrt`. Kept as a record of the mistake rather than deleted:
    the note below reached the right conclusion (do not ship a constant derived through an
    inconsistency) from a misreading, and the way it was caught was somebody re-reading the figure
    instead of re-deriving from the text.'
  second_candidate_verified: 'VERIFIED 2026-08-17.
    Correcting the lead recorded earlier the same day: the first author is Shapiro J, not Anderegg --
    Shapiro J, van Klaveren D, Lagarde SM, et al., Br J Surg 2016;103(8):1039-1047, PubMed 27115731.

    THE COEFFICIENTS ARE THERE. THE BASELINE SURVIVAL IS NOT. Table 2 gives the multivariable Cox hazard
    ratios with reference levels, and the final model after backward selection keeps three variables:
      cN     cN0 1.00 ref | cN1 1.46 (1.09-1.95), P=0.012
      ypT    ypT0 0.76 (0.49-1.17) | ypT1 1.00 ref | ypT2 1.02 (0.64-1.61) | ypT3-4 1.15 (0.76-1.73)
      ypN    ypN0 1.00 ref | ypN1 1.78 (1.32-2.39) | ypN2 1.98 (1.29-3.02) | ypN3 4.34 (2.38-7.93)
    So every beta is ln(HR). What is missing is S0(t): the nomogram (Fig. 1) maps total points to 1- and
    5-year survival through a DRAWN AXIS, and no numeric baseline survival appears anywhere in the paper.
    S(t) = S0(t)^exp(Xb) needs both halves, so as published the model ranks patients and cannot state a
    probability, the identical failure mode as the four cervical prognosis nomograms.

    A BACK-SOLVE WAS ATTEMPTED AND IS BEING REJECTED, which is worth recording because the route looked
    open. The paper gives one worked example: cN1 with ypT0 and ypN0 "would have a total of 2 points,
    corresponding to estimated 1- and 5-year survival rates of 88 and 62 per cent". With Xb =
    ln(1.46) + ln(0.76) = +0.1040 that inverts to S0(1y) = 0.891 and S0(5y) = 0.650, which would close
    the cell. It does not survive its own consistency check. The Methods say the nomogram points are the
    Cox coefficients "multiplied by ten and rounding the result to the lowest whole number", which for
    this patient gives floor(10*0.3784) + floor(10*-0.2744) = 3 + (-3) = 0 points, and rescaling each
    variable to a zero minimum as rms::nomogram does gives 3. Neither reproduces the paper''s stated 2.
    Since the points arithmetic cannot be reproduced, it is unknown whether 88 and 62 per cent were read
    off exact Xb or off a rounded points total, and a constant derived through an inconsistency is not a
    constant. Recorded rather than shipped.

    Discrimination, for the record: c-index 0.63 at internal validation, 0.62/0.63 on a two-way split
    between Erasmus MC (246) and the other centres (380), and 0.61 for OS in the genuinely external
    validation of 975 patients across three academic centres (Goense L et al., Ann Thorac Surg
    2018;106(5):1541-1547, PubMed 29932887), which also gives 0.64 for PFS with accurate calibration.
    The development paper is
    candid: predicted survival showed "only moderate correlation with observed survival, emphasizing the
    need for new prognostic factors".

    NEXT ACTION, in order of cost: read S0(1y) and S0(5y) off the survival axes of Fig. 1 and accept the
    reading error; or email the corresponding author for the two constants; or leave the cell open. Note
    that even with S0 this is a 0.61-0.63 model against the AUGIS forest''s 83.9% time-dependent AUC, so
    closing the cell here buys a weak flagship rather than a good one. Its appeal is that cN, ypT and ypN
    are cancer-registry fields already mapped in the target platform crosswalk.'
  second_candidate: 'A closed-form alternative to the AUGIS random survival forest
    exists, and it is weaker. Anderegg MCJ et al., "Prediction of survival in patients with oesophageal
    or junctional cancer receiving neoadjuvant chemoradiotherapy and surgery", Br J Surg 2016,
    doi:10.1002/bjs.10142, PubMed 27115731. Multivariable Cox on 626 patients after nCRT plus surgery;
    the final model keeps three predictors, pretreatment cN, ypT and ypN categories, with c-index
    0.63 at internal validation.

    It has been externally validated, properly: Goense L et al., Ann Thorac Surg 2018;106(5):1541-1547,
    PubMed 29932887, on 975 patients across three academic centres, giving C-statistic 0.61 for OS
    (against 0.63 in the development cohort) and 0.64 for PFS, with calibration described as accurate
    for both.

    Why it does not displace AUGIS. Discrimination is the problem: 0.61 external, against AUGIS''s
    5-year time-dependent AUC of 83.9% and even its own Cox comparator at 82.3%. The two metrics are not
    directly comparable, but not by a margin that closes a gap that wide. The development paper says so
    itself, predicted survival showed "only moderate correlation with observed survival, emphasizing
    the need for new prognostic factors". Its inputs are the attraction: cN, ypT and ypN are cancer
    registry fields already mapped in the target platform crosswalk, where AUGIS needs a few thousand trees.

    Unverified and probably blocked the familiar way: Br J Surg 2016 is paywalled with no PMC record, so
    the coefficient table has not been read. It is a NOMOGRAM built from a Cox fit, which in every case
    this project has examined, four cervical prognosis papers, msk_prostate_post_rp, means the
    points-to-probability axis is drawn in a figure and no numeric baseline survival S0(t) is printed.
    With beta alone the model ranks patients and cannot state a probability.

    NEXT ACTION: worth one check against the full text, because three registry-native predictors is
    a cheap model to ship if the constants are there. Open Br J Surg 2016 and look for a numeric S0(t) at
    named horizons alongside the coefficient table. If it is absent, this cell stays with AUGIS as the
    better model that cannot be transcribed, and the honest conclusion is that oesophageal prognosis has
    no implementable flagship rather than that we have not looked.'
