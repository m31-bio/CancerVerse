  code: cancerverse_baseline.cervical.prognosis.arrm
  license: restricted
  license_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9406128/
  license_basis: >-
    NOT open access, and recorded here so nobody assumes otherwise from the PMC link. Europe PMC
    reports isOpenAccess "N" and license null for doi:10.1016/j.ejca.2021.09.008; OpenAlex reports
    oa_status "green", i.e. readable through a repository deposit, which grants no reuse licence.
    The deployed ESGO calculator additionally carries "©2023 All rights reserved".
    Basis for implementing anyway is the same as atria_stroke_2013, iota_adnex and amap: what was
    taken from the article is Table 2, thirteen regression coefficients and thirteen integers, and
    a coefficient table is a set of facts rather than copyrightable expression (Feist v. Rural
    Telephone). No text, figure or code from the article is reproduced.
    The OUTCOME GRID IS A SEPARATE QUESTION AND IS NOT RESOLVED HERE. Only twelve of its numbers
    appear in the article's prose; the remaining values were re-derived by running an estimator
    over the patient-level cohort the ESGO calculator ships to every browser that loads it. That
    is derived-from-shipped-data, not a coefficient table, and the EU sui generis database right
    reaches datasets that copyright does not. DETERMINED 2026-08-18 by M31: the project's use is academic
    research only, and on that basis the derived outcome grid is in scope. The strongest ground is
    not ESGO's own terms but statute. UK Copyright and Rights in Databases Regulations 1997
    reg. 20 (implementing Directive 96/9/EC art. 9) provides that database right "is not infringed
    by fair dealing with a substantial part of its contents if ... it is extracted for the purpose
    of illustration for teaching or research and not for any commercial purpose, and the source is
    indicated". All three conditions hold: the calculator is public and was accessed by ordinary
    means, the source is named here in more detail than the exception requires, and the purpose is
    non-commercial research. That exception is written for organisations doing research, which is
    what makes it the load-bearing argument.
