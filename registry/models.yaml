- id: pancreatic_response_gap
  imaging_decision_2026_08_18: 'DECIDED, not pending. Widening criterion 2 to accept imaging inputs was put to the team on 2026-08-18 and declined for now. This cell therefore stays open by decision rather than by omission, and re-searching it on a schedule is not the plan, every candidate added to this literature since 2020 is imaging-derived. See docs/INCLUSION_CRITERIA.md for what was weighed, including why a retrained radiomics model would stop being an independent published baseline. What would reopen it is narrower: adopting published deep-learning WEIGHTS run as published, which is a different question and does not apply to any candidate in this cell.'
  clinical_decision_rule: 'WHAT THIS CELL IS ACTUALLY COMPARED AGAINST. The routine-variable answer in this disease is not a model; it is two CA19-9 thresholds, and they are in clinical use.

    Dekker EN, van Klaveren D, et al.; Trans-Atlantic Pancreatic Surgery (TAPS) Consortium. BJS. 2025;112(2):znaf011. Locally advanced pancreatic cancer after induction FOLFIRINOX, n=213 across five referral centres (3 USA, 2 Netherlands).

      RULE:  CA19-9 decrease > 80%%   AND   post-induction CA19-9 < 50 U/mL

      meets it, WHO PS 0        ~40%% 3-year overall survival -> consider exploration
      fails it                   <20%% -> authors advise more reluctance to explore
      (reference: non-metastatic at restaging, not selected for exploration: 11.8%%)

    It fails criterion 1 of docs/INCLUSION_CRITERIA.md, and not because it is incomplete, because it was never meant to be a model. What the paper publishes is Cox hazard ratios for three factors and contour plots for surgeons; no nomogram, no AUC, no C-index, no external validation. The decision language is "be more reluctant", not "this patient response probability is 0.63".

    TWO CONSEQUENCES, neither of them decided here. (1) The rule itself could be implemented as a binary baseline, multicentre support, published survival separation, actual clinical adoption, at the cost that it emits a group, not a probability, so calibration, Brier and decision-curve net benefit are all uncomputable for it, exactly as for albi and lipi. (2) Or this cell accepts that its comparator is a clinical convention rather than an equation, which is arguably the more honest comparison and does not fit the shape of a baseline table. Choosing between those changes what "baseline" means for this cell, so it is a decision for the team and is deliberately left open.'
  criteria_note_2026_08_18: 'RE-SEARCHED 2026-08-18, and the picture is clearer than the 2026-08-06 note. Two new candidates, both rejected, and the reason they fail is the same reason the cell is hard.

    (1) Koo J, Choi G, Cheon J, et al. Predicting Chemotherapy Response in Patients With Advanced or Metastatic Pancreatic Cancer Using Machine Learning. JCO Clin Cancer Inform. 2025. doi:10.1200/CCI-25-00124, PMID 41329903. Directly on-question. n=191 across two Korean centres, 2014-2023, no external validation reported. FAILS criterion 3, and is smaller than the candidate already on file.

    (2) Dekker EN, van Klaveren D, et al.; Trans-Atlantic Pancreatic Surgery (TAPS) Consortium. CA19-9 response after induction FOLFIRINOX for locally advanced pancreatic cancer. BJS. 2025;112(2):znaf011. Five referral centres, 3 USA and 2 Netherlands, n=213. NOT A MODEL: a threshold analysis. It publishes Cox hazard ratios for three factors (Table 2) and contour plots, no nomogram, no discrimination statistic, no external validation. Fails criterion 1, there is no constant that turns it into a probability, because it was never meant to be one.

    WHAT THE RE-SEARCH ACTUALLY ESTABLISHED. The routine-variable signal in this disease is CA19-9 kinetics, and the literature uses it as a THRESHOLD (>80%% decrease; post-induction <50 U/ml) rather than fitting it into a model. That is a convention of the field, not an absence of data, and it means searching for a fitted routine-variable response model here will keep returning threshold papers. Unblocking this cell means either accepting CEUS kinetics (criterion 2) or fitting the CA19-9 thresholds ourselves, which would make it our model, not a published baseline.'
  criteria_note: 'Fails criterion 2 of docs/INCLUSION_CRITERIA.md (inputs this library takes). Searching again will not unblock this cell; only a routine-variable model, or a decision to widen criterion 2, will.'
  researched_2026_08_17: 'RE-SEARCHED 2026-08-17. Nothing new. The contrast-enhanced ultrasound
    nomogram in `tier_note` remains the strongest candidate and the cell remains a gap for the reason
    already recorded (CEUS kinetics are not routine clinical variables).

    The one hit worth reporting is a category error rather than a candidate: Ann Surg 2022, PubMed
    32149822, "Prognosis Based Definition of Resectability in Pancreatic Cancer". It is a resectability
    and prognosis paper, concordance index reported for overall survival against stage, site and sex,
    so it answers the prognosis question, which this disease already has filled by msk_pancreatic. It
    would not fill the response cell even if it were fully published, and putting it here would repeat
    the mistake `blocker` already records for the nine-variable model: conditioning on observed response
    and calling the result response prediction.'
  disease: pancreatic
  axis: response
  role: flagship
  status: gap
  title: (no open flagship yet)
  repro_tier: C
  tier_note: 'SEARCHED 2026-08-06; the ''not searched exhaustively'' label no longer applies. Candidates
    exist. The strongest true response model is a contrast-enhanced ultrasound nomogram for neoadjuvant
    chemotherapy efficacy in borderline-resectable and locally advanced disease (Cancer Imaging 2024,
    doi:10.1186/s40644-024-00662-2), AUC 0.852 primary and 0.854 validation, on three predictors: taller-than-wide
    shape, time to peak enhancement, and peak tumour/normal ratio. Also found: a nine-variable chemotherapy-response
    nomogram for advanced and metastatic disease, C-statistic 0.74.'
  open_source: none
  blocker: The ultrasound model's inputs are contrast-enhanced ultrasound kinetics, not routine clinical
    variables, the same obstacle as the radiomics models in the gastric and cervical response cells.
    The nine-variable model takes initial response to chemotherapy as a predictor, so it estimates survival
    conditioned on observed response; that is prognosis under treatment, not response prediction, and
    it belongs in a different cell than the one it would fill.
