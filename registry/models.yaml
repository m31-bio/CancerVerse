  title: Integer risk score for complete tumour regression (Ryan TRG 0) after preoperative chemotherapy
    in advanced gastric cancer
  citation: Xu W, Ma Q, Wang L, et al. Front Oncol. 2021;11:607640
  citation_apa: 'Xu, W., Ma, Q., Wang, L., He, C., Lu, S., Ni, Z., Hua, Z., Zhu, Z., Yang, Z., Zheng,
    Y., Feng, R., Yan, C., Li, C., Yao, X., Chen, M., Liu, W., Yan, M., & Zhu, Z. (2021). Prediction Model
