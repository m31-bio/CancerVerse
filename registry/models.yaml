  architecture_family: Logistic regression
  architecture: Multivariable logistic regression on hrHPV status, cytology grade and age (optionally
    E6 oncoprotein) to CIN2+/CIN3+ probability.
  parity_note: 'The paper publishes no worked example, no calibration table and no predicted-vs-observed
    cross-tabulation (checked). But its supplement (Additional file 1, Table S1) is a real .xlsx rather
    than a figure, so a stronger check than a worked example was available: an independently downloaded,
    machine-readable copy of the coefficient table compared to our shipped constants term by term at ZERO
    tolerance, across all four nested models. 56/56 coefficients match exactly, with no extra or missing
    terms in either direction. A worked example would have verified the model at one point in the input
    space; this verifies every coefficient in it. Note: PMC''s mirror path returns an HTML interstitial,
    not the workbook; Springer''s static-content CDN serves the real file. Fixture: tests/parity/reference/cervical_table_s1.json
    via cervical_s1_extract.py; asserted offline by tests/parity/test_cervical_cin_parity.py.'
  core_formula: "logit(p) = β₀ + β_hrHPV·hrHPV + β_cytology + β_age·age\n             [ + β_E6·E6 + Σ\
