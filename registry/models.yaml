- id: colorectal_response_gap
  disease: colorectal
  axis: response
  role: catalog
  status: catalog
  title: (cell closed 2026-08-14, kept as the record of what blocked it)
  repro_tier: A
  superseded_by: wang_larc_pcr
  tier_note: >-
    CLOSED 2026-08-14. This entry is kept, not deleted, because the way it was closed is the useful part.
    For three months the cell was blocked on ONE NUMBER: Wang et al, Cancer Medicine 2024 (PMID 38819440,
    PMC11141331) publishes six odds ratios (Table 4), both C-indices, and the nomogram's points formula
    (Results 3.3), but no intercept and no points-to-probability axis outside Figure 3A. Points rank
    patients; they do not state a probability, and the probability is the output. Everything in
    `routes_tried` below was correct at the time and is left standing.

    What broke it was not a new paper. The authors' own calculator is built with R's `DynNom` package,
    and every DynNom app ships a "Model Summary" tab wired to a renderPrint of the fitted model object.
    For the `rms::lrm` fit behind this nomogram that printout IS the complete coefficient table,
    intercept included. Driving the app's Shiny websocket directly and asking for that one output
    returned the whole model in a single message. See `wang_larc_pcr`.

    The generalisable lesson, now written up in tests/parity/reference/wang_larc_pcr_fetch.py: a Shiny
    app is not automatically Route B. Ask what the app itself is willing to print before settling for
    probing its outputs one patient at a time. DynNom, regression-tool Shiny apps and anything else
    with a "model summary" panel may simply hand over the model.
  open_source: none
  blocker: >-
    RESOLVED. Was: missing the intercept and the points-to-probability axis, with everything else
    published (pre-CRT CEA 0.944, histopathology 4.608, T stage 0.793, N stage 0.727, MRI EMVI 0.352,
    TNT 2.264, and the points formula 22.0 x N stage + 15.0 x T stage + ... + 3.85 x CEA). The intercept
    turned out to be -0.0131 and is still published nowhere in the literature, it was read from the
    authors' deployed calculator on 2026-08-14. Worth noting how small the missing piece was: the
    intercept is statistically indistinguishable from zero (SE 0.2588, p 0.96), and the cell was blocked
    on it for months anyway, because a rank is not a probability no matter how near zero the constant is.
  blocker_kind: resolved, one missing constant, recovered from the authors' own deployed calculator
  routes_tried: >-
    Left as written on 2026-08-14, before the cell was closed, because it is an accurate record of what
    genuinely does not exist. No GitHub/CRAN repo for "LARC2" or "pcrpredict"; no erratum or correction
    notice on PMC11141331 or PubMed 38819440; no supplementary file (the data-availability statement is
    "All data obtained or analyzed during this work are included within the article"); no later paper by
    Wang/Li/Huang/Guo republishing the model with an intercept, the nearby hits are a different pCR
    model (an XGBoost black box, out of scope by CONVENTIONS.md's verifiability boundary) and an
    unrelated NAR-score OS/DFS nomogram (prognosis axis, different predictors). All of that is still
    true. The one claim that was wrong was "None of the six verification routes used elsewhere apply to
    a Shiny app": the page really does return a loading shell with no decimal literals, but the shell is
    a transient cold-start frame, and the running app behind it answers.
- id: wang_larc_pcr
  disease: colorectal
  axis: response
  role: flagship
  status: implemented
  title: Wang 2024 dynamic nomogram, pathological complete response after neoadjuvant chemoradiotherapy
    in locally advanced rectal cancer
  code: cancerverse_baseline.colorectal.response.wang_larc_pcr
  our_code: cancerverse_baseline.colorectal.response.wang_larc_pcr
