      Both are real HTML tables in PMC8082104, so no figure has to be read.
    verified: true
    numbered: false
  core_formula: "score = 5·[CA19-9 ≤ 10.90 U/mL] + 4·[CA72-4 ≤ 3.19 U/mL]\n        + 7·[well differentiated]\
    \ + 7·[LNmax ≥ 1.535 cm]\n\n  range 0–23; high risk if score > 13\n\n  observed pCR: 0% at ≤13 points,\
    \ 22.35% above"
  discrimination: AUC 0.84 (0.77–0.91) training, 0.73 (0.55–0.91) internal validation, 0.82 (0.71–0.92)
    prospective cohort. No C-index and no calibration analysis are reported anywhere in the paper.
  discrimination_source: >-
    PMC8082104 Results, read in full 2026-08-14 (not the abstract), verbatim: "The AUC of the prediction
    model was 0.84 (SD = 0.03; 95% CI: 0.77-0.91; P<0.0001)"; "The AUC of the prediction model in the
    internal validation group was 0.73 (SD=0.09; 95% CI: 0.55-0.91; P=0.017)"; "In the external
    validation group, the AUC of the prediction model was 0.82 (SD=0.05; 95% CI: 0.71-0.92; P=0.0016)".
    These are AUCs of the summed integer score itself, not of an underlying continuous logistic
    predictor, the paper's "prediction model" and its risk score are the same object.
  development_cohort: 428 patients at Shanghai Ruijin Hospital, 304 retrospective (July 2009–November
    2018), split 2:1 at random into 202 training and 102 internal validation, plus 124 enrolled prospectively
    December 2018–June 2020 after the model was locked
  tier_note: >-
    CHOSEN 2026-08-14 as the candidate for the gastric response cell, out of 28 papers. Chosen on one
    criterion the others fail: it is computable exactly as published. The four point values, the 0–23
    range and the 13-point cutoff are all printed in text, so there is no missing intercept and no
    quantity to recover from a figure. This library already ships integer scores of this shape --
    CHA2DS2-VASc, HAS-BLED, GRACE, so the form is not a compromise.

    The runner-up was PMID 41883960 (Hou 2026), the only paper in the 28 that prints a complete logistic
    model including an intercept (3.081, SE 1.179) and therefore the only one that can emit a
    probability. It was not chosen because n=113, there is no external cohort at all, the intercept
    belongs to a seven-term fit whose nomogram drops one term, and the coding direction contradicts the
    paper's own baseline table, all five biomarker betas are negative while the Results prose attaches
    them to the low level, which Table 1 shows is the level associated with response. Implementing that
    unresolved would ship a model that is exactly backwards.

    So the cell trades a probability for a computable model. That trade should be reviewed, not assumed.
  scope_note: >-
    Locally advanced gastric adenocarcinoma receiving neoadjuvant chemotherapy. Endpoint is Ryan TRG 0,
    i.e. pathological complete response, at resection.

    Three limits that belong next to any number this produces. First, it is single-centre: the paper
    calls its prospective cohort an "external validation group" but every author is at Shanghai Ruijin,
    only one hospital is ever named, and the paper's own limitations say "This was a single-center
    clinical study". It is prospective TEMPORAL validation. Second, it is thin, 30 TRG=0 events in the
    retrospective data, 20 of them in training against four retained predictors, so events per variable
    is about 5 and the 0.84 is optimistic on its face; the internal AUC rests on 10 events with a CI
    running down to 0.55, and the prospective AUC on 9. Third, it outputs a risk group, not a
    probability, and no calibration was ever assessed.

    The temporal validation is worth more than it first looks. Regimens changed between the eras (EOX
    and taxane-containing retrospectively, SOX and FLOT prospectively), so it is a genuine out-of-era
    test, which matters, because PMID 35280802 showed a gastric response signature holding at AUC
    0.72–0.78 across chemotherapy regimens and collapsing to 0.50 under apatinib + SOX.
  blocker: >-
    None for implementation. Two things the paper does not state and that cannot be reconstructed: the
    rounding rule mapping ORs 5.615 / 4.531 / 7.426 / 7.945 onto points 5 / 4 / 7 / 7, and whether the
    13-point cutoff was the operating threshold behind the reported validation sensitivities and
    specificities. Neither blocks the code, because the points are printed directly; both mean the paper
    cannot be re-derived, only transcribed.
  blocker_kind: none, transcribable as published
