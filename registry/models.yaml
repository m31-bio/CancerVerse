- id: hap
  discrimination: 'AUROC for mortality, HAP: 1-year 0.79 (95% CI 0.69-0.88) training, 0.67 (0.58-0.76)
    validation; 2-year 0.82 (0.73-0.92) training, 0.64 (0.49-0.78) validation. Highest of the six scores
    compared at both time points, but the validation advantage is significant only at 1 year (P=0.02);
    at 2 years P=0.71'
  discrimination_source: 'Kadalayil L et al., Ann Oncol 2013;24(10):2565-2570, PubMed 23857958 /
    PMC4023407. Read 2026-08-17 from SUPPLEMENTARY TABLE S4, not from the article text, the main text
    states only that HAP "had the highest AUROC" with pairwise P-values and never prints a value. The
    supplementary .doc was recovered through the Europe PMC supplementaryFiles endpoint after PMC
    returned block pages for the /bin/ path.

    Table S4 in full, ROC curve area (95% CI), training then validation.
    1 year (deaths/subjects 31/74 training, 63/134 validation): HAP 0.79 (0.69, 0.88) / 0.67 (0.58, 0.76);
    Child-Pugh 0.69 / 0.57; Okuda 0.64 / 0.55; CLIP 0.58 / 0.62; MELD 0.61 / 0.54; BCLC 0.53 / not given.
    2 years (51/67 training, 86/104 validation): HAP 0.82 (0.73, 0.92) / 0.64 (0.49, 0.78);
    Child-Pugh 0.70 / 0.56; Okuda 0.63 / 0.59; CLIP 0.75 / 0.61; MELD 0.56 / 0.53; BCLC 0.63 / not given.

    Read the validation column, and read the 2-year P-value. Training-to-validation costs HAP 0.12 at
    1 year (0.79 -> 0.67) and 0.18 at 2 years (0.82 -> 0.64), so the training figures overstate it
    substantially. The paper''s own significance test, verbatim from the table footnote: "P-value: <0.001
    for both at 1 and 2 years for the training dataset. P-value: 0.02 at 1 year and 0.71 at 2 years for
    the validation dataset." At two years, in validation, HAP is NOT distinguishable from Child-Pugh,
    Okuda, CLIP or MELD. Quoting 0.82 without that is the misreading this field exists to prevent.

    Separation across the four grades is the other half of the evidence, and it is strong: median OS
    27.6 / 18.5 / 9.0 / 3.6 months for HAP A / B / C / D in the derivation cohort. Those medians are the
    UK cohort''s and do not transfer, see scope_note.'
