    NO STATED LICENCE, which defaults to full copyright rather than to permission, so `restricted`
    until someone decides otherwise. Recorded here as well as in `blocker` because the audit script
    reads these two fields, and a catalog row with a restricted licence and no determination is the
    same gap that `msk_rectal`, `hap` and `kunzmann` were caught in on 2026-08-17.

    Facts gathered 2026-08-18, none of which is a licence grant. The zip ships no LICENSE file and
    none of its four source files carries a copyright notice. The calculator itself states a citation
    requirement, "Please cite the following source when using this program: NCI-funded Breast Cancer
    Surveillance Consortium (P01 CA154292)...", whose wording presupposes use, and its Source Code
    page offers "software downloads, and usage guidelines". Download needs no login, no password and
    no acceptance click. P01 CA154292 is an NCI grant.

    The Feist reasoning used for every other determination in this registry does NOT transfer: those
    turn on a coefficient table in an article being a set of facts, while what would be taken here is
    a 2,394,000-row precomputed table and a SAS macro, a software artifact and a database, and the
    EU sui generis database right reaches datasets that copyright does not. See `blocker` for the
    full record. NOT IMPLEMENTED, so nothing has been taken under this uncertainty.
