- id: predict_breast
  discrimination: 'AUC for 10-year breast-cancer-specific mortality, PREDICT v2 (the version
    implemented here): combined external validation 0.752 all cases, 0.760 ER-positive, 0.696
    ER-negative. Model-fitting cohort 0.805. Range across the four validation sets 0.632-0.805'
  discrimination_source: 'Breast Cancer Res 2017;19(1):58, PMC5440946, Table 5 "Comparison of
    discrimination (AUCs) of PREDICT v1 and PREDICT v2, by data set and oestrogen receptor status",
    full text read 2026-08-17. The v2 column is the one that applies, this library implements
    v2.2.

    Per set, v2, all cases: ECRIC 0.805, NTBCS 0.772, POSH 0.741, BCOS 0.734, combined validation
    0.752. ECRIC is the MODEL-FITTING cohort, so 0.805 is internal and must not be quoted beside
    the others as though it were validation. The worst single figure is BCOS ER-negative at 0.632.

    ER status matters more than the site does. Verbatim: "in the combined validation data, PREDICT
    v2 performed slightly better for ER-positive disease than for ER-negative disease (AUC 0.760
    vs. 0.750, P = 0.016)". v2 barely moved discrimination over v1, the refit targeted
    calibration, not separation, and the paper says the AUCs were "similar" throughout.

    CALIBRATION IS THE CAVEAT THAT MATTERS, and it is not fixed. Verbatim: "Both PREDICT v1 and
    v2 tended to under-estimate breast cancer mortality in women with small ER-positive tumours
    and over-estimate mortality in women with larger ER-positive tumours." The v2 refit exists
    because v1 under-estimated mortality in women diagnosed under 40; v2 improved that
    ("the calibration of v2 improved over v1 in patients diagnosed under the age of 40") without
    eliminating the tumour-size pattern. A model used to decide whether chemotherapy is worth its
    toxicity is being asked a calibration question, so read this before the AUC.'
