- id: ang2010_rpa
  discrimination: 'n/a as a c-index - no AUC or concordance is reported. Evidence is separation: 3-year
    overall survival 93.0% (95% CI 88.3-97.7) low risk, 70.8% (60.7-80.8) intermediate, 46.2% (34.7-57.7)
    high, with hazard ratios vs low of 3.54 and 7.16. Non-overlapping confidence intervals across all
    three groups'
  discrimination_source: 'Ang KK, Harris J, Wheeler R, et al. N Engl J Med 2010;363(1):24-35 (RTOG 0129),
    PubMed 20530316 / PMC2943767. The abstract was read 2026-08-17 and stops exactly where the numbers
    would be, it says only "Using recursive-partitioning analysis, we classified our patients as having
    a low, intermediate, or high risk of death on the basis of four factors" and gives no rates by group.
    NEJM is paywalled and PMC served a block page on the day of reading.

    The figures above did not need re-fetching: they were extracted from PMC2943767 when the module was
    implemented and have been carried in the code all along. THREE_YEAR_OS, THREE_YEAR_OS_CI and
    HAZARD_RATIO_VS_LOW in src/cancerverse_baseline/head_neck/prognosis/ang2010_rpa.py, whose docstring quotes
    the Results-section decision tree verbatim. This registry field was simply never filled in from them.
    That is the whole finding here: the number was not missing from the project, only from the table.

    No AUC is appropriate rather than absent, this is a three-group decision tree, so the same
    reasoning as lipi, albi, abc_method and moore_criteria. What matters for such a model is whether the
    groups separate in the published order by enough to change management, and these do: a 47-point
    spread in 3-year OS with confidence intervals that do not overlap between any pair. That separation
    is why the de-escalation trials in HPV-positive oropharyngeal cancer are built on these groups.

    External validation exists and is already cited in the module for a different purpose: Fakhry et al.,
    Cancer 2019;125(12):2027-2038 (PMC6594017), which reproduces the risk groups and is what settles the
    two ambiguities in Ang''s own wording, what "nonsmokers" means, and where T1 falls. See scope_note
    and the `definition` input.'
