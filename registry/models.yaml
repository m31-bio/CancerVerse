- id: dutasteride
  disease: prostate
  axis: response
  role: flagship
  status: implemented
  title: Dutasteride chemoprevention (9 outcomes x 2 arms, benefit and harm)
  code: mayo_baseline.prostate.response.dutasteride
  entrypoint: dutasteride_predict
  license: open
  repro_tier: A
  year: 2013
  citation: Nguyen CT, Isariyawongse B, Yu C, Kattan MW — models for men with a prior negative biopsy
    considering dutasteride (REDUCE)
  source_url: https://pubmed.ncbi.nlm.nih.gov/23768723/
  public_repo: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/ProstateCancerConsideringDutasteride
  equation_source: Coefficients machine-extracted from the deployed calculator's published R source at
    https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/ProstateCancerConsideringDutasteride
    by tests/parity/reference/dutasteride_extract.py. 17 Cox sub-models (9 outcomes x 2 arms, minus one
    missing arm), 315 coefficients, each risk = 1 - S0^exp(score) with its own predictor subset, spline
    knots and applicability bounds.
  upstream:
  - url: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/ProstateCancerConsideringDutasteride
    note: deployed model source, 711 lines of R
  canonical_impl:
    type: open_source
    url: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/ProstateCancerConsideringDutasteride
    license: see repository terms
  our_code: mayo_baseline.prostate.response.dutasteride
  architecture_family: Survival (Cox)
  architecture: 'Seventeen Cox sub-models: nine outcomes each predicted on and off dutasteride, with restricted
    cubic splines and per-outcome applicability bounds, so the reported quantity is the treated-minus-untreated
    difference rather than either risk.'
  core_formula: "risk = 1 − S₀^exp(score)        per outcome, per arm\n\n  difference = on-drug − off-drug\n\
    \               negative is benefit, positive is harm\n  9 outcomes × 2 arms (ASAP has only the on-drug\
    \ arm)"
  n_parameters: 315
  development_cohort: 'REDUCE trial: men with a prior negative 6- to 12-core prostate biopsy'
  parity_status: checked
  parity_note: 'CHECKED 2026-08-06 against the vendor''s own deployed R, route 1. tests/parity/reference/dutasteride_reference.R
    copies the 17 predict.* functions VERBATIM from riskcalc.org''s server.R and adds raw.* copies with
    only the display rounding removed. 8 patients x 9 outcomes x 2 arms = 132 probabilities; worst absolute
    difference 4.9e-11 percentage points, and the ''Not Applicable'' judgement agreed on every one. That
    comparison is also what licenses MACHINE EXTRACTION of the coefficients: 315 is past the point where
    hand-copying is safe (this project shipped a wrong ALBI coefficient from a far smaller transcription),
    so they are parsed out of the R and this test proves the parse faithful. Two published asymmetries
    are reproduced rather than smoothed: ASAP has no off-treatment arm in the source, so its difference
    is None rather than 0; and HGPIN on dutasteride is a CONSTANT 3.838831% with no predictors while its
    off-treatment arm is a full 28-term model.'
  scope_note: Men with a prior negative 6- to 12-core biopsy in the past 6 months (REDUCE). Nine outcomes,
    three of them harms (erectile dysfunction, gynecomastia, urinary tract infection). It reproduces REDUCE's
    central finding that dutasteride LOWERS overall prostate cancer but RAISES high-grade disease -- a
    model reporting only the overall reduction would answer half the question. Applicability bounds differ
    per outcome, so a patient can be answerable for some outcomes and not others; unanswerable ones return
    None rather than a guess.
  inputs:
  - age
  - psa
  - dre_abnormal
  - sexually_active
  - history_of_impotence
  - history_of_libido_problems
  - family_history_prostate_cancer
  - percent_free_psa
  - bmi
  - ipss_score
  - max_urinary_flow_ml_s
  - biopsy_cores
  - prostate_volume_ml
  - residual_urine_ml
  open_source: available
  evidence:
    test: tests/parity/test_dutasteride_parity.py
    test_function: test_matches_the_vendor_r
    script: tests/parity/reference/dutasteride_extract.py
    fixture: tests/parity/reference/dutasteride_cases.json
  equation_location:
    numbered: null
    where: NOT IN THE PAPER as a closed form. 315 coefficients across 17 Cox sub-models, machine-extracted
      from ClevelandClinicQHS/riskcalc-website/tree/main/ProstateCancerConsideringDutasteride by tests/parity/reference/dutasteride_extract.py.
    verified: vendor R source; parity-verified 2026-08-05
