- id: optum_lung_lasso
  disease: lung
  axis: detection
  role: alternative
  role_note: 'It was added as catalog/catalog and then implemented by a separate
    pass that did not move the role with the status, leaving `status: implemented` beside `role: catalog`,
    the only such row in the registry. Alternative rather than flagship because lung/detection already
    has one in plcom2012, and the two answer the same question (who to image for lung cancer) from
    different inputs: PLCOm2012 wants a smoking history in numbers, this wants routine EHR.'
  status: implemented
  year: 2023
  title: Optum EHR LASSO model (3-year lung cancer risk from routine care)
  flagship_note: 'Deliberately NOT the flagship. It has the larger development cohort by two orders of
    magnitude and the better claim to work on data a hospital already holds, and it is still the wrong
    default: PLCOm2012 is written into screening guidelines, and a library whose lung default disagreed
    with the guideline would be answering a question nobody asked. This one is carried alongside as the
    EHR-native comparator, the thing a deployed model is actually competing with, and as the honest
    answer to "what can you run over the whole panel tonight".'
  code: cancerverse_baseline.lung.detection.optum_lung_lasso
  our_code: cancerverse_baseline.lung.detection.optum_lung_lasso
  entrypoint: optum_lung_lasso_predict
  architecture_family: Logistic regression
  architecture: 'LASSO (L1-penalised) logistic regression fitted with Cyclops over 16,633 candidate OMOP
    covariates; the penalty left 278 non-zero. Prediction is a plain dot product over covariateIds
    through a logistic link, no splines, no interactions, no per-patient normalisation, because every
    surviving covariate is a 0/1 indicator whose stored normalisation factor is 1.'
  core_formula: "p(lung cancer in days 1-1095) = 1 / (1 + e^(-XB))\n\n  XB = -8.8024 + sum over the 278\
    \ covariates of beta_i * x_i\n  x_i  = value of covariateId i, divided by its normFactor (all 1 here)\n\
    \  covariateId = conceptId * 1000 + analysisId, observed in day -365..0\n  a covariateId the model\
    \ does not carry contributes nothing"
  citation: Chandran U, Reps J, Yang R, Vachani A, Maldonado F, Kalsekar I. Machine Learning and Real-World
    Data to Predict Lung Cancer Risk in Routine Care. Cancer Epidemiol Biomarkers Prev. 2023;32(3):337-343
  source_url: https://doi.org/10.1158/1055-9965.EPI-22-0873
  paper_title: Machine Learning and Real-World Data to Predict Lung Cancer Risk in Routine Care
  equation_source: 'The fitted model itself, not the paper: inst/models/full_model/model.json in the
    Apache-2.0 study package, which is the artifact PatientLevelPrediction loads and scores with. The
    paper prints no coefficient table, it reports AUCs and names the top predictors, so the package
    is the only complete statement of the equation, and it is a machine-readable one.'
  equation_location:
    numbered: false
    where: 'ohdsi-studies/lungCancerPrognostic at 61c526ea, inst/models/full_model/. model.json holds
      the intercept and 16,633 betas (279 non-zero including the intercept); covariateImportance.csv
      holds the same coefficients unrounded plus a covariateName, analysisId and conceptId for each;
      preprocessing.json holds the normFactors applied at predict time; trainDetails.json names
      cdm_optum_ehr_v1705 and the 4,777,606-patient attrition. The prediction function is
      PatientLevelPrediction''s predictCyclopsType, in R/CyclopsModels.R.'
    verified: downloaded and read 2026-08-14; both coefficient files cross-checked against each other by
      tests/parity/reference/optum_lung_lasso_extract.py
  n_parameters: 279
  inputs:
  - covariates (mapping of OMOP covariateId to value, or an iterable of the ids present)
  license: open
  open_source: available
  public_repo: https://github.com/ohdsi-studies/lungCancerPrognostic
  canonical_impl:
    type: open_source
    url: https://github.com/ohdsi-studies/lungCancerPrognostic/tree/master/inst/models/full_model
