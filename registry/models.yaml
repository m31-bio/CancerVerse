    Two things make this the sturdiest of the source checks in this registry, and one thing keeps it
    from being parity. Sturdy: the second copy is openly accessible, so anyone can redo the check, which is not true of chau_eg, msk_ovarian''s figure, or the BCSC
    Appendix Figure. Sturdy: the intercept lives in the table CAPTION rather than a row, and a check
