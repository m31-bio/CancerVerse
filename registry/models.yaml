    candidate had been an `rms::cph` + `nomogram()` fit, so all four failed the same way, and
    the fix was to look for a model of a different FORM rather than a better model of the same
    form. ARRM converts its betas to integer points, bands the score, and reports each band's
    observed Kaplan-Meier outcome, so no baseline hazard exists to be missing. Keep this row as
    the record of what was tried; it is the reason the next blocked cell should be re-read for
    a shared structural defect before another paper of the same kind is searched for.
