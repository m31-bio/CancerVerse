  status: catalog
  year: 2026
  title: Interpretable LR model for stroke in newly diagnosed atrial fibrillation
  citation: Interpretable machine learning models for stroke risk prediction in patients with newly diagnosed
    atrial fibrillation. npj Digital Medicine
  source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13057017/
  license: open
  open_source: available
  public_repo: https://github.com/Jesse-cwl/Stroke-Prediction-in-AF
  upstream:
  - doi: 10.1038/s41746-026-02470-3
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13057017/
    note: development and two external validations; Table 2 odds ratios, no intercept
  repro_tier: C
  discrimination: AUC 0.915 internal, 0.877-0.886 in two external cohorts, against 0.614-0.621 for CHA2DS2-VASc
    in the same cohorts
  candidate_for: cha2ds2_vasc
  code_status: 'Training code is public (GitHub, MIT; archived Zenodo 10.5281/zenodo.18767654) and runs
    the full pipeline end to end. It is NOT a usable model on its own: no serialised model file ships,
    and the derivation data (NTUH-iMD) is not shared, so the notebooks cannot be re-run to reproduce
    the fit. What the code gives us is evidence to read the missing constant OUT of, retained output
    cells and case-level figures, not a model to load and call.'
  blocker: 'Missing the intercept, and ONLY the intercept. Re-examined 2026-08-14: the nine coefficients
    are no longer missing. Notebook 01 in the repository retains 8 of its 56 output cells, the earlier
    note here that every output had been cleared was wrong, and the retained output of the final cell
    prints the multivariable odds ratios to six decimal places, so each coefficient is ln(OR) exactly:
    prior ischemic stroke 4.506327, warfarin 0.560889, AAD -0.654219, CLD -0.249559, APA 0.217518, OHA
    0.181271, HTN 0.176715, DM 0.127999, age 0.010919 per year. The intercept is absent because the notebook
    fits it and then drops it one character before printing: `np.exp(model_multi.params[1:])`, commented
    `# Exclude constant term`. Neither the article nor the supplement closes the gap. Table 2 prints
    odds ratios only, and Supplementary Figure 1 is a bar plot of the same nine coefficients with no
    axis-readable intercept and no coefficient table. There is still no serialised model and the derivation
    data is not shared.'
  blocker_kind: one missing constant
  tier_note: 'the strongest replacement candidate found. Note the licence split,
    which matters and is easy to get wrong: the ARTICLE is CC BY-NC-ND, while the REPOSITORY is MIT.

    There are TWO logistic regressions in this paper and they are easy to conflate.
    (i) An unregularised statsmodels fit on raw predictors, which is what Table 2 reports and what the
    six-decimal odds ratios in notebook 01 belong to. Nine coefficients known, intercept missing: one
    number from being implementable. (ii) An sklearn pipeline. StandardScaler on age, LogisticRegression
    C=0.1 liblinear, which is what produces the headline AUC 0.9146 and the dashboard. Its coefficients
    are shrunk relative to (i): prior ischemic stroke reads about 4.05 against 4.506327.

    The intercept of (ii) IS recoverable and was recovered. Notebook 08 retains three case-level figures
    that plot each beta*x contribution and annotate the predicted risk, so the constant follows as
    logit(p) - sum(beta*x). Patient 994 gives -2.986, patient 19 gives -2.988, patient 67 gives -2.976;
    the first two have the finer axis and agree to three decimals, so the intercept of (ii) is about
    -2.99. That does NOT make (ii) usable: it standardises age with the training mean and standard
    deviation, which are unpublished, and Table 1 reports age as median (IQR) 75 (66, 82) rather than
    mean and SD, so those two constants cannot be recovered from the paper. Model (i) is therefore the
    cheaper target by a wide margin, one number rather than three.

    EARLIER-VERSION SEARCH, 2026-08-14: exhausted, nothing found, do not repeat. There is no preprint --
    Europe PMC returns exactly one record for the title and Crossref reports `relation: {}` on the DOI,
    so no has-preprint or is-preprint-of link exists. No correction or amendment; the version of record
    was deposited 2026-04-07 under CC BY-NC-ND 4.0. The supplement is only MOESM1 (PDF) and MOESM2 (MP4);
    MOESM3 and beyond do not resolve, so there is no peer review file or reporting summary to mine. The
    repository has ten commits and two file uploads (2025-05-03 and 2025-05-22); notebooks 00-09 are
    byte-identical between them and the second upload only added notebook 10 and a longer README, so
    there is no earlier, richer version in git history. The Zenodo archive
    (10.5281/zenodo.18767654, concept 10.5281/zenodo.18767653) has a single version marked is_last, and
    its copy of notebook 01 has the same SHA-1 as the one on main, a snapshot, not a fuller release.
    The one supplementary item still unexamined is MOESM2, the dashboard demo video: worked examples at
    two different ages would pin the age scaler and finish model (ii) without contacting anyone.'
  discrimination_source: npj Digital Medicine, PMC13057017, read 2026-08-07. Internal AUC 0.915 (LR) and
    0.914 (Platt-calibrated XGBoost); two external cohorts give 0.877/0.882 for LR and 0.886/0.879 for
    XGBoost. CHA2DS2-VASc scored 0.614-0.621 in those same cohorts, which is what makes this a like-for-like
    comparison rather than two numbers from different populations.
- id: atria_stroke_2013
  nomogram_check_result: agrees
  nomogram_check: 'CHECKED against Table 3 of PMC3698792 on 2026-08-14 and recorded as a
    structured result on 2026-08-18, the conclusion existed for four days only in a
    conversation, which is the same failure mode as an undocumented licence.

    Every cell agrees. Age without prior stroke 0/3/5/6 for <65, 65-74, 75-84, >=85; with
    prior stroke 8/7/7/9. Six one-point factors each score 1. The published ranges hold
    exactly: 0-12 without a prior stroke, 7-15 with one.

    WHAT THE CHECK FOUND was a defect in our TEST, not in the code. The test asserted
    atria_score(prior_stroke=True, age=50) == 7 with the comment "floor of the stroke
    range", and the code returned 8. The code was right: the age term is NON-MONOTONIC for
    stroke patients, under-65 scores 8 while 65-84 scores 7, so the floor of 7 sits in
    the middle bands, not at the youngest. A reading of Table 3 that assumes age rises
    monotonically puts that floor in the wrong place, and the test had made exactly that
    assumption. It now asserts age=70 and says why.

    Verified against the paper rather than against our own module docstring, which is
