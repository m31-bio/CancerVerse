    text, figure or code from the article is reproduced. The prospective validation numbers
    (10.1158/1078-0432.CCR-15-1346, PMC4896296) are two sentences of Results text, quoted exactly and cited,
    not reproduced at length.
  repro_tier: A
  open_source: none
  citation: Gynecol Oncol. 2010;116(1):44-49
  equation_source: >-
    doi:10.1016/j.ygyno.2009.09.006, read from PMC4470610 on 2026-08-14. Table 3 ("Multivariate Analysis of
    Prognostic Factors of Treatment Response") gives five adjusted odds ratios; the paper states outright
    that these are NOT used as weights ("the five risk factors identified conferred comparable weights and
    there were no interactions across them, a simple prognostic index was developed by combining the number
    of risk factors"), so the model is a count 0-5, banded low 0-1 / mid 2-3 / high 4-5. Table 4
    ("Validation of Prognostic Model") gives estimated/observed response rate and median PFS/OS for each band
    in both the development cohort (GOG 110+169+179, n=428) and the external validation cohort (GOG 149), a
    complete numeric statement over the entire three-cell output space. Prospective validation as a tertiary
    endpoint of GOG 240 (n=452) is in Tewari et al, Clin Cancer Res 2015;21(3):579-588, PMC4896296, Results
