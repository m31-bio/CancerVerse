  core_formula: "A(t₁,t₂) = Σₐ [h₁(a) / (h₁(a)+h₂(a))] · e^(−Λ(a)) · [1 − e^(−(h₁(a)+h₂(a)))]\n\n  h₁(a)\
    \  breast-cancer hazard  = RR(a) × race-specific baseline\n  h₂(a)  competing all-cause mortality\
    \ hazard\n  Λ(a)   cumulative hazard up to age a\n  a      runs year by year from t₁ to t₂"
