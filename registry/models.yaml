- id: msk_pancreatic
  disease: pancreatic
  axis: prognosis
  role: flagship
  status: implemented
  title: MSK pancreatic nomogram (disease-specific survival after resection)
  code: mayo_baseline.pancreatic.prognosis.msk_pancreatic
  license: open
  repro_tier: A
  citation: Brennan MF, Kattan MW, Klimstra D, Conlon K. Ann Surg. 2004;240(2)
  equation_source: Coefficients from the deployed calculator's published R source at https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PancreaticCancer1YrSurvivalAfterResectionforAdenocarcinoma,
    which riskcalc.org's own page cites to the publication above.
  upstream:
  - url: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PancreaticCancer1YrSurvivalAfterResectionforAdenocarcinoma
    note: deployed model source, coefficients in plain text
  canonical_impl:
    type: open_source
    url: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PancreaticCancer1YrSurvivalAfterResectionforAdenocarcinoma
    license: see repository terms
  our_code: mayo_baseline.pancreatic.prognosis.msk_pancreatic
  architecture_family: Survival (Cox)
  architecture: Cox proportional hazards with restricted cubic splines on positive-node count and tumour
    size, plus ten categorical and binary terms; three published horizons.
  core_formula: "S(t) = S₀(t)^exp(Xβ)\n\n  S₀ = 0.6775     at 12 months\n       0.3457804  at 24 months\n\
    \       0.1976732  at 36 months\n  Xβ   splines on positive-node count and tumour size, plus ten\n\
    \       categorical and binary terms; T stage is non-monotone"
  parity_status: checked
  parity_note: 'Route 1, CHECKED 2026-08-06 against the vendor''s own deployed R: the reference script
    copies the model expression VERBATIM from riskcalc.org''s server.R and runs it under R 4.6.1, so the
    comparison is against their arithmetic rather than our reading of it. 8 patients x 3 horizons = 24
    probabilities, covering all four T stages, all three differentiation levels, both resection locations
    and both ends of the age, node and size bounds; worst absolute difference 5.0e-11 percentage points.
    Two published oddities are pinned rather than corrected: T2 and T3 both score BETTER than the T1 reference,
    and splenectomy is the single largest term (+0.907). ALSO FOUND: the hosted tool labels its size field
    ''mm'' while validating 0.1-16 with knots at 2, 3.2 and 5.5 -- those are centimetres. NOTE this cell
    was recorded as having no published equation until 2026-08-06.'
  scope_note: 'After resection for adenocarcinoma of the pancreas. Validated ranges enforced: age 33-89,
    positive nodes 0-39, negative nodes 0-83, size 0.1-16 cm.'
  inputs:
  - age
  - male
  - portal_vein_resected
  - splenectomy
  - resection_margin_positive
  - location
  - differentiation
  - posterior_margin_positive
  - positive_nodes
  - negative_nodes
  - back_pain
  - t_stage
  - weight_loss
  - size_cm
  open_source: available
  evidence:
    test: tests/parity/test_msk_pancreatic_parity.py
    test_function: test_matches_the_vendor_r
    script: tests/parity/reference/msk_pancreatic_reference.R
    fixture: tests/parity/reference/msk_pancreatic_cases.json
  public_repo: https://github.com/ClevelandClinicQHS/riskcalc-website/tree/main/PancreaticCancer1YrSurvivalAfterResectionforAdenocarcinoma
  source_url: https://doi.org/10.1097/01.sla.0000133125.85489.07
  year: 2004
  development_cohort: Memorial Sloan Kettering pancreatic resection series
  entrypoint: msk_pancreatic_predict
  equation_location:
    numbered: null
    where: NOT IN THE PAPER as a closed form. Coefficients from ClevelandClinicQHS/riskcalc-website/tree/main/PancreaticCancer1YrSurvivalAfterResectionforAdenocarcinoma.
    verified: vendor R source; parity-verified 2026-08-06
