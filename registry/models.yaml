- id: dutasteride
  disease: prostate
  axis: response
  role: flagship
  status: implemented
  discrimination: 'Concordance index by outcome, placebo/dutasteride: high-grade PCa 0.69/0.71, BPH
    symptoms 0.70/0.60, acute urinary retention 0.66/0.62, any PCa 0.62/0.61, erectile dysfunction
    0.59/0.60, UTI 0.55/0.51, HGPIN 0.53/0.47, gynecomastia 0.52/0.52, ASAP 0.48/0.53. Four of the
    nine are at or below chance in at least one arm and the paper says so'
  discrimination_source: 'Frontiers in Oncology 2012;2:138, Table 4 "Nomogram concordance indices",
    read 2026-08-14. Reported per outcome and per arm, 18 figures, not one, which is why this field
    lists them rather than quoting a single headline number.

    The authors state the weakness themselves, verbatim: "Several of the nomograms (e.g., those for
    UTI, gynecomastia, HGPIN, ASAP) demonstrate poor discrimination and are based on those models that
    contained a large proportion of non-predictive variables." Two figures are BELOW 0.5. HGPIN under
    dutasteride at 0.472 and ASAP under placebo at 0.485, which is worse than a coin toss, and both
    are recorded here rather than dropped.

    Read this before using the harm outcomes. The two endpoints this model is worth having for,
    high-grade prostate cancer (0.69/0.71) and BPH symptoms (0.70 placebo), discriminate reasonably.
    The harms it also reports, which are the reason a chemoprevention tool is more honest than a
    benefit-only one, are the ones that discriminate worst.'
  title: Dutasteride chemoprevention (9 outcomes x 2 arms, benefit and harm)
  code: cancerverse_baseline.prostate.response.dutasteride
  entrypoint: dutasteride_predict
  license: noncommercial_source
  license_url: https://polyformproject.org/licenses/noncommercial/1.0.0
  license_basis: >-
    There is no published closed form at all. Every coefficient, 17 Cox
    sub-models, 315 constants, was machine-extracted from the deployed
    calculator's R source at ClevelandClinicQHS/riskcalc-website, which is
    PolyForm Noncommercial 1.0.0. This is the most exposed of the six: the
    vendor's source is not one route to the numbers, it is the only one.
    Two independent bases cover that use, and they are not the same argument.
    First, fitted coefficients are facts rather than expression, the Feist
    reasoning recorded for iota_adnex and amap, and facts are not the
    licence's to restrict. Second, and only since M31 confirmed the project's
    use is academic research only, PolyForm permits it in its own words: "Any
    noncommercial purpose is a permitted purpose." Note which clause that is.
    The entity-type safe harbor for charities, educational institutions and
    public research organizations does NOT obviously cover M31, and this
    determination does not rest on it. It rests on the purpose clause, so it
    lapses the day the project's purpose stops being academic research.
    this field was absent and `license` read `open`,
    which described the ARTICLE and said nothing about where the machine-
    readable coefficients actually came from. See
    docs/ACADEMIC_USE_LICENSE_REVIEW.md.
