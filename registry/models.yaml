    CELL CLOSED 2026-08-14 by `cibula_arrm`. The `blocker` and `tier_note` below are kept
    verbatim because they are still correct about the four papers they describe. Yoo 2012,
    Wang 2018, Zhang 2022 and the 2024 SEER Asian-population model all omit a numeric S0(t)
