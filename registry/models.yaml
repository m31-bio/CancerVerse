- id: bcsc_v2
  disease: breast
  axis: detection
  role: flagship
  status: implemented
  year: 2008
  title: BCSC breast density model (Tice 2008, the BCSC calculator's version 1.0, 5-year risk)
  flagship_note: >-
    Replaces `bcrat` here, 2026-08-17. BCRAT's two hardest inputs, age at menarche and age at first
    live birth, are among the fields the target platform does not hold, so it cannot run on that
    data at all. This model instead asks for BI-RADS breast density (a field a screening centre already
    records), plus family history and biopsy history, each optional. this said "yes/no/unknown", which reads as an accepted value and is not one, passing the string "unknown" raises KeyError. Unknown is expressed by OMITTING the argument, which leaves the patient at the reference group rather than scoring them as a "no" (1.311% against 1.114% for a 55-year-old at density 2). That distinction matters on real EHR data, where both fields are frequently absent. Its concordance (0.66,
    Table 4 of the paper) is also modestly higher than BCRAT's pooled AUC (~0.60).

    THE VERSION LABEL WAS WRONG AND IS CORRECTED HERE, 2026-08-17. This entry used to be titled
    'version 2.0' and cited the BCSC site's intro.htm as the authority for that. The page says the
    opposite. Fetched and read in full: "This is version 2.0 of the invasive breast cancer risk
    calculator" appears on a page that also says "In 2015, the BCSC risk calculator has been updated to
    include benign breast disease diagnoses and to estimate both five-year and ten-year breast cancer
    risk". So version 2.0 IS the 2015 update. What this module implements is Tice 2008, five-year risk
    only, with biopsy history as a bare yes/no, which is the calculator's version 1.0.

    Three independent checks agree, and each is cheap to redo. (1) The v2.0 software manifest on
    sourcecode.htm lists `bxresult_fmt.sas7bdat`, a biopsy-RESULT format table; this model has no
    biopsy-result axis at all. (2) v2.0 is described everywhere as five- AND ten-year; this model is
    five-year only. (3) The v3 lookup table's `biopsy_result` takes the six BBD levels (2 no prior
    biopsy, 3 benign unclassified, 4 non-proliferative, 5 proliferative without atypia, 6 proliferative
    with atypia, 7 LCIS) that v2 introduced, and none of them can be produced from this model's inputs.

    The registry id `bcsc_v2` is deliberately NOT renamed in the same edit: it is wired into
    `cancerverse_baseline.breast.detection.bcsc_v2`, its entrypoint, its test module and its parameter rows,
    and a rename is a separate change that should be made on purpose rather than as a side effect of a
    documentation fix. See `bcsc_v2_bbd_2015` for the real version 2.0, which is not implemented.
  version_note: >-
    BCSC calculator lineage, for anyone reading the three entries side by side. v1.0 = Tice 2008 (this
    entry, implemented). v2.0 = Tice 2015, adding benign breast disease and a ten-year horizon
    (`bcsc_v2_bbd_2015`, catalog). v3.0 = Gard 2024 (`bcsc`, catalog). Discrimination does NOT improve
    monotonically along that line, v3's AUC is 0.646 against this model's concordance of 0.66, so     "newest" is not the reason to prefer any of them.
  code: cancerverse_baseline.breast.detection.bcsc_v2
  our_code: cancerverse_baseline.breast.detection.bcsc_v2
  entrypoint: bcsc_v2_predict
  citation: Tice JA, Cummings SR, Smith-Bindman R, et al. Using Clinical Factors and Mammographic Breast
    Density to Estimate Breast Cancer Risk. Ann Intern Med. 2008;148(5):337-347
  source_url: https://doi.org/10.7326/0003-4819-148-5-200803040-00004
  license: open
  open_source: available
  public_repo: https://tools.bcsc-scc.ucdavis.edu/BC5yearRisk_V2/sourcecode.htm
  repro_tier: B
  discrimination: Concordance statistic 0.66 (95% CI 0.65-0.67) in the validation sample; age-adjusted
    c-statistic 0.622 (Table 4 / Results, the paper's own reported figures)
  equation_source: Every coefficient comes from the paper's own "Appendix Figure. The Breast Cancer
    Surveillance Consortium breast density model algorithm", a fully closed-form algorithm with no
    external source needed, unlike every other candidate considered for this cell.
  equation_location:
    numbered: false
    where: "Appendix Figure, \"The Breast Cancer Surveillance Consortium breast density model algorithm\"\
      \ (NIH Public Access manuscript pages 9-10): I(x,r) and D(x,r) polynomial/exponential tables, the\
      \ P(x,r) recursion, the density relative-hazard table, and the age/race density-adjustment table.\
      \ The family-history and biopsy-history multipliers are stated in prose in the paragraph beneath\
      \ that table, not in a numbered display."
    verified: 'read directly, 2026-08-17. RE-READ 2026-08-18 and
      every constant compared, see `nomogram_check`. The figure is an image, so it was
      rendered at 300 dpi and its four tables cropped at full resolution; the manuscript
      prints the whole figure twice, on pages 9 and 10, and both printings were read.'

  architecture_family: Competing-risk absolute-risk model
  architecture: Third-order polynomial baseline invasive-incidence and exponential non-breast-cancer
    mortality, both by race/ethnicity, combined by a year-by-year competing-risk recursion into a
    race-specific 5-year risk; that risk is then standardized to the BI-RADS-2 reference density using
    age- and race-specific adjustment factors, multiplied by the woman's own density category's relative
    hazard, and (if known) by simple family-history and breast-biopsy multipliers.
  core_formula: "I(x,r) = a_r·x³+b_r·x²+c_r·x+d_r   (annual incidence, % )\n  D(x,r) = n_r·e^(m_r·x)  \
    \    (annual non-BC mortality, % )\n  P(x,r): P(a,r)=1; P(x,r) = P(x-1,r) − I(x-1,r) − D(x-1,r)\n\
    \  AR_r = Σ_{x=a}^{a+4} I(x,r)·P(x,r)              (race-specific 5y risk)\n\n  risk = AR_r × adjustment[r,age_band]\
    \ × density_RH[age<65][density]\n         × family_history_mult (if known) × biopsy_mult (if known)"
  parity_status: not_checked
  parity_blocker: no_independent_reference_implementation
  parity_note: 'There is no independent reference implementation to check this against, the BCSC''s
    own SAS macro that deploys this exact algorithm is behind the same password-gated request as the
    2015/2024 updates (see `blocker` below). What IS checked: every coefficient was transcribed
    character-for-character from the paper''s own Appendix Figure (2026-08-17) and the resulting
    predictions were compared against the paper''s own Table 5 worked examples across 28 age/density
    combinations plus all 4 family-history x biopsy-history combinations at age 50-54/density 2. Table 5
    reports risk averaged over the study''s actual race mix (71% White), so a White-only calculation is
    expected to sit consistently a little BELOW it, not match exactly, which is exactly the pattern
    found (ratios 0.75-1.02 across all 28 cells), rather than the inconsistent or wildly-wrong ratios a
    formula error would produce. See tests/test_breast_detection_bcsc_v2.py for the full comparison.'
  nomogram_check: 'CHECKED 2026-08-18 against the Appendix Figure, all 57 constants, plus the model
    shape. This check is weaker than iota_adnex''s in one way and stronger than the three MSK nomograms''
    in another. Weaker: the Appendix Figure is an IMAGE. None of its numbers appear in the PDF text
    layer, so it cannot be diffed as text the way ADNEX''s Appendix D was; it has to be read by eye.
    Stronger: it is a verbatim transcription check, not a measurement, so unlike the gastric, ovarian and
    pancreatic nomograms there is no ruler, no scale to derive, and no measurement error, only reading
    error. The control for reading error is the manuscript itself: the NIH Public Access version prints
    the entire Appendix Figure TWICE, on pages 9 and 10, and both printings were read and agree. Method:
    300-dpi render, each of the four tables cropped at full resolution and 2x-upscaled before being read.
    Compared: 16 incidence-polynomial coefficients (4 races x a,b,c,d), 8 mortality-exponential
    coefficients, 8 density relative hazards (BI-RADS 1-4 x under/over 65), 20 age-and-race adjustment
    factors, the 2 family-history and 2 biopsy-history multipliers that are stated in the closing prose
    rather than in a table, and the age-65 density cut-off. Every one agrees to the last printed digit.
    The comparison script was negative-tested by altering one digit of D(white).n and confirming it
    failed. The model SHAPE was checked against the same figure''s prose too: the P(x,r) recursion, the
    sum of I(x,r)*P(x,r) over five years, and the order in which the adjustment factor, density relative
    hazard and the two optional multipliers are applied.

    This does NOT close `parity_blocker`, and the distinction matters: what is now established is that we
    transcribed the published algorithm correctly, not that anyone else''s code produces our numbers. The
    BCSC''s own SAS deployment of this same algorithm is still password-gated.'
  nomogram_check_result: agrees
  evidence:
    test: tests/test_breast_detection_bcsc_v2.py
  blocker: 'The 2015 update (Tice et al., J Clin Oncol 2015;33(28):3137-3143) refines this exact model
    by replacing the binary "ever had a biopsy" input with a full benign-breast-disease classification
    and adds a 10-year horizon. That refinement''s own standardized hazard-ratio table is not printed in
    its paper, only in a SAS macro behind a password-gated request, submitted to the consortium
    2026-08-07, awaiting reply. See `future_enhancement` and
    cancerverse_baseline.breast.detection.bcsc_v2_bbd_extension_coefficients for what is already transcribed
    (three of the four needed tables) and what specifically is still missing.'
  future_enhancement: bcsc_v2_bbd_extension_coefficients holds Appendix Tables A3/A4/A5 from the 2015
    paper (baseline invasive-incidence and DCIS polynomials, mortality exponential fit), read 2026-08-14.
    The remaining gap is the standardized hazard ratio HR(age, race, density, family history, benign
    breast disease); once the SAS macro or an equivalent printed source arrives, this flagship should be
    upgraded in place rather than added as a new id, since it is the same model with a finer risk-factor
    input.
  discrimination_source: 'Ann Intern Med. 2008;148(5):337-347, Results section and Table 4, read directly 2026-08-17.'
  candidate_for: bcrat
  tier_note: 'Needs only age, race/ethnicity, family history, breast biopsy history and BI-RADS density,
    no age at menarche or age at first live birth, so it fits the platform''s data far better than
    BCRAT. Excludes American Indian/Alaskan Native (the paper''s own exclusion, for inconsistent SEER
    rates in that group) and is developed/validated only for ages 35-79 and a 5-year horizon.'
  paper_title: 'Using Clinical Factors and Mammographic Breast Density to Estimate Breast Cancer Risk:
    Development and Validation of a New Predictive Model'
  citation_apa: 'Tice, J. A., Cummings, S. R., Smith-Bindman, R., Ichikawa, L., Barlow, W. E., &
    Kerlikowske, K. (2008). Using Clinical Factors and Mammographic Breast Density to Estimate Breast
    Cancer Risk: Development and Validation of a New Predictive Model. Annals of Internal Medicine,
    148(5), 337-347. https://doi.org/10.7326/0003-4819-148-5-200803040-00004'
  inputs:
  - start_age
  - race
