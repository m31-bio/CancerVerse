# Parameter-level audit, one entry per predictor, per model.
#
# WHY THIS IS A SEPARATE FILE FROM models.yaml
# --------------------------------------------
# models.yaml answers "what is this model". This answers "what is each input
# doing inside it". Folding ~250 parameter rows into models.yaml would double
# that file for readers who only ever want the model-level view. The join key
# is the model id, and tests/test_parameters.py enforces that every implemented
# model appears here and that no parameter names an input the code rejects.
#
# WHAT EACH FIELD MEANS
# ---------------------
#   name              our keyword argument, so a row can be tied to running code
#   label             how the paper prints it
#   coefficient       the fitted number AS PUBLISHED. null where the model is a
#                     point score (points live in `points`) or where the term is
#                     a lookup rather than a slope.
#   units             the units the coefficient assumes. Getting this wrong is
#                     the single most common way to misuse one of these models.
#   transform         the arithmetic applied to the raw input BEFORE it meets
#                     the coefficient, written so it can be checked against code
#   transform_kind    identity | centering | scaling | log | log2 | log10 |
#                     reciprocal | power | spline | banding | dichotomy |
#                     categorical | derived | interaction | none
#   reference_level   for categoricals: the level carrying no term
#   paper_effect      the effect size the PAPER prints (OR/HR/RR + CI), verbatim
#                     where possible. null where the paper prints none.
#   importance_rank   1 = the parameter that carries the model. See
#                     `importance_basis` on the model for how it was decided.
#   note              anything that will otherwise be misread. Sign flips,
#                     non-monotone effects, dead branches, unit traps.
#
# ON "MOST IMPORTANT"
# -------------------
# Three different things get called that, and they do not always agree:
#   (a) the largest coefficient          — scale-dependent, often meaningless
#   (b) the paper's own ranking          — citable, but not always published
#   (c) the measured swing over a real clinical range, computed by
#       scripts/feature_importance.py, joined at spreadsheet-build time
# `importance_rank` here follows (b) where the paper states one and (c)
# otherwise, and `importance_basis` records which. Where they disagree, the
# disagreement is recorded rather than resolved, msk_pancreatic is the clean
# example: splenectomy has the largest coefficient and is not the largest
# effect, because almost nobody has one.
#
# NOTE 2026-08-17: this file was rewritten programmatically when a model was added,
# and yaml.safe_dump does not preserve comments, the header above was lost and has
# been restored from git. Edit this file by hand, or re-attach this header afterwards.
parameters:
  erspc_rc3:
    axis: detection
    importance_basis: measured sweep; the paper ranks nothing explicitly
    top_parameter: psa
    top_parameter_why: 'PSA carries 63% of the total swing over clinical ranges, and it is the only input
      that moves over two orders of magnitude. The log2 transform is what makes that tractable: risk rises
      per DOUBLING of PSA, not per ng/mL, so 2->4 and 8->16 move the logit by the same 1.024.'
    paper_importance_quote: null
    equation: logit(p) = -1.826 + 1.024*(log2(PSA) - 2.0) - 1.500*(log2(volume_class) - 5.4) + 0.992*DRE
    params:
    - name: (intercept)
      label: Intercept
      coefficient: -1.826
      units: logit
      transform: '1'
      transform_kind: none
      importance_rank: null
      note: Sets the risk of a biopsy-naive man at the centering point. PSA 4 ng/mL (log2 = 2.0), volume
        class 40 mL (log2 = 5.32, near 5.4), negative DRE. That patient is at logit -1.826, i.e. about
        14%.
    - name: psa
      label: PSA
      coefficient: 1.024
      units: ng/mL
      transform: log2(PSA) - 2.0
      transform_kind: log2
      importance_rank: 1
      paper_effect: null
      note: Centered on log2(4) = 2.0, i.e. on PSA 4 ng/mL. The coefficient is per doubling. Recovered
        from SWOP's own Flash calculator to 2.2e-06.
    - name: volume_ml
      label: Prostate volume (DRE-assessed, in 3 classes)
      coefficient: -1.5
      units: mL
      transform: log2(volume_class) - 5.4, where volume_class = 25 if <30 mL, 40 if <50, else 60
      transform_kind: banding + log2
      importance_rank: 2
      paper_effect: null
      note: 'TWO transforms stacked, and the first is easy to miss. The raw volume is first collapsed
        into THREE CLASSES (25 / 40 / 60 mL) and only then logged. So the model cannot distinguish a 31
        mL prostate from a 49 mL one, both are class 40. Feeding continuous volume straight into log2
        is a real and silent error. Sign is negative: a bigger prostate means the same PSA is more likely
        benign (dilution).'
    - name: dre_positive
      label: Abnormal digital rectal examination
      coefficient: 0.992
      units: indicator
      transform: 1 if abnormal else 0
      transform_kind: dichotomy
      reference_level: normal DRE
      importance_rank: 3
      paper_effect: null
      note: Worth almost exactly one PSA doubling (0.992 vs 1.024).
  pbcg:
    axis: detection
    importance_basis: measured sweep; the paper reports discrimination, not a predictor ranking
    top_parameter: psa
    top_parameter_why: >-
      PSA carries 41% of total swing, age 25%. But the structural point matters
      more than the ranking: PBCG fits EIGHT coefficient sets, one per pattern
      of missing prior-biopsy / DRE / family-history data, so "how important is
      DRE" has eight different answers depending on what else is known.
    paper_importance_quote: null
    equation: |
      S_low  = beta_low . x        S_high = beta_high . x
      P(no cancer) = 1/(1 + e^S_low + e^S_high)
      x = [1, log2(PSA), age, african_ancestry, (prior_biopsy), (dre), (family_history)]
    coefficient_note: >-
      Coefficients below are the ALL-PREDICTORS-KNOWN set (True, True, True).
      Seven other sets exist; see src/cancerverse_baseline/prostate/detection/pbcg.py.
      Two coefficients are given per term because the outcome is multinomial:
      low grade (Gleason 6) and high grade (Gleason 7+), both against "no
      cancer" as the reference outcome.
    params:
      - name: (intercept)
        label: Intercept
        coefficient: -2.44052108
        coefficient_high_grade: -6.36851856
        units: logit
        transform: "1"
        transform_kind: none
        importance_rank: null
      - name: psa
        label: PSA
        coefficient: 0.13617244
        coefficient_high_grade: 0.79996510
        units: ng/mL
        transform: "log2(PSA)"
        transform_kind: log2
        importance_rank: 1
        paper_effect: null
        note: >-
          NOT centered, unlike ERSPC RC3, the intercept absorbs it. Note the
          near-6x gap between the low-grade (0.136) and high-grade (0.800)
          coefficients: PSA barely separates Gleason 6 from no cancer, but
          separates Gleason 7+ strongly. That asymmetry is the entire clinical
          argument for PBCG over a binary any-cancer model.
      - name: age
        label: Age
        coefficient: 0.01780617
        coefficient_high_grade: 0.05566536
        units: years
        transform: "age"
        transform_kind: identity
        importance_rank: 2
        note: >-
          Untransformed and uncentered. The coefficient looks tiny, but age
          spans ~40 years in practice, so it contributes 25% of measured swing.
          This is the standard trap in reading coefficient tables.
      - name: african_ancestry
        label: African ancestry
        coefficient: 0.78721039
        coefficient_high_grade: 0.61596975
        units: indicator
        transform: "1 if African ancestry else 0"
        transform_kind: dichotomy
        reference_level: non-African ancestry
        importance_rank: 6
        note: >-
          External validation found PBCG OVER-predicts in Black and other
          groups at most thresholds. The coefficient is published and
          reproduced; its calibration is contested. This is the reason ERSPC
          RC3 is kept alongside rather than retired.
      - name: prior_biopsy
        label: Prior negative biopsy
        coefficient: -0.83613721
        coefficient_high_grade: -1.27437249
        units: indicator
        transform: "1 if prior negative biopsy else 0; ABSENT from 4 of the 8 coefficient sets"
        transform_kind: dichotomy
        reference_level: biopsy-naive
        importance_rank: 4
        note: >-
          Strongly protective, and more so for high grade (-1.27) than low
          (-0.84), a previous negative biopsy is better evidence against
          aggressive disease than against any disease. If not supplied, the
          model switches to a coefficient set fitted WITHOUT it rather than
          imputing a value.
      - name: dre_abnormal
        label: Abnormal DRE
        coefficient: 0.04612721
        coefficient_high_grade: 0.85780143
        units: indicator
        transform: "1 if abnormal else 0; ABSENT from 4 of the 8 coefficient sets"
        transform_kind: dichotomy
        reference_level: normal DRE
        importance_rank: 3
        note: >-
          The most extreme low/high split in the model: 0.046 for low grade
          (essentially nothing) against 0.858 for high grade. An abnormal DRE
          says almost nothing about whether Gleason 6 will be found and a great
          deal about whether Gleason 7+ will be.
      - name: family_history
        label: Family history of prostate cancer
        coefficient: 0.33233636
        coefficient_high_grade: 0.61003848
        units: indicator
        transform: "1 if positive else 0; ABSENT from 4 of the 8 coefficient sets"
        transform_kind: dichotomy
        reference_level: no family history
        importance_rank: 5

  pbcg_extended:
    axis: detection
    importance_basis: THE PAPER'S OWN TABLE 3 ODDS RATIOS, printed for the full (12-factor), standard
      (6-factor) and smallest (2-factor) models. Having three nested fits of the same data is unusually
      good evidence, and it shows two coefficients changing meaning between them, see african_ancestry.
    top_parameter: prostate_volume
    top_parameter_why: 'Prostate volume has the strongest effect in the full model by a wide margin —
      OR 0.25 (0.20, 0.32) per DOUBLING of volume, i.e. a doubled prostate quarters the odds of high-grade
      cancer. PSA is second at OR 2.38 per doubling. The two are the same mechanism seen from both sides:
      PSA density is what actually discriminates, and this model reconstructs it from its two logged components
      rather than dividing them. Volume is optional, though, and requires TRUS, so the model most people
      can actually run is the 6-factor standard one, where PSA leads.'
    paper_importance_quote: 'Ankerst 2022, on adding volume to the standard model: "adding just prostate
      volume to these six risk factors and evaluating on the validation set yielded a CIL of -10.1 (95%
      CI -11.2, -9.0), and an AUC of 75.6 ... Assessment of prostate volume, however, requires an invasive
      procedure that is not routinely performed in advance of the prostate biopsy."'
    equation: 'p(high grade) = 1 / (1 + e^(-XB))

      XB from ONE OF 1,024 fitted sub-models, selected by WHICH of the ten

      optional predictors were supplied. Nothing is imputed.

      PSA and prostate volume enter as log2.

      '
    coefficient_note: Coefficients shown are the FULL model, the single sub-model in which all twelve
      risk factors are present (fitted to 1,334 biopsies from 3 cohorts). 1,023 others exist. The smallest,
      age+PSA only, is fitted to all 12,703 biopsies from 10 cohorts and carries intercept -5.82232349197518,
      age 0.0529313031876652, psa 0.540530440277563. A coefficient here is therefore not one number but
      a family of 1,024, and the ones from the sparse sub-models rest on far more data.
    params:
    - name: (intercept)
      label: Intercept
      coefficient: 0.0973696550103029
      units: logit
      transform: '1'
      transform_kind: none
      importance_rank: null
      note: Positive in the full model and -5.82 in the age+PSA model. Intercepts are not comparable across
        sub-models; they absorb whatever the missing predictors were contributing.
    - name: prostate_volume
      label: Prostate volume
      coefficient: -1.370931984702
      units: mL
      transform: log2(prostate_volume). NOT banded, unlike ERSPC RC3
      transform_kind: log2
      importance_rank: 1
      paper_effect: OR 0.25 (0.20, 0.32) per log2 unit, p < 0.0001
      note: 'The strongest effect in the full model. Contrast ERSPC RC3, which collapses volume into three
        classes (25/40/60 mL) before logging, this model uses the continuous value, so it can distinguish
        prostates that RC3 cannot. Optional: omitting it selects a sub-model fitted without it rather
        than imputing.'
    - name: psa
      label: PSA
      coefficient: 0.868327204172581
      units: ng/mL
      transform: log2(PSA), uncentered
      transform_kind: log2
      importance_rank: 2
      paper_effect: OR 2.38 (1.98, 2.89) per doubling in the full model; 1.99 (1.86, 2.12) in the 6-factor
        standard model; 1.72 (1.64, 1.80) in the age+PSA model
      note: MANDATORY, along with age. Note the OR falls from 2.38 to 1.72 as other predictors are removed,
        with fewer covariates PSA absorbs less of the signal per doubling, not more. Coefficients are
        not portable between sub-models.
    - name: prior_biopsy
      label: Prior negative biopsy
      coefficient: -1.14525401103566
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: no prior negative biopsy
      importance_rank: 3
      paper_effect: OR 0.32 (0.22, 0.45) full model; 0.28 (0.24, 0.32) standard model
      note: Strongly protective and stable across sub-models, one of the few that is.
    - name: dre_abnormal
      label: Digital rectal examination
      coefficient: 0.665655402758357
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: normal DRE
      importance_rank: 4
      paper_effect: OR 1.95 (1.46, 2.60) full model; 2.57 (2.29, 2.88) standard model
    - name: famhist_1
      label: First-degree prostate cancer family history
      coefficient: 0.656168999001428
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: no first-degree history
      importance_rank: 5
      paper_effect: OR 1.93 (1.38, 2.69) full model; 1.94 (1.70, 2.22) standard model
      note: Remarkably stable between fits (1.93 vs 1.94) on very different sample sizes.
    - name: age
      label: Age
      coefficient: 0.0685626071025404
      units: years
      transform: age, untransformed and uncentered
      transform_kind: identity
      importance_rank: 6
      paper_effect: OR 1.07 (1.05, 1.09) full model; 1.05 (1.04, 1.06) standard; 1.05 (1.05, 1.06) smallest
      note: MANDATORY. Small per-year OR over a wide range, so it still contributes substantially.
    - name: race
      label: African ancestry
      coefficient: -0.380223435347789
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: not of African ancestry
      importance_rank: 7
      paper_effect: OR 0.68 (0.45, 1.03), p = 0.08 in the FULL model; OR 1.26 (1.11, 1.44), p = 0.0005
        in the standard 6-factor model
      note: THE SIGN FLIPS BETWEEN SUB-MODELS, and this is the most important single caveat in the table.
        In the full model African ancestry looks protective (OR 0.68, not significant, fitted on 1,334
        biopsies from 3 cohorts); in the standard model it is adverse and significant (OR 1.26 on 8,432
        biopsies from 9 cohorts). Which sub-model a user lands in is decided by which optional fields
        they happened to fill in. The 2018 predecessor was found on external validation to OVER-predict
        in Black and other groups; that has not been re-tested for this version here.
    - name: prior_psa
      label: Prior PSA screen
      coefficient: -0.344481486143253
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: no prior PSA screen
      importance_rank: 8
      paper_effect: OR 0.71 (0.38, 1.34), p = 0.3
    - name: famhist_2
      label: Second-degree prostate cancer family history
      coefficient: 0.263997135421439
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: no second-degree history
      importance_rank: 9
      paper_effect: OR 1.30 (0.86, 1.96), p = 0.2
      note: About a third the effect of first-degree history, as expected, but not statistically significant
        here.
    - name: famhist_bca
      label: First-degree breast cancer family history
      coefficient: 0.142564644665647
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: no first-degree breast cancer history
      importance_rank: 10
      paper_effect: OR 1.15 (0.77, 1.70), p = 0.5
      note: A BRCA-pathway proxy. Small and not significant in this fit, but retained in the model.
    - name: hispanic
      label: Hispanic ethnicity
      coefficient: 0.0799051521528611
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: not Hispanic
      importance_rank: 11
      paper_effect: OR 1.08 (0.78, 1.50), p = 0.6
    - name: ari_use
      label: 5-alpha-reductase-inhibitor use
      coefficient: -0.0446955684912442
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: no ARI use
      importance_rank: 12
      paper_effect: OR 0.96 (0.63, 1.44), p = 0.8
      note: Nearly inert here. Note this is NOT the same claim as the dutasteride chemoprevention model
        on the response axis, which estimates what happens if you START the drug; this asks only whether
        current users differ at biopsy.
    - name: (sub-model selection)
      label: Which of the ten optional predictors were supplied
      coefficient: null
      units: 1,024 patterns
      transform: the presence/absence pattern of the ten optional predictors selects one of 1,024 fitted
        sub-models
      transform_kind: derived
      importance_rank: null
      note: The design of the model, not a preprocessing detail. Ten optional predictors give 2^10 patterns
        and a model was fitted for every one, so a record missing prostate volume and prior PSA is scored
        by the model fitted on records missing exactly those two. Nothing is imputed and no missing-indicator
        term exists, contrast PREVENT, which does use missing indicators. The published function ends
        in round(), returning whole percentage points; we return the unrounded probability and expose
        rounded_like_reference() for parity.
  ukb_hnc:
    axis: detection
    importance_basis: measured sweep; the paper ranks nothing explicitly
    top_parameter: smoking_status
    top_parameter_why: Current smoking carries the largest single coefficient at ln(3.10) = 1.131402,
      and the measured sweep gives it 30% of the total swing over clinical ranges. Alcohol is second at
      22%, but only because its largest level is PREVIOUS drinking rather than current, see that row.
    paper_importance_quote: null
    equation: logit(p) = -9.54 + ln(1.04)*age + ln(0.96)*BMI + ln(1.81)*male + smoking + Townsend +
      alcohol + exercise + fruit/veg; p is 7-year risk of ICD-10 C00-C14 or C30-C31
    params:
    - name: (intercept)
      label: Model intercept
      coefficient: -9.54
      units: logit
      transform: '1'
      transform_kind: none
      importance_rank: null
      note: 'Printed in the CAPTION of Table III, not in a row, with 95% CI -11.2 to -7.88. That location
        is why earlier passes over this literature recorded head and neck detection as having no
        implementable model. Not interpretable on its own: age and BMI are uncentred, so this is the
        log-odds at age 0 and BMI 0.'
    - name: smoking_status
      label: Smoking status
      coefficient: null
      points: never 0 (ref) | previous 0.463734 | current 1.131402
      units: indicator
      transform: 3-level categorical, never as reference
      transform_kind: dichotomy
      importance_rank: 1
    - name: alcohol_status
      label: Alcohol status
      coefficient: null
      points: never 0 (ref) | previous 1.181727 | current 0.350657
      units: indicator
      transform: 3-level categorical, never as reference
      transform_kind: dichotomy
      importance_rank: 2
      note: NON-MONOTONIC, AND THE LARGEST LEVEL IS THE ONE THAT STOPPED. Previous drinkers carry OR 3.26
        (1.32-8.04); current drinkers 1.42 with a CI spanning 1 (0.62-3.21), i.e. not distinguishable
        from never. This is the sick-quitter pattern, people who stopped because they were already
        unwell, so the term does not run in the direction a clinician expects. Do not reorder it.
    - name: age
      label: Age at assessment
      coefficient: 0.03922071315328133
      units: years
      transform: continuous, per year, UNCENTRED
      transform_kind: none
      importance_rank: 3
      note: OR 1.04 per year, so about 1.48 per decade. The paper models it continuous deliberately, "to
        prevent biological implausibility and inefficient use of data".
    - name: townsend_quintile
      label: Townsend Deprivation Index quintile
      coefficient: null
      points: 'Q1 0 (ref) | Q2 0.262364 | Q3 0.131028 | Q4 0.593327 | Q5 0.506818'
      units: quintile
      transform: 5-level categorical, quintile 1 = LEAST deprived = reference
      transform_kind: banding
      importance_rank: 4
      note: 'Also non-monotonic, Q4 at 1.81 exceeds Q5 at 1.66. And it does not transfer, a UK
        area-level index with no US equivalent, the same problem recorded for PREVENT''s SDI decile.'
    - name: bmi
      label: Body mass index
      coefficient: -0.040821994520255166
      units: kg/m2
      transform: continuous, per unit, UNCENTRED
      transform_kind: none
      importance_rank: 5
      note: PROTECTIVE, OR 0.96 per unit. Higher BMI carried lower head and neck cancer risk in this
        cohort. That is the direction the paper reports; the negative sign is not an error to fix.
    - name: exercise_days
      label: Days per week of moderate exercise
      coefficient: null
      points: none 0 (ref) | 1-4 days -0.385662 | 5 or more days -0.415515
      units: days/week
      transform: 3-level banding on NHS guidance
      transform_kind: banding
      importance_rank: 6
      note: The two active levels are nearly identical (0.68 and 0.66), so the model says exercising at
        all matters and how much does not.
    - name: male
      label: Male sex
      coefficient: 0.5933268452777344
      units: indicator
      transform: 1 if male else 0, female as reference
      transform_kind: dichotomy
      importance_rank: 7
    - name: fruit_veg
      label: Fruit and vegetable portions per day
      coefficient: null
      points: under 5/day 0 (ref) | 5 or more -0.34249
      units: indicator
      transform: dichotomised at the NHS five-a-day threshold
      transform_kind: dichotomy
      importance_rank: 8
  capra:
    axis: prognosis
    importance_basis: point allocation (the model IS its point table) cross-checked against the measured
      sweep; both name PSA
    top_parameter: psa
    top_parameter_why: PSA can contribute 4 of the 10 available points, more than any other variable,
      and Gleason 3. Together they are 70% of the score. Age and T stage contribute 1 point each and
      are effectively tie-breakers.
    paper_importance_quote: null
    equation: CAPRA = psa_points + gleason_points + t_stage_points + [%cores >= 34] + [age >= 50], range
      0-10
    params:
    - name: psa
      label: PSA at diagnosis
      coefficient: null
      points: 0 if <=6; 1 if <=10; 2 if <=20; 3 if <=30; 4 if >30
      units: ng/mL
      transform: 5-level banding of raw PSA
      transform_kind: banding
      importance_rank: 1
      note: Bands are upper-inclusive and NOT equal width, 2.1-6 spans 4 ng/mL for its 0 points while
        >30 is unbounded for 4. The banding discards everything above 30, so PSA 31 and PSA 300 score
        identically.
    - name: gleason_primary
      label: Gleason primary pattern
      coefficient: null
      points: 3 if primary >= 4
      units: pattern 1-5
      transform: if primary >=4 -> 3 points; elif secondary >=4 -> 1 point; else 0
      transform_kind: categorical
      importance_rank: 2
      note: THERE IS NO 2-POINT LEVEL. The jump is 0 -> 1 -> 3, so a primary pattern 4 is worth three
        times a secondary pattern 4. Primary and secondary are not interchangeable and must not be summed
        into a Gleason total before scoring.
    - name: gleason_secondary
      label: Gleason secondary pattern
      coefficient: null
      points: 1 if secondary >= 4 and primary <= 3
      units: pattern 1-5
      transform: see gleason_primary, the two are scored jointly, not separately
      transform_kind: categorical
      importance_rank: 2
    - name: t_stage
      label: Clinical T stage
      coefficient: null
      points: 0 for T1/T2; 1 for T3a
      units: AJCC clinical T
      transform: dichotomy at T3a
      transform_kind: dichotomy
      reference_level: T1/T2
      importance_rank: 3
      note: CAPRA is a localized-disease score; T3b and above are out of scope and raise.
    - name: percent_positive_cores
      label: Percentage of positive biopsy cores
      coefficient: null
      points: 1 if >= 34%
      units: percent
      transform: dichotomy at 34%
      transform_kind: dichotomy
      importance_rank: 4
      note: A single threshold at an unusual number. 33% scores 0 and 34% scores 1; the continuous information
        is discarded.
    - name: age
      label: Age at diagnosis
      coefficient: null
      points: 1 if >= 50
      units: years
      transform: dichotomy at 50
      transform_kind: dichotomy
      importance_rank: 5
      note: Nearly every man in scope scores this point, so in practice it acts as a constant offset rather
        than a discriminator.
  dutasteride:
    axis: response
    importance_basis: structural, the quantity of interest is a DIFFERENCE between two arms, so no single
      covariate "carries" it
    top_parameter: (treatment arm)
    top_parameter_why: This is a response model, and the arm indicator is not a covariate inside one equation,
      it selects which of two fitted sub-models runs. The predictors below shift each arm's absolute
      risk; only the arm changes the answer to the question being asked (should this man take dutasteride).
    paper_importance_quote: null
    equation: risk = 1 - S0 ** exp(score), one Cox sub-model per (outcome, arm); 17 sub-models, 315 coefficients
    coefficient_note: 315 coefficients across 9 outcomes x 2 arms is past the point where a per-coefficient
      table is readable or safe to hand-copy. They are machine-extracted into tests/parity/reference/dutasteride_coefficients.json
      and parity-tested against the vendor R. The rows below document the PREDICTOR SET and its transforms,
      which is the part a reader needs.
    params:
    - name: (treatment arm)
      label: Dutasteride vs no dutasteride
      coefficient: null
      units: arm
      transform: selects the coefficient set; NOT a term inside one equation
      transform_kind: derived
      importance_rank: 1
      note: Two asymmetries reproduced from the source. ASAP has a dutasteride arm only, so no difference
        can be formed and it returns None rather than 0. HGPIN on dutasteride is a CONSTANT 3.838831%
        with no predictors at all, while its off-treatment arm is a full 28-term model.
    - name: age
      label: Age
      coefficient: null
      units: years
      transform: restricted cubic spline, knots differ per sub-model
      transform_kind: spline
      importance_rank: 2
    - name: psa
      label: PSA
      coefficient: null
      units: ng/mL
      transform: restricted cubic spline, knots differ per sub-model
      transform_kind: spline
      importance_rank: 3
    - name: prostate_volume_ml
      label: Prostate volume
      coefficient: null
      units: mL
      transform: restricted cubic spline
      transform_kind: spline
      importance_rank: 4
    - name: ipss_score
      label: International Prostate Symptom Score
      coefficient: null
      units: points 0-35
      transform: restricted cubic spline
      transform_kind: spline
      importance_rank: 5
      note: Drives the BPH-progression and acute-urinary-retention outcomes, not the cancer ones.
    - name: sexually_active
      label: Sexually active
      coefficient: null
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 6
      note: Enters the erectile-dysfunction harm model, a harm predictor, not a benefit one.
    - name: history_of_impotence
      label: History of impotence
      coefficient: null
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 7
    - name: (applicability bounds)
      label: Per-sub-model applicability bounds
      coefficient: null
      units: n/a
      transform: each sub-model returns None outside its own validated input range
      transform_kind: none
      importance_rank: null
      note: The bounds DIFFER per outcome, so one patient can be in scope for some outcomes and out of
        scope for others, the tool displays "Not Applicable" per row and this module reproduces that.
  prevent:
    axis: detection
    importance_basis: measured sweep over the base/10-year/total-CVD model
    top_parameter: age
    top_parameter_why: Age dominates, and it does so twice over, once through its own term and again
      through SEVEN interaction terms (age x non-HDL, x HDL, x SBP, x diabetes, x smoking, x BMI, x eGFR).
      Every other risk factor's slope is age-dependent, which is why the same cholesterol means something
      different at 40 and at 75.
    paper_importance_quote: null
    equation: logit(risk) = sum(beta_term * x_term) over up to 31 terms; 5 variants x 2 horizons x 5 outcomes
      x 2 sexes = 100 coefficient sets
    coefficient_note: Coefficients shown are the FEMALE / BASE / 10-YEAR / TOTAL-CVD set, one of 100.
      The transforms are shared by all 100 sets and are the part that generalises; see src/cancerverse_baseline/cvd/detection/prevent_coefficients.py
      for the rest.
    params:
    - name: age
      label: Age, per 10 years
      coefficient: 0.7939329
      units: years
      transform: (age - 55) / 10
      transform_kind: centering + scaling
      importance_rank: 1
      note: Centered at 55 and scaled per decade. Also appears in age^2 (30-year equations only) and in
        seven interaction terms.
    - name: (age squared)
      label: Age squared
      coefficient: 0.0
      units: decades^2
      transform: ((age - 55)/10)^2
      transform_kind: power
      importance_rank: null
      note: Zero in the 10-year equations; non-zero only at the 30-year horizon.
    - name: total_chol_mg_dl
      label: non-HDL-C, per 1 mmol/L
      coefficient: 0.0305239
      units: mg/dL in, mmol/L in the equation
      transform: 0.02586*(total_chol - hdl) - 3.5
      transform_kind: derived + unit conversion + centering
      importance_rank: 3
      note: THREE things happen before the coefficient applies. Total cholesterol and HDL are combined
        into non-HDL (a derived quantity, not an input), converted mg/dL -> mmol/L by 0.02586, then centered
        on 3.5 mmol/L. Passing total cholesterol straight in is a large silent error.
    - name: hdl_mg_dl
      label: HDL-C, per 0.3 mmol/L
      coefficient: -0.1606857
      units: mg/dL in, mmol/L in the equation
      transform: (0.02586*hdl - 1.3) / 0.3
      transform_kind: unit conversion + centering + scaling
      importance_rank: 5
      note: Enters BOTH here and inside non-HDL, with opposite signs.
    - name: sbp
      label: SBP, split at 110 mm Hg
      coefficient: -0.2394003
      coefficient_upper: 0.3600781
      units: mm Hg
      transform: sbp_min = (min(sbp,110) - 110)/20 ; sbp_max = (max(sbp,110) - 130)/20
      transform_kind: spline (linear, one knot at 110)
      importance_rank: 2
      note: A two-piece linear spline, not one slope. Below 110 the coefficient is NEGATIVE (-0.239) and
        above it POSITIVE (+0.360), low blood pressure is itself adverse, which a single linear term
        cannot express. Both pieces are always computed; for sbp=130, sbp_min is at its floor.
    - name: diabetes
      label: Diabetes
      coefficient: 0.8667604
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
      note: Largest single main-effect coefficient in the base model, but attenuated with age by the age
        x diabetes term (-0.271).
    - name: smoker
      label: Current smoking
      coefficient: 0.5360739
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 6
    - name: bmi
      label: BMI, split at 30 kg/m2
      coefficient: 0.0
      coefficient_upper: 0.0
      units: kg/m2
      transform: bmi_min = (min(bmi,30) - 25)/5 ; bmi_max = (max(bmi,30) - 30)/5
      transform_kind: spline (linear, one knot at 30)
      importance_rank: null
      note: EXACTLY ZERO for total CVD, ASCVD, CHD and stroke, 40 of the 50 coefficient sets per sex.
        BMI only moves the HEART FAILURE outcome. A caller who supplies BMI expecting their CVD risk to
        change gets no change, and that is correct. Pinned by test_bmi_only_affects_the_heart_failure_outcome.
    - name: egfr
      label: eGFR, split at 60 mL/min/1.73m2
      coefficient: 0.6045917
      coefficient_upper: 0.0433769
      units: mL/min/1.73m2
      transform: egfr_min = (min(egfr,60) - 60)/-15 ; egfr_max = (max(egfr,60) - 90)/-15
      transform_kind: spline (linear, one knot at 60) with NEGATIVE scaling
      importance_rank: 7
      note: Note the divisor is -15, so the scaled variable increases as kidney function FALLS. Below
        60 the slope is 14x the slope above it (0.605 vs 0.043), this is a chronic-kidney-disease term
        that is nearly inert in people with normal kidneys.
    - name: htn_meds
      label: Antihypertensive use
      coefficient: 0.3151672
      units: indicator
      transform: 1/0, plus an interaction htn_meds * sbp_max at -0.0663612
      transform_kind: dichotomy + interaction
      importance_rank: 8
      note: The interaction is negative, so treatment FLATTENS the blood-pressure slope. Being on treatment
        raises risk (unmeasured severity) while reducing how much each additional mm Hg costs.
    - name: statin
      label: Statin use
      coefficient: -0.1477655
      units: indicator
      transform: 1/0, plus an interaction statin * non_hdl at +0.1197879
      transform_kind: dichotomy + interaction
      importance_rank: 9
      note: 'Same structure as htn_meds, mirrored: lowers risk directly, steepens the non-HDL slope.'
    - name: uacr
      label: Urine albumin-to-creatinine ratio
      coefficient: null
      units: mg/g
      transform: ln(UACR). NOT centered
      transform_kind: log
      importance_rank: null
      note: Optional; supplying it switches to the `uacr` or `full` variant. Unlike every other continuous
        term in PREVENT this one is not centered. If absent, its slope term is 0 and a separate `acr_missing`
        indicator is set to 1, the published design, not an imputation.
    - name: hba1c
      label: HbA1c
      coefficient: null
      units: percent
      transform: (hba1c - 5.3), with SEPARATE slopes for diabetic and non-diabetic patients
      transform_kind: centering + stratified slope
      importance_rank: null
      note: Two mutually exclusive terms, hba1c_dm and hba1c_no_dm; whichever does not apply is 0. The
        same HbA1c means something different with and without a diabetes diagnosis.
    - name: sdi_decile
      label: Social Deprivation Index decile
      coefficient: null
      units: decile 1-10
      transform: 'two indicators: deciles 4-6, and deciles 7-10'
      transform_kind: categorical
      reference_level: deciles 1-3
      importance_rank: null
      note: A 10-level ordinal collapsed to 3 groups. Deciles 1-3 carry no term.
  score2:
    axis: detection
    importance_basis: measured sweep; the paper reports C-indices, not a predictor ranking
    top_parameter: age
    top_parameter_why: Age has the largest coefficient (0.3742 male / 0.4648 female) AND interacts with
      all five other predictors, every interaction being negative. So every risk factor's effect SHRINKS
      with age, a 20-a-day habit costs a 45-year-old far more relative risk than a 65-year-old.
    paper_importance_quote: null
    equation: 'lp = sum(beta_i * x_i) + sum(beta_ij * age_c * x_j)

      uncalibrated = 1 - S0 ** exp(lp)

      calibrated  = 1 - exp(-exp(scale1 + scale2 * ln(-ln(1 - uncalibrated))))

      '
    coefficient_note: Coefficients shown are MALE; the female set is in src/cancerverse_baseline/cvd/detection/coefficients.py.
    params:
    - name: age
      label: Age
      coefficient: 0.3742
      units: years
      transform: (age - 60) / 5
      transform_kind: centering + scaling
      importance_rank: 1
      note: Centered at 60, scaled per 5 years. Appears in 5 further interaction terms.
    - name: smoker
      label: Current smoking
      coefficient: 0.6012
      units: indicator
      transform: 1/0; plus smoking x age at -0.0755
      transform_kind: dichotomy + interaction
      importance_rank: 2
      note: Largest main effect among the binary predictors. The negative interaction means the log-HR
        falls by 0.0755 per 5 years of age.
    - name: sbp
      label: Systolic blood pressure
      coefficient: 0.2777
      units: mm Hg
      transform: (sbp - 120) / 20; plus sbp x age at -0.0255
      transform_kind: centering + scaling + interaction
      importance_rank: 3
    - name: total_chol_mmol
      label: Total cholesterol
      coefficient: 0.1458
      units: mmol/L
      transform: total_chol - 6.0 (centered, NOT scaled); plus tchol x age at -0.0281
      transform_kind: centering + interaction
      importance_rank: 5
      note: The only continuous predictor here that is centered but not scaled. Units are mmol/L, not
        mg/dL, divide mg/dL by 38.67.
    - name: hdl_mmol
      label: HDL cholesterol
      coefficient: -0.2698
      units: mmol/L
      transform: (hdl - 1.3) / 0.5; plus hdl x age at +0.0426
      transform_kind: centering + scaling + interaction
      importance_rank: 4
      note: 'The only POSITIVE age interaction: HDL''s protective effect weakens with age.'
    - name: diabetes
      label: Diabetes
      coefficient: 0.6457
      units: indicator
      transform: 1/0; plus diabetes x age at -0.0983
      transform_kind: dichotomy + interaction
      importance_rank: null
      note: 'Present in the equation but OUT OF SCOPE: SCORE2 is defined for people without diabetes (SCORE2-Diabetes
        is a separate model). The term is implemented and defaults to 0.'
    - name: region
      label: Risk region
      coefficient: null
      units: low / moderate / high / very_high
      transform: 1 - exp(-exp(scale1 + scale2 * ln(-ln(1 - uncalibrated_risk))))
      transform_kind: derived (post-hoc recalibration)
      reference_level: none, every region has its own pair
      importance_rank: 6
      note: NOT a term in the linear predictor. It is a complementary log-log recalibration applied to
        the finished probability, with a (scale1, scale2) pair per sex per region. The same linear predictor
        gives materially different risks in Belgium and in Bulgaria, and this is the only place that difference
        lives.
  cvd_statin_benefit:
    axis: response
    importance_basis: structural, this is a composition of a published trial effect with a baseline risk,
      so "importance" is about which of the two inputs the answer is sensitive to
    top_parameter: baseline_risk
    top_parameter_why: Absolute benefit is baseline risk multiplied by a fixed proportional effect, so
      it scales LINEARLY with baseline risk and only logarithmically with the LDL reduction. Doubling
      baseline risk doubles the benefit; doubling the LDL reduction does not. This is the whole argument
      for treating on absolute risk rather than on cholesterol level.
    paper_importance_quote: 'CTT 2010, verbatim from the abstract: "similar proportional reductions in
      major vascular events per 1.0 mmol/L LDL cholesterol reduction ... in all types of patient studied",
      the sentence that licenses multiplying a trial effect onto an individual''s baseline risk.'
    equation: ARR(t) = baseline_risk(t) * (1 - RR ** delta_ldl_mmol);  NNT = 1/ARR
    params:
    - name: baseline_risk
      label: Untreated absolute risk
      coefficient: null
      units: probability 0-1
      transform: supplied by the caller, not computed here
      transform_kind: none
      importance_rank: 1
      note: Deliberately NOT computed internally, so the choice of risk model, its horizon and its scope
        stay visible in the result. Take it from predict("prevent", ...) or predict("score2", ...).
    - name: ldl_reduction_mmol_l
      label: LDL-C reduction achieved
      coefficient: null
      units: mmol/L
      transform: mg/dL / 38.67 if supplied in US units; then used as an EXPONENT on the rate ratio
      transform_kind: unit conversion + power
      importance_rank: 2
      note: 'Enters as an exponent, not a multiplier: RR^delta. So 2 mmol/L of lowering gives 0.78^2 =
        0.61, not 0.56. Treating the effect as linear in LDL overstates the benefit of large reductions.'
    - name: (rate ratio)
      label: CTT rate ratio per 1.0 mmol/L
      coefficient: 0.78
      units: rate ratio
      transform: fixed constant; 0.78 (0.76-0.80) for major vascular events, 0.90 (0.87-0.93) for all-cause
        mortality
      transform_kind: none
      importance_rank: 3
      paper_effect: RR 0.78 (95% CI 0.76-0.80) per 1.0 mmol/L LDL reduction, major vascular events
      note: The published CI propagates into arr_ci, but it covers the TRIAL EFFECT ONLY. Uncertainty
        in the baseline risk estimate is usually the larger source and is not represented.
  grace:
    axis: prognosis
    importance_basis: the paper's own odds ratios, which it prints for all 8 predictors, plus the points
      allocation those ORs were converted into
    top_parameter: cardiac_arrest_at_admission
    top_parameter_why: 'Cardiac arrest at presentation has the largest odds ratio in the paper (OR 4.3)
      and, per event, the second-largest point award (39). But note the split between "largest effect"
      and "largest contribution": age scores up to 100 points because it ranges over 60 years, while cardiac
      arrest is 39 points or nothing and is rare. Over a real ACS population age moves the score most;
      for the individual patient who arrested, nothing else comes close.'
    paper_importance_quote: 'Granger 2003 abstract, verbatim: "The following 8 independent risk factors
      accounted for 89.9% of the prognostic information: age (odds ratio [OR], 1.7 per 10 years), Killip
      class (OR, 2.0 per class), systolic blood pressure (OR, 1.4 per 20-mm Hg decrease), ST-segment deviation
      (OR, 2.4), cardiac arrest during presentation (OR, 4.3), serum creatinine level (OR, 1.2 per 1-mg/dL
      [88.4-micro mol/L] increase), positive initial cardiac enzyme findings (OR, 1.6), and heart rate
      (OR, 1.3 per 30-beat/min increase)."'
    equation: score = sum of 8 banded point awards; risk = interpolated lookup of the published points
      -> in-hospital mortality table
    params:
    - name: age
      label: Age
      coefficient: null
      points: '<=30: 0; 30-39: 8; 40-49: 25; 50-59: 41; 60-69: 58; 70-79: 75; 80-89: 91; >=90: 100'
      units: years
      transform: 8-level banding, bands upper-inclusive at the NEXT band's printed lower label
      transform_kind: banding
      importance_rank: 4
      paper_effect: OR 1.7 per 10 years
      note: The widest point range in the model (0-100). Band edges are ambiguous as printed and are resolved
        by the paper's own worked examples, see the systolic-BP note.
    - name: killip_class
      label: Killip class
      coefficient: null
      points: 'I: 0; II: 20; III: 39; IV: 59'
      units: class I-IV
      transform: direct lookup
      transform_kind: categorical
      reference_level: Killip class I
      importance_rank: 3
      paper_effect: OR 2.0 per class
      note: Steps are roughly even (20, 19, 20), consistent with a constant OR per class.
    - name: sbp
      label: Systolic blood pressure
      coefficient: null
      points: '<=80: 58; 80-99: 53; 100-119: 43; 120-139: 34; 140-159: 24; 160-199: 10; >=200: 0'
      units: mm Hg
      transform: 7-level banding, REVERSED, low pressure scores highest
      transform_kind: banding
      importance_rank: 6
      paper_effect: OR 1.4 per 20-mm Hg DECREASE
      note: 'THE SCALE RUNS BACKWARD. <=80 mm Hg scores 58 and >=200 scores 0, because this term encodes
        cardiogenic shock, not hypertension. Separately, the printed bands are ambiguous at their edges:
        taken literally SBP 100 would fall in "100-119" and score 43, but the paper''s own worked example
        scores it 53. Each printed band''s true upper edge is the NEXT band''s printed lower label, inclusive.
        Coded literally the model is wrong at 100 mm Hg, one of the commonest readings there is.'
    - name: heart_rate
      label: Heart rate
      coefficient: null
      points: '<=50: 0; 50-69: 3; 70-89: 9; 90-109: 15; 110-149: 24; 150-199: 38; >=200: 46'
      units: beats/min
      transform: 7-level banding, upper-inclusive as above
      transform_kind: banding
      importance_rank: 7
      paper_effect: OR 1.3 per 30-beat/min increase
    - name: creatinine_mg_dl
      label: Serum creatinine
      coefficient: null
      points: '0-0.39: 1; 0.40-0.79: 4; 0.80-1.19: 7; 1.20-1.59: 10; 1.60-1.99: 13; 2.00-3.99: 21; >4.0:
        28'
      units: mg/dL
      transform: 7-level banding, upper-inclusive as above
      transform_kind: banding
      importance_rank: 8
      paper_effect: OR 1.2 per 1 mg/dL increase
      note: mg/dL, not umol/L, multiply umol/L by 1/88.4. The worked example puts creatinine 0.40 in
        the 0-0.39 band.
    - name: cardiac_arrest_at_admission
      label: Cardiac arrest at presentation
      coefficient: null
      points: 39 if present
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 1
      paper_effect: OR 4.3
      note: Largest odds ratio in the model.
    - name: st_segment_deviation
      label: ST-segment deviation
      coefficient: null
      points: 28 if present
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 2
      paper_effect: OR 2.4
    - name: elevated_cardiac_enzymes
      label: Elevated initial cardiac enzymes
      coefficient: null
      points: 14 if present
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 5
      paper_effect: OR 1.6
  cha2ds2_vasc:
    axis: prognosis
    importance_basis: point allocation, the model is a point table and nothing else
    top_parameter: prior_stroke_tia_thromboembolism
    top_parameter_why: Prior stroke/TIA/thromboembolism and age >= 75 are the only 2-point items; everything
      else scores 1. The doubling is the model's entire statement about relative importance. Prior stroke
      is ranked first because it alone takes a patient straight to the anticoagulation threshold of 2.
    paper_importance_quote: null
    equation: score = C + H + A2 + D + S2 + V + A + Sc, range 0-9
    params:
    - name: prior_stroke_tia_thromboembolism
      label: Prior Stroke / TIA / thromboembolism (S2)
      coefficient: null
      points: 2
      units: indicator
      transform: 1/0, worth 2 points
      transform_kind: dichotomy
      importance_rank: 1
    - name: age
      label: Age (A2 and A)
      coefficient: null
      points: 2 if >=75; 1 if 65-74; else 0
      units: years
      transform: 3-level banding; the two age items are MUTUALLY EXCLUSIVE
      transform_kind: banding
      importance_rank: 2
      note: The acronym lists age twice (A2 for >=75, A for 65-74) and a reader can double-count it. Age
        contributes at most 2 points in total, never 3.
    - name: heart_failure
      label: Congestive heart failure / LV dysfunction (C)
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 3
    - name: hypertension
      label: Hypertension (H)
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 3
    - name: diabetes
      label: Diabetes mellitus (D)
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 3
    - name: vascular_disease
      label: Vascular disease. MI, PAD, aortic plaque (V)
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 3
    - name: female
      label: Sex category, female (Sc)
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
      note: A modifier, not an independent risk factor. A score of 1 arising from female sex ALONE is
        treated as low risk; sex counts only alongside at least one other factor. Implemented in risk_category(),
        not in the score.
    - name: (rate table)
      label: Annual stroke rate by score
      coefficient: null
      units: n/a
      transform: deliberately NOT implemented
      transform_kind: none
      importance_rank: null
      note: Published cohorts report materially different annual event rates for the same score, so no
        rate lookup is shipped. The model returns a guideline-level category instead. `risk` is None by
        design.
  atria_stroke_2013:
    axis: prognosis
    importance_basis: point allocation, the model is a point table, and the points were assigned proportional
      to the fitted Cox coefficients
    top_parameter: age
    top_parameter_why: Age dominates and does so twice over. Without a prior stroke it spans 0 to 6 of
      a 0-12 range, half the scale from one variable, while every comorbidity is worth 1. And it is
      the variable the prior-stroke interaction acts on, so age is also what decides how much a prior
      stroke is worth. Prior stroke is not ranked first only because it cannot be scored independently
      of age at all.
    paper_importance_quote: null
    equation: score = age_points(age, prior_stroke) + female + diabetes + CHF + hypertension + proteinuria
      + (eGFR<45 or ESRD); range 0-12 without prior stroke, 7-15 with one
    params:
    - name: age
      label: Age, scored from one of two columns
      coefficient: null
      points: 'no prior stroke: 0 (<65) / 3 (65-74) / 5 (75-84) / 6 (>=85). Prior stroke: 8 (<65) / 7
        (65-74) / 7 (75-84) / 9 (>=85)'
      units: years
      transform: 4-level banding, column selected by prior_stroke
      transform_kind: banding + interaction
      importance_rank: 1
      note: The prior-stroke column is NOT monotonic in age, under-65 (8) outscores 65-84 (7). A young
        patient who has already had a stroke is the strongest signal in the model, because a stroke at
        that age is less attributable to age itself. Any implementation that treats age as monotonic,
        or adds a flat prior-stroke constant to a single age term, gets this band wrong and still looks
        plausible.
    - name: prior_stroke
      label: Prior ischemic stroke
      coefficient: null
      points: not separable, selects the age column
      units: indicator
      transform: selects which age column applies
      transform_kind: interaction
      importance_rank: 2
      note: Has no standalone point value. This is the structural difference from CHA2DS2-VASc, where
        prior stroke is a flat 2 points independent of age. Here it is worth between 1 and 8 points depending
        on the patient's age band.
    - name: egfr_under_45_or_esrd
      label: eGFR < 45 mL/min/1.73m2 or end-stage renal disease
      coefficient: null
      points: 1
      units: indicator
      transform: threshold on a routine chemistry value
      transform_kind: dichotomy
      importance_rank: 3
      note: One of the two predictors CHA2DS2-VASc lacks, and part of why ATRIA discriminates better.
        Routine chemistry, not a send-out assay.
    - name: proteinuria
      label: Proteinuria
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 3
      note: The other predictor CHA2DS2-VASc lacks. A urinalysis flag.
    - name: female
      label: Female sex
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
      note: Scored as a flat point, unlike CHA2DS2-VASc where a lone female point is conventionally treated
        as low risk. No such carve-out exists in ATRIA's banding.
    - name: diabetes
      label: Diabetes mellitus
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
    - name: heart_failure
      label: Congestive heart failure
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
    - name: hypertension
      label: Hypertension
      coefficient: null
      points: 1
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
    - name: (rate table)
      label: Annual thromboembolic rate by score
      coefficient: null
      units: n/a
      transform: banded, not per-point
      transform_kind: none
      importance_rank: null
      note: Table 4 gives events, person-years and rate per 100 person-years for each score 0-15. Only
        the three-way band it defines is shipped (<=5 low, 6 moderate, >=7 high); the per-point rates
        are a finer claim than external validations have agreed on, so `risk` is None, matching the treatment
        of CHA2DS2-VASc above.
  bcrat:
    axis: detection
    importance_basis: measured sweep; Gail 1989 names the four factors but does not rank them
    top_parameter: n_relatives
    top_parameter_why: >-
      Among the risk-factor terms, first-degree relatives with breast cancer
      carries the largest coefficient (0.958 in the white model, per relative,
      up to 2). But the honest answer is ATTAINED AGE, which is not a
      coefficient at all, it selects the SEER incidence hazard, and that
      hazard varies 400-fold across the 14 age bands. The relative-risk model
      is a modest multiplier on top of a baseline that age almost entirely
      determines.
    paper_importance_quote: >-
      Gail 1989 abstract, verbatim: "The risk factors used were age at menarche,
      age at first live birth, number of previous biopsies, and number of
      first-degree relatives with breast cancer. ... The model allowed for the
      fact that relative risks associated with previous breast biopsies were
      smaller for women aged 50 or more than for younger women."
    equation: |
      LP  = NB*B1 + AM*B2 + AF*B3 + NR*B4 + AF*NR*B6 + ln(R_hyp)
      RR  = exp(LP)                    for attained age < 50
      RR  = exp(LP + NB*B5)            for attained age >= 50
      h1(a) = (1-AR) * RR(a) * lambda1(a)      h2(a) = lambda2(a)
      A(t1,t2) = sum_a [h1/(h1+h2)] * exp(-Lambda(a)) * [1 - exp(-(h1+h2))]
    coefficient_note: >-
      Coefficients shown are the WHITE model. Five other race/ethnicity strata
      exist and they DROP different variables, the black (CARE) model drops
      age at first birth entirely, the US-born Hispanic (SFBCS) model drops age
      at menarche. So a covariate's importance is stratum-dependent by
      construction.
    params:
      - name: n_relatives
        label: First-degree relatives with breast cancer (NR)
        coefficient: 0.9583027845
        units: count, categorised
        transform: "0 or unknown -> 0; 1 -> 1; 2+ -> 2. Pooled to max 1 in Asian and Hispanic strata."
        transform_kind: categorical
        importance_rank: 1
        note: >-
          Also carries the model's only interaction, AF x NR at -0.191, the
          effect of relatives is BLUNTED in women who gave birth late. Two
          risk factors that are individually adverse are less than additive.
      - name: n_biopsies
        label: Number of previous benign breast biopsies (NB)
        coefficient: 0.5292641686
        coefficient_age_50_plus: 0.2412216856
        units: count, categorised
        transform: "0 or unknown -> 0; 1 -> 1; 2+ -> 2. Pooled to max 1 in Hispanic strata."
        transform_kind: categorical
        importance_rank: 2
        note: >-
          THE ONLY AGE-VARYING TERM. At attained age >= 50 an extra
          -0.2880424830 is added per biopsy, so the effective coefficient falls
          from 0.529 to 0.241, biopsies matter less than half as much in older
          women. This is applied at ATTAINED age during the integration, not at
          the age of entry, so a single projection can use both values as the
          woman crosses 50.
      - name: age_first_birth
        label: Age at first live birth (AF)
        coefficient: 0.2186262218
        units: years, categorised
        transform: "<20 or unknown -> 0; 20-24 -> 1; 25-29 or NULLIPAROUS -> 2; >=30 -> 3"
        transform_kind: categorical
        importance_rank: 3
        note: >-
          NULLIPAROUS IS CODED AS 98 AND MAPS TO CATEGORY 2, i.e. a woman who
          has never given birth is scored the same as one whose first birth was
          at 25-29. Dropped entirely (coefficient 0) in the black/CARE stratum.
      - name: age_menarche
        label: Age at menarche (AM)
        coefficient: 0.0940103059
        units: years, categorised
        transform: ">=14 or unknown -> 0; 12-13 -> 1; <12 -> 2"
        transform_kind: categorical
        importance_rank: 4
        note: >-
          Smallest of the four. Categories <12 and 12-13 are POOLED in the
          black stratum, and the whole variable is dropped in the US-born
          Hispanic one.
      - name: atypical_hyperplasia
        label: Biopsy histology, atypical hyperplasia (R_hyp)
        coefficient: null
        units: multiplier
        transform: "relative-risk MULTIPLIER: no -> 0.93, yes -> 1.82, unknown -> 1.00. Enters as ln(R_hyp)."
        transform_kind: derived
        importance_rank: 5
        note: >-
          Not a beta, a multiplicative factor logged into the linear
          predictor. Forced to 1.0 (no effect) when n_biopsies is 0, since
          there is no histology without a biopsy.
      - name: start_age / end_age
        label: Attained age (risk projection interval)
        coefficient: null
        units: years
        transform: "selects the 5-year SEER hazard band via floor((age-20)/5); integration proceeds one year at a time"
        transform_kind: banding + integration
        importance_rank: null
        note: >-
          The largest driver of absolute risk and NOT a regression term at all.
          lambda1 (breast cancer incidence) rises from 0.00001 at 20-24 to
          0.00444 at 80-84 in the white stratum. This is why BCRAT is a
          competing-risk absolute-risk model rather than a regression.
      - name: race
        label: Race / ethnicity
        coefficient: null
        units: 6 strata
        transform: "selects BETA, ONE_MINUS_AR, LAMBDA1 and LAMBDA2 simultaneously, four tables at once"
        transform_kind: derived
        reference_level: none, every stratum has its own full parameter set
        importance_rank: null
        note: >-
          Not a covariate. It swaps the entire model, including which risk
          factors are present. This port collapses six Asian-American subgroups
          to one "asian" stratum using Chinese rates as a proxy.
      - name: (1 - attributable risk)
        label: Attributable-risk adjustment
        coefficient: 0.5788413
        units: multiplier
        transform: "scales lambda1 down so the baseline hazard is risk-factor-FREE"
        transform_kind: derived
        importance_rank: null
        note: >-
          SEER incidence already contains the population's average relative
          risk. Multiplying by (1-AR) removes it so RR is not double-counted.
          Omitting this step inflates every estimate by ~1.7x.

  bcsc_v2:
    axis: detection
    importance_basis: measured sweep of `bcsc_v2_predict` across each input's full range, holding the
      others fixed at age 55/white/density 2/no family history/no biopsy
    top_parameter: density
    top_parameter_why: 'Swinging BI-RADS density from category 1 to 4 moves the prediction 0.48x to 2.01x
      relative to the reference (a 4.2-fold range), the largest swing of any single input, and it is a
      NAMED, PUBLISHED coefficient (the paper''s own relative-hazard table), not a structural artifact.
      Biopsy history (0.906x/1.495x, 1.65-fold) and family history (0.938x/1.454x, 1.55-fold) are smaller.
      The honest caveat is the same shape as BCRAT''s: ATTAINED AGE drives the baseline shape more than any
      one factor, since the cubic incidence polynomial itself rises several-fold across the model''s 35-79
      age range before any risk factor is applied, but age is not a fitted coefficient in the way density
      is, it selects which point on the SEER-fitted curve applies.'
    paper_importance_quote: 'Tice et al. 2008, Results: "The strength of the association between breast
      density and breast cancer was greater for women younger than age 65 years (the relative hazard for
      extremely dense versus almost entirely fat breasts decreased from 4.2 to 2.2; P for interaction <
      .001)." Both figures reproduce from the tables here: RH[4]/RH[1] is 2.0119/0.48107 = 4.18 under 65
      and 1.4499/0.65706 = 2.21 at 65+, matching to rounding.'
    equation: 'I(x,r) = a_r*x^3 + b_r*x^2 + c_r*x + d_r        D(x,r) = n_r*exp(m_r*x)

      P(a,r) = 1;  P(x,r) = P(x-1,r) - I(x-1,r)/100 - D(x-1,r)/100     for x > a

      AR_r = sum_{x=a}^{a+4} [I(x,r)/100] * P(x,r)

      risk = AR_r * adjustment[r, age_band] * density_RH[age<65][density]
             * family_history_mult (if known) * biopsy_mult (if known)

      '
    coefficient_note: Coefficients shown are the WHITE stratum unless noted. Three other race/ethnicity
      strata (black, Asian, Hispanic) each carry their own full baseline-incidence and mortality
      polynomial; American Indian/Alaskan Native was excluded by the paper itself for inconsistent SEER
      rates, so there is no fifth stratum to fall back to.
    params:
    - name: density
      label: BI-RADS breast density category (1-4)
      coefficient: null
      units: relative hazard, 4 categories
      transform: 'relative hazard vs category 2 (reference): under 65 -> 0.48107 / 1.00 / 1.5506 / 2.0119;
        65+ -> 0.65706 / 1.00 / 1.3881 / 1.4499'
      transform_kind: categorical
      importance_rank: 1
      note: The only input with a DIFFERENT coefficient set before vs after age 65, the paper reports the
        density association is significantly stronger in younger women (P for interaction < .001), so the
        under-65 table is not simply extrapolated to older women.
    - name: biopsy_history
      label: History of a breast biopsy
      coefficient: null
      units: multiplier
      transform: 'never -> 0.906; >=1 biopsy -> 1.495. Unknown -> no multiplication (factor of 1), not an
        imputed average.'
      transform_kind: dichotomy
      importance_rank: 2
      note: Simple population-wide multiplier, unlike BCRAT's n_biopsies which is banded 0/1/2+ and
        age-varying. This model's biopsy input carries no histology detail (atypical hyperplasia, LCIS),
        that granularity is the 2015 update's contribution, not yet implemented (see `future_enhancement`
        on this model's registry entry).
    - name: family_history
      label: First-degree relative with breast cancer
      coefficient: null
      units: multiplier
      transform: 'no relatives -> 0.938; >=1 relative -> 1.454. Unknown -> no multiplication (factor of
        1), not an imputed average.'
      transform_kind: dichotomy
      importance_rank: 3
      note: Unlike BCRAT's n_relatives (banded 0/1/2+, with a family-history x parity interaction), this
        is a flat yes/no with no count or interaction term.
    - name: start_age
      label: Age at the start of the 5-year window
      coefficient: null
      units: years
      transform: selects a point on the cubic incidence polynomial and exponential mortality curve for
        each of 5 consecutive integer ages, and selects the age band for both the density-adjustment
        factor and the under-65/65+ density relative-hazard table
      transform_kind: fractional polynomial, banding
      importance_rank: null
      note: 'The largest driver of absolute risk and not a regression coefficient at all. I(x,white) rises
        from about 0.22% at 50 to 0.32% at 65 before any risk factor is applied. Also the one input with a
        hard discontinuity built in: BI-RADS 4''s relative hazard drops from 2.0119 to 1.4499 exactly at
        age 65, a real effect the paper reports rather than a smoothing artifact to remove.'
    - name: race
      label: Race / ethnicity
      coefficient: null
      units: 4 strata
      transform: selects BASELINE_INCIDENCE, MORTALITY and AGE_RACE_DENSITY_ADJUSTMENT simultaneously,
        three tables at once
      transform_kind: derived
      reference_level: none, every stratum has its own full parameter set
      importance_rank: null
      note: Not a covariate in the usual sense. It swaps the entire baseline model, and Asian women show
        both the lowest baseline incidence and the lowest density-adjustment factors of the four strata
        the paper reports.
  predict_breast:
    axis: prognosis
    importance_basis: structural, the paper reports validation statistics rather than ranking predictors;
      ranking below follows the prognostic index's construction
    top_parameter: nodes
    top_parameter_why: 'Nodal status and tumour size dominate the breast-cancer-specific prognostic index,
      and nodes edge it: the term is log((nodes+1)/10), so the first few positive nodes move the index
      far more than the tenth does. ER status is arguably more important still, but it is not a term,
      it selects between two DIFFERENT fractional-polynomial parameterisations of age and size.'
    paper_importance_quote: null
    equation: 'pi = age_term + size_term + nodes_term + grade + screen + HER2 + KI67 [+ treatment log-HRs]

      mi = 0.0698252 * (age - 34.23391957)                    # other-cause mortality

      competing-risk integration year by year to 15 years

      '
    coefficient_note: Coefficients shown are the ER-POSITIVE set; the ER-negative set uses different transforms,
      not merely different numbers.
    params:
    - name: nodes
      label: Number of positive lymph nodes
      coefficient: 0.7060723
      units: count
      transform: log((nodes + 1)/10) + 1.387566896
      transform_kind: log + centering
      importance_rank: 1
      note: The +1 inside the log is what lets node-negative disease (0 nodes) be scored at all. Because
        it is logarithmic, going 0 -> 1 node adds 0.49 to the index while 9 -> 10 adds 0.07.
    - name: size_mm
      label: Tumour size
      coefficient: 0.7530729
      coefficient_er_negative: 2.093446
      units: mm
      transform: 'ER+: log(size/100) + 1.545233938;  ER-: (size/100)^0.5 - 0.5090456276'
      transform_kind: log (ER+) / power (ER-)
      importance_rank: 2
      note: DIFFERENT FUNCTIONAL FORMS BY ER STATUS, log for ER-positive, square root for ER-negative.
        Not a different coefficient on the same transform. Size is in MILLIMETRES and divided by 100 first.
    - name: age
      label: Age at diagnosis
      coefficient: 34.53642
      coefficient_2: -34.20342
      units: years
      transform: 'ER+: two fractional polynomials, (age/10)^-2 - 0.0287449295 and (age/10)^-2 * ln(age/10)
        - 0.0510121013.  ER-: linear, (age - 56.3254902) with beta 0.0089827'
      transform_kind: fractional polynomial (ER+) / centering (ER-)
      importance_rank: 3
      note: The two ER-positive coefficients are enormous (+34.5 and -34.2) and nearly cancel, that is
        normal for fractional polynomials and means nothing about importance. Reading either one alone
        is meaningless. Age also drives the SEPARATE other-cause mortality index mi, at 0.0698252 per
        year centered on 34.23.
    - name: grade
      label: Histological grade
      coefficient: 0.746655
      coefficient_er_negative: 1.129091
      units: grade 1-3
      transform: 'ER+: entered as the number 1/2/3.  ER-: COLLAPSED TO BINARY, 1 if grade 2 or 3 else
        0.  Unknown -> 2.13'
      transform_kind: identity (ER+) / dichotomy (ER-)
      importance_rank: 4
      note: Unknown grade is imputed as 2.13, a non-integer, which is the reference implementation's own
        device for the cohort mean.
    - name: er_positive
      label: Oestrogen receptor status
      coefficient: null
      units: indicator
      transform: selects the entire ER_POS or ER_NEG parameter block
      transform_kind: derived
      importance_rank: null
      note: Not a term. It switches age, size and grade to different functional forms and turns Ki67 on
        or off.
    - name: her2
      label: HER2 status
      coefficient: 0.2413
      units: 1 positive / 0 negative / 9 unknown
      transform: 'lookup: positive +0.2413, negative -0.0762, unknown 0.0'
      transform_kind: categorical
      reference_level: unknown (coded 9, contributes 0)
      importance_rank: 5
      note: The reference level is UNKNOWN, not negative. So both known values move the index, in opposite
        directions, away from an unknown patient.
    - name: ki67
      label: Ki67 status
      coefficient: 0.14904
      units: 1 positive / 0 negative / 9 unknown
      transform: 'lookup: positive +0.14904, negative -0.11333, unknown 0.0. APPLIED ONLY IF ER-POSITIVE.'
      transform_kind: categorical
      reference_level: unknown
      importance_rank: 6
      note: Silently ignored for ER-negative disease, the term is multiplied out, not merely small.
    - name: screen_detected
      label: Screen-detected
      coefficient: -0.22763366
      coefficient_er_negative: 0.0
      units: indicator
      transform: 1 if screen-detected, 0 if symptomatic, 0.204 if UNKNOWN
      transform_kind: dichotomy with fractional imputation
      importance_rank: 7
      note: Unknown is imputed as 0.204, i.e. a fractional indicator, the cohort proportion. EXACTLY
        ZERO in the ER-negative model.
    - name: (baseline hazards)
      label: Two cumulative baseline hazards
      coefficient: null
      units: n/a
      transform: closed-form functions of time in years, one per cause; all-cause mortality is apportioned
        between causes in proportion to annual hazards
      transform_kind: derived
      importance_rank: null
  predict_breast_response:
    axis: response
    importance_basis: structural, benefit is the DIFFERENCE between two survival curves, so the treatment
      terms are the model
    top_parameter: chemo_generation
    top_parameter_why: Third-generation chemotherapy carries the largest single treatment log-hazard-ratio
      (-0.446, HR 0.64) and is the decision PREDICT is most used to inform. Hormone therapy is close behind
      and is unique in being TIME-VARYING, which no other term in the model is.
    paper_importance_quote: null
    equation: benefit(treatment) = S(t | no treatment) - S(t | treatment), both from the same prognostic
      index with treatment log-HRs added
    params:
    - name: chemo_generation
      label: Chemotherapy generation
      coefficient: -0.446
      units: 0 none / 2 second generation / 3 third generation
      transform: 'lookup: none 0.0, second generation -0.248, third generation -0.446'
      transform_kind: categorical
      reference_level: no chemotherapy
      importance_rank: 1
      note: HR 0.64 for third generation, 0.78 for second. There is no 'first generation' level.
    - name: hormone
      label: Adjuvant endocrine therapy
      coefficient: -0.3857
      coefficient_extended: -0.26
      units: indicator
      transform: -0.3857 for years 1-10; an ADDITIONAL -0.26 for years 11-15 if extended_hormone
      transform_kind: dichotomy + time-varying
      importance_rank: 2
      note: THE ONLY TIME-VARYING TERM IN THE MODEL. The extra years-11-15 effect is the ATLAS/aTTom extended-endocrine
        result. A benefit computed at 10 years and one computed at 15 years are not on the same scale.
    - name: trastuzumab
      label: Trastuzumab
      coefficient: -0.3567
      units: indicator
      transform: 1/0, applied only where HER2-positive
      transform_kind: dichotomy
      importance_rank: 3
    - name: bisphosphonate
      label: Bisphosphonate
      coefficient: -0.198
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
    - name: (radiotherapy)
      label: Radiotherapy
      coefficient: 0.0
      units: indicator
      transform: GATED OFF, r.enabled = 0 in v2.2, so every radiotherapy term evaluates to zero
      transform_kind: none
      importance_rank: null
      note: Present in the reference source and deliberately disabled there. We mirror the disabling exactly
        rather than silently enabling a pathway the reference turns off. Do not read a zero benefit here
        as a claim that radiotherapy does not help.
  plcom2012:
    axis: detection
    importance_basis: the paper's Table 2 odds ratios, cross-checked against the measured sweep; both
      point at the smoking block
    top_parameter: smoking_duration_years
    top_parameter_why: 'The smoking block collectively dominates, and duration is its largest component
      over a real range, 10 to 50 years of smoking moves risk far more than any single categorical term.
      The subtle part is that duration (years) matters MORE than intensity (cigarettes/day), which is
      why the model beats pack-year thresholds: pack-years multiply the two and lose the distinction.'
    paper_importance_quote: 'Tammemagi 2013, verbatim: "smoking intensity had a significant nonlinear
      association with lung cancer". The paper does not name a single strongest predictor; the Table 2
      odds ratios are reproduced per parameter below.'
    equation: logit(p) = -4.532506 + sum(beta_i * x_i); risk = 6-year probability via the logistic link
    params:
    - name: (intercept)
      label: Intercept
      coefficient: -4.532506
      units: logit
      transform: '1'
      transform_kind: none
      importance_rank: null
    - name: smoking_duration_years
      label: Duration of smoking
      coefficient: 0.0317321
      units: years
      transform: smoking_duration_years - 27
      transform_kind: centering
      importance_rank: 1
      paper_effect: OR 1.032 (1.014-1.051) per year
    - name: cigarettes_per_day
      label: Smoking intensity
      coefficient: -1.822606
      units: cigarettes/day
      transform: (cigarettes_per_day / 10)^-1 - 0.4021541613
      transform_kind: reciprocal + centering
      importance_rank: 2
      paper_effect: null
      note: 'A RECIPROCAL, and the sign is the thing everyone gets wrong. The coefficient is NEGATIVE
        and the transform is 1/x, so more cigarettes means a smaller x and therefore MORE risk. The effect
        saturates: going 5 -> 10 cigarettes/day moves the term by 1.0, while 40 -> 60 moves it by 0.08.
        Never linearise this. Also note it is undefined at 0, the model is for ever-smokers only and
        raises otherwise.'
    - name: quit_years
      label: Years since quitting
      coefficient: -0.0308572
      units: years
      transform: quit_years - 10
      transform_kind: centering
      importance_rank: 3
      paper_effect: OR 0.970 (0.950-0.990) per year
      note: Must be 0 for current smokers; the module enforces the consistency.
    - name: age
      label: Age
      coefficient: 0.0778868
      units: years
      transform: age - 62
      transform_kind: centering
      importance_rank: 4
      paper_effect: OR 1.081 (1.057-1.105) per year
    - name: race
      label: Race / ethnic group
      coefficient: null
      units: 6 categories
      transform: white 0 (reference); black +0.3944778; hispanic -0.7434744; asian -0.466585; American
        Indian/Alaskan Native 0.0; Native Hawaiian/Pacific Islander +1.027152
      transform_kind: categorical
      reference_level: white
      importance_rank: 5
      paper_effect: black OR 1.484 (1.083-2.033); hispanic OR 0.475 (0.195-1.160); asian OR 0.627 (0.332-1.185)
      note: American Indian / Alaskan Native is printed as EXACTLY 0 in Table 2, identical to the white
        reference, that is what the table says, not a missing value. Native Hawaiian/Pacific Islander
        at +1.027 is the largest categorical term in the model, larger than COPD or family history.
    - name: family_history_lung_cancer
      label: Family history of lung cancer
      coefficient: 0.587185
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 6
      paper_effect: OR 1.799 (1.471-2.200)
    - name: personal_cancer_history
      label: Personal history of cancer
      coefficient: 0.4589971
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 7
      paper_effect: OR 1.582 (1.172-2.128)
    - name: copd
      label: COPD
      coefficient: 0.3553063
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 8
      paper_effect: OR 1.427 (1.162-1.751)
    - name: current_smoker
      label: Smoking status
      coefficient: 0.2597431
      units: indicator
      transform: 1 if current, 0 if former
      transform_kind: dichotomy
      reference_level: former smoker
      importance_rank: 9
      paper_effect: OR 1.297 (1.047-1.605)
      note: Never-smokers are out of scope entirely, not a third level.
    - name: education_level
      label: Education
      coefficient: -0.0812744
      units: ordinal 1-6
      transform: education_level - 4
      transform_kind: centering
      importance_rank: 10
      paper_effect: OR 0.922 (0.874-0.972) per level
      note: A 6-level ordinal entered as a NUMBER (1 = less than high school, 6 = postgraduate), centered
        on 4. Treating it as unordered categories changes the model.
    - name: bmi
      label: Body-mass index
      coefficient: -0.0274194
      units: kg/m2
      transform: bmi - 27
      transform_kind: centering
      importance_rank: 11
      paper_effect: OR 0.973 (0.955-0.991) per unit
      note: NEGATIVE, higher BMI predicts LOWER lung-cancer risk here. This is the well-known reverse-causation/confounding
        signal (weight loss precedes diagnosis, smoking suppresses weight), not a protective effect of
        obesity. Do not correct the sign.
  lipi:
    axis: response
    importance_basis: point allocation, two items, one point each, deliberately unweighted
    top_parameter: dnlr
    top_parameter_why: 'Neither item is weighted above the other by construction, so there is no ranking
      inside the model. dNLR is listed first because it is the derived quantity that needs care: it is
      neutrophils / (leukocytes - neutrophils), NOT the ordinary neutrophil-to-lymphocyte ratio.'
    paper_importance_quote: 'Meta-analysis PMC11222319, verbatim: "elevated LIPI was significantly associated
      with poor OS (HR = 2.50, 95% CI: 2.09-2.99, p < 0.001) and PFS (HR = 1.77, 95% CI: 1.64-1.91, p
      < 0.001)."'
    equation: LIPI = [dNLR > 3] + [LDH > ULN], range 0-2; 0 good / 1 intermediate / 2 poor
    params:
    - name: dnlr
      label: Derived neutrophil-to-lymphocyte ratio
      coefficient: null
      points: 1 if > 3.0
      units: ratio
      transform: dNLR = neutrophils / (leukocytes - neutrophils), then dichotomised at 3.0
      transform_kind: derived + dichotomy
      importance_rank: 1
      note: The DENOMINATOR IS THE NON-NEUTROPHIL WHITE COUNT, not the lymphocyte count. That is what
        makes it "derived" and why it can be computed from a differential that lacks lymphocytes. Substituting
        an ordinary NLR gives a systematically different number.
    - name: ldh
      label: Lactate dehydrogenase
      coefficient: null
      points: 1 if > upper limit of normal
      units: U/L
      transform: dichotomised against the REPORTING LAB'S OWN upper limit of normal
      transform_kind: dichotomy
      importance_rank: 1
      note: There is no universal cutoff, so both the value and its ULN must be supplied. Hard-coding
        a threshold makes the score non-transferable between laboratories.
  lipi_prognosis:
    axis: prognosis
    importance_basis: point allocation, identical arithmetic to the response use
    top_parameter: dnlr
    top_parameter_why: 'SAME TWO PARAMETERS, SAME WEIGHTS, SAME CUTOFFS as the response use. The only
      thing that changes across the axis is the claim being made: on the response axis LIPI is used to
      predict benefit from immune checkpoint inhibitors, on the prognosis axis to predict survival regardless
      of treatment. Validation found the prognostic effect held under chemotherapy too, which is precisely
      why it is weak evidence of ICI-specific benefit.'
    paper_importance_quote: 'PMC7481630, verbatim: "The prognostic impact however was consistent across
      all studies in patients treated with ICI or chemotherapy", i.e. the same score behaves prognostically
      in both arms, so it does not by itself identify who benefits from immunotherapy specifically.'
    equation: identical to lipi
    params:
    - name: dnlr
      label: Derived neutrophil-to-lymphocyte ratio
      coefficient: null
      points: 1 if > 3.0
      units: ratio
      transform: neutrophils / (leukocytes - neutrophils), dichotomised at 3.0
      transform_kind: derived + dichotomy
      importance_rank: 1
    - name: ldh
      label: Lactate dehydrogenase
      coefficient: null
      points: 1 if > upper limit of normal
      units: U/L
      transform: dichotomised against the reporting lab's ULN
      transform_kind: dichotomy
      importance_rank: 1
  crc_pro:
    axis: detection
    importance_basis: THE PAPER'S OWN RANKING — Table 3 prints the change in c-statistic as each variable
      enters a forward-stepwise fit, separately for men and women. This is the most explicit importance
      evidence in the whole repository.
    top_parameter: age
    top_parameter_why: Age alone takes the c-statistic from 0.500 to 0.663 in men and 0.658 in women,
      a gain of 0.163 and 0.158 against a total model gain of 0.193 and 0.187. Every other variable combined
      is worth about 0.03. Race/ethnicity is a distant second at 0.010.
    paper_importance_quote: 'Kattan 2014, verbatim: "Age had a substantially stronger effect on the accuracy
      of the model than any of the other variables for both men and women. Race/ethnicity was the second
      most important variable for both sexes, and the relative importance of the additional variables
      were different between the sexes. The regular use of NSAIDs was an important predictor for women
      but not for men, whereas a personal history of cancer was not an important predictor variable for
      either sex."'
    equation: risk(10y) = 1 - S0 ** exp(Xb);  S0 = 0.9846654 (men), 0.9901043 (women)
    coefficient_note: MEN AND WOMEN ARE DIFFERENT MODELS WITH DIFFERENT PREDICTOR SETS, not one model
      with a sex term. Men have 12 predictors, women 11, and only 9 overlap. Coefficients below are the
      LINEAR component; every continuous predictor also carries 2-3 restricted-cubic-spline terms, listed
      in the transform.
    params:
    - name: age
      label: Age
      coefficient: 0.091669179
      coefficient_female: 0.090012542
      units: years
      transform: linear + RCS knots at 47, 60, 72 (both sexes)
      transform_kind: spline
      importance_rank: 1
      paper_effect: adjusted HR 3.03 (2.69-3.41) men, 2.81 (2.48-3.18) women, for age 67 vs 52
      paper_delta_c: men +0.163280, women +0.157655
    - name: ethnicity
      label: Race / ethnicity
      coefficient: null
      units: 5 categories
      transform: 'men: hawaiian +0.16092241, japanese +0.25353936, latino -0.13659953, white -0.16728044.
        women: hawaiian -0.24100367, japanese +0.014010715, latino -0.39669678, white -0.34056094'
      transform_kind: categorical
      reference_level: black
      importance_rank: 2
      paper_effect: men, Japanese vs white HR 1.52 (1.31-1.77); women, black vs white HR 1.41 (1.18-1.67)
      paper_delta_c: men +0.009710, women +0.010010
      note: THE REFERENCE IS BLACK, not white. Every printed coefficient is relative to Black participants,
        so all four levels in the women's model being negative means all four are lower-risk than Black
        women, not that they are protective in the abstract. Note the signs also FLIP by sex for Hawaiian
        (+0.161 men, -0.241 women).
    - name: pack_years
      label: Pack-years of smoking
      coefficient: 0.00022581331
      coefficient_female: 0.062703176
      units: pack-years
      transform: 'men: linear + RCS at 0, 6.375, 39.525. women: linear + RCS at 0, 1.25, 6.375, 27.5125
        (FOUR knots, the paper could not fit three)'
      transform_kind: spline
      importance_rank: 3
      paper_effect: men HR 1.06 (0.93-1.21) for 19.8 vs 0 pack-years
      paper_delta_c: men +0.005224 (rank 3), women +0.002476 (rank 6)
      note: The men's linear coefficient is 0.000226, essentially zero, because almost all of the effect
        is carried by the spline terms. Reading the linear coefficient alone would conclude smoking does
        not matter.
    - name: alcohol_drinks_per_day
      label: Alcohol
      coefficient: 0.28379769
      coefficient_female: -0.08856241
      units: drinks/day
      transform: 'men: linear + RCS at 0, 0.14457189, 2.8477722. women: linear + RCS at 0, 0.10740682,
        0.8099724'
      transform_kind: spline
      importance_rank: 4
      paper_effect: men HR 1.26 (1.13-1.41) for 1.15 vs 0 drinks/day; women HR 0.99 (0.93-1.06) for 0.1
        vs 0
      paper_delta_c: men +0.003229 (rank 4), women +0.000976 (rank 11)
      note: SIGN FLIPS BY SEX on the linear term (+0.284 men, -0.089 women), the spline knots differ
        too.
    - name: weight_lb / height_in
      label: Body-mass index
      coefficient: 0.018020786
      coefficient_female: 0.0075233925
      units: pounds and inches IN, kg/m2 in the equation
      transform: BMI = (weight_lb * 0.45359237) / (height_in * 0.0254)^2, then linear + RCS at 22.047175,
        25.941735, 31.778341 (men) or 20.371336, 25.508027, 33.722266 (women)
      transform_kind: derived + spline
      importance_rank: 5
      paper_effect: men HR 1.12 (1.04-1.21) for BMI 28.7 vs 23.8
      paper_delta_c: men +0.002821 (rank 5), women +0.001300 (rank 9)
      note: INPUTS ARE POUNDS AND INCHES. The spline knots assume the app's own conversion, so supplying
        kg/cm and converting yourself will land on the wrong side of a knot.
    - name: years_education
      label: Years of education
      coefficient: 0.072052428
      coefficient_female: 0.07443905
      units: years
      transform: linear + RCS at 7, 14, 18 (both sexes)
      transform_kind: spline
      importance_rank: 6
      paper_effect: men HR 0.94 (0.85-1.03) for 16 vs 12 years; women HR 1.01 (0.97-1.06) for 14 vs 12
      paper_delta_c: men +0.002333 (rank 6), women +0.003243 (rank 3)
    - name: family_history
      label: Family history of colon cancer
      coefficient: 0.24250922
      coefficient_female: 0.31589053
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 7
      paper_effect: men HR 1.27 (1.08-1.51); women HR 1.37 (1.17-1.61)
      paper_delta_c: men +0.001526, women +0.001839
    - name: multivitamin
      label: Regular multivitamin use
      coefficient: -0.19175375
      coefficient_female: -0.1665365
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 8
      paper_effect: men HR 0.83 (0.74-0.92); women HR 0.85 (0.76-0.95)
    - name: diabetes
      label: History of diabetes
      coefficient: 0.11020556
      coefficient_female: 0.23328937
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 9
      paper_effect: men HR 1.12 (0.96-1.30); women HR 1.26 (1.08-1.48)
      paper_delta_c: men +0.000600 (rank 11), women +0.002600 (rank 5)
      note: Ranked 11th in men and 5th in women, one of the clearest sex differences in the model.
    - name: aspirin
      label: Regular aspirin use
      coefficient: -0.20960315
      units: no / previously / currently
      transform: no 0 (reference); previously -0.032284161; currently -0.20960315
      transform_kind: categorical
      reference_level: 'no'
      importance_rank: 10
      paper_effect: HR 0.81 (0.71-0.92) current vs no
      note: MEN'S MODEL ONLY. Excluded from the women's model by the stepwise fit.
    - name: red_meat_oz_per_day
      label: Red meat intake
      coefficient: 0.073141733
      units: ounces/day
      transform: linear + RCS at 0.59081962, 2.0822052, 5.0656345
      transform_kind: spline
      importance_rank: 11
      paper_delta_c: men +0.000622 (rank 10); EXCLUDED from the women's model
      note: MEN'S MODEL ONLY.
    - name: activity_hours_per_day
      label: Moderate physical activity
      coefficient: -0.090669913
      units: hours/day
      transform: linear + RCS at 0.10714286, 0.82142857, 3.5357143
      transform_kind: spline
      importance_rank: 12
      paper_effect: men HR 0.92 (0.83-1.02) for 1.6 vs 0.4 hours/day
      paper_delta_c: men +0.000513 (rank 12); EXCLUDED from the women's model
      note: MEN'S MODEL ONLY.
    - name: estrogen
      label: Estrogen use
      coefficient: -0.24500762
      units: no / previously / currently
      transform: no 0 (reference); previously -0.044320489; currently -0.24500762
      transform_kind: categorical
      reference_level: 'no'
      importance_rank: 4
      paper_effect: HR 0.78 (0.68-0.90) current vs no
      paper_delta_c: women +0.003139 (rank 4)
      note: 'WOMEN''S MODEL ONLY, and the site of a real defect in the deployed calculator: its UI emits
        "Yes, but not currently" while the model tests for "Yes-previously", so the -0.044320489 term
        is unreachable there and a woman reporting PREVIOUS estrogen use is scored as if she reported
        none. We implement the paper (all three levels live); emulate_deployed_defect=True reproduces
        the tool.'
    - name: nsaid
      label: Regular NSAID use
      coefficient: -0.236997
      units: no / previously / currently
      transform: no 0 (reference); previously -0.046383323; currently -0.236997
      transform_kind: categorical
      reference_level: 'no'
      importance_rank: 10
      paper_effect: HR 0.79 (0.66-0.94) current vs no
      paper_delta_c: women +0.001097 (rank 10); EXCLUDED from the men's model
      note: WOMEN'S MODEL ONLY, this is the sex difference the paper calls out by name.
  msk_rectal:
    axis: prognosis
    importance_basis: measured sweep; the supplement prints hazard ratios but they are internally inconsistent
      for OS
    top_parameter: ypt
    top_parameter_why: ypT stage after chemoradiotherapy carries the largest single jump, ypT4 is +1.52
      (RFS) and +1.39 (OS) against the reference, an approximately 4-fold hazard. Positive nodes are close
      behind but are splined, so their effect saturates after the first few nodes.
    paper_importance_quote: null
    equation: Prob{T >= t} = S0(t) ** exp(X*beta), time in MONTHS; S0 published only at 0/60/120/180 months
    coefficient_note: TWO ENDPOINTS WITH DIFFERENT REFERENCE GROUPS AND DIFFERENT PREDICTOR SETS. RFS
      is coded against ypT0/T1 and has NO age term; OS is coded against ypT0/T1/T2 and has an age spline.
      Applying the RFS coding to OS silently misprices every ypT2 patient.
    params:
    - name: ypt
      label: ypT stage (post-treatment pathological T)
      coefficient: 1.521675
      coefficient_os: 1.386825
      units: ypT0-ypT4
      transform: 'RFS: indicators for T2 (+0.3143759), T3 (+0.6630723), T4 (+1.521675) against ypT0/T1.
        OS: indicators for T3 (+0.2726462) and T4 (+1.386825) against ypT0/T1/T2.'
      transform_kind: categorical
      reference_level: 'RFS: ypT0/T1.  OS: ypT0/T1/T2. DIFFERENT'
      importance_rank: 1
      note: MSK's own web form REJECTS ypT0 for an incomplete responder, because in its UI ypT0 means
        complete response and routes the patient elsewhere. The equation's RFS reference group is nonetheless
        labelled ypT0/T1, so this module accepts it, that corner is covered by the equation alone and
        no live reference value can be captured for it.
    - name: positive_nodes
      label: Number of positive lymph nodes
      coefficient: 0.522283
      coefficient_os: 0.5150229
      units: count
      transform: linear + restricted cubic spline, knots at 0, 1, 3
      transform_kind: spline
      importance_rank: 2
      note: Knots at 0, 1 and 3 mean essentially all the resolution is in the first three nodes. Going
        0 -> 1 node matters enormously; 7 -> 9 barely registers.
    - name: perineural_invasion
      label: Perineural invasion
      coefficient: 0.6336823
      coefficient_os: 0.6762158
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 3
      paper_effect: eTable prints HR 2.02 for OS; exp(0.6762158) = 1.97. The eTable and eFigure disagree
        for OS, see note.
    - name: venous_invasion
      label: Venous invasion
      coefficient: 0.136099
      coefficient_os: 0.470128
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 5
      note: 'A 3.5-fold difference between endpoints (0.136 RFS vs 0.470 OS) and the single coefficient
        most at risk of transcription error: read from a rendered figure, it could have been 0.470128
        or 0.0470128, and a dropped leading zero would have moved the hazard ratio from 1.60 to 1.05.
        Re-read at 600 dpi from independent renders.'
    - name: distance_to_anal_verge_cm
      label: Distance from the anal verge
      coefficient: -0.3811237
      coefficient_os: -0.4471371
      units: cm
      transform: 'DICHOTOMISED at 5 cm: 1 if >= 5 cm else 0'
      transform_kind: dichotomy
      importance_rank: 4
      note: A continuous measurement thrown away except for one threshold. 4.9 cm and 0.5 cm score identically.
        Protective sign, tumours further from the verge do better.
    - name: age
      label: Age
      coefficient: 0.00535203
      units: years
      transform: 'OS ONLY: linear + restricted cubic spline, knots at 36, 52, 64, 78.7'
      transform_kind: spline
      importance_rank: 6
      note: ABSENT FROM THE RFS MODEL ENTIRELY. This asymmetry is why OS can come out BELOW RFS for an
        older patient, which looks like a bug and is not. MSK's own deployed tool does the same. The
        two endpoints are separate marginal Cox fits, not a nested pair.
  wang_larc_pcr:
    axis: response
    importance_basis: measured sweep over each covariate's own deployed range. The paper's Table 4 ranks
      nothing and, being an ordinal-coded refit, does not correspond term-for-term to the model that is
      actually deployed.
    top_parameter: histopathology
    top_parameter_why: Histology moves the logit by 1.4323 between its two levels, the largest single
      jump in the model, and the only one a clinician cannot influence. Pre-CRT CEA is a close second
      (1.4016 across the full 0-24 ng/mL slider) but only because the slider is wide; per ng/mL it is
      the smallest coefficient in the model at -0.0584. T stage is third at 1.3364, and that number is
      the cT1-to-cT2 gap rather than a monotone gradient.
    paper_importance_quote: 'Wang 2024, Results 3.3, the nomogram''s own points allocation, which is the
      paper''s only ranking: "22.0 x Pre-CRT N stage + 15.0 x Pre-CRT T stage + 70.0 x Pre-CRT MRI_EMVI
      + 55.0 x Total neoadjuvant therapy + 100 x Histopathology + 3.85 x Pre-CR CEA (>= 24 = 0)". Histology
      takes the full 100 points there too. Note the points axis for CEA is REVERSED (24 ng/mL scores zero
      points) while the regression coefficient is negative, the two agree, but the signs look opposite.'
    equation: logit(P(pCR)) = -0.0131 + N-stage term + T-stage term - 1.1061*[EMVI positive] + 0.7642*[TNT
      given] - 1.4323*[signet-ring/mucinous] - 0.0584*CEA(ng/mL)
    coefficient_note: THE INTERCEPT IS NOT IN THE PAPER. Cancer Med 2024;13(11):e7251 publishes odds ratios
      (Table 4) and the nomogram points formula but no constant and no points-to-probability axis outside
      Figure 3A, so the article alone can rank patients and cannot state a probability. Every coefficient
      below was read on 2026-08-14 from the "Model Summary" tab of the authors' own calculator at pcrpredict.shinyapps.io/LARC2/,
      which prints the fitted rms::lrm object in full. Two further things the paper hides - the deployed
      model fits T and N as UNORDERED FACTORS (d.f. 9, not 6) where Table 4 reports one ordinal odds ratio
      each, and the T-stage reference is cT2, not cT1.
    params:
    - name: (intercept)
      label: Intercept
      coefficient: -0.0131
      units: logit
      transform: '1'
      transform_kind: none
      importance_rank: null
      note: Statistically indistinguishable from zero (SE 0.2588, p 0.96) and still indispensable, it
        fixes the reference patient (cN0, cT2, EMVI-negative, no TNT, adenocarcinoma, CEA 0) at P(pCR)
        = 0.497, and every other prediction hangs off that. This one number is what the published article
        is missing.
    - name: histopathology
      label: Histopathology (signet-ring cell / mucinous vs adenocarcinoma)
      coefficient: -1.4323
      units: indicator
      transform: 1 if signet-ring cell carcinoma or mucinous adenocarcinoma else 0
      transform_kind: dichotomy
      reference_level: adenocarcinoma
      paper_effect: Table 4 OR 4.608 (2.625-8.089) stated the other way round (adenocarcinoma vs signet-ring/mucinous);
        exp(1.4323) = 4.19 here
      importance_rank: 1
      note: SIGNET-RING AND MUCINOUS ARE POOLED into one level. A caller expecting two distinct effects
        will get a plausible wrong number for one of them.
    - name: cea_ng_ml
      label: Pre-CRT carcinoembryonic antigen
      coefficient: -0.0584
      units: ng/mL
      transform: linear, per ng/mL, over 0-24 only
      transform_kind: identity
      paper_effect: Table 4 OR 0.944 (0.921-0.968); exp(-0.0584) = 0.943
      importance_rank: 2
      note: 'NEGATIVE, while the paper''s points term reads "+3.85 x CEA". Both are right: the points
        axis is reversed (">= 24 = 0"). Bounded to 0-24 ng/mL because that is the authors'' own slider
        range and the paper''s explicit floor; outside it the module raises rather than extrapolating
        a linear logit term.'
    - name: t_stage
      label: Pre-CRT clinical T stage
      coefficient: 1.3364
      units: category
      transform: 'unordered factor, reference cT2: cT1 +1.3364, cT3 +0.5773, cT4 +0.0587'
      transform_kind: categorical
      reference_level: cT2
      paper_effect: Table 4 reports a single ordinal OR of 0.793 (0.634-0.993) per level, which is a DIFFERENT
        coding and does not reconcile term-by-term
      importance_rank: 3
      note: NOT MONOTONE, and the reference is cT2 rather than cT1, neither fact is recoverable from
        the paper. The fit says cT3 is MORE likely to reach pCR than cT2 (+0.5773, p 0.027) while cT4
        is barely distinguishable from it (+0.0587, p 0.836). The authors' own calculator reproduces this.
        The level is also literally named `cTcT1` in their dataset, a doubled prefix.
    - name: mri_emvi_positive
      label: Pre-CRT MRI extramural venous invasion
      coefficient: -1.1061
      units: indicator
      transform: 1 if EMVI positive else 0
      transform_kind: dichotomy
      reference_level: EMVI negative
      paper_effect: Table 4 OR 0.352 (0.262-0.473); exp(-1.1061) = 0.331
      importance_rank: 4
      note: The most statistically secure term in the model (Wald Z -7.37). Requires a staging MRI read
        for EMVI specifically, which is not universally reported.
    - name: total_neoadjuvant_therapy
      label: Total neoadjuvant therapy given
      coefficient: 0.7642
      units: indicator
      transform: 1 if TNT else 0
      transform_kind: dichotomy
      reference_level: no TNT
      paper_effect: Table 4 OR 2.264 (1.280-4.004); exp(0.7642) = 2.15
      importance_rank: 5
      note: The only modifiable input, this is a treatment choice, not a patient characteristic, so it
        is the term that makes the model a decision aid rather than a description.
    - name: n_stage
      label: Pre-CRT clinical N stage
      coefficient: -0.6596
      units: category
      transform: 'unordered factor, reference cN0: cN1 -0.4513, cN2 -0.6596'
      transform_kind: categorical
      reference_level: cN0
      paper_effect: Table 4 reports a single ordinal OR of 0.727 (0.606-0.873) per level, a DIFFERENT
        coding
      importance_rank: 6
      note: Monotone, unlike T stage, but the cN1-to-cN2 step (-0.208) is less than half the cN0-to-cN1
        step (-0.451), so an equal-spaced ordinal score overstates the top end.
  amap:
    axis: detection
    importance_basis: measured sweep; the paper names the components but does not rank them
    top_parameter: age
    top_parameter_why: Age carries the largest measured swing because it ranges over 50 years at 0.406
      score-points per year (0.06 / 14.77 * 100). Platelets are second. The subtlety is that ALBI, itself
      a two-variable model, enters as a SINGLE term at 0.48, so albumin and bilirubin reach the score
      only through it and their individual influence is diluted twice over.
    paper_importance_quote: null
    equation: 'ALBI = 0.66*log10(bilirubin) - 0.085*albumin

      aMAP = ({0.06*age + 0.89*male + 0.48*ALBI - 0.01*platelets} + 7.4) / 14.77 * 100

      '
    params:
    - name: age
      label: Age
      coefficient: 0.06
      units: years
      transform: age, untransformed; then the whole LP is rescaled (+7.4)/14.77*100
      transform_kind: identity + rescaling
      importance_rank: 1
      note: 0.406 points of the 0-100 scale per year.
    - name: platelets
      label: Platelet count
      coefficient: -0.01
      units: x10^3/mm^3 (= x10^9/L)
      transform: platelets, untransformed
      transform_kind: identity
      importance_rank: 2
      note: Negative, low platelets mean portal hypertension and advanced fibrosis. Ranges 60-350 in
        practice, so despite the small coefficient it contributes about 2.9 points per 100 x10^9/L.
    - name: (ALBI component)
      label: ALBI score, entered whole
      coefficient: 0.48
      units: ALBI units
      transform: 0.66*log10(bilirubin_umol_l) - 0.085*albumin_g_l, computed first, then multiplied by
        0.48
      transform_kind: derived (nested model)
      importance_rank: 3
      note: ONE PUBLISHED MODEL NESTED INSIDE ANOTHER. This repo implements ALBI separately on the liver
        PROGNOSIS axis; the same arithmetic appears here on the DETECTION axis as a single term. Both
        use -0.085 on albumin, which is what Johnson 2015 prints.
    - name: albumin_g_l
      label: Serum albumin (via ALBI)
      coefficient: -0.085
      units: g/L
      transform: enters ONLY through ALBI; effective aMAP coefficient is 0.48 * -0.085 = -0.0408 per g/L
      transform_kind: identity (inside ALBI)
      importance_rank: 4
      note: g/L, not g/dL. Multiply g/dL by 10.
    - name: bilirubin_umol_l
      label: Serum bilirubin (via ALBI)
      coefficient: 0.66
      units: umol/L
      transform: log10(bilirubin), inside ALBI; effective aMAP coefficient is 0.48 * 0.66 = 0.317 per
        log10 unit
      transform_kind: log10 (inside ALBI)
      importance_rank: 5
      note: umol/L, not mg/dL, multiply mg/dL by 17.1. The log10 means a doubling of bilirubin adds only
        0.095 to aMAP; the term saturates fast and cannot by itself push a patient into the high band.
    - name: male
      label: Male sex
      coefficient: 0.89
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: female
      importance_rank: 6
      note: 6.03 points on the 0-100 scale, about 15 years of age.
    - name: (rescaling)
      label: Linear-predictor rescaling
      coefficient: null
      units: n/a
      transform: (LP + 7.4) / 14.77 * 100, mapping onto 0-100
      transform_kind: derived
      importance_rank: null
      note: 'UNRESOLVED: the custodial CUHK calculator''s output sits 2-3 points ABOVE this published
        formula, while every individual slope matches. We implement the paper. Also, no continuous 5-year
        risk is shipped, whether the linear predictor is mean-centred before applying S0 = 0.984 is not
        resolvable from the text, and getting it wrong is a ~1.4x hazard multiplier.'
  hap:
    axis: response
    importance_basis: the paper's own effect statement, which gives all four items the same two-to-threefold
      range and awards them one point each
    top_parameter: albumin_g_l
    top_parameter_why: 'All four items are deliberately UNWEIGHTED, one point each, so the model asserts
      no ranking. Albumin is listed first because it is the item most often misused: the abstract renders
      the threshold as "36 g/dl", which is not a physiological albumin concentration, and the intended
      unit is g/L.'
    paper_importance_quote: 'Kadalayil 2013 abstract, verbatim: "Low albumin, high bilirubin or alpha-fetoprotein
      (AFP) and large tumour size were associated with a two- to threefold increase in the risk of death."'
    equation: HAP = [albumin < 36 g/L] + [bilirubin > 17 umol/L] + [AFP > 400 ng/mL] + [tumour > 7 cm];
      A=0, B=1, C=2, D=>2
    params:
    - name: albumin_g_l
      label: Serum albumin
      coefficient: null
      points: 1 if < 36
      units: g/L
      transform: dichotomy at 36 g/L (strictly less than)
      transform_kind: dichotomy
      importance_rank: 1
      paper_effect: two- to threefold increase in risk of death
      note: UNIT TRAP. Some renderings of the abstract print "<36 g/dl"; 36 g/dL is not a physiological
        albumin concentration. The module requires g/L and converts from g/dL on request.
    - name: bilirubin_umol_l
      label: Serum bilirubin
      coefficient: null
      points: 1 if > 17
      units: umol/L
      transform: dichotomy at 17 umol/L (strictly greater than)
      transform_kind: dichotomy
      importance_rank: 1
      paper_effect: two- to threefold increase in risk of death
    - name: afp_ng_ml
      label: Alpha-fetoprotein
      coefficient: null
      points: 1 if > 400
      units: ng/mL
      transform: dichotomy at 400 ng/mL
      transform_kind: dichotomy
      importance_rank: 1
      paper_effect: two- to threefold increase in risk of death
    - name: dominant_tumour_size_cm
      label: Size of the dominant tumour
      coefficient: null
      points: 1 if > 7
      units: cm
      transform: dichotomy at 7 cm
      transform_kind: dichotomy
      importance_rank: 1
      paper_effect: two- to threefold increase in risk of death
      note: The DOMINANT tumour, not total tumour burden and not the sum of diameters.
    - name: (grade banding)
      label: Points -> HAP grade
      coefficient: null
      units: n/a
      transform: A=0, B=1, C=2, D=>2, so grade D absorbs BOTH 3 and 4 points
      transform_kind: banding
      importance_rank: null
      note: 'Asymmetric by construction: A/B/C are exact counts and D is an inequality. Median OS by grade
        (27.6 / 18.5 / 9.0 / 3.6 months) is the UK derivation cohort''s and does not transfer.'
  albi:
    axis: prognosis
    importance_basis: the paper's multivariable Cox analysis, which identifies exactly these two as consistently
      significant once tumour burden is removed
    top_parameter: albumin_g_l
    top_parameter_why: Albumin dominates over any realistic range. Its coefficient (-0.085 per g/L) applies
      to a variable spanning roughly 25-50 g/L, giving a swing of about 2.1 ALBI units, larger than the
      entire grade 1 to grade 3 span. Bilirubin is log10-transformed, so a 20-fold rise moves the score
      by only 0.86.
    paper_importance_quote: 'Johnson 2015, verbatim: "When we eliminated the impact of the HCC itself
      (as measured by tumor size or TMN stage), we discovered that log 10 bilirubin and albumin were consistently
      statistically significant predictors of survival."'
    equation: ALBI = 0.66*log10(bilirubin_umol_l) - 0.085*albumin_g_l;  grade 1 <= -2.60 < grade 2 <=
      -1.39 < grade 3
    params:
    - name: albumin_g_l
      label: Serum albumin
      coefficient: -0.085
      units: g/L
      transform: albumin, untransformed
      transform_kind: identity
      importance_rank: 1
      note: g/L not g/dL. This module shipped -0.0852 until 2026-08-05, taken from a search-result summary
        rather than the paper; the primary prints -0.085. The error shifted scores by +0.006 to +0.009,
        enough to flip a grade at the -2.60 or -1.39 boundary. Three independent sources agree on -0.085.
    - name: bilirubin_umol_l
      label: Serum bilirubin
      coefficient: 0.66
      units: umol/L
      transform: log10(bilirubin)
      transform_kind: log10
      importance_rank: 2
      note: LOG BASE 10, not natural log. Using ln instead inflates the term by 2.3x. umol/L not mg/dL,
        multiply mg/dL by 17.1.
    - name: (grade thresholds)
      label: Grade cut-points
      coefficient: null
      units: n/a
      transform: grade 1 <= -2.60; -2.60 < grade 2 <= -1.39; grade 3 > -1.39
      transform_kind: banding
      importance_rank: null
      note: ALBI grades LIVER FUNCTION, not tumour burden. It replaces Child-Pugh's subjective items (ascites,
        encephalopathy) with two objective labs, which is why it is fully reproducible from numbers alone.
        `risk` is None, it is a stratifier, not a probability.
  abc_method:
    axis: detection
    importance_basis: the paper's own hazard ratios by group, which show the effect lives in the INTERACTION
      rather than in either test
    top_parameter: (H. pylori x pepsinogen interaction)
    top_parameter_why: Neither test ranks above the other, because the model is not additive. Group D
      H. pylori seroNEGATIVE with atrophy, is the HIGHEST risk group (HR 8.2), above group C which
      is seropositive with atrophy (HR 6.0). A model that added the two tests could never produce that
      ordering. Extensive atrophy destroys the niche H. pylori lives in, so the antibody titre falls as
      the damage progresses.
    paper_importance_quote: 'Watabe 2005 Table 3, verbatim: "Group A 1; B 1.1, 0.4-3.4, p=0.81; C 6.0,
      2.4-14.5, p<0.0001; D 8.2, 3.2-21.5, p<0.0001". Also from the same cohort: "Age (y) <60 1, >60 5.3
      (2.9-9.9)" and "Sex Female 1, Male 3.2 (1.3-8.2)", both larger than group B, and neither is in
      the score.'
    equation: group = f(H. pylori antibody, pepsinogen atrophy); each group carries a published annual
      incidence
    params:
    - name: (H. pylori x pepsinogen interaction)
      label: The 2x2 of antibody status against serological atrophy
      coefficient: null
      units: group A-D
      transform: (Hp-, PG-) -> A; (Hp+, PG-) -> B; (Hp+, PG+) -> C; (Hp-, PG+) -> D
      transform_kind: interaction
      importance_rank: 1
      paper_effect: 'HR vs group A: B 1.1 (0.4-3.4); C 6.0 (2.4-14.5); D 8.2 (3.2-21.5)'
      note: 'THE INTERACTION IS THE MODEL. Neither test is informative alone: the highest-risk group D
        is antibody-NEGATIVE, below group C which is positive. No additive combination of the two tests
        can produce that ordering, which is why this is recorded as a parameter in its own right rather
        than as a note on the two components.'
    - name: h_pylori_antibody_positive
      label: H. pylori antibody
      coefficient: null
      units: indicator
      transform: 1/0, then crossed with pepsinogen status into a 2x2
      transform_kind: dichotomy + interaction
      importance_rank: 2
      note: NOT MONOTONE ON ITS OWN. Seronegative is lower risk without atrophy (group A) and HIGHER risk
        with it (group D). Reading this variable in isolation inverts the conclusion for the highest-risk
        group.
    - name: pepsinogen_i
      label: Serum pepsinogen I
      coefficient: null
      units: ng/mL
      transform: atrophic if pepsinogen_i <= 70 AND ratio <= 3.0, an AND, so neither alone suffices
      transform_kind: dichotomy (conjunctive)
      importance_rank: 3
      note: 'The conjunction matters: sweeping PG I alone can never flip atrophy status, because the ratio
        has to move with it. Assay-specific.'
    - name: pepsinogen_i_ii_ratio
      label: Pepsinogen I / II ratio
      coefficient: null
      units: ratio
      transform: part of the same conjunction; atrophic requires ratio <= 3.0
      transform_kind: dichotomy (conjunctive)
      importance_rank: 3
    - name: prior_eradication
      label: History of H. pylori eradication
      coefficient: null
      units: indicator
      transform: INVALIDATES the classification, flagged, not scored
      transform_kind: none
      importance_rank: null
      note: Seroreversion after eradication moves people into groups A/B while atrophy, and risk, persist.
        The module flags this rather than returning a number that would be wrong.
    - name: (group -> incidence)
      label: Annual gastric-cancer incidence by group
      coefficient: null
      units: probability/year
      transform: A 0.04%, B 0.06%, C 0.35%, D 0.60%
      transform_kind: categorical
      importance_rank: null
      note: JAPANESE RATES from a health-checkup endoscopy cohort. The ordering transfers to lower-incidence
        populations; the absolute numbers do not. Group A is low-risk, NOT zero-risk, 7 of 3324 group-A
        subjects developed gastric cancer.
  msk_gastric:
    axis: prognosis
    importance_basis: measured sweep; the paper publishes a nomogram figure and no coefficient table
    top_parameter: depth
    top_parameter_why: 'Depth of invasion carries the largest swing, and it is also the parameter most
      often coded wrongly: it is an ORDINAL ENTERED AS A NUMBER 1-7 and then splined, not a set of indicators.
      Positive nodes are second. Negative nodes are the surprise, they PROTECT, strongly, over a range
      up to 146.'
    paper_importance_quote: null
    equation: DSS(t) = S0(t) ** exp(Xb);  S0 = 0.579053 at 5y, 0.5089101 at 9y
    params:
    - name: depth
      label: Depth of invasion
      coefficient: 0.6913717
      units: ordinal 1-7
      transform: coded 1-7 in the order mucosa, submucosa, propria muscularis, subserosa, suspected serosal
        invasion, definite serosal invasion, adjacent organ involvement; then linear + RCS at 2, 4, 6
      transform_kind: ordinal + spline
      importance_rank: 1
      note: TREATING THIS AS INDICATORS, OR REORDERING THE LEVELS, SILENTLY CHANGES EVERY PREDICTION.
        The seven levels are a numeric scale that gets splined, which only works if the ordering is exactly
        the one the source factor declares.
    - name: positive_nodes
      label: Positive lymph nodes resected
      coefficient: 0.34360148
      units: count
      transform: linear + RCS at 0, 1, 11
      transform_kind: spline
      importance_rank: 2
      note: Validated range 0-23; the splines are only anchored inside it.
    - name: negative_nodes
      label: Negative lymph nodes resected
      coefficient: -0.047258944
      units: count
      transform: linear + RCS at 5, 17, 37
      transform_kind: spline
      importance_rank: 3
      note: 'PROTECTIVE AND LARGE. -0.047 per node over a range running to 146 means a thorough lymphadenectomy
        moves the prediction more than most single risk factors. This is the nomogram''s well-known stage-migration
        property, not an error: more nodes examined means better staging and, separately, better surgery.'
    - name: primary_site
      label: Primary tumour site
      coefficient: null
      units: 4 categories
      transform: antrum/pyloric 0 (reference); body/middle third +0.23855249; GE junction +0.7131089;
        proximal/upper third +0.14158861
      transform_kind: categorical
      reference_level: antrum or pyloric
      importance_rank: 4
      note: GE junction is the worst site by a wide margin, at three times the body/middle-third term.
    - name: age
      label: Age
      coefficient: -0.011606041
      units: years
      transform: linear + RCS at 48, 67, 80
      transform_kind: spline
      importance_rank: 5
      note: NON-MONOTONIC. The three spline terms produce a U-shaped age effect, which is why reading
        the published figure's age axis looks wrong at first. The linear coefficient is negative and is
        not the whole story.
    - name: lauren
      label: Lauren histotype
      coefficient: null
      units: 3 categories
      transform: diffuse 0 (reference); intestinal -0.19097534; mixed -0.075717935
      transform_kind: categorical
      reference_level: diffuse
      importance_rank: 6
      note: THE REFERENCE IS DIFFUSE, the WORST-prognosis Lauren type, so both other types carry NEGATIVE
        coefficients. A reader expecting intestinal to be the reference will read every sign backwards.
    - name: male
      label: Male sex
      coefficient: 0.227464
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: female
      importance_rank: 7
    - name: size_cm
      label: Tumour size
      coefficient: 0.0097446167
      units: cm
      transform: size, untransformed and NOT splined
      transform_kind: identity
      importance_rank: 8
      note: The only continuous predictor here that is not splined, and the weakest term in the model,
        0.0097 per cm over a validated 0.1-21 cm range. Size barely matters once depth and nodes are
        known.
  kunzmann:
    axis: detection
    importance_basis: point allocation, which IS the fitted model, points are the coefficients divided
      by the smallest coefficient and rounded to the nearest 0.5
    top_parameter: male
    top_parameter_why: Male sex alone carries 4.0 of the 15 available points, more than any other single
      factor and HALF the referral threshold of 8. It reflects the roughly 5-fold male excess in oesophageal
      adenocarcinoma. A woman cannot reach the referral threshold without nearly every other factor being
      maximal.
    paper_importance_quote: null
    equation: points = round_to_half(coefficient / 0.40) per level; total 0-15; refer at >= 8
    params:
    - name: male
      label: Sex
      coefficient: 1.64
      points: male 4.0; female 0
      units: indicator
      transform: 1/0, then 1.64/0.40 = 4.1 -> rounded to 4.0 points
      transform_kind: dichotomy
      reference_level: female
      importance_rank: 1
      note: The paper's own worked example for the points construction.
    - name: smoking
      label: Smoking status
      coefficient: null
      points: never 0; former 2.0; current 3.5
      units: 3 categories
      transform: categorical -> points
      transform_kind: categorical
      reference_level: never smoker
      importance_rank: 2
      note: Former smokers keep most of the risk (2.0 of 3.5), which is the usual pattern for this cancer
        and unlike the reversible risk seen for squamous disease.
    - name: age
      label: Age
      coefficient: null
      points: '50-55: 0; 55-60: 1.5; 60-65: 2.5; 65+: 3.5'
      units: years
      transform: 4-level banding; the model is undefined below 50 and raises
      transform_kind: banding
      importance_rank: 3
    - name: bmi
      label: Body-mass index
      coefficient: null
      points: '<25: 0; 25-<30: 1.0; 30-<35: 1.5; 35+: 2.5'
      units: kg/m2
      transform: 4-level banding
      transform_kind: banding
      importance_rank: 4
      note: 'The 25-<30 band''s odds ratio can be recovered from the points: the divisor interval implies
        it is about 1.492-1.499, printed as 1.50.'
    - name: esophageal_condition
      label: Recorded oesophageal condition (reflux, Barrett's, etc.)
      coefficient: null
      points: 1.5 if present
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 5
    - name: (points divisor)
      label: Smallest coefficient, used as the divisor
      coefficient: 0.4
      units: log-odds
      transform: points = round_to_half(beta / 0.40)
      transform_kind: derived
      importance_rank: null
      note: THE PAPER GIVES TWO DIVISORS AND ONLY ONE WORKS. Methods say 0.40, the Table 2 footnote says
        0.41. Each published point constrains the divisor to an interval; intersecting all ten rows admits
        only d in (0.3958, 0.4046], which contains 0.40 and excludes 0.41. With 0.41, "smoking, former"
        comes out 1.5 against a published 2.0.
    - name: (scope)
      label: Adenocarcinoma only
      coefficient: null
      units: n/a
      transform: n/a
      transform_kind: none
      importance_rank: null
      note: 'Predicts oesophageal ADENOCARCINOMA, not squamous cell carcinoma. The two are different diseases
        with different risk factors. ESCC is driven by alcohol, tobacco and hot beverages. Applying this
        model where ESCC predominates is a category error. Factors tested and DROPPED by stepwise selection:
        height, respiratory sympathomimetics, statins, diabetes, hypertension, high baseline BP.'
  chau_eg:
    axis: response
    importance_basis: >-
      the paper's own Table 3 hazard ratios, ranked, WITH the caveat the authors themselves attach to
      that ranking. They looked at the same four numbers and concluded the opposite of a ranking:
      "All four factors have a similar order of magnitude, therefore they can be combined into a
      simple prognostic score without loss of relevant information." So ordering them here answers
      "which point estimate sat furthest from 1.0 in this cohort", not "which factor the model
      weights more", because the published model weights all four identically at 1.
    top_parameter: performance_status
    top_parameter_why: >-
      Largest hazard ratio of the four (1.575 against 1.409, 1.412 and 1.329) and the only one whose
      99% CI lower bound clears 1.25, so it is furthest from the null on both the estimate and the
      interval. It is also the only factor of the four that is a clinician's judgement rather than a
      recorded fact, which makes it the one most exposed to inter-rater variation at the point of
      use, a real consideration for a variable carrying the model's largest weight.
      STATED WITH THE PAPER'S CAVEAT, because whichever number gets quoted will be quoted alone: the
      four hazard ratios span 1.329 to 1.575 and their confidence intervals overlap heavily, which
      is exactly why the authors declined to weight them. Reading performance status as "the most
      important factor" overstates a spread the authors judged not worth encoding.
    paper_importance_quote: >-
      Chau 2004, verbatim, Results: "All four factors have a similar order of magnitude, therefore
      they can be combined into a simple prognostic score without loss of relevant information."
      This is the paper stating in its own words that no single factor should be read as dominant,
      the same shape as moore_criteria, and the opposite of the usual largest-coefficient claim.
    equation: >-
      count = number of 4 binary factors present (NOT a weighted sum); band = good 0 | moderate 1-2 |
      poor 3-4; output = that band's published median OS (11.8 / 7.4 / 4.1 months) and one-year
      survival (48.5% / 25.7% / 11%) in the derivation cohort. No intercept and no baseline survival
      are published and none is needed.
    params:
    - name: performance_status
      label: WHO/ECOG performance status
      coefficient: 1.575
      units: hazard ratio (not a beta; the paper prints no coefficient scale for this model)
      transform: PS 2-3 scores 1; PS 0-1 is the reference
      transform_kind: dichotomy
      importance_rank: 1
      note: >-
        99% CI 1.251-1.981, P < .0001. The paper's own grouping is 0-1 against 2-3; only six patients
        in 1,080 were PS 3 and none was PS 4, so the upper end of the accepted range is sparsely
        evidenced. Accepted here as the raw 0-4 score and dichotomised internally at >= 2, the same
        way cibula_arrm bands a continuous diameter rather than making the caller pre-band it.
    - name: alkaline_phosphatase_u_l
      label: Serum alkaline phosphatase
      coefficient: 1.412
      units: U/L
      transform: '>= 100 U/L scores 1'
      transform_kind: dichotomy
      importance_rank: 2
      note: >-
        99% CI 1.136-1.755, P < .0001. THE CUT-POINT IS THE TRAP: 100 U/L sits at or below many
        laboratories' UPPER reference limit, so this factor fires for patients whose liver chemistry
        is entirely normal and a reader seeing "alkaline phosphatase risk factor present" will
        reasonably but wrongly infer an abnormal result. The module says so in `notes` whenever it
        fires. The paper argues the factor is not merely a proxy for liver metastasis or performance
        status: "Even when PS was analyzed separately as 0, 1, and >= 2, the same factors remain in
        the prognostic model", and reads it as a marker of total tumour burden.
        It was also the only variable with substantial missing data (present for 823 of 1,080), which
        is why the index is fitted on 817 complete cases rather than the full cohort.
    - name: liver_metastases
      label: Liver metastases
      coefficient: 1.409
      units: binary
      transform: present scores 1
      transform_kind: dichotomy
      importance_rank: 3
      note: >-
        99% CI 1.139-1.743, P < .0001 FOR SURVIVAL, and not significant at all for tumour RESPONSE
        (Table 4, P = .558). That split is the single most useful thing in this entry: the same
        cohort, two models, and the factor that ranks third for survival does not predict response.
        Anyone reaching for this index to answer "will the tumour shrink" is using the wrong half of
        the paper, and the right half has no intercept.
    - name: peritoneal_metastases
      label: Peritoneal metastases
      coefficient: 1.329
      units: binary
      transform: present scores 1
      transform_kind: dichotomy
      importance_rank: 4
      note: >-
        99% CI 1.013-1.743, P = .007, the weakest of the four, and the only one whose 99% CI comes
        close to crossing 1 (lower bound 1.013). If the "similar order of magnitude" claim has an
        exception in either direction, this is the candidate. Unlike liver metastases it IS
        significant for tumour response as well (Table 4, risk ratio 0.475, P = .002). Also the site
        most often missed on cross-sectional imaging, so its absence in a record is weaker evidence
        than its presence.
    - name: (band cut-points)
      label: Risk-group bands
      coefficient: null
      units: factor count
      transform: good 0 | moderate 1-2 | poor 3-4
      transform_kind: banding
      importance_rank: null
      note: >-
        Zero is its own band, as in cibula_arrm, and it is the band the treatment-intensity argument
        turns on: 239 patients, median OS 11.8 months, one-year survival 48.5%. The poor band is 91
        patients at 4.1 months and 11%. Group sizes sum to 817, not the 1,080 of the abstract,
        because the index is fitted on complete cases; the paper checked and found no survival
        difference between included and excluded patients (log-rank P = .992).
        `risk` is None throughout: this returns the derivation cohort's observed survival for a band,
        not a calibrated individual probability.
    - name: (tumour response is a different model)
      label: Why Table 4 computes nothing here
      coefficient: null
      units: n/a
      transform: none, recorded for provenance, never evaluated
      transform_kind: none
      importance_rank: null
      note: >-
        Table 4 fits a SEPARATE logistic model for tumour response on the same cohort, and it is not
        the same four factors: performance status (0.469), peritoneal metastases (0.475) and alkaline
        phosphatase (0.655) are significant, while liver metastases (P = .558) and haemoglobin <= 11
        g/L (P = .512) are not. It prints risk ratios with NO INTERCEPT, and no response rate per
        risk band appears anywhere in the article (checked across the full text). So the response
        model is half a formula, the same defect that keeps four cervical prognosis nomograms out
        of this library, and inventing a band lookup for it would mean inventing numbers. Carried
        in the module as TABLE_4_RESPONSE_FACTORS so a reader can see the finding, wired to nothing.
  shapiro_ncrt:
    axis: prognosis
    importance_basis: >-
      the published point values, which ARE the model, they are the final Cox coefficients scaled
      to integers, so they are directly comparable across predictors in a way raw coefficients on
      different scales are not. Unusually for this library the ranking is uncontested: the three
      predictors' maxima are 10, 4 and 2 points, so ypN dominates by a factor the sweep confirms
      (62% of total swing against 25% and 12%). No "the paper declines to weight them" caveat
      applies here, unlike chau_eg and moore_criteria.
    top_parameter: ypn_category
    top_parameter_why: >-
      10 of the model's 16 points, and 62% of measured swing. ypN3 alone moves a patient from the
      best cell to 10 points, 68% one-year and 23% five-year survival, against 91% and 70% at
      zero, which is more than the other two predictors combined can do. It is also the variable
      the paper's own multivariable analysis singles out: cN and ypN were the only independent
      prognostic factors, with ypT retained in the final model despite not reaching significance.
      The corollary matters as much: ypN is also the input that breaks the model. ypN2 scores 5, the
      only odd point value, so every ypN2 patient lands on a total the published figure does not
      label. The model's most important variable is the one with a hole in it.
    paper_importance_quote: >-
      Shapiro 2016, Results, verbatim: "In patients treated with nCRT plus surgery, the only
      independent prognostic factors were cN category (HR 1.46, 95 per cent c.i. 1.09 to 1.95;
      P = 0.012) and ypN category (ypN1: HR 1.78, 1.32 to 2.39, P < 0.001; ypN2: HR 1.98, 1.29 to
      3.02, P < 0.001; ypN3: HR 4.34, 2.38 to 7.93, P < 0.001)." NOTE those hazard ratios are Table
      2, the FULL model; they do not reproduce the nomogram's points, and the final model's own
      coefficients are printed nowhere in the article.
    equation: >-
      total = points(cN) + points(ypT) + points(ypN), 0-16; survival = Fig. 1's printed 1-year and
      5-year axes looked up at that total. Totals 5, 7, 9, 11 are reachable and unlabelled, and
      return None.
    params:
    - name: ypn_category
      label: ypN, nodal category on the resection specimen (UICC TNM 7th ed.)
      coefficient: null
      units: category
      transform: ypN0 0 pts; ypN1 4; ypN2 5; ypN3 10
      transform_kind: categorical
      importance_rank: 1
      note: >-
        Node COUNTS, not extent: ypN0 none, ypN1 one to two, ypN2 three to six, ypN3 seven or more.
        Coefficient is null because the final model's coefficients are printed nowhere, the points
        are all the paper gives, and Table 2's hazard ratios belong to a different (full) model.
        THE 5-POINT VALUE IS THE MODEL'S ONLY ODD NUMBER and therefore the sole cause of the four
        unreachable survival lookups. ypN2 was 60 of 626 patients (9.6%).
        The step from ypN2 (5) to ypN3 (10) doubles the contribution, a much larger jump than
        ypN1 to ypN2 (4 to 5), consistent with Table 2, where ypN3's hazard ratio is 4.34 against
        ypN2's 1.98.
    - name: ypt_category
      label: ypT, tumour category on the resection specimen (UICC TNM 7th ed.)
      coefficient: null
      units: category
      transform: ypT0 0 pts; ypT1 2; ypT2 2; ypT3 4
      transform_kind: categorical
      importance_rank: 2
      note: >-
        ypT1 AND ypT2 SHARE ONE POINT VALUE, the figure's middle tick reads "ypT1/pT2" over a
        single mark. Four categories, three weights. Splitting them would invent a distinction the
        model does not make.
        Retained in the final model despite not being independently significant in Table 2 (ypT0
        0.76, ypT2 1.02, ypT3-4 1.15, all P > 0.3 against a ypT1 reference), which is why its
        reference level differs between the two tables: Table 2 references ypT1, the nomogram
        references ypT0.
    - name: cn_category
      label: cN, clinical nodal category before treatment (UICC TNM 6th ed.)
      coefficient: null
      units: binary
      transform: cN0 0 pts; cN1 2
      transform_kind: dichotomy
      importance_rank: 3
      note: >-
        SIXTH EDITION, AND BINARY, cN0 versus cN1, not the modern N0-N3. A warehouse holding
        8th-edition clinical N cannot supply this variable without a mapping decision, and passing
        "cN2" is refused by the module rather than mis-scored.
        The smallest contributor at 2 points, but the only PRE-treatment variable in the model: it is
        what stops this being purely a description of the resection specimen.
    - name: (points-to-survival axes)
      label: Fig. 1's printed lookup
      coefficient: null
      units: per cent
      transform: 'points 0/2/4/6/8/10/12/14/16 -> 1-yr 91/88/85/81/75/68/60/51/41 and 5-yr
        70/62/53/43/33/23/14/7/3'
      transform_kind: banding
      importance_rank: null
      note: >-
        THE REASON THIS PAPER IS IMPLEMENTABLE AT ALL. Every other Cox nomogram this project has
        examined, four cervical prognosis papers, msk_prostate_post_rp, printed this step as a
        drawn axis, leaving S(t) = S0(t)^exp(Xb) without its baseline. Here the axes carry numeric
        tick labels, so the lookup is complete and no S0(t) is needed.
        Its limit is that the ticks are at EVEN totals only, so the four reachable odd totals
        (5, 7, 9, 11) have no published value and the module returns None.
    - name: (the Cox fit deliberately not used)
      label: Why the four gaps are not filled
      coefficient: 0.1411
      units: per point on the log-hazard scale
      transform: 'S(p) = S0^exp(0.1411 p), with S0 = 0.91 at 1 year and 0.70 at 5 years'
      transform_kind: none
      importance_rank: null
      note: >-
        Recorded, and NOT applied. This form reproduces all eighteen printed survival values with a
        worst deviation under one percentage point, so filling in totals 5, 7, 9 and 11 from it would
        be easy and would look authoritative. It would also be this project generating numbers rather
        than reading them, which is the line the repository does not cross, so the module returns
        None and says why.
        It also exposes an unresolved inconsistency in the source: the Methods say the points are the
        Cox coefficients "multiplied by ten", implying 0.1 per point, while the axis behaves like
        0.141. The final model's coefficients are printed nowhere, so the article cannot settle it,
        and nothing in the implementation depends on settling it.
  rmi:
    axis: detection
    importance_basis: structural. RMI is MULTIPLICATIVE, so no term is additively "largest"; the ranking
      below is by the factor by which each can move the index
    top_parameter: ca125
    top_parameter_why: CA-125 is the only unbounded factor and it enters LINEARLY AND UNTRANSFORMED, so
      the index is directly proportional to it. U and M multiply by at most 3-4 each; CA-125 routinely
      spans 10 to 500 U/mL, a 50-fold range. That is also the model's weakness, false positives cluster
      wherever CA-125 is raised for benign reasons.
    paper_importance_quote: null
    equation: 'RMI = U * M * CA-125  (RMI 4: * S); refer above the cutoff'
    params:
    - name: ca125
      label: Serum CA-125
      coefficient: null
      units: U/mL
      transform: MULTIPLIED IN RAW, no log, no centering, no cap
      transform_kind: identity (multiplicative)
      importance_rank: 1
      note: Because it is linear and untransformed, false positives cluster wherever CA-125 is raised
        for reasons unrelated to malignancy, endometriosis, PID, menstruation, ascites of any cause.
        RMI is diagnostic triage for a KNOWN MASS, not a screening test.
    - name: ultrasound_score
      label: Ultrasound morphology score (U)
      coefficient: null
      units: count 0-5 of features
      transform: 'RMI1: 0->0, 1->1, 2-5->3.  RMI2/4: 0-1->1, 2-5->4.  RMI3: 0-1->1, 2-5->3'
      transform_kind: categorical (multiplicative)
      importance_rank: 2
      note: RMI 1 SETS U=0 WHEN THE SCORE IS 0, forcing the WHOLE INDEX TO 0 regardless of CA-125. Reproduced
        faithfully, and it is the reason RMI 2 and 3 exist. The five features are multilocular cyst,
        solid areas, bilateral lesions, ascites, intra-abdominal metastases.
    - name: postmenopausal
      label: Menopausal score (M)
      coefficient: null
      units: indicator
      transform: premenopausal 1; postmenopausal 3 (RMI 1/3) or 4 (RMI 2/4)
      transform_kind: dichotomy (multiplicative)
      importance_rank: 3
    - name: max_diameter_cm
      label: Tumour size score (S)
      coefficient: null
      units: cm
      transform: 'RMI 4 ONLY: 1 if < 7 cm, 2 if >= 7 cm. Ignored by RMI 1/2/3.'
      transform_kind: dichotomy (multiplicative)
      importance_rank: 4
      note: Required for rmi4 and warned-about if supplied to any other variant.
    - name: variant
      label: RMI variant
      coefficient: null
      units: rmi1 / rmi2 / rmi3 / rmi4
      transform: selects the U and M mappings AND the cutoff (200 for RMI 1/2/3, 450 for RMI 4)
      transform_kind: derived
      importance_rank: null
      note: The four published variants disagree on both the mappings and the cutoff, so the SAME PATIENT
        gets different calls under different variants. Output is an INDEX, not a probability, there is
        no link function and the only published interpretation is "above cut-off, refer to gynae-oncology".
  roma:
    axis: detection
    importance_basis: the coefficients themselves, which differ by an order of magnitude across menopausal
      strata
    top_parameter: he4_pmol_l
    top_parameter_why: 'HE4 dominates premenopausally to an extreme degree, its coefficient is 2.38 against
      CA-125''s 0.0626, a 38-fold ratio, so the premenopausal model is very nearly an HE4-only model.
      Postmenopausally the two are comparable (1.04 vs 0.732). That is the model encoding a clinical fact:
      CA-125 is elevated by benign gynaecological disease common in premenopausal women, so it discriminates
      poorly there.'
    paper_importance_quote: Moore 2009 reports much weaker premenopausal sensitivity (76.5%, 95% CI 58.8-89.3)
      than postmenopausal (92.3%), consistent with CA-125 contributing almost nothing to the premenopausal
      index.
    equation: 'Premenopausal:   PI = -12.0 + 2.38*ln(HE4) + 0.0626*ln(CA125)

      Postmenopausal:  PI =  -8.09 + 1.04*ln(HE4) + 0.732*ln(CA125)

      PP = exp(PI) / (1 + exp(PI))

      '
    params:
    - name: he4_pmol_l
      label: Human epididymis protein 4
      coefficient: 2.38
      coefficient_postmenopausal: 1.04
      units: pmol/L
      transform: ln(HE4). NATURAL log, not log10
      transform_kind: log
      importance_rank: 1
      note: Assay-specific (HE4 EIA, Fujirebio). pmol/L, not ng/mL.
    - name: ca125_u_ml
      label: Cancer antigen 125
      coefficient: 0.0626
      coefficient_postmenopausal: 0.732
      units: U/mL
      transform: ln(CA125)
      transform_kind: log
      importance_rank: 2
      note: THE PREMENOPAUSAL COEFFICIENT IS ESSENTIALLY ZERO (0.0626). A 10-fold rise in CA-125 moves
        the premenopausal index by 0.14, less than a 7% change in HE4 does. Assay-specific (Architect
        CA125II, Abbott).
    - name: postmenopausal
      label: Menopausal status
      coefficient: null
      units: indicator
      transform: selects one of TWO SEPARATE MODELS, different intercept and both slopes
      transform_kind: derived
      importance_rank: null
      note: Not an indicator term. The two strata are different models, not one model with an offset.
    - name: cutoff_source
      label: High-risk threshold
      coefficient: null
      units: probability
      transform: 'paper (default): pre >13.1%, post >27.7%.  assay_insert: pre >=11.4%, post >=29.9%'
      transform_kind: banding
      importance_rank: null
      note: TWO SETS OF CUTOFFS EXIST AND THEY CROSS OVER. The commercial cutoff is MORE sensitive premenopausally
        and LESS sensitive postmenopausally. A premenopausal woman at PP = 12% is low risk by the paper
        and high risk by the assay insert. The coefficients are not in doubt, paper, Abbott/Fujirebio
        insert and ARUP all print the same six numbers.
  msk_ovarian:
    axis: prognosis
    importance_basis: measured sweep; coefficients recovered from the deployed R source
    top_parameter: residual_disease
    top_parameter_why: Residual disease after cytoreduction is the largest single effect in the model,
      spanning -0.541 (no gross residual) to +0.622 (>2 cm), a range of 1.16 in the linear predictor,
      more than twice any other term. It is the whole clinical argument for maximal cytoreductive surgery,
      and it is the only variable in the model the surgeon controls.
    paper_importance_quote: null
    equation: S(5y) = 0.4284861 ** exp(Xb)
    params:
    - name: residual_disease
      label: Residual disease after primary surgery
      coefficient: null
      units: 5 categories
      transform: no gross residual -0.54064543; <0.5 cm -0.3062644; 0.5-1 cm 0 (REFERENCE); 1-2 cm +0.5518022;
        >2 cm +0.6219986
      transform_kind: categorical
      reference_level: 0.5-1 cm. THE MIDDLE CATEGORY
      importance_rank: 1
      note: THE REFERENCE IS THE MIDDLE CATEGORY, not either end, so two levels carry negative terms and
        two positive. A reader expecting "no residual disease" to be the reference will misread every
        coefficient in the row. Monotone in the right direction once that is understood.
    - name: ascites
      label: Ascites
      coefficient: 0.57912923
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 2
      note: The largest binary term, comparable to moving two residual-disease categories.
    - name: age
      label: Age
      coefficient: 0.014563065
      units: years
      transform: linear + RCS at 44, 60, 75
      transform_kind: spline
      importance_rank: 3
      note: Validated range 22-87, enforced.
    - name: platelets
      label: Pre-operative platelet count
      coefficient: 0.00063621499
      units: x10^3/uL
      transform: platelets, untransformed and NOT splined
      transform_kind: identity
      importance_rank: 4
      note: Tiny coefficient over a large validated range (113-1078), so it contributes meaningfully at
        the extremes. Thrombocytosis is a known adverse marker in ovarian cancer.
    - name: histology_yes
      label: Tumour histology (Yes/No)
      coefficient: -0.18814327
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 5
      note: WE CANNOT SAY WHAT "YES" MEANS. The hosted tool labels the input simply "Tumor Histology"
        with Yes/No choices and the coefficient is on "Yes"; the paper's series is serous carcinoma, but
        that mapping is not recoverable from the code. The argument is named `histology_yes` rather than
        inventing a meaning. Read Chi 2008 before clinical use.
    - name: grade
      label: Tumour grade
      coefficient: -0.053519323
      units: 1-2 vs 3
      transform: grade 3 -> -0.053519323; grade 1-2 -> 0 (reference)
      transform_kind: dichotomy
      reference_level: grade 1-2
      importance_rank: 6
      note: NEGATIVE, grade 3 scores BETTER than grade 1-2 in this model. The effect is tiny and its
        sign is counter-intuitive. Reproduced as published; in a bulky stage IIIC series grade carries
        little information once residual disease is known.
  cervical_cin_risk:
    axis: detection
    importance_basis: the coefficients, which are directly comparable here because every predictor is
      binary or a single centered continuous term
    top_parameter: cytology
    top_parameter_why: 'Cytology is by far the largest term in the model, and its top level is extreme:
      SCC/ADC carries 7.199 in the base model, about 3.5 TIMES the hrHPV coefficient (2.068) and the
      single largest number anywhere in the equation. The cytology levels are also strongly ordered, so
      the variable behaves like a graded severity scale rather than a set of labels.'
    paper_importance_quote: null
    equation: logit(p) = intercept + b_hrHPV*hrHPV + b_cytology + b_age*age [+ b_E6*E6] [+ genotype terms]
    coefficient_note: Coefficients shown are the BASE variant; e6, genotyping and full variants have their
      own full sets.
    params:
    - name: cytology
      label: Cervical cytology (Bethesda)
      coefficient: 7.19866
      units: 7 levels
      transform: NILM 0 (reference); ASC-US +1.36354; LSIL +1.51085; ASC-H +3.55612; AGC +4.28591; HSIL/AIS
        +4.90115; SCC/ADC +7.19866
      transform_kind: categorical
      reference_level: NILM
      importance_rank: 1
      note: Must be reported on the BETHESDA system. Note ASC-H (3.556) outranks LSIL (1.511) by a wide
        margin despite both being "low-grade-ish" names. ASC-H means atypical squamous cells where HSIL
        cannot be excluded, and it behaves like a high-grade result.
    - name: hrhpv_positive
      label: High-risk HPV DNA/mRNA
      coefficient: 2.06771
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 2
      note: Falls to 1.517 in the genotyping variants, because the individual genotype terms absorb part
        of it. Coefficients are not portable across variants.
    - name: age
      label: Age
      coefficient: -0.01935
      units: years
      transform: age, untransformed and UNCENTERED
      transform_kind: identity
      importance_rank: 3
      note: NEGATIVE, AND THAT IS NOT AN ERROR. Conditional on hrHPV status and cytology, older women
        in this screening population were at slightly LOWER CIN risk, because prevalent HPV infection
        in younger women is more likely to be transient but is still counted as positive. Do not correct
        the sign. The coefficient roughly doubles (-0.044 to -0.049) in the E6-containing variants.
    - name: e6_positive
      label: HPV16/18 E6 oncoprotein
      coefficient: 1.9361
      units: indicator
      transform: 1/0; required for the e6 and full variants, rejected by the others
      transform_kind: dichotomy
      importance_rank: 4
      note: Adding E6 raises the intercept from -3.19 to -1.64, i.e. it re-baselines the whole model.
    - name: genotypes
      label: HPV extended genotyping (9 pooled groups)
      coefficient: 1.44896
      units: 9 indicators
      transform: HPV16 +1.44896; HPV52 +0.89489; HPV33/58 +0.79158; HPV18 +0.95014; HPV39/68/35 +0.6052;
        HPV31 +0.35975; HPV45 +0.12346; HPV51 -1.08557; HPV59/56/66 -1.14307
      transform_kind: categorical (non-exclusive indicators)
      importance_rank: 5
      note: TWO GROUPS CARRY LARGE NEGATIVE COEFFICIENTS — HPV51 (-1.086) and HPV59/56/66 (-1.143). Conditional
        on being hrHPV-positive, carrying one of these instead of HPV16 is substantially reassuring. The
        pooled groups are the paper's own and are NOT interchangeable with other groupings. Note HPV18
        flips sign (+0.950 -> -0.402) between the genotyping and full variants.
    - name: variant
      label: Model variant
      coefficient: null
      units: base / e6 / genotyping / full
      transform: selects one of four nested coefficient sets
      transform_kind: derived
      importance_rank: null
      note: 'Scope: Chinese screening population; outcome is CIN2+/CIN3+ AT COLPOSCOPY, not invasive cancer
        incidence over time.'
  cibula_arrm:
    axis: prognosis
    importance_basis: >-
      the paper's own points column, cross-tabulated against the prevalence of each level in its own
      Table 1. ARRM is unusual in that its published points ARE a standardised importance ranking:
      every beta is divided by the same constant (100/5.231), so unlike raw coefficients on different
      scales the points are directly comparable across predictors. That makes the "largest
      coefficient" and "the paper's own ranking" bases collapse into one, and it makes them DISAGREE
      with the third basis, measured swing over a clinical range, which is why this entry records the
      disagreement rather than picking a winner silently.
    top_parameter: tumour_diameter_cm
    top_parameter_why: >-
      Largest expected contribution by a factor of 2.8, computed from the paper's own numbers.
      Weighting each level's points by its Table 1 prevalence gives an average contribution of 14.4
      points for tumour diameter, against 5.2 for grade, 4.4 for LVSI, 2.9 for histotype and at most
      2.7 for positive pelvic nodes. Diameter earns points from 84% of patients (only the 16.4% under
      0.5 cm score zero) and 44% of the cohort sits in the 21- or 30-point levels.
      HISTOTYPE HAS THE STRONGER CLAIM ON THE OTHER READING, because
      whichever number gets quoted will be quoted alone: neuroendocrine is 33 points, the single
      largest value anywhere in the model, a third of the entire scale, and enough on its own to move
      a patient with no other risk factor two bands. It averages only 2.9 because neuroendocrine is
      1.0% of the cohort and "other" 1.2%. So: diameter is what moves the average patient, histotype
      is what moves the extreme one. Neither statement is wrong and they are not interchangeable.
    paper_importance_quote: >-
      Cibula 2021 makes no importance claim in prose, checked, there is no "the strongest predictor
      was..." sentence anywhere in the Results or Discussion. What it publishes instead is Table 2's
      "Risk points (max. 100)" column, which is a ranking by construction: 'A risk score was derived
      from regression coefficients (β) of the final model, which were weighted to the maximum sum of
      100 points.' The ranking below is therefore the authors' own arithmetic, not a reader's
      inference from it.
    equation: >-
      score = Σ points over the five predictors, 0-100, where points = round(β × 100/5.231);
      band = 0 | 1-25 | 26-50 | 51-75 | 76-100; each band returns the derivation cohort's observed
      Kaplan-Meier disease-free survival and its conditional annual recurrence risk for years 1-5.
      There is no baseline hazard and no individual probability.
    params:
    - name: tumour_diameter_cm
      label: Maximal pathologic tumour diameter
      coefficient: 1.556
      units: cm
      transform: '<0.5 cm = 0 pts (ref); 0.5-1.99 = 10; 2-3.99 = 21; >=4 = 30'
      transform_kind: banding + categorical
      importance_rank: 1
      note: >-
        The coefficient recorded is the largest of the three (>=4 cm); the others are 0.501 (10 pts)
        and 1.115 (21 pts). PATHOLOGIC, not imaged, the measurement comes off the resection
        specimen, so this model cannot be run before surgery. Two unit traps sit on this one
        parameter. The paper bands in centimetres and the authors' own calculator labels the
        identical cut-points in millimetres (<5, 5-19, 20-39, >=40), so a pipeline that carries the
        warehouse's units through unconverted is wrong by a factor of ten and raises nothing. And the
        bands are closed on the left: a 2.0 cm tumour scores 21, not 10.
    - name: histotype
      label: Tumour histotype
      coefficient: 1.741
      units: category
      transform: 'squamous = 0 pts (ref); adenocarcinoma = 7; adenosquamous = 11; other = 22;
        neuroendocrine = 33'
      transform_kind: categorical
      importance_rank: 2
      note: >-
        The coefficient recorded is neuroendocrine, the largest in the model. Ranked second only
        because it is rare; see top_parameter_why. Note the ordering is NOT monotone in the obvious
        clinical reading: "other" (22 pts, β 1.145) outranks adenosquamous (11 pts) and sits between
        it and neuroendocrine, so "other" is not a residual catch-all with a small weight, it is the
        second-heaviest level in the model. Any pipeline mapping ICD-O-3 morphology onto these five
        categories is making an 11- to 33-point decision per patient.
    - name: positive_pelvic_nodes
      label: Number of positive pelvic lymph nodes
      coefficient: 0.939
      units: count
      transform: '0 or not assessed = 0 pts (ref); 1 = 5; 2 = 9; >=3 = 18'
      transform_kind: banding + categorical
      importance_rank: 3
      note: >-
        The coefficient recorded is >=3 nodes; 1 node is 0.255 (p=0.098, HR 1.291 with a CI crossing
        1) and 2 nodes 0.482. PELVIC nodes specifically, para-aortic nodes are collected separately
        in the same cohort and are not this variable. The reference level pools zero with NOT
        ASSESSED, and that pooling is load-bearing rather than incidental: 13.1% of the derivation
        cohort (567 of 4,343) had no pelvic lymphadenectomy at all, and every one of them scored zero
        here. A missing value is therefore silently optimistic, and it is optimistic in a way that
        occurred in one patient in eight of the data the model was fitted on.
    - name: lvsi
      label: Lymphovascular space invasion
      coefficient: 0.538
      units: binary
      transform: no or not assessed = 0 pts (ref); yes = 10 pts
      transform_kind: dichotomy
      importance_rank: 4
      note: >-
        Same "not assessed" pooling as the nodes and at a similar rate: LVSI was not available for
        19.3% (838) of the cohort. The module accepts None and reproduces the pooling, and says so in
        `notes` every time, which is the only thing distinguishing "we looked and it was clean" from
        "nobody looked".
    - name: grade
      label: Histological grade
      coefficient: 0.457
      units: ordinal 1-3
      transform: grade 1 = 0 pts (ref); grade 2 = 5; grade 3 = 9
      transform_kind: ordinal
      importance_rank: 5
      note: >-
        THE ONLY REQUIRED INPUT, AND THE WEAKEST EVIDENCED ONE, worth stating together, because the
        module's strictest demand falls on the model's least significant variable. Neither grade level
        reaches significance in Table 2: grade 2 is p=0.235 with HR 1.297 (0.852; 1.976) and grade 3
        is p=0.085 with HR 1.579 (0.970; 2.570), both CIs crossing 1. It is retained in the published
        model regardless, so it is retained here.
        It is required rather than defaultable because Table 2 gives it no "not assessed" level,
        unlike the nodes and LVSI. That is the correct reading of the table and it has a real cost:
        grade was missing for 27.6% of the derivation cohort (1,199 of 4,343) and was handled by
        multiple imputation over five datasets, which cannot be reproduced for a single patient. So
        the module refuses a case that occurred in more than a quarter of the development data rather
        than quietly scoring it as grade 1.
    - name: (points divisor)
      label: Beta-to-points constant
      coefficient: 19.116803670426304
      units: points per unit beta
      transform: points = round(beta × 100/5.231), where 5.231 is the sum of the largest beta in each
        predictor
      transform_kind: scaling
      importance_rank: null
      note: >-
        NEVER PRINTED IN THE PAPER. Recovered from the sentence that describes the construction
        ("weighted to the maximum sum of 100 points") taken literally, and then confirmed rather than
        assumed: all thirteen published point values reproduce under round(β × 19.1168) with no
        exceptions and no rounding fudge, and the worst possible patient scores exactly 100. Same
        technique this library used to recover the Kunzmann divisor. Carried here because a reader
        checking the points column against the beta column needs the constant that links them, and
        because it is the single number that would silently rescale every point value in the model.
    - name: (band cut-points)
      label: Risk-group bands
      coefficient: null
      units: points
      transform: '0 | 1-25 | 26-50 | 51-75 | 76-100'
      transform_kind: banding
      importance_rank: null
      note: >-
        Zero is its own band, not the bottom of the first 25-point interval, the paper's phrase is
        "25-point intervals with the exception" of the zero group, and that group is the one the
        surveillance argument turns on (213 patients, 4 recurrences, 5-year DFS 97.5%). At the other
        end the 76-100 band holds 13 patients and 12 recurrences, so its published figures are
        descriptive of thirteen people; the paper stops its landmark analysis there at year three and
        the module returns None for years four and five rather than the 0.0% the arithmetic gives.
        `risk` is None throughout: this is a stratifier that reports its band's observed outcome, not
        a calibrated individual probability.
  moore_criteria:
    axis: response
    importance_basis: >-
      the paper's own Table 3 point estimates, with a caveat that has to travel with the ranking: the
      authors themselves judge the five factors "comparable" and weight them EQUALLY in the published
      index (a simple count, 0-5). Ranking them by point estimate is informational only, it answers
      "which factor's odds ratio sits furthest from 1.0 in this cohort", not "which factor the model
      weights more heavily", because the model does not weight any of them differently. No paper_importance
      basis of "largest coefficient" applies cleanly here: there is no coefficient, only an odds ratio the
      paper explicitly declines to use as a weight.
    top_parameter: black_race
    top_parameter_why: >-
      Furthest from the null on point estimate (OR 0.49), narrowly ahead of prior_radiosensitizer (0.52).
      STATED WITH THE CAVEAT THE PAPER ITSELF INSISTS ON: the five 95% CIs overlap substantially (race
      0.28-0.83 vs. recurrence timing 0.39-0.95), which is exactly why the authors call the weights
      "comparable" and built a count rather than a weighted score. Naming a top parameter here answers a
      narrower question than usual, which single-cohort point estimate was largest, and should not be
      read as "the model relies on race more than the others", because it does not rely on any of them more
      than the others by construction.
    paper_importance_quote: >-
      Moore 2010, verbatim: "Given that the five risk factors identified conferred comparable weights and
      there were no interactions across them, a simple prognostic index was developed by combining the
      number of risk factors." This is the paper stating, in its own words, that no single factor should be
      read as more important than the rest, the opposite of the usual "largest coefficient" claim this
      field records for other models.
    equation: count = number of 5 binary factors present (NOT a weighted sum); band = low 0-1 | mid 2-3 |
      high 4-5; output = Table 4's published response rate and median PFS/OS for that band, development and
      external (GOG 149) cohorts
    params:
    - name: black_race
      label: Race (Black vs. non-Black)
      coefficient: 0.49
      units: odds ratio (not a beta; the paper prints no logistic coefficient scale for this model)
      transform: present/absent, +1 to the count if present
      transform_kind: dichotomy
      importance_rank: 1
      note: >-
        THE FACTOR REQUIRING THE MOST CARE IN THIS ENTRY. Table 3's actual test is "Black vs. Non-black";
        the paper's own Results and Discussion instead say "African-American" throughout, so even the
        source is not internally consistent about which word names this variable. The OR (0.49, 95% CI
        0.28-0.83, P 0.008) is a fact about this specific cohort, not a biological claim, the Discussion
        says so, weighing access-to-care against biological hypotheses without resolving between them.
        Never used as a weight; counted identically to the other four. Same handling precedent as
        pbcg_extended's African-ancestry term, which documents a race coefficient that FLIPS SIGN between
        two of that model's own sub-models, the standing reminder in this library that these terms are
        cohort-specific and not stable biological constants.
    - name: prior_radiosensitizer
      label: Prior radiosensitizing chemotherapy (concurrent cisplatin WITH radiotherapy)
      coefficient: 0.52
      units: odds ratio
      transform: yes/no, +1 to the count if yes
      transform_kind: dichotomy
      importance_rank: 2
      note: Means cisplatin given CONCURRENTLY with prior radiotherapy specifically, not cisplatin given
        alone at some unrelated time. Table 1 reports it as a variable distinct from any later recurrence
        chemotherapy.
    - name: disease_site
      label: Site of disease (pelvic vs. non-pelvic)
      coefficient: 0.58
      units: odds ratio
      transform: pelvic scores; distant or combined do not
      transform_kind: categorical + dichotomy
      importance_rank: 3
      note: >-
        THE ONE GENUINE GAP IN THE SOURCE. Table 1/2 record THREE levels, pelvic, distant, combined
        (13.1% of the 428-patient development cohort), but Table 3 tests a binary "Pelvic vs.
        Non-pelvic" and the paper never states in prose which side "combined" falls on. This module reads
        the label literally (everything that is not pelvic-only is non-pelvic) and flags every case where
        that inference fires, in `notes`. A different, equally defensible reading (combined counts as
        pelvic, since pelvic disease is present) would move 56 development patients across the factor.
    - name: performance_status
      label: GOG/ECOG performance status > 0
      coefficient: 0.60
      units: odds ratio
      transform: PS 1-4 scores; PS 0 does not
      transform_kind: dichotomy
      importance_rank: 4
      note: The cut is PS > 0, not PS >= some worse grade, a GOG PS of 1 (symptomatic but fully
        ambulatory) counts identically to a PS of 4 in this index. Accepted here as the raw 0-4 score and
        dichotomised internally, the same way cibula_arrm bands a continuous diameter rather than asking
        the caller to pre-band it.
    - name: months_diagnosis_to_first_recurrence
      label: Interval from original diagnosis to first recurrence
      coefficient: 0.61
      units: odds ratio
      transform: '<= 12 months scores; > 12 months does not'
      transform_kind: dichotomy
      importance_rank: 5
      note: >-
        LOWEST point estimate of the five and the one closest to the null, if the "comparable weights"
        claim has an exception, this is the candidate, though its CI (0.39-0.95) overlaps every other
        factor's. Measured from the ORIGINAL cancer diagnosis to the FIRST recurrence, not from the start
        of the chemotherapy regimen this model evaluates, a different and later date a caller could
        confuse it with.
    - name: (odds ratios not used as weights)
      label: Why five odds ratios sit in this file and compute nothing
      coefficient: null
      units: n/a
      transform: none, count each present factor as 1, ignore its odds ratio entirely
      transform_kind: none
      importance_rank: null
      note: >-
        The paper's own construction, quoted in full under paper_importance_quote. Recorded because every
        other points-table model in this library (kunzmann, xu_gastric_trg_score) recovers a divisor that
        turns coefficients into the published weights, and a reader who expects the same pattern here would
        go looking for one that does not exist. There is no divisor to find: the published weight on every
        factor is exactly 1, by the authors' explicit choice, not by a derivation this project performed.
  endpac:
    axis: detection
    importance_basis: point allocation, weight change can contribute +/-6 of a total range of -6 to 11
    top_parameter: weight_change_kg
    top_parameter_why: 'Weight change has the widest point range in the score (-6 to +6), wider than glucose
      (1 to 4) and age (-1 to +1) combined. It is also the term whose SIGN is most often inverted: weight
      LOSS scores POSITIVE. The clinical logic is that the diabetes is a consequence of the tumour, and
      unexplained weight loss alongside new diabetes is the tell.'
    paper_importance_quote: null
    equation: END-PAC = A(glucose change) + B(weight change) + C(age); >=3 high, 1-2 intermediate, <=0
      very low
    params:
    - name: weight_change_kg
      label: Weight change over the preceding year
      coefficient: null
      points: '<=-6.0: +6; -5.9..-4.0: +4; -3.9..-2.0: +2; -1.9..+1.9: 0; +2.0..+3.9: -2; +4.0..+5.9:
        -4; >=+6.0: -6'
      units: kg
      transform: 7-level banding of the SIGNED change; LOSS is a negative input and a POSITIVE score
      transform_kind: banding
      importance_rank: 1
      note: SIGN ERRORS HERE INVERT THE WHOLE MODEL. Losing >=6 kg scores +6; gaining >=6 kg scores -6.
    - name: glucose_at_diabetes_mg_dl
      label: Blood glucose at diabetes onset
      coefficient: null
      points: contributes its CATEGORY INDEX, 4 or 5
      units: mg/dL
      transform: 'BG category: <100 -> 1; 100-109 -> 2; 110-125 -> 3; 126-160 -> 4; >160 -> 5. Term A
        = category(now) - category(1y before).'
      transform_kind: banding + difference
      importance_rank: 2
      note: A DIFFERENCE OF CATEGORY INDICES, NOT OF mg/dL VALUES. A rise from 95 to 130 mg/dL is category
        1 -> 4, i.e. A = 3. The paper's Table 2 footnote describes a DIFFERENT variant ("model B") scoring
        1 point per 10 mg/dL; that is not this score.
    - name: glucose_one_year_before_mg_dl
      label: Blood glucose one year before
      coefficient: null
      points: contributes its category index, 1-3
      units: mg/dL
      transform: same BG category scale; must be < 126 mg/dL or the patient was already diabetic
      transform_kind: banding
      importance_rank: 2
      note: Table 1 assigns categories 1-3 to the -1 year reading and 4-5 to the reading at onset, so
        term A is bounded to 1-4. The module enforces the pair; without that check an out-of-scope pair
        (say a FALL from diabetic to normal) silently yields a score far outside the published range.
    - name: age_at_diabetes_onset
      label: Age at diabetes onset
      coefficient: null
      points: '<=59: -1; 60-69: 0; >=70: +1'
      units: years
      transform: 3-level banding
      transform_kind: banding
      importance_rank: 3
      note: The narrowest term in the score; effectively a tie-breaker.
    - name: (risk bands)
      label: Score -> risk band
      coefficient: null
      units: n/a
      transform: '>=3 high; 1 or 2 intermediate; <=0 very low'
      transform_kind: banding
      importance_rank: null
      note: THE <=0 BOUNDARY IS DEFENDED ARITHMETICALLY. The abstract writes "<0" and the Results write
        "<=0", both citing the same 49%. The paper's own group proportions sum to exactly 100% (19+32+49
        and 77+21+2) ONLY under <=0; under <0 a score of exactly 0 would belong to no group. This module
        previously implemented the abstract's "<0", which put score 0 on the wrong side of the boundary
        between "extremely low risk, reassure" and "needs follow-up".
  msk_pancreatic:
    axis: prognosis
    importance_basis: measured sweep, which DISAGREES with the largest coefficient, recorded rather than
      resolved
    top_parameter: t_stage
    top_parameter_why: T stage carries the largest measured swing (28.5 percentage points), narrowly ahead
      of splenectomy. But splenectomy has the LARGEST SINGLE COEFFICIENT in the model (+0.907) and does
      not top the swing ranking, because it is a rare binary while T stage always takes some value. This
      is the cleanest example in the repository of why "largest coefficient" and "most important" are
      different questions.
    paper_importance_quote: null
    equation: S(t) = S0(t) ** exp(Xb);  S0 = 0.6775 at 12 months, 0.3457804 at 24, 0.1976732 at 36
    params:
    - name: t_stage
      label: T stage
      coefficient: null
      units: T1-T4
      transform: T1 0 (reference); T2 -0.53691787; T3 -0.38735092; T4 +0.3867342
      transform_kind: categorical
      reference_level: T1
      importance_rank: 1
      note: NOT MONOTONE. Against a T1 reference, T2 (-0.537) and T3 (-0.387) are both BETTER than T1,
        while T4 is worse. Reproduced as published; do not "fix" the ordering.
    - name: splenectomy
      label: Splenectomy performed
      coefficient: 0.90746165
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 2
      note: THE LARGEST SINGLE COEFFICIENT IN THE MODEL, larger than any nodal or margin effect. It is
        a marker of extended resection for locally advanced disease, not a treatment effect, and certainly
        not a reason to avoid splenectomy.
    - name: positive_nodes
      label: Positive lymph nodes
      coefficient: 0.23051721
      units: count
      transform: linear + RCS at 0, 1, 5
      transform_kind: spline
      importance_rank: 3
      note: Validated range 0-39. Knots at 0/1/5 put all the resolution in the first few nodes.
    - name: size_cm
      label: Maximum tumour size
      coefficient: 0.43940983
      units: cm
      transform: linear + RCS at 2, 3.2, 5.5
      transform_kind: spline
      importance_rank: 4
      note: A LABELLING DEFECT IN THE HOSTED TOOL. Its size input is labelled "Maximum Path Axis (mm)",
        but the validated range is 0.1-16 and the spline knots sit at 2, 3.2 and 5.5, those are CENTIMETRES.
        A user entering "8" meaning 8 mm would silently be scored as an 8 cm tumour. This module takes
        centimetres and says so.
    - name: location
      label: Resection location
      coefficient: -0.75934357
      units: head vs other
      transform: head 0 (reference); NOT head -0.75934357
      transform_kind: dichotomy
      reference_level: head of pancreas
      importance_rank: 5
      note: Non-head tumours score substantially BETTER. Head is the reference.
    - name: differentiation
      label: Tumour differentiation
      coefficient: null
      units: well / moderate / poor
      transform: moderate 0 (reference); well -0.20496646; poor +0.31532231
      transform_kind: categorical
      reference_level: moderately differentiated
      importance_rank: 6
      note: Reference is the MIDDLE level, so well-differentiated carries a negative term.
    - name: posterior_margin_positive
      label: Posterior margin positive
      coefficient: 0.3177352
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 7
      note: Note this is SEPARATE from and larger than the general resection-margin term (+0.063).
    - name: back_pain
      label: Back pain
      coefficient: 0.22200163
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 8
      note: A symptom, not a pathological finding, a proxy for retroperitoneal/perineural extension.
    - name: portal_vein_resected
      label: Portal vein resected
      coefficient: 0.14916275
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 9
    - name: negative_nodes
      label: Negative lymph nodes
      coefficient: -0.0017790967
      units: count
      transform: negative_nodes, untransformed and NOT splined
      transform_kind: identity
      importance_rank: 10
      note: Protective but very weak here (validated range 0-83), unlike the gastric nomogram, where
        the same variable is one of the strongest terms. The same clinical quantity carries very different
        weight in two models by the same group.
    - name: age
      label: Age
      coefficient: -0.0018564703
      units: years
      transform: age, untransformed
      transform_kind: identity
      importance_rank: 11
      note: Negative and nearly inert. Validated range 33-89.
    - name: male
      label: Male sex
      coefficient: 0.052203014
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      reference_level: female
      importance_rank: 12
    - name: weight_loss
      label: Weight loss
      coefficient: 0.04259022
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 13
    - name: resection_margin_positive
      label: Resection margin positive
      coefficient: 0.06340785
      units: indicator
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 14
      note: Strikingly small for what is normally a headline surgical outcome, a fifth of the posterior-margin
        term. Reproduced as published.
  ang2010_rpa:
    axis: prognosis
    importance_basis: tree structure. HPV status is the FIRST SPLIT, so it is important in a sense no
      coefficient can express
    top_parameter: hpv_positive
    top_parameter_why: 'HPV status is the root of the recursive-partitioning tree. Every other variable
      is only consulted inside one of its two branches, and they are DIFFERENT variables in each: nodal
      stage matters only if HPV-positive, T stage only if HPV-negative. A patient''s HPV status does not
      merely shift their risk, it determines which questions get asked at all. 3-year OS is 93.0% for
      low risk against 46.2% for high.'
    paper_importance_quote: 'Ang 2010 Results, verbatim: "Patients with HPV-positive tumors were considered
      to be at low risk, with the exception of smokers with a high nodal stage (i.e., N2b to N3), who
      were considered to be at intermediate risk; patients with HPV-negative tumors were considered to
      be at high risk, with the exception of nonsmokers with tumors of stage T2 or T3, who were considered
      to be at intermediate risk."'
    equation: a 3-level decision tree; no linear predictor exists
    params:
    - name: hpv_positive
      label: Tumour HPV / p16 status
      coefficient: null
      units: indicator
      transform: ROOT SPLIT of the tree, selects which branch, and therefore which other variables, apply
      transform_kind: categorical (tree root)
      importance_rank: 1
      paper_effect: 'hazard ratio vs low risk: intermediate 3.54, high 7.16'
    - name: pack_years
      label: Smoking, pack-years
      coefficient: null
      units: pack-years
      transform: dichotomised at 10 pack-years; applied on BOTH branches
      transform_kind: dichotomy
      importance_rank: 2
      note: A DOCUMENTED AMBIGUITY. Ang's text says ">10 pack-years" on the HPV-positive branch but "nonsmokers"
        on the HPV-negative one. Fakhry et al.'s external validation operationalises BOTH as "low tobacco
        exposure", the same <=10/>10 split, and this module applies it to both branches under either
        definition.
    - name: n_stage
      label: Nodal stage (AJCC 7th ed.)
      coefficient: null
      units: N0-N3
      transform: 'HPV-POSITIVE BRANCH ONLY: N2b/N2c/N3 counts as high nodal stage'
      transform_kind: categorical
      importance_rank: 3
      note: Never consulted for HPV-negative patients.
    - name: t_stage
      label: T stage (AJCC 7th ed.)
      coefficient: null
      units: T1-T4
      transform: 'HPV-NEGATIVE BRANCH ONLY: definition=''ang2010'' -> T2/T3 are the intermediate exception;
        definition=''fakhry'' -> <T4, which adds T1'
      transform_kind: categorical
      importance_rank: 4
      note: 'THE TWO OPERATIONALISATIONS DIFFER FOR EXACTLY ONE CELL: HPV-negative, low-smoking, T1,
        high risk under the literal primary reading, intermediate under Fakhry. RTOG 0129 enrolled stage
        III-IV disease so T1 was likely rare there, which plausibly explains the primary''s silence. Default
        is the literal reading. Never consulted for HPV-positive patients.'
    - name: (risk group -> outcome)
      label: Group 3-year overall survival
      coefficient: null
      units: probability
      transform: low 93.0% (88.3-97.7); intermediate 70.8% (60.7-80.8); high 46.2% (34.7-57.7)
      transform_kind: categorical
      importance_rank: null
      note: A group-level survival, not a per-patient probability. `risk` is None.
  iota_adnex:
    axis: detection
    importance_basis: measured sweep; the paper ranks nothing explicitly
    top_parameter: ca125
    top_parameter_why: 'CA-125 carries the largest swing over clinical ranges, and it does so unevenly
      across the four linear predictors: its coefficient is 0.766 for stage II-IV against 0.112 for borderline,
      so raising CA-125 does not raise ''malignant'' uniformly, it shifts probability from borderline
      towards advanced disease. That reallocation is the model''s clinical point and is invisible in any
      binary score.'
    paper_importance_quote: null
    equation: P(kth) = e^zk / (1 + sum_j e^zj); four linear predictors vs benign; CA-125 and lesion diameter
      as log2; solid/lesion ratio linear and squared
    params:
    - name: (intercept)
      label: Intercept
      coefficient: -14.91583
      coefficient_note: -7.577663 / -12.276041 / -14.915830 / -11.909267 for borderline / stage I / stage
        II-IV / metastatic
      units: logit
      transform: '1'
      transform_kind: none
      importance_rank: null
      note: Four intercepts, one per linear predictor. They are not comparable with each other or with
        any other model's, each sets the odds of one diagnosis against benign at the point where every
        predictor is zero, which for a log2 term means CA-125 of 1 U/mL and is outside the fitted range.
    - name: ca125
      label: Serum CA-125
      coefficient: 0.765456
      coefficient_note: 0.111642 / 0.197249 / 0.765456 / 0.276166 for borderline / stage I / stage II-IV
        / metastatic
      units: U/mL
      transform: log2(CA-125), base 2, NOT natural log
      transform_kind: log2
      importance_rank: 1
      note: 'Largest swing over clinical ranges, and it acts unevenly: 0.766 for stage II-IV against 0.112
        for borderline, so raising CA-125 shifts probability from borderline towards advanced disease
        rather than raising ''malignant'' uniformly. That reallocation is the model''s clinical point
        and no binary score can show it.'
    - name: solid_diameter_mm
      label: Maximal diameter of largest solid component
      coefficient: 10.37696
      coefficient_note: 'ratio D/C: 6.967853 / 9.583053 / 10.37696 / 6.644939; squared: -5.65588 / -5.83319
        / -5.70975 / -2.30330, for borderline / stage I / stage II-IV / metastatic'
      coefficient_squared: -5.70975
      units: mm
      transform: 'ratio = solid_diameter_mm / lesion_diameter_mm, entered TWICE: linearly and squared'
      transform_kind: derived + power
      importance_rank: 2
      note: 'The squared term is negative in all four predictors on purpose: risk does not rise monotonically
        with solid content. Dropping it scores an almost entirely solid mass far too high.'
    - name: lesion_diameter_mm
      label: Maximal diameter of lesion
      coefficient: 0.430477
      coefficient_note: 0.372046 / 0.873530 / 0.430477 / 0.449025 for borderline / stage I / stage II-IV
        / metastatic
      units: mm
      transform: log2(C), and C is also the denominator of the solid ratio
      transform_kind: log2
      importance_rank: 3
      note: Appears TWICE. Changing lesion diameter moves both the log2 term and the solid ratio, so its
        total effect is never its printed coefficient alone.
    - name: ascites
      label: Ascites
      coefficient: 1.348408
      coefficient_note: 0.971061 / 0.452731 / 1.348408 / 1.636407 for borderline / stage I / stage II-IV
        / metastatic
      units: 0/1
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 4
      note: Strongest for metastatic disease (1.636), which is where it is clinically expected.
    - name: acoustic_shadows
      label: Acoustic shadows
      coefficient: -2.35516
      coefficient_note: -2.04157 / -1.87763 / -2.35516 / -2.49845 for borderline / stage I / stage II-IV
        / metastatic
      units: 0/1
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 5
      note: 'The only strongly protective feature: shadows point AWAY from malignancy.'
    - name: age
      label: Patient age
      coefficient: 0.051239
      coefficient_note: 0.004506 / 0.017260 / 0.051239 / 0.033601 for borderline / stage I / stage II-IV
        / metastatic
      units: years
      transform: age, untransformed and uncentered
      transform_kind: identity
      importance_rank: 6
      note: Enters per YEAR. The paper reports OR 1.67 per DECADE, which is the same thing stated differently
        and is a common transcription error.
    - name: more_than_10_locules
      label: More than 10 cyst locules
      coefficient: 0.273692
      coefficient_note: 1.375079 / 0.791873 / 0.273692 / 0.899980 for borderline / stage I / stage II-IV
        / metastatic
      units: 0/1
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 7
      note: A threshold indicator, not a count. Strongest for borderline (1.375).
    - name: papillary_structures
      label: Number of papillary structures
      coefficient: 0.389874
      coefficient_note: 0.604238 / 0.400369 / 0.389874 / 0.215645 for borderline / stage I / stage II-IV
        / metastatic
      units: count 0-4
      transform: capped count, entered as the number 0-4
      transform_kind: identity
      importance_rank: 8
      note: 4 means MORE THAN THREE. Passing a raw count above 3 overstates the term.
    - name: oncology_centre
      label: Type of centre
      coefficient: 0.459021
      coefficient_note: 0.953043 / 0.452484 / 0.459021 / 0.808887 for borderline / stage I / stage II-IV
        / metastatic
      units: 0/1
      transform: 1/0
      transform_kind: dichotomy
      importance_rank: 9
      note: NOT a patient characteristic, it encodes referral filtering. It must match where the scan
        was actually done; a prediction computed with the wrong value is not interpretable.
  optum_lung_lasso:
    axis: detection
    importance_basis: THE FITTED COEFFICIENTS THEMSELVES, ranked by |beta|, read from model.json. Every
      predictor is a 0/1 indicator with a normalisation factor of 1, so |beta| is directly comparable
      across the whole model and no sweep is needed to establish a ranking, unlike every other model
      in this file, where a coefficient's units decide how much it can move. The paper names its top predictors
      in prose and the ordering below agrees with it.
    top_parameter: (3639) current smoker
    top_parameter_why: 'Current smoking is the largest coefficient in the model at +1.5915, worth about
      five times the odds, and the LASSO kept all three levels of the smoking covariate with the signs
      the literature would predict: never -0.2132, former +0.7172, current +1.5915. That is the reassuring
      part of an otherwise opaque model, a penalised fit over 16,633 candidates, given no clinical priors
      at all, recovered smoking as the dominant risk factor for lung cancer.'
    paper_importance_quote: null
    equation: 'p(lung cancer in days 1-1095) = 1 / (1 + e^(-XB))

      XB = -8.8024 + sum over 278 covariates of beta_i * (x_i / normFactor_i)

      x_i is the value of OMOP covariateId i = conceptId * 1000 + analysisId,

      observed in day -365..0 relative to the index visit. Every normFactor is

      1 here because every surviving covariate is a 0/1 indicator.

      '
    coefficient_note: 278 non-zero coefficients out of 16,633 candidates is far past what a per-row table
      can carry, and none of them is a clinical variable in the sense the rest of this file uses. They
      are machine-extracted into src/cancerverse_baseline/lung/detection/data/optum_lung_lasso_2023.json by tests/parity/reference/optum_lung_lasso_extract.py,
      which cross-checks model.json against the unrounded covariateImportance.csv and refuses to write
      if they disagree. The rows below document the TERM STRUCTURE, how many covariates each OMOP analysis
      contributes, and the twelve largest coefficients by magnitude. The coefficients recorded here
      are model.json's, rounded to four decimal places by PatientLevelPrediction's JSON writer, because
      that file is the one the vendor's own predict path loads and scores with.
    params:
    - name: covariates
      label: The OMOP covariate vector (the model's only argument)
      coefficient: null
      units: mapping of covariateId to value
      transform: each value divided by its stored normFactor, then multiplied by its beta; a covariateId
        the model does not carry contributes nothing
      transform_kind: scaling
      importance_rank: null
      note: The normalisation is the trap worth naming. PatientLevelPrediction fitted this with normalize
        = TRUE, so at predict time it divides every covariate by the maximum seen in training before multiplying
        by beta. A plain dot product is therefore WRONG in general for a model saved this way. It happens
        to be right here, and only here, because all 278 surviving covariates are 0/1 indicators whose
        stored factor is 1, the extraction script asserts that rather than assuming it.
    - name: (intercept)
      label: Intercept
      coefficient: -8.8024
      units: logit
      transform: '1'
      transform_kind: none
      importance_rank: null
      note: A patient with none of the 278 covariates sits at a 3-year risk of 0.015%. That is the floor
        of the model, and it is also what an EMPTY record scores, the covariate set was built missingMeansZero,
        so absence and health are indistinguishable to it.
    - name: (analysis 410) drug_era group in the prior year
      label: Term family - drug era groups
      coefficient: null
      coefficient_note: 114 of the 278 covariates; largest +0.2871 (oxazole/thiazine/triazine derivatives),
        smallest |beta| 0.0001
      units: indicator
      transform: 1 if any drug era in the ATC group in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: null
      note: The largest family by count and the smallest by influence. Thirty-five of the 114 carry |beta|
        below 0.02 and the smallest is 0.0001, which is the LASSO leaving a long tail in rather than a
        set of findings.
    - name: (analysis 702) measurement recorded in the prior year
      label: Term family - measurements
      coefficient: null
      coefficient_note: 65 of the 278 covariates; largest -0.8444 (body temperature)
      units: indicator
      transform: 1 if the measurement was RECORDED in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: null
      note: 'These encode that a test was done, NOT its result. Nothing in this model reads a value: a
        sodium level of 120 and one of 140 are the same covariate. That is why the family is best read
        as health-care utilisation, and why several of its members (screening mammography -0.2266, PSA
        -0.2154) are really proxies for sex and for being in routine care.'
    - name: (analysis 210) condition_era group in the prior year
      label: Term family - condition era groups
      coefficient: null
      coefficient_note: 59 of the 278 covariates; largest +0.5853 (chronic obstructive lung disease)
      units: indicator
      transform: 1 if any condition era in the SNOMED group in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: null
      note: The most clinically legible family. COPD (+0.5853), peripheral vascular disease (+0.4057)
        and tobacco dependence syndrome (+0.3599) are the three largest, and all three are what a clinician
        would name.
    - name: (analysis 802) observation in the prior year
      label: Term family - observations
      coefficient: null
      coefficient_note: 15 of the 278 covariates; largest +0.8025 (a temperature observation)
      units: indicator
      transform: 1 if the observation exists in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: null
      note: Contains the model's one genuine internal collision. Covariate 40766362802 is the presence
        of an observation on concept 40766362, and that is the SAME concept the study package's smoking
        covariate reads its value from. Presence scores -0.7069; the value-derived smoking covariate scores
        up to +1.5915. Neither number can be read on its own.
    - name: (analysis 502) procedure_occurrence in the prior year
      label: Term family - procedures
      coefficient: null
      coefficient_note: 13 of the 278 covariates; largest -0.2906 (routine gynaecologic examination)
      units: indicator
      transform: 1 if the procedure occurred in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: null
      note: Every one of the thirteen is small. The largest two are negative coefficients on a routine
        gynaecologic examination (-0.2906) and a general examination of the patient (-0.1849), the utilisation
        signal again, with its sign flipped, and in the first case standing in for sex.
    - name: (analyses 1, 4, 5) demographics
      label: Term family - gender, race, ethnicity
      coefficient: null
      coefficient_note: 5 of the 278 covariates; gender = MALE +0.0060, race White +0.6352, race Black
        or African American +0.5006, ethnicity Not Hispanic or Latino +0.6495, ethnicity Hispanic or Latino
        +0.0150
      units: indicator
      transform: 1 if the demographic value applies, else 0
      transform_kind: dichotomy
      importance_rank: null
      note: 'Gender = FEMALE was dropped before fitting as redundant, so male is the only sex term and
        female is the reference. Read the race and ethnicity coefficients as coding and cohort composition
        in one vendor''s EHR, not as biology: both of the two race terms the LASSO kept are positive,
        which means they are contrasts against everyone not coded either way rather than against each
        other.'
    - name: (3639) current smoker
      label: Smoking status - current
      coefficient: 1.5915
      units: indicator
      transform: 1 if the last coded smoking observation in day -365..0 says 'Current smoker', else 0
      transform_kind: dichotomy
      reference_level: no coded smoking observation at all
      importance_rank: 1
      note: 'Defined by the study package''s own SQL (R/smoking.R), not by FeatureExtraction: it takes
        max(smoke_value) over concept 40766362, mapping never=1, previously smoked / not currently smoking=2,
        current=3, then forms value*1000+639. A patient with NO smoking observation gets none of the three,
        which is not the same as never-smoker and scores 0.2132 logits higher than one.'
    - name: (13003) age group 65-69
      label: Age band 65-69
      coefficient: 1.3068
      units: indicator
      transform: 1 if floor(age/5) == 13, else 0
      transform_kind: banding
      reference_level: age band 50-54, dropped before fitting as redundant
      importance_rank: 2
      note: Age enters as five-year bands, never as a number. The development cohort was 45-65, so this
        band is its top edge and carries the patients closest to it.
    - name: (12003) age group 60-64
      label: Age band 60-64
      coefficient: 1.0075
      units: indicator
      transform: 1 if floor(age/5) == 12, else 0
      transform_kind: banding
      reference_level: age band 50-54, dropped before fitting as redundant
      importance_rank: 3
      note: The four surviving bands run -0.6263 (45-49), 0 (50-54, the reference), +0.6120 (55-59), +1.0075
        (60-64), +1.3068 (65-69), monotone, which a LASSO given five unordered indicators was under
        no obligation to produce.
    - name: (3020891702) body temperature measured
      label: Body temperature recorded in the prior year
      coefficient: -0.8444
      units: indicator
      transform: 1 if a body-temperature measurement exists in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: 4
      note: The fourth-largest coefficient in the model is not a risk factor. It records that somebody
        took a temperature, which happens at ordinary visits, and it is negative. Together with the positive
        term below on a temperature OBSERVATION it is the clearest sign that this model is partly fitting
        one vendor's documentation habits.
    - name: (45771331802) temperature observation
      label: Temperature recorded as an observation in the prior year
      coefficient: 0.8025
      units: indicator
      transform: 1 if an observation on concept 45771331 exists in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: 5
      note: Same clinical fact as the term above, filed in a different OMOP domain, with the opposite
        sign and almost the same magnitude. Where a temperature lands is an artefact of the source system's
        mapping, so this pair is a coding contrast, not a physiological one.
    - name: (2639) former smoker
      label: Smoking status - previously smoked
      coefficient: 0.7172
      units: indicator
      transform: 1 if the last coded smoking observation says 'Previously smoked' or 'Not currently smoking',
        else 0
      transform_kind: dichotomy
      reference_level: no coded smoking observation at all
      importance_rank: 6
      note: Two source strings collapse into this one level, so 'not currently smoking', which a clinician
        might read as a current smoker's temporary state, is scored as former.
    - name: (40766362802) smoking status observation present
      label: A smoking-status observation exists in the prior year
      coefficient: -0.7069
      units: indicator
      transform: 1 if any observation on concept 40766362 exists in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: 7
      note: Fires for the same patients as the smoking covariates above, and pulls the other way. It is
        the offset for having asked the question at all; the three analysis-639 terms carry the answer.
    - name: (38003564005) ethnicity Not Hispanic or Latino
      label: Ethnicity - not Hispanic or Latino
      coefficient: 0.6495
      units: indicator
      transform: 1 if ethnicity is coded 'Not Hispanic or Latino', else 0
      transform_kind: dichotomy
      reference_level: ethnicity not coded
      importance_rank: 8
      note: The reference is an unrecorded ethnicity, not the other category, so this is closer to a completeness-of-record
        term than to an ethnic contrast.
    - name: (8527004) race White
      label: Race - White
      coefficient: 0.6352
      units: indicator
      transform: 1 if race is coded 'White', else 0
      transform_kind: dichotomy
      reference_level: race not coded
      importance_rank: 9
      note: See the demographics family note. Black or African American is +0.5006 against the same reference,
        so the two are not opposed.
    - name: (9003) age group 45-49
      label: Age band 45-49
      coefficient: -0.6263
      units: indicator
      transform: 1 if floor(age/5) == 9, else 0
      transform_kind: banding
      reference_level: age band 50-54, dropped before fitting as redundant
      importance_rank: 10
      note: The youngest band in the cohort, and the only negative age term.
    - name: (11003) age group 55-59
      label: Age band 55-59
      coefficient: 0.612
      units: indicator
      transform: 1 if floor(age/5) == 11, else 0
      transform_kind: banding
      reference_level: age band 50-54, dropped before fitting as redundant
      importance_rank: 11
    - name: (255573210) COPD condition era
      label: Chronic obstructive lung disease in the prior year
      coefficient: 0.5853
      units: indicator
      transform: 1 if a condition era in the COPD group exists in day -365..0, else 0
      transform_kind: dichotomy
      importance_rank: 12
      note: The largest genuinely clinical non-smoking term, and the same predictor PLCOm2012 carries
        as a yes/no question. Being able to compare the two on this one term is part of why both models
        are in the library.
  xu_gastric_trg_score:
    axis: response
    importance_basis: point allocation, which IS the model, the logistic fit exists only to derive the
      four weights and is never used again at prediction time
    top_parameter: differentiation
    top_parameter_why: 'Differentiation and LNmax tie on points at 7 each, the largest of the four weights,
      and together they are 14 of the 23 available, either one alone clears the 13-point cut-off only
      in combination, but the two together clear it outright regardless of both tumour markers. Differentiation
      is named the top parameter over LNmax because it is the one a site can actually supply: it comes
      off the diagnostic biopsy report, while LNmax has to be abstracted out of a radiology report. On
      the paper''s own numbers LNmax has the marginally larger coefficient (2.073 against 2.005).'
    paper_importance_quote: null
    equation: score = 5·[CA19-9 ≤ 10.90] + 4·[CA72-4 ≤ 3.19] + 7·[well differentiated] + 7·[LNmax ≥ 1.535
      cm]; total 0-23; high-likelihood group at > 13
    params:
    - name: differentiation
      label: Tumour differentiation grade
      coefficient: 2.005
      points: well 7; poor 0
      units: indicator
      transform: well vs poor
      transform_kind: dichotomy
      reference_level: poor
      importance_rank: 1
      paper_effect: OR 7.426 (2.143-25.725), P 0.002
      note: The paper states no intermediate level, so a moderately differentiated tumour cannot be scored
        without a decision the paper does not make. Our implementation raises rather than picking a side.
    - name: lnmax_cm
      label: Short-axis diameter of the largest regional lymph node (MDCT)
      coefficient: 2.073
      points: ≥1.535 cm 7; <1.535 cm 0
      units: cm
      transform: dichotomised at 1.535 cm
      transform_kind: dichotomy
      reference_level: <1.535 cm
      importance_rank: 2
      paper_effect: OR 7.945 (2.085-30.279), P 0.002
      note: 'THE ONE THAT WILL BE READ BACKWARDS. A LARGER node scores toward complete regression. This
        is the paper''s direction, not a transcription error: Table 3 indexes the ">=" level, Table 4
        gives it the 7 points, and the Discussion calls it a novel finding and offers a speculative immunological
        mechanism. It is also a single-cohort result resting on 20 events, and the first thing to check
        if the model fails to transport.'
    - name: ca19_9_u_ml
      label: CA 19-9
      coefficient: 1.725
      points: ≤10.90 U/mL 5; >10.90 0
      units: U/mL
      transform: dichotomised at 10.90 U/mL, LOW scores
      transform_kind: dichotomy
      reference_level: '>10.90 U/mL'
      importance_rank: 3
      paper_effect: OR 5.615 (1.272-24.782), P 0.023
      note: Pretreatment draw. About 5-10% of people are Lewis-antigen negative and cannot express CA
        19-9 at all; they score these 5 points for a reason unrelated to their tumour.
    - name: ca72_4_u_ml
      label: CA 72-4
      coefficient: 1.511
      points: ≤3.19 U/mL 4; >3.19 0
      units: U/mL
      transform: dichotomised at 3.19 U/mL, LOW scores
      transform_kind: dichotomy
      reference_level: '>3.19 U/mL'
      importance_rank: 4
      paper_effect: OR 4.531 (1.167-17.589), P 0.029
      note: The smallest weight, and the input least likely to exist outside East Asian practice. Its
        odds ratio over its points, 4.531/4 = 1.13275, is the divisor that reproduces all four point values
        from the four odds ratios.
