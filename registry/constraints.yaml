# Applicability constraints for each flagship model, sourced to its paper.
#
# Peer to models.yaml and maintained the same way: by hand, under review. It is
# not generated, because the `applies_to` line for each model is an editorial
# judgement about which limit matters most to a reader, and that cannot be
# derived from anything.
#
# Per model:
#   applies_to  one line: who the model is for, and the limit most likely to be
#               violated by someone reaching for it
#   sources     up to five sentences FROM THE PAPER that establish those limits,
#               each with the section it appears in and, where the retrieved
#               format genuinely had one, its page number
#   access      `open` or `closed`, whether a reader can reach the full text
#
# THE PAGE FIELD IS OPTIONAL AND USUALLY ABSENT. Most of these papers were
# retrieved as HTML or JATS XML, formats with section headings and no printed
# pagination, so there is no page number to give and the key is simply not
# there. It used to carry the string "no pagination in retrieved format" on
# every such entry, which was 24 of 34 models repeating a non-answer; the
# section heading was doing all the work already.
#
# Only `amap` and `msk_pancreatic` were read from genuinely paginated sources,
# and only their entries carry the key. Where it is present it is a real page
# in the printed article and can be checked. Never fill it from a citation's
# page range: that produces a number that looks checkable and is not.
#
# PROVENANCE. docs/MODEL_CONSTRAINTS_SOURCES.md is the full record, every
# sourced quote across all 34 flagships, each retrieved independently and then
# re-fetched by a second reader trying to refute it. docs/MODEL_CONSTRAINTS.md
# is the audit those constraints were extracted from, including the constraints
# the CODE fails to enforce. The subset here is what the coverage page renders,
# capped so a table cell stays readable.
constraints:
  pbcg_extended:
    applies_to: Men referred for prostate biopsy. Predicts HIGH-GRADE disease only (Gleason grade group
      ≥ 2), not any cancer.
    scope:
      sex: >-
        Men
      point_in_care: >-
        At the biopsy decision
      disease: >-
        Predicts HIGH-GRADE disease only (Gleason grade group >= 2), not any cancer
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC9306143/
    doi: https://doi.org/10.1186/s12874-022-01674-x
    sources:
    - claim: Population is men referred for prostate biopsy, drawn from the Prostate Biopsy Collaborative
        Group across ten international cohorts.
      section: Methods
      quote: The study was based on risk factor and outcome data collected from January 2006 to December
        2019 from trans-rectal systematic 10–12 core biopsies from 10 PBCG cohorts spanning North America
        and Europe used for training and one PBCG European cohort used for validation (Figs. 1, 2, and
        S1).
    - claim: The model is for a biopsy-referred population, not for screening in an unreferred population.
      section: Methods
      quote: Included data came from patients who had received a prostate biopsy following a PSA test
        under local standard-of-care and may be seen as representative of patients in North America, including
        Puerto Rico, and Europe.
    - claim: Outcome is high-grade / clinically significant prostate cancer, defined as Gleason grade
        group >= 2 found on biopsy.
      section: Methods
      quote: Clinically significant prostate cancer was defined as Gleason grade group ≥ 2 on biopsy [13].
    - claim: Age and PSA are mandatory inputs; the other ten predictors are optional.
      section: Methods
      quote: 'For users of the developed risk calculator, two risk factors were mandatory: PSA and age.
        Ten risk factors were optional: DRE, prostate volume, prior negative biopsy, 5-alpha-reductase-inhibitor
        use, prior PSA screen (yes/no), African ancestry, Hispanic ethnicity, first- and second-degree
        prostate cancer- and first-degree breast cancer-family history.'
    - claim: 'Sub-model sample sizes: the smallest (PSA + age) is fitted on 12,703 biopsies from 10 cohorts,
        the full 12-factor model on only 1,334 biopsies from 3 cohorts.'
      section: Results
      quote: The smallest model only contains PSA and age, utilizing all 12,703 biopsies from the 10 PBCG
        cohorts since these two risk factors were measured for all individuals. The largest model contains
        all 12 risk factors and was constructed from only 1,334 biopsies from 3 PBCG cohorts, as these
        were the only complete cases.
    n_sourced_total: 11
  dutasteride:
    applies_to: Men with a prior negative 6–12 core biopsy in the past 6 months (REDUCE). Each of the
      9 outcomes has its own applicability bounds.
    scope:
      sex: >-
        Men
      prior_treatment: >-
        A negative 6-12 core biopsy within the past 6 months (REDUCE)
      misuse: >-
        Each of the nine outcomes has its own applicability bounds
    access: open
    full_text: https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2012.00138/full
    doi: null
    sources:
    - claim: 'Development population is the REDUCE trial biopsy cohort: 6729 men who had at least one
        biopsy or prostate surgery, split into dutasteride (N=3305) and placebo (N=3424) arms.'
      section: Materials and methods
      quote: 'Data from 6729 patients from the REDUCE trial who had at least one biopsy or prostate surgery
        were included in this study (Andriole et al., 2010). This cohort was split into two sub-groups:
        (1) patients who received dutasteride (N = 3305) and (2) patients who received placebo (N = 3424).'
    - claim: Population is men with a prior NEGATIVE prostate biopsy (the repo card's 'prior negative
        ... biopsy' scope).
      section: Discussion
      quote: The REDUCE metagram can theoretically provide estimates of outcomes relevant to dutasteride
        treatment that are tailored to a man at risk for developing PCa (i.e., older men with elevated
        PSA and a history of previous negative biopsy).
    - claim: 'Histology / subtype restriction: outcome definitions are histologic and mutually conditioned,
        high-grade PCa is Gleason sum >=7; HGPIN counts only when no previous or concurrent ASAP or
        PCa; ASAP counts only in the absence of PCa.'
      section: Materials and methods
      quote: The pathological endpoints included PCa, high grade prostate cancer (HGPCa) that was defined
        as Gleason score sum ≥7, high grade prostatic intraepithelial neoplasia (HGPIN), and atypical
        small acinar proliferation (ASAP). In this study, HGPIN was counted as an independent endpoint
        only if there was no previous or concurrent ASAP or PCa. Similarly, ASAP was counted only in the
        absence of PCa.
    - claim: 'Outcome definition: nine endpoints, each predicted twice (on and off dutasteride), giving
        18 nomograms.'
      section: Abstract > Results
      quote: A total of 18 nomograms assessing the risks of cancer, high grade cancer, high grade prostatic
        intraepithelial neoplasia (HGPIN), atypical small acinar proliferation (ASAP), erectile dysfunction
        (ED), acute urinary retention (AUR), gynecomastia, urinary tract infection (UTI) and BPH-related
        surgery either on or off dutasteride were created.
    - claim: Four of the nine outcomes have concordance at or below chance in at least one arm, and the
        paper says so.
      section: Results
      quote: Several of the nomograms (e.g., those for UTI, gynecomastia, HGPIN, ASAP) demonstrate poor
        discrimination and are based on those models that contained a large proportion of non-predictive
        variables. Values of less than 0.5 reflect poor discrimination by a given nomogram and are an
        artifact of random assignment of risk scores to patients.
    n_sourced_total: 12
  capra:
    applies_to: Pre-operative, clinically localized disease. T1/T2/T3a only - T3b and T4 are refused.
      The 0-2/3-5/6-10 risk banding this returns is a downstream convention, NOT defined in Cooperberg
      2005, which groups scores as 0-1/2/3/4/5/6/>=7.
    scope:
      point_in_care: >-
        Pre-operative
      disease: >-
        Clinically localized; T1/T2/T3a only, T3b and T4 are refused
      misuse: >-
        The 0-2 / 3-5 / 6-10 banding is a downstream convention, not Cooperberg 2005's, which
        groups 0-1/2/3/4/5/6/>=7
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC2948569/
    doi: https://doi.org/10.1097/01.ju.0000158155.33890.e7
    sources:
    - claim: Population is preoperative and confined to clinically localized disease (repo card bullet
        1, first half).
      section: Methods > Patient cohort
      quote: We included patients diagnosed between 1992 and 2001 with clinically localized disease (clinical
        stage T1c-3a, N0/x, M0/x) who did not receive neoadjuvant or adjuvant radiation or hormonal therapy
        (N=2154).
    - claim: Outcome definition.
      section: Methods > Variable definitions
      quote: Disease recurrence after radical prostatectomy (RP) was defined as two consecutive PSA values
        ≥0.2 ng/ml at any time postoperatively or any additional treatment more than six months after
        RP. The date of recurrence was defined as the earlier of the second PSA ≥0.2 ng/ml or the date
        additional treatment was initiated. If disease recurrence did not occur, the patient's follow-up
        time was censored at the date of the last recorded PSA.
    - claim: The code accepts any T1 or T2 substage (T1a, T1b included) as 0 points, matching Table 1's
        'T1/T2' row.
      section: Methods > Development of the UCSF Cancer of the Prostate Risk Assessment (UCSF-CAPRA)
      quote: T-stage as T1c, T2a, T2b, T2c, T3a
    - claim: All five inputs (PSA, both Gleason patterns, T stage, % positive cores, age) are mandatory
        - none may be missing.
      section: Methods > Patient cohort
      quote: We excluded patients with unknown PSA, Gleason score, clinical T-stage, or PPB.
    - claim: Domain check on age is only 'age > 0'; age 0.5 and age 150 both produce a score.
      section: Methods > Development of the UCSF Cancer of the Prostate Risk Assessment (UCSF-CAPRA)
      quote: age as <50, 50-54, 55-59, 60-64, 65-69, ≥70
    n_sourced_total: 18
  prevent:
    applies_to: US adults 30-79 - the paper's one range, stated for both horizons. We additionally refuse
      the 30-year horizon above age 59, which is stricter than the paper and stricter than preventr, which
      warns there and still answers. Race-free by design; use SCORE2 for a European patient.
    scope:
      age: >-
        30-79, the paper's one range for both horizons; the 30-year horizon is additionally
        refused above 59, which is stricter than the paper
      population: >-
        US adults. Race-free by design; use SCORE2 for a European patient
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC10910659/
    doi: https://doi.org/10.1161/CIRCULATIONAHA.123.067626
    sources:
    - claim: 'Outcome definition: total CVD = composite of fatal and non-fatal ASCVD and HF; ASCVD = CHD
        (MI and fatal CHD) plus stroke.'
      section: 'Methods > Outcome Ascertainment: Total CVD, CVD Subtypes, and Mortality'
      quote: 'The primary outcome was incident total CVD, which was defined as a composite of fatal and
        non-fatal ASCVD and HF events.2, 34 ASCVD included coronary heart disease (CHD: myocardial infarction
        and fatal CHD) and stroke as a composite outcome similar to the PCEs.2'
    - claim: BMI moves only the heart-failure outcome; BMI coefficients are zero for total CVD / ASCVD
        / CHD / stroke.
      section: Methods > Statistical Analysis
      quote: Given observational data demonstrating a robust independent association between obesity and
        incident HF, but not ASCVD, BMI was included as a predictor only in the HF-specific and death
        models; in contrast, given the limited association between cholesterol values and incident HF
        in prior studies, cholesterol was not included as a predictor in HF-specific and death models.54,
        55
    - claim: Age range of the development / validation cohort is 30-79 years.
      section: Methods > Study Population
      quote: Individual-level participant data were included for adults aged 30 to 79 years without known
        ASCVD or HF at baseline.
    - claim: 'Stage / treatment-timing restriction: primary prevention only, no known ASCVD or heart
        failure at baseline. The model is not valid for secondary prevention.'
      section: Methods > Study Population
      quote: Individual-level participant data were included for adults aged 30 to 79 years without known
        ASCVD or HF at baseline.
    - claim: SDI is entered as decile categories 1-3 / 4-6 / 7-10, and was derived only from a zip-code
        linkage available in a subset of datasets.
      section: Methods > Measurement of Traditional and Novel Predictors
      quote: Analyses with SDI as a predictor were restricted to available OLDW datasets (36 datasets).
    n_sourced_total: 20
  cvd_statin_benefit:
    applies_to: NOT a published model, guideline arithmetic over a baseline risk you supply. Its horizon
      and endpoint are whatever that model's were.
    scope:
      misuse: >-
        Not a published model. Guideline arithmetic over a baseline risk you supply, so its
        horizon and endpoint are whatever that model's were
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC2988224/
    doi: https://doi.org/10.1016/S0140-6736(10)61350-5
    sources:
    - claim: STANDARD DIMENSION, stage / disease-severity / treatment-timing restriction.
      section: Methods > Study eligibility and outcomes; Results (first two paragraphs)
      quote: only procedures resulting from recurrent ischaemia^23 or occurring more than 30 days after
        randomisation^24 (depending on the trial) were included.
    - claim: STANDARD DIMENSION, sex restriction.
      section: Results (subgroup paragraph)
      quote: In particular, there was a highly significant proportional risk reduction of 25% (99% CI
        18–31; p<0·0001) per 1·0 mmol/L reduction in LDL cholesterol in participants with no previous
        history of vascular disease, as well as significant reductions of 17% (99% CI 10–24; p<0·0001)
        among women and of 16% (99% CI 3–27; p=0·002) in people older than 75 years at entry (figure 3).
    - claim: Explicit INCLUSION criteria of the meta-analysis.
      section: Methods > Study eligibility and outcomes
      quote: 'Trials were eligible for inclusion if: the main effect of the intervention was to lower
        LDL cholesterol; no other differences in risk factor modification were intended; and at least
        1000 participants were to be recruited with at least 2 years'' scheduled treatment duration.'
    - claim: Explicit EXCLUSIONS / data unavailable.
      section: Results (second paragraph)
      quote: Individual participant data were unavailable from three eligible trials involving 11
    - claim: CARD BULLET 3b / scope_note, the trial effect is a ~5-year effect (median follow-up 4.8-5.1
        years), which the repo then carries to a 10-year horizon.
      section: Results (opening paragraphs)
      quote: the weighted median follow-up duration among survivors was 5·1 years (2·1 years for patients
        with acute coronary syndrome and 5·8 years for those with stable disease).
    n_sourced_total: 13
  grace:
    applies_to: An acute coronary syndrome admission. This is the 2003 IN-HOSPITAL score, not the BMJ
      2006 6-month score and not GRACE 2.0.
    scope:
      point_in_care: >-
        At an acute coronary syndrome admission
      misuse: >-
        The 2003 IN-HOSPITAL score. Not the BMJ 2006 6-month score and not GRACE 2.0
    access: closed
    full_text: https://pubmed.ncbi.nlm.nih.gov/14581255/
    doi: https://doi.org/10.1001/archinte.163.19.2345
    sources:
    - claim: 'Population: an acute coronary syndrome admission.'
      section: Abstract > Methods
      quote: A multivariable logistic regression model was developed using 11 389 patients (including
        509 in-hospital deaths) with ACS with and without ST-segment elevation enrolled in the Global
        Registry of Acute Coronary Events (GRACE) from April 1, 1999, through March 31, 2001.
    - claim: 'Outcome definition and prediction horizon: death during the index hospitalisation (in-hospital
        mortality); no time horizon beyond discharge.'
      section: Abstract > Objective; Abstract > Methods
      quote: To develop a simple model to assess the risk for in-hospital mortality
    - claim: 'Stated unit for age: years.'
      section: Abstract > Results
      quote: age (odds ratio [OR], 1.7 per 10 years)
    - claim: 'The model has exactly eight predictors: Killip class, SBP, heart rate, age, creatinine,
        cardiac arrest at admission, ST-segment deviation, elevated cardiac enzymes.'
      section: Abstract > Results
      quote: 'The following 8 independent risk factors accounted for 89.9% of the prognostic information:
        age (odds ratio [OR], 1.7 per 10 years), Killip class (OR, 2.0 per class), systolic blood pressure
        (OR, 1.4 per 20-mm Hg decrease), ST-segment deviation (OR, 2.4), cardiac arrest during presentation
        (OR, 4.3), serum creatinine level (OR, 1.2 per 1-mg/dL [88.4- micro mol/L] increase), positive
        initial cardiac enzyme findings (OR, 1.6), and heart rate (OR, 1.3 per 30-beat/min increase).'
    - claim: 'ACS subtype / anatomic-site restriction: the model covers the entire ACS spectrum, both
        with and without ST-segment elevation, i.e. no subtype restriction.'
      section: Abstract > Methods; Abstract > Conclusions
      quote: patients (including 509 in-hospital deaths) with ACS with and without ST-segment elevation
    n_sourced_total: 11
  atria_stroke_2013:
    applies_to: Atrial fibrillation, anticoagulation decision. Answers a different question from GRACE
      despite sharing the cell.
    scope:
      point_in_care: >-
        At the anticoagulation decision in atrial fibrillation
      misuse: >-
        Answers a different question from GRACE despite sharing the cell
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC3698792/
    doi: https://doi.org/10.1161/JAHA.113.000250
    sources:
    - claim: Population is atrial fibrillation, and the model's purpose is the anticoagulation decision.
      section: Abstract > Background
      quote: More accurate and reliable stroke risk prediction tools are needed to optimize anticoagulation
        decision making in patients with atrial fibrillation (AF).
    - claim: Outcome definition.
      section: Methods > Outcome Event Identification
      quote: 'Ischemic stroke was defined as sudden onset of a neurologic deficit lasting >24 hours and
        not attributable to other identifiable causes.13 Other thromboembolic events were considered valid
        if they met the following criterion: sudden occlusion of an artery to a visceral organ or extremity
        documented by imaging, surgery, or pathology and not attributable to concomitant atherosclerosis
        or other etiology.'
    - claim: Age enters through an age x prior-stroke interaction, not an age term plus a separate prior-stroke
        flag.
      section: Methods > Statistical Analyses > Model derivation and internal validation in the original
        ATRIA cohort
      quote: On the basis of univariate analysis results in the derivation cohort, we also tested an additional
        interaction term of age by prior stroke.
    - claim: Age range of the development / validation cohort.
      section: Methods > Cohort Assembly
      quote: We included all patients ≥18 years old with either 2 or more outpatient AF diagnoses (ICD‐9
        code 427.31) or 1 outpatient AF diagnosis with ECG validation.
    - claim: Stage or treatment-timing restriction - the score estimates stroke risk in the ABSENCE of
        anticoagulation.
      section: Methods > Cohort Assembly
      quote: We used only person‐time off warfarin to develop our stroke risk model.
    n_sourced_total: 14
  bcsc_v2:
    applies_to: Women having screening mammography, age 35+. The paper states a LOWER bound only and reports
      an 80-84 age band, so our 79 ceiling is this library's, not the paper's. Four race groups only;
      5-year INVASIVE cancer risk.
    scope:
      age: >-
        35 and over. The paper states a lower bound only and reports an 80-84 band, so the 79
        ceiling is this library's addition
      sex: >-
        Women
      point_in_care: >-
        At screening mammography
      population: >-
        Four race groups only
      misuse: >-
        5-year INVASIVE cancer risk
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC2674327/
    doi: https://doi.org/10.7326/0003-4819-148-5-200803040-00004
    sources:
    - claim: Outcome is INVASIVE breast cancer; DCIS is not an outcome.
      section: Methods > Model Development
      quote: Women entered the model 6 months after the index mammogram and were censored at the time
        of death, diagnosis of ductal carcinoma in situ, or the end of follow-up.
    - claim: Outcome definition and prediction horizon.
      section: Discussion (summary paragraph)
      quote: In summary, we developed a risk prediction model that incorporates breast density to estimate
        a woman's 5-year risk for invasive breast cancer.
    - claim: 'Lower age bound: the development cohort was restricted to women age 35 years or older.'
      section: Methods > Study Population
      quote: We included 1 095 484 women age 35 years or older who had had at least 1 mammogram with breast
        density measured by using the Breast Imaging Reporting and Data System (BI-RADS) classification
        system in any of the 7 mammography registries participating in the National Cancer Institute–funded
        Breast Cancer Surveillance Consortium (BCSC) (available at http://breastscreening.cancer.gov)
        (29).
    - claim: Age range actually represented in the development/validation cohort.
      section: Results > Table 1. Baseline Patient Characteristics
      quote: At the time of their earliest mammogram in the BCSC, 46% of women in our study were younger
        than age 50 years (Table 1).
    - claim: The density relative hazards split at age 65 (a constraint the repo card does not state but
        the code implements via DENSITY_AGE_CUTOFF).
      section: Methods > Model Development
      quote: The strength of the breast density association with breast cancer was greater for women younger
        than age 65 years (P for interaction < 0.001). Thus, separate models were fitted for women younger
        than age 65 years and for women age 65 years or older.
    n_sourced_total: 17
  predict_breast:
    applies_to: Early invasive breast cancer after surgery. ER status is structural, not a coefficient,
      it selects a different model form.
    scope:
      sex: >-
        Women
      point_in_care: >-
        After surgery
      disease: >-
        Early invasive breast cancer
      misuse: >-
        ER status is structural, not a coefficient: it selects a different model form
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC5440946/
    doi: https://doi.org/10.1186/s13058-017-0852-3
    sources:
    - claim: Outcome definition and prediction horizon.
      section: Methods > Patient data > Model development data
      quote: Vital status was ascertained at the end of June 2013, and all analyses were censored on 31
        December 2012 to allow for delay in reporting of vital status. Breast cancer-specific mortality
        was defined as deaths where breast cancer was listed as the cause of death on part 1a, 1b or 1c
        of the death certificate.
    - claim: 'Stage / treatment-timing restriction: surgically treated early breast cancer, adjuvant setting.'
      section: Methods > Patient data > Model development data
      quote: Patients who did not undergo surgery, patients with incomplete local therapy (wide local
        excision without radiotherapy) and patients with fewer than four nodes excised with a diagnosis
        of node-negative disease were excluded from the analyses, leaving a study population of 5738 individuals.
    - claim: 'Histology / subtype / anatomic site restriction: invasive breast cancer.'
      section: Methods > Patient data > Model development data
      quote: The primary analysis was based on data from patients with invasive breast cancer diagnosed
        in East Anglia, UK, between 1999 and 2003 identified by ECRIC.
    - claim: Explicit inclusion and exclusion criteria for the development cohort.
      section: Methods > Patient data > Model development data
      quote: Information obtained from ECRIC included age at diagnosis, number of lymph nodes sampled
        and number of lymph nodes positive, tumour size, histological grade, ER status, mode of detection
        (screening vs. clinical), information on local therapy (wide local excision, mastectomy, radiotherapy),
        and type of adjuvant systemic therapy (chemotherapy, endocrine therapy, both). Exact chemotherapy
        regimens are unknown, but the majority of patients with breast cancer in the ECRIC population
        received first- or second-generation chemotherapy during this time period. Patients who did not
        undergo surgery, patients with incomplete local therapy (wide local excision without radiotherapy)
        and patients with fewer than four nodes excised with a diagnosis of node-negative disease were
        excluded from the analyses, leaving a study population of 5738 individuals. Of these 1977 (34%)
        had less than 10 years of potential follow-up.
    - claim: 'ER status is structural, not a coefficient: ER-positive and ER-negative are fitted as separate
        models, so er_positive is a mandatory input.'
      section: Methods > Patient data > Statistical methods
      quote: Separate models were derived for ER-positive and ER-negative breast cancer.
    n_sourced_total: 7
  predict_breast_response:
    applies_to: Same population and inputs as the prognosis cell; reports the absolute benefit of each
      adjuvant regimen.
    scope:
      sex: >-
        Women
      point_in_care: >-
        After surgery
      misuse: >-
        Reports the absolute BENEFIT of each adjuvant regimen, not a risk
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC5440946/
    doi: https://doi.org/10.1186/s13058-017-0852-3
    sources:
    - claim: Outcome definition and prediction horizon.
      section: Methods > Patient data > Model development data
      quote: Breast cancer-specific mortality was defined as deaths where breast cancer was listed as
        the cause of death on part 1a, 1b or 1c of the death certificate.
    - claim: 'Stage / treatment-timing restriction: surgically treated early breast cancer, adjuvant setting.'
      section: Methods > Patient data > Validation samples
      quote: Patients diagnosed between 1990 and 2000 with unilateral stages I–III breast cancer without
        a previous cancer diagnosis (except non-melanoma skin cancer), for whom complete data on tumour
        size, nodal status, receipt of adjuvant systemic therapy, and follow-up were available, were included.
    - claim: 'Histology / anatomic site restriction: invasive breast cancer.'
      section: Methods > Patient data > Model development data
      quote: The primary analysis was based on data from patients with invasive breast cancer diagnosed
        in East Anglia, UK, between 1999 and 2003 identified by ECRIC.
    - claim: Explicit inclusion and exclusion criteria for the development cohort.
      section: Methods > Patient data > Model development data
      quote: Patients who did not undergo surgery, patients with incomplete local therapy (wide local
        excision without radiotherapy) and patients with fewer than four nodes excised with a diagnosis
        of node-negative disease were excluded from the analyses, leaving a study population of 5738 individuals.
    - claim: Stated conditions under which the model is invalid or unreliable.
      section: Results > Model calibration
      quote: In contrast, PREDICT v2 slightly over-predicted the number of breast cancer deaths in women
        diagnosed under the age of 30 years (48 predicted vs. 34 observed, P = 0.047).
    n_sourced_total: 10
  plcom2012:
    applies_to: EVER-SMOKERS only, never-smokers cannot be scored. Developed on PLCO smokers aged 55–74;
      6-year unscreened natural history.
    scope:
      age: >-
        Developed on PLCO smokers aged 55-74
      prior_treatment: >-
        EVER-SMOKERS only. Never-smokers cannot be scored
      misuse: >-
        6-year unscreened natural history
    access: open
    full_text: https://pmc.ncbi.nlm.nih.gov/articles/PMC3929969/
    doi: https://doi.org/10.1056/NEJMoa1211776
    sources:
    - claim: 'Population: ever-smokers only; the model is not defined for never-smokers.'
      section: DISCUSSION
      quote: PLCOM2012 excluded persons who had never smoked. Additional unique predictors and models
        are required for prediction of lung-cancer risk among persons who have never smoked, and such
        models have not been developed. Generally, lung-cancer risk among persons who have never smoked
        is so low that low-dose CT screening of such persons is not currently warranted.
    - claim: 'Stated condition under which the model is invalid or unvalidated: population socioeconomic
        composition / generalizability.'
      section: DISCUSSION
      quote: The socioeconomic status of the PLCO study population was higher than that of the general
        population. 27 Although this might theoretically limit generalizability, because most of the predictors
        appear to have a biologic relationship with lung cancer that is independent of socioeconomic status,
        the model may still perform well. The PLCOM2012 should be evaluated in different populations and
        clinical and public health settings in well-designed prospective studies.
    - claim: Histology / subtype / anatomic-site restriction on the predicted outcome.
      section: METHODS > STUDY DESIGN
      quote: All histologically confirmed lung cancers that were diagnosed from study entry through 6
        years of follow-up were included.
    - claim: 'Outcome definition and prediction horizon: 6-year probability of a lung-cancer diagnosis.'
      section: Abstract > METHODS
      quote: risk was the probability of a diagnosis of lung cancer during the 6-year study period
    - claim: 'Age range of the development and validation cohort: 55-74 years; performance outside it
